function drawHullClaw(f           , x        , y        , holding         , crate         , h          )       {
  const { ctx, c } = f;
  const k = h.claw;
  ctx.strokeStyle = holding && !h.asleep ? C.gold : h.look.trim;
  ctx.lineWidth = Math.max(2, c * 0.2) * k;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + c * 0.6 * k, y - c * (holding ? 0.35 : 0.9) * k);
  ctx.moveTo(x, y);
  ctx.lineTo(x + c * 0.6 * k, y + c * (holding ? 0.35 : 0.9) * k);
  ctx.stroke();
  if (holding && crate) drawCrateAt(f, x + c * 0.4, y - c * 0.7, 1.4);
}

// --- app/room-static-draw.ts
// The Neon lab's static room drawing (ADR-058), called by room-static.ts once per chunk with the parts of the
// layout whose drawn bounds reach into it: floor tiles and seams, chargers with their `+` pattern and pool, the
// gap with its depth band and hazard rim, the hatch's pool and energy field base, and walls with lifted top faces and glowing
// edge strips. Glows are layered strokes at low alpha, never a canvas shadow blur.

                                             

                                                   


                                                         

                                                 

/** A chunk's drawing frame: the room frame translated to the chunk, plus the sprite cache and pixel ratio. */
                                                                               

/** Where every static thing is, computed once per layer (room-layout.ts). */
                               
             
                                                                             
                                                                                                  
 

/** The cells an edge run covers. */
function runBox(r         )          {
  const alongX = r.side === 'north' || r.side === 'south';
  return { x: r.x, y: r.y, width: alongX ? r.len : 1, height: alongX ? 1 : r.len };
}

/** True when `a`, grown by `margin` cells on every side, overlaps `b`. */
function boxesMeet(a         , b         , margin = 0)          {
  return a.x - margin < b.x + b.width && b.x < a.x + a.width + margin &&
    a.y - margin < b.y + b.height && b.y < a.y + a.height + margin;
}

/** Pixel rectangle of a cell box. */
const px = (f           , b         ) =>
  ({ x: cellLeft(f, b.x), y: cellTop(f, b.y), w: b.width * f.c, h: b.height * f.c });

/** Floor tiles of FLOOR_TILE cells over the part of the room inside `box`, by tileShade. */
function drawFloorTiles(f           , room      , box         )       {
  const { ctx, c } = f;
  const x0 = Math.max(0, box.x), y0 = Math.max(0, box.y);
  const x1 = Math.min(room.width, box.x + box.width), y1 = Math.min(room.height, box.y + box.height);
  for (let ty = Math.floor(y0 / FLOOR_TILE) * FLOOR_TILE; ty < y1; ty += FLOOR_TILE) {
    for (let tx = Math.floor(x0 / FLOOR_TILE) * FLOOR_TILE; tx < x1; tx += FLOOR_TILE) {
      const w = Math.min(FLOOR_TILE, room.width - tx), h = Math.min(FLOOR_TILE, room.height - ty);
      ctx.fillStyle = tileShade(tx, ty) === 1 ? NEON.floorA : NEON.floorB;
      ctx.fillRect(cellLeft(f, tx), cellTop(f, ty), w * c, h * c);
    }
  }
}

/** 1 px seams on the west edges (x mod 4 = 0) and north edges (y mod 4 = 0) of floor and charger cells. */
function drawSeams(f           , west           , north           )       {
  const { ctx, c } = f;
  ctx.fillStyle = NEON.seam;
  for (const r of west) ctx.fillRect(cellLeft(f, r.x), cellTop(f, r.y), 1, r.len * c);
  for (const r of north) ctx.fillRect(cellLeft(f, r.x), cellTop(f, r.y), r.len * c, 1);
}

/** Pool radius of a charger region in px: half its longer side + 3 cells (ADR-059). */
const chargerPoolRadius = (r         , c        ) =>
  (Math.max(r.width, r.height) / 2 + POOL_RADIUS.chargerExtra) * c;

/** Pool radius of a hatch region in cells: half its longer side + 2.5 (ADR-059). */
const hatchPoolRadius = (r         ) => Math.max(r.width, r.height) / 2 + POOL_RADIUS.hatchExtra;

/** Charger regions: floor fill, pool, ADR-045's `+` per cell in charger (not colour alone) and a 1.5 px border. */
function drawChargers(f             , regions           )       {
  const { ctx, c } = f;
  for (const r of regions) {
    const p = px(f, r);
    ctx.fillStyle = NEON.chargerFloor;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    const radius = chargerPoolRadius(r, c);
    const pool = f.glow.pool(POOLS.charger.colour, POOLS.charger.alpha, radius, f.dpr);
    drawSprite(ctx, pool, p.x + p.w / 2, p.y + p.h / 2, radius);
    ctx.strokeStyle = NEON.charger;
    ctx.lineWidth = Math.max(1, c * 0.12);
    ctx.beginPath();
    for (let y = r.y; y < r.y + r.height; y++) chargerRow(f, r.x, r.x + r.width, y);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeRect(p.x + 0.75, p.y + 0.75, p.w - 1.5, p.h - 1.5);
  }
}

/** Adds the `+` of each charger cell from..to-1 on row y to the current path. */
function chargerRow(f           , from        , to        , y        )       {
  const { ctx, c } = f;
  const r = c * 0.25;
  for (let x = from; x < to; x++) {
    const mx = cellLeft(f, x) + c / 2, my = cellTop(f, y) + c / 2;
    ctx.moveTo(mx - r, my);
    ctx.lineTo(mx + r, my);
    ctx.moveTo(mx, my - r);
    ctx.lineTo(mx, my + r);
  }
}

/** Adds the line of each edge run to the current path, `shiftY` cells down (walls pass −WALL_LIFT). */
function edgePath(f           , runs           , shiftY = 0)       {
  const { ctx, c } = f;
  for (const r of runs) {
    const x = cellLeft(f, r.x), y = cellTop(f, r.y) + shiftY * c;
    if (r.side === 'north' || r.side === 'south') {
      const ly = r.side === 'north' ? y : y + c;
      ctx.moveTo(x, ly);
      ctx.lineTo(x + r.len * c, ly);
    } else {
      const lx = r.side === 'west' ? x : x + c;
      ctx.moveTo(lx, y);
      ctx.lineTo(lx, y + r.len * c);
    }
  }
}

/** Strokes the current path as a glowing line: each [width, alpha] in turn, the last one the line itself. */
function glowStroke(ctx                          , colour        , layers                             )       {
  ctx.strokeStyle = colour;
  for (const [width, alpha] of layers) {
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** The chasm: gap fill, a 0.4-cell depth band under its north edges, and the 2 px hazard rim with its glow. */
function drawGaps(f           , gaps           , tops           , rims           )       {
  const { ctx, c } = f;
  ctx.fillStyle = NEON.gap;
  for (const g of gaps) ctx.fillRect(cellLeft(f, g.x), cellTop(f, g.y), g.width * c, c);
  ctx.fillStyle = NEON.gapDepth;
  for (const t of tops) ctx.fillRect(cellLeft(f, t.x), cellTop(f, t.y), t.len * c, 0.4 * c);
  if (rims.length === 0) return;
  ctx.beginPath();
  edgePath(f, rims);
  glowStroke(ctx, NEON.gapRim, [[10, 0.12], [6, 0.22], [3.5, 0.45], [2, 1]]);
}

/** Each hatch's static pool (ADR-059), centred on its region; the web hatch never opens (ADR-033). */
function drawHatchPools(f             , hatches           )       {
  for (const h of hatches) {
    const p = px(f, h), r = hatchPoolRadius(h) * f.c;
    drawSprite(f.ctx, f.glow.pool(POOLS.hatch.colour, POOLS.hatch.alpha, r, f.dpr), p.x + p.w / 2, p.y + p.h / 2, r);
  }
}

/** The hatch's static field: a faint fill, a 1 px border and wave lines along the longer side every 0.8 cell. */
function drawHatchBase(f           , hatches           )       {
  const { ctx } = f;
  for (const h of hatches) {
    const p = px(f, h);
    ctx.fillStyle = NEON.hatch;
    ctx.globalAlpha = 0.16;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = NEON.hatch;
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
    ctx.beginPath();
    hatchWaves(f, p, h.width >= h.height);
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/** Adds the field lines of a hatch rectangle `p` (px) to the path: waves of amplitude 0.12 cell, period 1.6 cells. */
function hatchWaves(f           , p                                                , horizontal         )       {
  const { ctx, c } = f;
  const across = horizontal ? p.h : p.w, along = horizontal ? p.w : p.h;
  const step = c / 4;
  for (let o = 0.4 * c; o < across; o += 0.8 * c) {
    for (let t = 0; t <= along + 0.01; t += step) {
      const wave = 0.12 * c * Math.sin((2 * Math.PI * t) / (1.6 * c));
      const x = horizontal ? p.x + t : p.x + o + wave, y = horizontal ? p.y + o + wave : p.y + t;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
}

/** Walls: side faces at their cells, top faces WALL_LIFT north, and the 1.5 px edge strips with two glow strokes. */
function drawWalls(f           , walls           , edges           )       {
  const { ctx, c } = f;
  ctx.fillStyle = NEON.wallSide;
  for (const w of walls) ctx.fillRect(cellLeft(f, w.x), cellTop(f, w.y), w.width * c, c);
  ctx.fillStyle = NEON.wallTop;
  for (const w of walls) ctx.fillRect(cellLeft(f, w.x), cellTop(f, w.y) - WALL_LIFT * c, w.width * c, c);
  if (edges.length === 0) return;
  ctx.beginPath();
  edgePath(f, edges, -WALL_LIFT);
  glowStroke(ctx, NEON.wallEdge, [[5, 0.18], [3, 0.35], [1.5, 1]]);
}

// --- app/room-static.ts
// The Neon lab's static layer (ADR-058): floor, seams, chargers and their pools, gaps, the hatch pool and base and walls,
// drawn once per room into offscreen chunks of CHUNK_CELLS × CHUNK_CELLS world cells. A chunk is built the first
// time it is visible, with everything whose drawn bounds reach into it (clipped, so glows continue across chunk
// edges), and kept in a least-recently-used cache of max(24, 2 × the visible chunks). A new room, cell size or
// pixel ratio gets a new layer (`layerFor`).

                                             
                                                   

                                                                   

                                                                       
                                                 

/** The chunk cache never holds fewer than this many chunks. */
const MIN_CHUNK_CACHE = 24;
/** Cells around a chunk whose things are drawn into it: the wall lift and the widest glow stroke fit in 2. */
const MARGIN = 2;

/** Every list of the static drawing for `room`. */
function staticLayout(room      )               {
  return {
    room, walls: tileRuns(room, 'wall'), gaps: tileRuns(room, 'gap'),
    chargers: regionRects(room, 'charger'), hatches: regionRects(room, 'hatch'),
    edges: wallEdges(room), rims: gapRims(room), tops: gapTops(room),
    seamsWest: seamRuns(room, 'west'), seamsNorth: seamRuns(room, 'north'),
  };
}

/** The room cells chunk (cx, cy) covers: world cell 12 cx is room cell 12 cx − 1. */
function chunkBox(k          )          {
  return { x: CHUNK_CELLS * k.cx - 1, y: CHUNK_CELLS * k.cy - 1, width: CHUNK_CELLS, height: CHUNK_CELLS };
}

/** The static layer of one (room, cell size, pixel ratio). */
class StaticLayer {
           room      ;
           c        ;
           dpr        ;
           layout              ;
  /** Chunks built since this layer was made. */
  built = 0;
  /** Cached chunk canvases by `cx,cy`, least recently used first. */
          chunks = new Map                           ();
          cap = MIN_CHUNK_CACHE;
          glow           ;

  constructor(room      , c        , dpr        , glow           ) {
    this.room = room;
    this.c = c;
    this.dpr = dpr;
    this.glow = glow;
    this.layout = staticLayout(room);
  }

  /** How many chunks are cached. */
  get cached()         { return this.chunks.size; }

  /** The canvas of chunk `k`, built when it is not cached; marks it most recently used. */
  chunk(k          )                    {
    const key = `${k.cx},${k.cy}`;
    const hit = this.chunks.get(key);
    if (hit) {
      this.chunks.delete(key);
      this.chunks.set(key, hit);
      return hit;
    }
    const canvas = this.build(k);
    this.built++;
    this.chunks.set(key, canvas);
    return canvas;
  }

  /** Draws the `visible` chunks at the frame's offset with one `drawImage` each, then trims the cache. */
  draw(f           , visible            )       {
    const side = CHUNK_CELLS * this.c;
    this.cap = Math.max(MIN_CHUNK_CACHE, 2 * visible.length);
    for (const k of visible) f.ctx.drawImage(this.chunk(k), f.ox + k.cx * side, f.oy + k.cy * side, side, side);
    // Non-null: the map holds more entries than the cap here.
    while (this.chunks.size > this.cap) this.chunks.delete(this.chunks.keys().next().value );
  }

  /** Paints chunk `k` into a fresh offscreen canvas. */
          build(k          )                    {
    const side = CHUNK_CELLS * this.c;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(side * this.dpr);
    canvas.height = Math.round(side * this.dpr);
    // Non-null: a fresh canvas always has a 2d context.
    const ctx = canvas.getContext('2d') ;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.beginPath();
    ctx.rect(0, 0, side, side);
    ctx.clip();
    const f              = {
      ctx, c: this.c, vw: side, vh: side, ox: -k.cx * side, oy: -k.cy * side, glow: this.glow, dpr: this.dpr,
    };
    paintChunk(f, this.layout, chunkBox(k));
    return canvas;
  }
}

const near = (list           , box         ) => list.filter((r) => boxesMeet(runBox(r), box, MARGIN));
const nearBoxes = (list           , box         ) => list.filter((b) => boxesMeet(b, box, MARGIN));

/** ADR-058's static order inside one chunk's room cells `box`: floor, seams, chargers, gaps, hatch pool, hatch base, walls. */
function paintChunk(f             , L              , box         )       {
  drawFloorTiles(f, L.room, box);
  drawSeams(f, near(L.seamsWest, box), near(L.seamsNorth, box));
  drawChargers(f, L.chargers.filter((r) => boxesMeet(r, box, Math.ceil(chargerPoolRadius(r, 1)))));
  drawGaps(f, nearBoxes(L.gaps, box), near(L.tops, box), near(L.rims, box));
  drawHatchPools(f, L.hatches.filter((h) => boxesMeet(h, box, Math.ceil(hatchPoolRadius(h)))));
  drawHatchBase(f, nearBoxes(L.hatches, box));
  drawWalls(f, nearBoxes(L.walls, box), near(L.edges, box));
}

/** The cached layer when it matches (room, c, dpr), else a new one stored in `cache`. */
function layerFor(
  cache                                                , room      , c        , dpr        ,
)              {
  const l = cache.layer;
  if (l && l.room === room && l.c === c && l.dpr === dpr) return l;
  cache.layer = new StaticLayer(room, c, dpr, cache.glow);
  return cache.layer;
}

// --- app/item-view.ts
// Items on canvas in the Neon look (ADR-058, ADR-071): the crystal diamond (ADR-034), the cached antenna and arm
// icons, the floor items' light pools and icons, each robot's hold slots on its hull (Hauler's in its cargo bed,
// ADR-070) and where the `*` crystal draws. room-view.ts and robot-view.ts call these in the frame order.


                                                                                                  
                                           

                                                           

                                                 



                                                 
                                                   

/** What the Neon drawing of items needs besides the frame: motion, sprites, pixel ratio (robot-view.ts's NeonDraw). */
                                                                  

/** ADR-071: a floor item draws at this share of its 2-cell footprint; a hold item at this share of a cell. */
const ITEM_SCALE = 0.9;

/** ADR-071: Scout's and Relay's hold slot: anchor + (1, 1), 1.4 cells wide, on a lens-dark disc of 0.8 cells. */
const SMALL_SLOT = { offset: 1, size: 1.4, disc: 0.8 }         ;

/** ADR-071: the thinnest line an icon draws, in px. */
const MIN_ICON_LINE = 1.5;

/** ADR-071: an icon's stroke width at `px`: 1.6 of 16 units, never under MIN_ICON_LINE. */
function iconLineWidth(px        )         {
  return Math.max(MIN_ICON_LINE, (1.6 * px) / 16);
}

/** Paints `shape` in `colour` into a px × px box at the origin (the canvas half of item-icons.ts's SVG). */
function paintIcon(ctx                          , shape           , colour        , px        )       {
  const u = px / 16;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = iconLineWidth(px);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const s of shape.strokes) {
    if ('line' in s) {
      s.line.forEach(([x, y], i) => (i ? ctx.lineTo(x * u, y * u) : ctx.moveTo(x * u, y * u)));
    } else {
      const [x, y, r, a0, a1] = s.arc;
      const rad = Math.PI / 180;
      ctx.moveTo((x + r * Math.cos(a0 * rad)) * u, (y + r * Math.sin(a0 * rad)) * u);
      ctx.arc(x * u, y * u, r * u, a0 * rad, a1 * rad);
    }
  }
  ctx.stroke();
  for (const [x, y, r] of shape.dots) {
    ctx.beginPath();
    ctx.arc(x * u, y * u, r * u, 0, Math.PI * 2);
    ctx.fill();
  }
}

/** ADR-071: the item sprite per (kind, px, dpr): the icon of ADR-071 in its ITEM_COLOURS colour. */
function itemSprite(glow           , kind                              , px        , dpr        )         {
  return glow.sprite(`item|${kind}|${px}|${dpr}`, px, px, dpr, (ctx) => {
    paintIcon(ctx, ICON_SHAPES[kind], ITEM_COLOURS[kind], px);
  });
}

/** The centre of a crystal `size` cells wide at room cell `a`. */
function crystalCentre(f           , a              , size        )        {
  return { x: cellLeft(f, a.x) + (size * f.c) / 2, y: cellTop(f, a.y) + (size * f.c) / 2 };
}

/** ADR-071: where the `*` crystal draws: carried on Hauler in its first bed slot (0.9 cells), else as today. */
function crystalPlace(w            )                                                            {
  const crystal = w.crystal;
  if (!crystal) return null;
  if (!crystal.isCarried) return { at: crystal.position, size: 2 };
  const robots = robotStates(w);
  const carrier = robots[carrierIndex(robots.map((r) => r.position), crystal)];
  if (carrier.model !== 'hauler') return { at: crystal.position, size: 1.4 };
  const slot = cargoBed(1).slots[0];
  const a = carrier.position;
  const centre = { x: a.x + slot.x + slot.width / 2, y: a.y + slot.y + slot.height / 2 };
  return { at: crystal.position, size: ITEM_SCALE, centre };
}

/** The px centre of a crystal place (its `centre` in cells, else the middle of its square). */
function placeCentre(f           , place                                                    )        {
  if (!place.centre) return crystalCentre(f, place.at, place.size);
  return { x: cellLeft(f, place.centre.x), y: cellTop(f, place.centre.y) };
}

/**
 * Crystal (ADR-034, ADR-058) centred at (mx, my), `size` cells wide: a glow (left out with `glow` false), the
 * diamond and its upper-left facet in white at 0.75.
 */
function drawCrystalAt(f           , mx        , my        , size        , n          , glow = true)       {
  const { ctx, c } = f;
  const r = size * c * 0.45;
  if (glow) {
    const gr = 0.9 * size * c;
    drawSprite(ctx, n.glow.pool(NEON.crystal, 0.55, gr, n.dpr), mx, my, gr);
  }
  ctx.fillStyle = NEON.crystal;
  ctx.beginPath();
  ctx.moveTo(mx, my - r);
  ctx.lineTo(mx + r * 0.75, my);
  ctx.lineTo(mx, my + r);
  ctx.lineTo(mx - r * 0.75, my);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = NEON.white;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(mx, my - r);
  ctx.lineTo(mx, my);
  ctx.lineTo(mx - r * 0.75, my);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

/** Crystal at room cell `a`, `size` cells wide (ADR-034): carried 1.4 wide, on the floor 2. */
function drawCrystal(f           , a              , size        , n          )       {
  const { x, y } = crystalCentre(f, a, size);
  drawCrystalAt(f, x, y, size, n);
}

/** True when a box of half-size `r` px around (x, y) is at least partly in the view. */
function inView(f           , x        , y        , r        )          {
  return x + r > 0 && x - r < f.vw && y + r > 0 && y - r < f.vh;
}

/** ADR-071: the floor items' pools (drawn with the other pools), each like the crystal's and pulsing with it. */
function drawItemPools(f           , items                      , n          )       {
  const r = POOL_RADIUS.crystalPerSize * 2 * f.c;
  for (const item of items) {
    const mid = crystalCentre(f, item.position, 2);
    if (!inView(f, mid.x, mid.y, r)) continue;
    const pool = POOLS[item.kind];
    drawSprite(f.ctx, n.glow.pool(pool.colour, pool.alpha, r, n.dpr), mid.x, mid.y, r, 0.85 + 0.15 * n.m.crystalPulse);
  }
}

/** ADR-071: the floor items' icons at 0.9 × their 2 cells (before the robots); returns the kinds drawn. */
function drawFloorItems(f           , items                      , n          )             {
  const drawn             = [];
  for (const item of items) {
    const mid = crystalCentre(f, item.position, 2);
    if (!inView(f, mid.x, mid.y, f.c)) continue;
    drawn.push(item.kind);
    if (item.kind === 'crystal') drawCrystalAt(f, mid.x, mid.y, 2, n);
    else drawIcon(f, item.kind, mid, ITEM_SCALE * 2 * f.c, n);
  }
  return drawn;
}

/** One item's icon `px` wide centred at `mid`; a crystal as the diamond without its glow. */
function drawIcon(f           , kind          , mid       , px        , n          )       {
  if (kind === 'crystal') {
    drawCrystalAt(f, mid.x, mid.y, px / f.c, n, false);
    return;
  }
  const size = Math.round(px);
  f.ctx.drawImage(itemSprite(n.glow, kind, size, n.dpr).canvas, mid.x - size / 2, mid.y - size / 2, size, size);
}

/** ADR-071: the px rectangle of each hold slot of robot `r` (Scout and Relay one, Hauler its three bed slots). */
function holdSlotRects(f           , r            )                                                            {
  const rx = cellLeft(f, r.position.x), ry = cellTop(f, r.position.y);
  if (r.model === 'hauler') {
    return cargoBed(f.c).slots.map((s) => ({ x: rx + s.x, y: ry + s.y, width: s.width, height: s.height }));
  }
  const at = SMALL_SLOT.offset * f.c, size = SMALL_SLOT.size * f.c;
  return [{ x: rx + at, y: ry + at, width: size, height: size }];
}

/**
 * ADR-071: one robot's hold slots on its hull, each on a lens-dark backing, without pools. `slots` come from
 * `holdSlots` (the carried `*` crystal first): Hauler's carried crystal gets its slot's backing and is drawn by the
 * crystal's own step; on Scout and Relay it draws as ADR-034's carried crystal, with no disc. Returns the kinds of
 * the hold entries drawn.
 */
function drawHold(f           , r            , slots                              , n          )             {
  const carried = slots.filter((k) => k !== null).length - r.hold.length;
  const rects = holdSlotRects(f, r);
  const { ctx, c } = f;
  const drawn             = [];
  slots.forEach((kind, i) => {
    const rect = rects[i];
    if (kind === null || !rect || (i < carried && r.model !== 'hauler')) return;
    const mid = { x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 };
    ctx.fillStyle = ROBOT_LOOKS[r.model].lensDark;
    if (r.model === 'hauler') {
      ctx.fillRect(rect.x + 0.08 * c, rect.y + 0.08 * c, rect.width - 0.16 * c, rect.height - 0.16 * c);
    } else {
      ctx.beginPath();
      ctx.arc(mid.x, mid.y, SMALL_SLOT.disc * c, 0, Math.PI * 2);
      ctx.fill();
    }
    if (i < carried) return;
    drawn.push(kind);
    drawIcon(f, kind, mid, r.model === 'hauler' ? ITEM_SCALE * c : SMALL_SLOT.size * c, n);
  });
  return drawn;
}

// --- app/lift-view.ts
// The lift in the room and outside views (ADR-063, ADR-074, in ADR-058's Neon look): a cached sprite per (ready, px,
// dpr) drawn after the sweep, dark until the lift is ready and lit with filled chevrons when it is, and its light pool
// only while ready, pulsing with `liftPulse` (still under reduced motion, UX.18). No text (L-07); the light is read
// from the drawn world each frame (UI.10).


                                                          

                                                           

                                                

                                                 

/** ADR-074: one frame's lift look (`roomUI().look.lift`): ready and the pulse it was drawn with. */
                                                           

/** One chevron's three points, pointing from side `s` (0 N, 1 E, 2 S, 3 W) to the centre at distance `d`. */
function chevron(mid        , d        , c        , s        )                     {
  const local                     = [[-0.5 * c, -d - 0.25 * c], [0, -d + 0.25 * c], [0.5 * c, -d - 0.25 * c]];
  const turn = (s * Math.PI) / 2, cos = Math.cos(turn), sin = Math.sin(turn);
  return local.map(([x, y]) => [mid + x * cos - y * sin, mid + x * sin + y * cos]);
}

/**
 * ADR-074: the lift sprite `px` square (5 cells): a plate inset 0.25 c with corner radius 0.5 c in NEON.liftPlate
 * and a 2 px edge, a 2 px ring of radius 1.4 c and four chevrons midway between ring and edge, 1.0 c wide and 0.5 c
 * deep, pointing to the centre; NEON.liftDim with hollow chevrons (1.5 px) when not ready, NEON.liftLit filled when
 * ready. Painted once per key in the glow cache.
 */
function liftSprite(cache           , ready         , px        , dpr        )         {
  return cache.sprite(`lift|${ready}|${px}|${dpr}`, px, px, dpr, (ctx) => {
    const c = px / 5, mid = px / 2, colour = ready ? NEON.liftLit : NEON.liftDim;
    ctx.fillStyle = NEON.liftPlate;
    ctx.strokeStyle = colour;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(0.25 * c, 0.25 * c, px - 0.5 * c, px - 0.5 * c, 0.5 * c);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mid, mid, 1.4 * c, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = colour;
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 4; s++) {
      const [a, b, e] = chevron(mid, (1.4 + 2.25) / 2 * c, c, s);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.lineTo(e[0], e[1]);
      ctx.closePath();
      if (ready) ctx.fill(); else ctx.stroke();
    }
  });
}

/** The lift's region in canvas px and whether any of it is in view. */
function liftBox(f           , level       )                                                             {
  if (level.lift === null) return null;
  const r = CellRect.lift(level.lift);
  const x = cellLeft(f, r.x), y = cellTop(f, r.y), px = Math.round(r.width * f.c);
  return { x, y, px, seen: x < f.vw && x + px > 0 && y < f.vh && y + px > 0 };
}

/**
 * ADR-074: draws the lift of `level` for the world `w` (nothing without a lift); returns its look with `pulse` (the
 * frame's `liftPulse`), or null without a lift.
 */
function drawLift(f           , level       , w            , n          , pulse        )                  {
  const box = liftBox(f, level);
  if (!box) return null;
  const ready = liftReady(level, w);
  if (box.seen) f.ctx.drawImage(liftSprite(n.glow, ready, box.px, n.dpr).canvas, box.x, box.y, box.px, box.px);
  return { ready, pulse };
}

/**
 * ADR-074: the ready lift's pool, POOLS.lift with radius half the side + POOL_RADIUS.liftExtra cells, at alpha ×
 * (0.7 + 0.3 × `pulse`); nothing while the lift is not ready or out of view.
 */
function drawLiftPool(f           , level       , w            , n          , pulse        )       {
  const box = liftBox(f, level);
  if (!box || !liftReady(level, w)) return;
  const r = (LIFT_SIZE / 2 + POOL_RADIUS.liftExtra) * f.c, mx = box.x + box.px / 2, my = box.y + box.px / 2;
  if (mx + r < 0 || mx - r > f.vw || my + r < 0 || my - r > f.vh) return;
  f.ctx.globalAlpha = 0.7 + 0.3 * pulse;
  drawSprite(f.ctx, n.glow.pool(POOLS.lift.colour, POOLS.lift.alpha, r, n.dpr), mx, my, r);
  f.ctx.globalAlpha = 1;
}

// --- app/fab-view.ts
// The fab console in the room and outside views (ADR-082, ADR-089, in ADR-058's Neon look): a cached sprite per (px,
// dpr) over its 4 × 4 region, drawn after the lift and before the pools: a plate with an edge and a chip mark in its
// middle (a black body, a notch, gold stubs), echoing the board's chip symbol. No text (L-07), no light pool and no
// state; it is drawn from the level each frame (UI.10).


                                              
                                                           

                                                

                                                 

/** ADR-089: one frame's console look (`roomUI().look.fab`): whether any of its region was in view. */
                                          

/** Three stubs on each of the west and east sides of a body at (x, y), `bw` × `bh`, each `len` long. */
function stubs(
  ctx                          , x        , y        , bw        , bh        , len        ,
)       {
  ctx.beginPath();
  for (const k of [0.25, 0.5, 0.75]) {
    const sy = y + k * bh;
    ctx.moveTo(x - len, sy);
    ctx.lineTo(x, sy);
    ctx.moveTo(x + bw, sy);
    ctx.lineTo(x + bw + len, sy);
  }
  ctx.stroke();
}

/**
 * ADR-089: the console sprite `px` square (4 cells, c = px / 4): a plate inset 0.2 c with corner radius 0.4 c in
 * NEON.fabPlate with a 2 px NEON.fabEdge edge; a chip body 1.6 c × 1.2 c centred in NEON.fabChip with a 1.5 px
 * fabEdge outline, a notch of radius 0.15 c at the middle of its north edge, and three C.gold stubs per side, 0.3 c
 * long and 1.5 px wide, at a quarter, half and three quarters of its height. Painted once per key in the glow cache.
 */
function fabSprite(cache           , px        , dpr        )         {
  return cache.sprite(`fab|${px}|${dpr}`, px, px, dpr, (ctx) => {
    const c = px / FAB_SIZE, mid = px / 2;
    ctx.fillStyle = NEON.fabPlate;
    ctx.strokeStyle = FAB_COLOURS.edge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(0.2 * c, 0.2 * c, px - 0.4 * c, px - 0.4 * c, 0.4 * c);
    ctx.fill();
    ctx.stroke();
    const bw = 1.6 * c, bh = 1.2 * c, bx = mid - bw / 2, by = mid - bh / 2;
    ctx.strokeStyle = FAB_COLOURS.gold;
    ctx.lineWidth = 1.5;
    stubs(ctx, bx, by, bw, bh, 0.3 * c);
    ctx.fillStyle = NEON.fabChip;
    ctx.strokeStyle = FAB_COLOURS.edge;
    ctx.beginPath();
    ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = NEON.fabPlate;
    ctx.beginPath();
    ctx.arc(mid, by, 0.15 * c, 0, Math.PI);
    ctx.fill();
    ctx.stroke();
  });
}

/**
 * ADR-089: draws the fab console of `level` when any of its region is in view; returns `{ seen }`, or null without a
 * console.
 */
function drawFab(f           , level       , n          )                 {
  if (level.fab === null) return null;
  const r = CellRect.fab(level.fab.position);
  const x = cellLeft(f, r.x), y = cellTop(f, r.y), px = Math.round(r.width * f.c);
  const seen = x < f.vw && x + px > 0 && y < f.vh && y + px > 0;
  if (seen) f.ctx.drawImage(fabSprite(n.glow, px, n.dpr).canvas, x, y, px, px);
  return { seen };
}

// --- app/plaque-view.ts
// The diagram plaques in the room and outside views (ADR-084, ADR-039, ADR-097, in ADR-058's Neon look): each a cached
// sprite per (px, dpr), 2 × 2 cells centred on its cell, drawn after the fab console and before the pools: a plate
// with an edge and a small mark of two dots joined by an arrow. No text (L-07, ADR-084), no pool and no state.

                                              
                                                           

                                                

                                                 

/** ADR-097: a plaque's side in cells. */
const PLAQUE_CELLS = 2;

/**
 * ADR-097: the plaque sprite `px` square (2 cells, c = px / 2): a plate inset 0.15 c with corner radius 0.25 c in
 * NEON.plaquePlate with a 2 px NEON.plaqueEdge edge; two dots of radius 0.14 c at 0.6 c and 1.4 c on the middle row
 * joined by a 1.5 px line with an arrowhead at the east dot, in plaqueEdge. Painted once per key in the glow cache.
 */
function plaqueSprite(cache           , px        , dpr        )         {
  return cache.sprite(`plaque|${px}|${dpr}`, px, px, dpr, (ctx) => {
    const c = px / PLAQUE_CELLS, mid = px / 2;
    ctx.fillStyle = NEON.plaquePlate;
    ctx.strokeStyle = NEON.plaqueEdge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(0.15 * c, 0.15 * c, px - 0.3 * c, px - 0.3 * c, 0.25 * c);
    ctx.fill();
    ctx.stroke();
    const a = 0.6 * c, b = 1.4 * c, r = 0.14 * c, head = 0.22 * c;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(a, mid);
    ctx.lineTo(b - r, mid);
    ctx.moveTo(b - r - head, mid - head);
    ctx.lineTo(b - r, mid);
    ctx.lineTo(b - r - head, mid + head);
    ctx.stroke();
    ctx.fillStyle = NEON.plaqueEdge;
    for (const x of [a, b]) {
      ctx.beginPath();
      ctx.arc(x, mid, r, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/** ADR-097: draws each plaque of `level` that is in view; returns how many were drawn (`roomLook.plaques`). */
function drawPlaques(f           , level       , n          )         {
  const px = Math.round(PLAQUE_CELLS * f.c);
  let drawn = 0;
  for (const p of level.plaques) {
    const x = cellLeft(f, p.position.x) - (px - f.c) / 2, y = cellTop(f, p.position.y) - (px - f.c) / 2;
    if (x >= f.vw || x + px <= 0 || y >= f.vh || y + px <= 0) continue;
    f.ctx.drawImage(plaqueSprite(n.glow, px, n.dpr).canvas, x, y, px, px);
    drawn++;
  }
  return drawn;
}

// --- app/unseen-view.ts
// The unseen dim of the room and outside views (ADR-098): marks the follow frame as seen before each frame and fills
// every unseen cell of the drawn frame with NEON.void at UNSEEN_DIM, as merged rectangles.

                                                   


                                           

                                                 
                                                     

/** Marks the follow frame of the active session's open level in `v.seen` and returns that map. */
function markSeen(v             , w            , vw        , vh        )            {
  const level = v.game.player.run.level;
  const seen = v.seen.of(v.game.player, level);
  const span = framedCells(followFrame(w, level.room.width, level.room.height, vw, vh), level.room.width,
    level.room.height);
  if (span) seen.mark(span);
  return seen;
}

/**
 * Dims each unseen cell of the drawn frame `f` with NEON.void at UNSEEN_DIM, as unseenRects' rectangles, one
 * fillRect each; globalAlpha back to 1. Returns the rectangles and cells dimmed.
 */
function drawUnseen(f           , seen           )                                   {
  const span = framedCells(f, seen.level.room.width, seen.level.room.height);
  const rects = span ? unseenRects(seen, span) : [];
  if (rects.length === 0) return { rects: 0, cells: 0 };
  const { ctx, c } = f;
  ctx.fillStyle = NEON.void;
  ctx.globalAlpha = UNSEEN_DIM;
  for (const r of rects) ctx.fillRect(cellLeft(f, r.x), cellTop(f, r.y), r.width * c, r.height * c);
  ctx.globalAlpha = 1;
  return { rects: rects.length, cells: rects.reduce((n, r) => n + r.width * r.height, 0) };
}

// --- app/robot-view.ts
// Every robot of the room and outside views in the Neon look (ADR-058, ADR-070: Scout, Hauler and Relay, asleep or
// awake), in two passes: first every robot's light (the lens cone unless asleep, thruster cones and pools, ADR-059),
// then every robot's glowing, flickering flames, cached body sprite (robot-bodies.ts), hull parts (room-parts.ts),
// hold items (item-view.ts, ADR-071) and impact marks, each from that robot's shown signals (UX.19) and facing. A
// towed robot is in neither pass: tow-view.ts draws its hull after the figure (ADR-072); its tower's claw closes on
// no crate.


             
                                                                                  
                          




                                                   

                                                   


                                                   

                                                 


/** What the Neon drawing of moving things needs besides the frame: motion, sprites, pixel ratio. */
                                                                         

/**
 * ADR-070: what one frame drew of one robot (the room's debug hook `roomUI().look.robots`); ADR-072: `towedBy` only
 * while towed (then `cones` is 0).
 */
                                
                                                                                             
 

/** ADR-071: the hold items one frame drew on one robot's hull (the debug hook `roomUI().look.holds`). */
                                                                      

const DIRS              = ['north', 'east', 'south', 'west'];
const FLAME_KEYS = { north: 'thrusterN', east: 'thrusterE', south: 'thrusterS', west: 'thrusterW' }         ;
const BUMP_KEYS = { north: 'bumperN', east: 'bumperE', south: 'bumperS', west: 'bumperW' }         ;

/** Robot side in cells. */
const SIDE = 4;

/**
 * One robot as this frame draws it: its state, look, facing, shown signals, pixel box, firing thrusters, whether it
 * carries the `*` crystal (ADR-071) and whether its claw holds a crate (not a towed robot, ADR-072).
 */
                      
                                                                                                             
                                                        
 

/** Robot `i` of `states` with its look (asleep or awake), its facing and its own signals from the shown run. */
function drawnRobot(
  f           , states                       , i        , shown          , facing           , carries         ,
)             {
  const r = states[i];
  const marks = shown.signalsOf(r.model);
  return {
    r, look: robotLookOf(r.model, r.asleep), facing, marks,
    rx: cellLeft(f, r.position.x), ry: cellTop(f, r.position.y), rs: SIDE * f.c,
    flames: DIRS.filter((d) => marks.getKey(`robot.${FLAME_KEYS[d]}`)),
    carries, crate: r.holding && towedOf(states, i) < 0,
  };
}

/**
 * ADR-059, ADR-070, ADR-071, ADR-072: every robot of `w` not towed in robot order, with its marks from
 * `shown.signalsOf(model)` and its facing from `facingOf`: first every robot's light, then every robot's flames,
 * body, hull parts, hold items and impacts, so no robot's light lies over another's body. Returns what was drawn per
 * robot (a towed one with `towedBy` and no cones) and on each hull drawn here.
 */
function drawRobots(
  f           , w            , shown          , n          , facingOf                              ,
)                                                     {
  const states = robotStates(w);
  const carrier = crystalCarrier(states, w.crystal);
  const robots = states.map((r, i) => drawnRobot(f, states, i, shown, facingOf(r.model), i === carrier));
  const grounded = robots.filter((o) => !isTowed(o.r));
  const cones = new Map(grounded.map((o) => [o.r.model, drawRobotLight(f, o, n)]));
  const holds = grounded.map((o) => ({ model: o.r.model, kinds: drawRobotBody(f, o, shown, n) }));
  return {
    robots: robots.map((o) => ({
      model: o.r.model, asleep: o.r.asleep, facing: o.facing, cones: cones.get(o.r.model) ?? 0,
      ...(o.r.towedBy ? { towedBy: o.r.towedBy } : {}),
    })),
    holds,
  };
}

/** One robot's flames, hull (`drawRobotHull`) and impacts; returns the hold kinds drawn. */
function drawRobotBody(f           , o            , shown          , n          )             {
  for (const d of o.flames) drawFlame(f, d, o, n);
  const kinds = drawRobotHull(f, o.r, shown, o.carries, o.crate, n);
  f.ctx.fillStyle = NEON.impact;
  for (const d of DIRS) if (o.marks.getKey(`robot.${BUMP_KEYS[d]}`)) drawImpact(f, d, o.rx, o.ry, o.rs);
  return kinds;
}

/**
 * ADR-070, ADR-071, ADR-072: robot `r`'s body sprite, hull parts (whip waves from its antenna's `tx`, its bars, its
 * claw on a crate when `crate`) and hold items (the `*` crystal's slot first when it `carries` it), at its anchor in
 * the frame's current transform; tow-view.ts draws a towed robot with it. Returns the hold kinds drawn.
 */
function drawRobotHull(
  f           , r            , shown          , carries         , crate         , n          ,
)             {
  const { c } = f;
  const body = bodySprite(n.glow, r.model, robotLookOf(r.model, r.asleep), r.asleep, c, n.dpr);
  f.ctx.drawImage(body.canvas, cellLeft(f, r.position.x), cellTop(f, r.position.y), SIDE * c, SIDE * c);
  const antenna = shown.circuitOf(r.model).components.find((k) => k.kind === 'antenna');
  const tx = antenna !== undefined && shown.signalsOf(r.model).getKey(`${antenna.id}.tx`);
  const capacity = shown.equipmentOf(r.model).battery?.capacity ?? null;
  const bars = r.charge !== null && capacity !== null ? chargeBars(r.charge, capacity) : 4;
  drawRobotParts(f, r, tx, bars, n, crate);
  return drawHold(f, r, holdSlots(r, HOLD_CAPACITY[r.model], carries), n);
}

/**
 * ADR-059, ADR-070: the lens cone (none while asleep) and the thruster cones, then the thruster pools; returns how
 * many cones were drawn.
 */
function drawRobotLight(f           , o            , n          )         {
  const { ctx, c } = f;
  const { rx, ry, rs } = o;
  const cones = conesFor(o.facing, thrustOf(o.marks)).filter((k) => !(o.r.asleep && k.kind === 'lens'));
  for (const cone of cones) {
    const spec = CONES[cone.kind];
    const apex = cone.kind === 'lens'
      ? lensConeApex(rx, ry, rs, cone.dir)
      : flameBase(thrusterConeDir(cone.dir), rx, ry, rs, c);
    const len = spec.length * c;
    const pulse = cone.kind === 'lens' ? 0.9 + 0.1 * n.m.lensPulse : 0.85 + 0.15 * n.m.flicker;
    drawCone(ctx, coneSprite(n.glow, cone.kind, cone.dir, len, n.dpr), coneRect(apex, cone.dir, len, spec.halfAngle, pulse));
  }
  for (const d of o.flames) {
    const b = flameBase(d, rx, ry, rs, c);
    const r = POOL_RADIUS.thruster * c;
    drawSprite(ctx, n.glow.pool(POOLS.thruster.colour, POOLS.thruster.alpha, r, n.dpr), b.x, b.y, r);
  }
  return cones.length;
}

/** The midpoint of the flame's base: the middle of the robot's side opposite the push. */
function flameBase(d           , rx        , ry        , rs        , c        )                           {
  const m = rs / 2, out = 0.6 * c;
  if (d === 'east') return { x: rx - out, y: ry + m };
  if (d === 'west') return { x: rx + rs + out, y: ry + m };
  if (d === 'south') return { x: rx + m, y: ry - out };
  return { x: rx + m, y: ry + rs + out };
}

/** ADR-045's flame triangle at length 1.2 c × (0.85 + 0.15 flicker), its core at 0.6 its size, and a glow. */
function drawFlame(f           , d           , o            , n          )       {
  const { ctx, c } = f;
  const { rx, ry, rs } = o;
  const len = c * 1.2 * (0.85 + 0.15 * n.m.flicker);
  const b = flameBase(d, rx, ry, rs, c);
  const r = 1.1 * c;
  drawSprite(ctx, n.glow.pool(o.look.flame, 0.5, r, n.dpr), b.x, b.y, r);
  ctx.fillStyle = o.look.flame;
  flameTriangle(ctx, d, rx, ry, rs, len, c * 0.6);
  ctx.fillStyle = NEON.flameCore;
  flameTriangle(ctx, d, rx, ry, rs, len * 0.6, c * 0.6 * 0.6);
}

/** Fills a triangle with its base of half-width `half` on the robot's side and its tip `len` away. */
function flameTriangle(
  ctx                          , d           , rx        , ry        , rs        , len        , half        ,
)       {
  const m = rs / 2;
  ctx.beginPath();
  if (d === 'east') { ctx.moveTo(rx, ry + m - half); ctx.lineTo(rx - len, ry + m); ctx.lineTo(rx, ry + m + half); }
  if (d === 'west') {
    ctx.moveTo(rx + rs, ry + m - half); ctx.lineTo(rx + rs + len, ry + m); ctx.lineTo(rx + rs, ry + m + half);
  }
  if (d === 'south') { ctx.moveTo(rx + m - half, ry); ctx.lineTo(rx + m, ry - len); ctx.lineTo(rx + m + half, ry); }
  if (d === 'north') {
    ctx.moveTo(rx + m - half, ry + rs); ctx.lineTo(rx + m, ry + rs + len); ctx.lineTo(rx + m + half, ry + rs);
  }
  ctx.fill();
}

/** Bumper impact mark on the wall side `d` of the robot. */
function drawImpact(f           , d           , rx        , ry        , rs        )       {
  const { ctx, c } = f;
  const t = c * 0.35;
  if (d === 'north') ctx.fillRect(rx + c, ry - t / 2, rs - 2 * c, t);
  if (d === 'south') ctx.fillRect(rx + c, ry + rs - t / 2, rs - 2 * c, t);
  if (d === 'west') ctx.fillRect(rx - t / 2, ry + c, t, rs - 2 * c);
  if (d === 'east') ctx.fillRect(rx + rs - t / 2, ry + c, t, rs - 2 * c);
}

// --- app/tow-view.ts
// Towed robots in the room and outside views (ADR-065, ADR-072): drawn after the figure and before the walk ring,
// the joystick and the vignette, each at TOW_SCALE on its tower's claw over a shadow: its body sprite, hull parts,
// hold items, carried `*` crystal and rider mark, without light, flames or impacts. room-view.ts calls it in the
// frame order and leaves out the towed robot's crystal and rider in its own passes.


                                                                         




                                                              

                                                 

/** ADR-065, ADR-072: a towed robot is drawn at this fraction of its size. */
const TOW_SCALE = 0.7;

/** ADR-072: the shadow under a towed robot (the figure's shadow colour). */
const TOW_SHADOW = 'rgba(0, 0, 0, 0.5)';

/** ADR-072: the shadow's offset (x, y) from the towed robot's box and its corner radius, in cells. */
const SHADOW_SHAPE = { dx: 0.25, dy: 0.4, radius: 0.35 }         ;


/**
 * ADR-072: the drawn box of a robot towed by `tower` (px): side 4c × TOW_SCALE, west edge at the tower's east side
 * + 0.6 × its claw scale cells, its middle level with the tower's; clamped inside `room` so a robot kept lifted at a
 * wall stays on screen (UI.10).
 */
function towedBox(
  f           , tower            , room                                   ,
)                                         {
  const size = ROBOT_SIZE * f.c * TOW_SCALE;
  const x = cellLeft(f, tower.position.x) + ROBOT_SIZE * f.c + 0.6 * ROBOT_BODIES[tower.model].clawScale * f.c;
  const y = cellTop(f, tower.position.y) + (ROBOT_SIZE * f.c) / 2 - size / 2;
  const clamp = (v        , lo        , hi        ) => Math.max(lo, Math.min(v, hi - size));
  return {
    x: clamp(x, cellLeft(f, 0), cellLeft(f, room.width)),
    y: clamp(y, cellTop(f, 0), cellTop(f, room.height)),
    size,
  };
}

/** ADR-072: the shadow, the box as a rounded rectangle offset down and right, in TOW_SHADOW. */
function drawTowShadow(f           , box                                        )       {
  const { ctx, c } = f;
  ctx.fillStyle = TOW_SHADOW;
  ctx.beginPath();
  ctx.roundRect(box.x + SHADOW_SHAPE.dx * c, box.y + SHADOW_SHAPE.dy * c, box.size, box.size, SHADOW_SHAPE.radius * c);
  ctx.fill();
}

/** The carried `*` crystal at its place on `w`'s carrier, in the current transform (ADR-034, ADR-071). */
function drawCarriedCrystal(f           , w            , n          )       {
  const place = crystalPlace(w);
  if (!place) return;
  const mid = placeCentre(f, place);
  drawCrystalAt(f, mid.x, mid.y, place.size, n);
}

/**
 * ADR-072: every towed robot after the figure: the shadow, then its body sprite, hull parts, hold items, carried `*`
 * crystal and rider mark scaled about its own centre into `towedBox`; no light, flames or impacts. Returns the
 * models drawn with the hold kinds drawn on each (the room's `look.holds` entries for towed robots).
 */
function drawTowedRobots(
  f           , w            , shown          , n          , room                                   ,
)                 {
  const states = robotStates(w);
  const carrier = crystalCarrier(states, w.crystal);
  const ridden = riddenModel(w);
  const drawn                 = [];
  for (const [i, r] of states.entries()) {
    const t = towerOf(states, r);
    if (!isTowed(r) || t < 0) continue;
    const box = towedBox(f, states[t], room);
    drawTowShadow(f, box);
    const { ctx, c } = f;
    ctx.save();
    ctx.translate(box.x + box.size / 2, box.y + box.size / 2);
    ctx.scale(TOW_SCALE, TOW_SCALE);
    ctx.translate(-(cellLeft(f, r.position.x) + 2 * c), -(cellTop(f, r.position.y) + 2 * c));
    const kinds = drawRobotHull(f, r, shown, i === carrier, r.holding, n);
    if (i === carrier) drawCarriedCrystal(f, w, n);
    if (w.figure && ridden === r.model) drawFigure(f, w.figure, null);
    ctx.restore();
    drawn.push({ model: r.model, kinds });
  }
  return drawn;
}

/** ADR-072: true when the `*` crystal is carried by a towed robot (tow-view.ts draws it, without its pool). */
function crystalOnTowed(w            )          {
  const states = robotStates(w);
  const carrier = crystalCarrier(states, w.crystal);
  return carrier >= 0 && isTowed(states[carrier]);
}

/** ADR-072: true when the figure rides a towed robot (tow-view.ts draws its rider mark). */
function riderOnTowed(w            )          {
  const ridden = riddenModel(w);
  return ridden !== null && robotStates(w).some((r) => r.model === ridden && isTowed(r));
}

// --- app/figure-sprite.ts
// The Explorer (ADR-056, option 1 of docs/design/figure/figure-study.html) as data: the study's `pose` and
// `drawExplorer` turned into shapes in px relative to the footprint centre, which figure-view.ts replays on the
// canvas. The east and west poses have jointed legs and a lighter, edged near side (ADR-060). DOM-free.

                                                               


                         
                                                                                                                 
                                                                                    
                                                                                           
                                                                                         
                                                                                              

/**
 * One frame of the Explorer: the shadow (drawn first, not lifted), then `shapes` drawn lifted by `lift` px,
 * mirrored when `flipX` and rotated by `lean` radians about the footprint centre.
 */
                                                                                                                        

const EXPLORER_COLORS                  
                                                                                                 = {
  navy: '#171C54', navyLight: '#2D3580', navyNear: '#8A9AF5', nearEdge: NEON.void, skin: '#E8B48C', hair: '#3A2A20', gold: '#EDBA4A',
  shadow: 'rgba(28, 33, 41, 0.22)',
};

/**
 * Design units across the footprint, and how far the figure sits below its centre, in design units. The study
 * uses 20 units, which lets the hair rise 2.3 units above the footprint while running; 23 units and 1 unit down
 * keep the hair and the shadow inside it (ADR-056 "inside its 2 × 2 footprint").
 */
const EXPLORER_UNITS = 23, EXPLORER_DROP = 1;

/** Running east or west leans forward by this many radians (ADR-056). */
const EXPLORER_RUN_LEAN = 0.12;

/** The study's `pose`: swing −1…1, bob 0…1 and the amplitude of the mode. */
function figureSwing(pose            )                                              {
  const amp = pose.mode === 'run' ? 1 : pose.mode === 'walk' ? 0.62 : 0;
  const turn = pose.phase * Math.PI * 2;
  const swing = Math.sin(turn) * amp;
  const bob = pose.mode === 'idle' ? (Math.sin(turn) * 0.5 + 0.5) * 0.15 : Math.abs(Math.cos(turn)) * amp;
  return { swing, bob, amp };
}

const EC = EXPLORER_COLORS;

/** Shape builders in design units `u`, shifted down by EXPLORER_DROP. */
function shapesIn(u        ) {
  const y = (n        ) => (n + EXPLORER_DROP) * u;
  return {
    limb: (x1        , y1        , x2        , y2        , w        , color        , edge         )              =>
      ({ kind: 'limb', x1: x1 * u, y1: y(y1), x2: x2 * u, y2: y(y2), width: w * u, color,
        ...(edge === undefined ? {} : { edge }) }),
    ellipse: (x        , cy        , rx        , ry        , color        )              =>
      ({ kind: 'ellipse', x: x * u, y: y(cy), rx: rx * u, ry: ry * u, color }),
    rrect: (x        , top        , w        , h        , r        , color        )              =>
      ({ kind: 'rrect', x: x * u, y: y(top), w: w * u, h: h * u, r: r * u, color }),
    cap: (x        , cy        , r        , from        , to        , color        )              =>
      ({ kind: 'cap', x: x * u, y: y(cy), r: r * u, from: from * Math.PI, to: to * Math.PI, color }),
  };
}

                                          

/** ADR-060: hip swing, knee bend and arm swing in radians per mode (idle stands straight). */
const SIDE_GAIT                                                                           = {
  idle: { hip: 0, knee: 0, arm: 0 }, walk: { hip: 0.55, knee: 1.0, arm: 0.75 }, run: { hip: 0.8, knee: 1.4, arm: 1.05 },
};

/** ADR-060: thigh and shin lengths in design units. */
const SIDE_THIGH = 2.9, SIDE_SHIN = 2.9;

/** ADR-060: the least distance between the feet at phase 0.25, in cells (asserted by tests, not used to draw). */
const SIDE_MIN_SPREAD_CELLS = { walk: 0.5, run: 0.7 }         ;

/** ADR-060: hip, knee and arm angles of the near (σ = +1) or far (σ = −1) side; positive is ahead (east). */
function sideAngles(pose            , near         )                                             {
  const g = SIDE_GAIT[pose.mode];
  const turn = pose.phase * Math.PI * 2, sigma = near ? 1 : -1;
  return {
    hip: sigma * g.hip * Math.sin(turn) + 0,
    knee: g.knee * Math.max(0, sigma * Math.cos(turn)),
    arm: -sigma * g.arm * Math.sin(turn) + 0, // + 0: idle gives 0, not -0
  };
}

/** One leg as thigh and shin: hip (0, 2), knee, then a shin trailing the thigh by the knee bend. */
function sideLeg(s        , a                               , color        , edge         )                {
  const kx = Math.sin(a.hip) * SIDE_THIGH, ky = 2 + Math.cos(a.hip) * SIDE_THIGH;
  const shin = a.hip - a.knee;
  return [
    s.limb(0, 2, kx, ky, 2.4, color, edge),
    s.limb(kx, ky, kx + Math.sin(shin) * SIDE_SHIN, ky + Math.cos(shin) * SIDE_SHIN, 2.4, color, edge),
  ];
}

/** One arm from the shoulder (0, -2.6), length 4.4. */
function sideArm(s        , angle        , color        , edge         )              {
  return s.limb(0, -2.6, Math.sin(angle) * 4.4, -2.6 + Math.cos(angle) * 4.4, 1.9, color, edge);
}

/** ADR-060's east branch (west mirrors it): far limbs, backpack, torso, near limbs, head; one eye ahead. */
function sideShapes(s        , pose            )                {
  const far = sideAngles(pose, false), near = sideAngles(pose, true);
  return [
    sideArm(s, far.arm, EC.navy), ...sideLeg(s, far, EC.navy),
    s.rrect(-4.2, -4.2, 2.6, 5.4, 1, EC.gold),
    s.rrect(-2.4, -4.4, 4.8, 7, 2, EC.navyLight),
    ...sideLeg(s, near, EC.navyNear, EC.nearEdge), sideArm(s, near.arm, EC.navyNear, EC.nearEdge),
    s.ellipse(0.4, -7.2, 3.2, 3.1, EC.skin),
    s.cap(-0.2, -7.8, 3.3, 0.95, 2.05, EC.hair),
    s.ellipse(2, -7, 0.5, 0.6, EC.navy),
  ];
}

/** The study's north/south branch: south the front (face, eyes, hair, zip), north the back (hair, backpack). */
function frontBackShapes(s        , swing        , front         )                {
  const out                = [];
  const lift = (side        ) => Math.max(0, side * swing) * 2.2;
  for (const side of [-1, 1]) out.push(s.limb(side * 1.4, 2, side * 1.5, 7.2 - lift(side), 2.4, EC.navy));
  for (const side of [-1, 1]) {
    const a = side * swing * (front ? 1 : -1);
    out.push(s.limb(side * 3.1, -3, side * 3.6, 1.4 - a * 1.6, 1.9, EC.navy));
  }
  out.push(s.rrect(-2.8, -4.4, 5.6, 7, 2, EC.navyLight));
  out.push(front ? s.limb(0, -4, 0, 2, 0.6, EC.gold) : s.rrect(-2.2, -4, 4.4, 4.8, 1, EC.gold));
  out.push(s.ellipse(0, -7.4, 3.3, 3.1, front ? EC.skin : EC.hair));
  if (front) {
    out.push(s.cap(0, -8, 3.4, 1.02, 1.98, EC.hair));
    out.push(s.ellipse(-1.2, -7, 0.5, 0.6, EC.navy), s.ellipse(1.2, -7, 0.5, 0.6, EC.navy));
  }
  return out;
}

/** ADR-056: the Explorer in `pose` for a footprint `size` px wide (2 cells). */
function explorerSprite(pose            , size        )               {
  const u = size / EXPLORER_UNITS;
  const s = shapesIn(u);
  const k = figureSwing(pose);
  const side = pose.facing === 'east' || pose.facing === 'west';
  return {
    shadow: s.ellipse(0, 8.2, 5.5, 1.8, EC.shadow),
    lift: k.bob * 0.9 * u,
    flipX: pose.facing === 'west',
    lean: side && pose.mode === 'run' ? EXPLORER_RUN_LEAN : 0,
    shapes: side ? sideShapes(s, pose) : frontBackShapes(s, k.swing, pose.facing === 'south'),
  };
}

// --- app/figure-view.ts
// Canvas drawing of the figure in the room and outside views (ADR-027, ADR-056, ADR-058, ADR-060): a standing figure is
// the Explorer replayed from explorerSprite at its footprint centre with a cyan rim light behind every shape and a
// dark ground shadow, a riding figure the small rider mark.

                                                    
                                                   

                                                      

                                                 



/** ADR-058: the shadow under the Explorer on the dark floor. */
const SHADOW = 'rgba(0, 0, 0, 0.5)';

/** ADR-058: the rim light's width on each side of a shape, max(1, 0.07 cell) px. */
function rimWidth(c        )         {
  return Math.max(1, 0.07 * c);
}

/** Figure (ADR-027, ADR-056): the Explorer in `pose` while standing; riding (or no pose) the rider mark. */
function drawFigure(f           , fig             , pose                   )       {
  if (fig.isRiding || pose === null) drawRiderMark(f, fig);
  else drawExplorer(f, fig, pose);
}

/** The ADR-027 mark: a navy circle with a white rim and visor, 1 × 1 (riding) or 2 × 2. */
function drawRiderMark(f           , fig             )       {
  const { ctx, c } = f;
  const size = fig.isRiding ? 1 : 2;
  const shift = fig.isRiding ? -c * 0.5 : 0;
  const fx = cellLeft(f, fig.position.x) + shift, fy = cellTop(f, fig.position.y) + shift;
  ctx.fillStyle = C.figure;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(fx + size * c / 2, fy + size * c / 2, size * c * 0.48, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(fx + size * c * 0.3, fy + size * c * 0.35, size * c * 0.4, size * c * 0.14);
}

/**
 * ADR-056, ADR-058: the shadow, then the lifted, mirrored and leaning shapes about the 2 × 2 footprint's centre:
 * first every shape in the rim colour widened by `rimWidth`, then the shapes themselves.
 */
function drawExplorer(f           , fig             , pose            )       {
  const { ctx, c } = f;
  const sprite = explorerSprite(pose, 2 * c);
  const cx = cellLeft(f, fig.position.x) + c, cy = cellTop(f, fig.position.y) + c;
  ctx.save();
  ctx.translate(cx, cy);
  drawFigureShape(ctx, { ...sprite.shadow, color: SHADOW });
  ctx.translate(0, -sprite.lift);
  if (sprite.flipX) ctx.scale(-1, 1);
  if (sprite.lean !== 0) ctx.rotate(sprite.lean);
  const rim = rimWidth(c);
  for (const s of sprite.shapes) drawRim(ctx, s, rim);
  for (const s of sprite.shapes) drawFigureShape(ctx, s, rim);
  ctx.restore();
}

/** One shape's rim pass in NEON.rim: a limb `rim` px wider on each side, the rest stroked at 2 `rim` px. */
function drawRim(ctx                          , s             , rim        )       {
  ctx.strokeStyle = NEON.rim;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (s.kind === 'limb') {
    ctx.lineWidth = s.width + 2 * rim;
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
  } else {
    ctx.lineWidth = 2 * rim;
    shapePath(ctx, s);
  }
  ctx.stroke();
}

/** Adds a non-limb shape's outline to the current path. */
function shapePath(ctx                          , s                                        )       {
  if (s.kind === 'ellipse') ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
  else if (s.kind === 'rrect') ctx.roundRect(s.x, s.y, s.w, s.h, s.r);
  else {
    ctx.arc(s.x, s.y, s.r, s.from, s.to);
    ctx.closePath();
  }
}

/** One shape: limbs as round-capped strokes (ADR-060: first a wider `edge` stroke when it has one), the rest filled. */
function drawFigureShape(ctx                          , s             , rim = 0)       {
  if (s.kind === 'limb' && s.edge !== undefined) {
    ctx.beginPath();
    ctx.strokeStyle = s.edge;
    ctx.lineWidth = s.width + rim;
    ctx.lineCap = 'round';
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }
  ctx.beginPath();
  if (s.kind === 'limb') {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    return;
  }
  shapePath(ctx, s);
  ctx.fillStyle = s.color;
  ctx.fill();
}

// --- app/room-view.ts
// Canvas drawing of the room and outside views in the Neon lab look (ADR-058), in its frame order: the void, the static
// layer (room-static.ts: floor, seams, chargers, gaps, hatch pool and base and walls in cached chunks), the light
// sweep, the lift (lift-view.ts, ADR-074), the fab console (fab-view.ts, ADR-089), the diagram plaques
// (plaque-view.ts, ADR-097), the ready lift's, crystal, floor item and beacon pools, the hatch pulse, crates and
// beacons (room-parts.ts), the floor items (item-view.ts, ADR-071),
// every robot not towed (Scout, Hauler, Relay, ADR-070) with its light cones, flames, hull parts, hold items and
// impacts (robot-view.ts), the crystal (at `crystalPlace`), the figure (figure-view.ts, its pose from the move record
// and the frame clock, ADR-056), every towed robot on its tower's claw with its crystal and rider (tow-view.ts,
// ADR-072), the dim of every unseen cell (unseen-view.ts, ADR-098), the tap-to-walk ring and the floor joystick
// (ADR-051, ADR-055) and the vignette. Every motion comes from
// roomMotion on the frame clock and stands still under reduced motion (UX.18).

                                                                           













                                                



                                                 

                                                    


                                                                

/** ADR-058: no steady room or outside frame makes more canvas calls than this (tools/check-neon.ts). */
const ROOM_FRAME_BUDGET = 400;

/**
 * The room's frame in a vw × vh canvas: cell size `c` and the canvas offset of the room's outer edge, so cell
 * (x, y) starts at ox + (x + 1) c, oy + (y + 1) c. Its centre is the follow camera, or the look camera while Look is
 * on and panned (`lookCamera`, ADR-094). Drawing and room input (ADR-051) share it.
 */
function roomFrameOf(
  v             , w            , vw        , vh        ,
)                                        {
  const room = v.game.player.run.level.room;
  const c = cellSize(vw, vh);
  const cam = lookCamera(v.look, w, room.width, room.height, c, vw, vh);
  return { c, ox: Math.round(vw / 2 - cam.x), oy: Math.round(vh / 2 - cam.y) };
}

/** UX.18: the system asks for reduced motion; read on every frame. */
function prefersReducedMotion()          {
  return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches === true;
}

/**
 * Draws the whole room view for the current world state `w` at frame time `now` (ms), each robot's marks from the
 * `shown` run (UX.19, ADR-070); sets `v.figurePose` to the standing figure's pose, or null (ADR-056), and
 * `v.roomLook` to the frame's look numbers. It first marks the follow frame as seen (`markSeen`, ADR-098), so with
 * Look off nothing on screen is unseen.
 */
function renderRoom(v             , w            , shown          , now        )       {
  const { ctx, w: vw, h: vh } = sizeCanvas(v.roomCanvas);
  const run = v.game.player.run;
  const room = run.level.room;
  const { c, ox, oy } = roomFrameOf(v, w, vw, vh);
  const f            = { ctx, c, vw, vh, ox, oy };
  const seen = markSeen(v, w, vw, vh);
  const reduced = prefersReducedMotion();
  const dpr = window.devicePixelRatio || 1;
  const n           = { m: roomMotion(now, reduced, room.width), glow: v.roomCache.glow, dpr };
  ctx.fillStyle = NEON.void;
  ctx.fillRect(0, 0, vw, vh);
  const layer = layerFor(v.roomCache, room, c, dpr);
  const visible = chunksInView(f, room);
  layer.draw(f, visible);
  drawSweep(f, layer, n.m.sweepX);
  const lift = drawLift(f, run.level, w, n, liftPulse(now, reduced));
  const fab = drawFab(f, run.level, n);
  const plaques = drawPlaques(f, run.level, n);
  drawPools(f, v, w, n, lift?.pulse ?? 1);
  drawHatchPulse(f, layer, n.m.hatchPulse);
  drawCrates(f, w.crates);
  drawBeacons(f, run.level.beacons, n.m.ringPhase);
  const items = drawFloorItems(f, w.items ?? [], n);
  const facings = v.game.player.facings;
  const { robots, holds } = drawRobots(f, w, shown, n, (m) => facings.of(m).facing);
  drawStarCrystal(f, w, n);
  drawPerson(v, f, w, now, reduced);
  const drawn = [...holds, ...drawTowedRobots(f, w, shown, n, room)];
  const unseen = drawUnseen(f, seen);
  drawWalkAids(v, f);
  n.glow.vignette(ctx, vw, vh);
  v.roomLook = {
    chunks: layer.cached, built: layer.built, sweepX: n.m.sweepX, ringPhase: n.m.ringPhase,
    facing: robots[0].facing, cones: robots.reduce((k, r) => k + r.cones, 0), sprites: n.glow.painted, robots,
    items, holds: robots.map((r) => drawn.find((h) => h.model === r.model) ?? { model: r.model, kinds: [] }), lift,
    fab, plaques, unseen,
  };
}

/**
 * ADR-034, ADR-071: the `*` crystal at its place: on the floor, on Scout or Relay, or in Hauler's first bed slot;
 * on a towed robot tow-view.ts draws it (ADR-072).
 */
function drawStarCrystal(f           , w            , n          )       {
  const place = crystalPlace(w);
  if (!place || crystalOnTowed(w)) return;
  const mid = placeCentre(f, place);
  drawCrystalAt(f, mid.x, mid.y, place.size, n);
}

/** The figure with its pose (ADR-056); a rider in a towed robot is drawn by tow-view.ts (ADR-072). */
function drawPerson(v             , f           , w            , now        , reduced         )       {
  v.figurePose = null;
  if (w.figure && !w.figure.isRiding) {
    const motion = v.game.player.motion;
    v.figureSeen = observeMoves(v.figureSeen, motion.moves, now);
    v.figurePose = figurePose(motion, v.figureSeen, now, reduced);
  }
  if (w.figure && !riderOnTowed(w)) drawFigure(f, w.figure, v.figurePose);
}

/** The walk ring and the joystick over the world (ADR-051, ADR-055). */
function drawWalkAids(v             , f           )       {
  const walk = v.game.player.walkTarget;
  if (walk?.kind === 'cell') drawWalkTarget(f, walk.anchor);
  if (v.roomTouch?.moved) drawJoystick(f, v.roomTouch, v.roomCanvas.getBoundingClientRect());
}

/** The sweep: seams within 3 cells of `sweepX` in NEON.sweep at alpha 0.5 × (1 − distance / 3), visible rows. */
function drawSweep(f           , layer             , sweepX               )       {
  if (sweepX === null) return;
  const { ctx, c } = f;
  const y0 = Math.floor(-f.oy / c) - 1, y1 = Math.ceil((f.vh - f.oy) / c);
  ctx.fillStyle = NEON.sweep;
  for (const r of layer.layout.seamsWest) {
    const d = Math.abs(r.x - sweepX);
    const from = Math.max(r.y, y0), to = Math.min(r.y + r.len, y1);
    if (d >= 3 || from >= to) continue;
    ctx.globalAlpha = 0.5 * (1 - d / 3);
    ctx.fillRect(cellLeft(f, r.x), cellTop(f, from), 1, (to - from) * c);
  }
  ctx.globalAlpha = 1;
}

/**
 * The dynamic light pools: the ready lift's (with `liftPulse`, ADR-074), the `*` crystal's (none on a towed robot,
 * ADR-072) and each floor item's (with the pulse, ADR-071) and each beacon's.
 */
function drawPools(f           , v             , w            , n          , pulse        )       {
  drawLiftPool(f, v.game.player.run.level, w, n, pulse);
  const { ctx, c } = f;
  const place = crystalPlace(w);
  if (place && !crystalOnTowed(w)) {
    const r = POOL_RADIUS.crystalPerSize * place.size * c;
    const mid = placeCentre(f, place);
    const sprite = n.glow.pool(POOLS.crystal.colour, POOLS.crystal.alpha, r, n.dpr);
    drawSprite(ctx, sprite, mid.x, mid.y, r, 0.85 + 0.15 * n.m.crystalPulse);
  }
  drawItemPools(f, w.items ?? [], n);
  const br = POOL_RADIUS.beacon * c;
  for (const b of v.game.player.run.level.beacons) {
    const top = beaconTop(f, b);
    drawSprite(ctx, n.glow.pool(POOLS.beacon.colour, POOLS.beacon.alpha, br, n.dpr), top.x, top.y, br);
  }
}

/** One fill of each visible hatch rectangle in hatch at alpha 0.04 + 0.10 × `pulse`. */
function drawHatchPulse(f           , layer             , pulse        )       {
  const { ctx, c } = f;
  ctx.fillStyle = NEON.hatch;
  ctx.globalAlpha = 0.04 + 0.1 * pulse;
  for (const h of layer.layout.hatches) {
    const x = cellLeft(f, h.x), y = cellTop(f, h.y), w = h.width * c, hh = h.height * c;
    if (x < f.vw && x + w > 0 && y < f.vh && y + hh > 0) ctx.fillRect(x, y, w, hh);
  }
  ctx.globalAlpha = 1;
}

/** ADR-051, ADR-058: a 2 px ring in the rim colour of radius one cell around the target footprint's centre. */
function drawWalkTarget(f           , a              )       {
  const { ctx, c } = f;
  ctx.strokeStyle = NEON.rim;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cellLeft(f, a.x) + c, cellTop(f, a.y) + c, c, 0, Math.PI * 2);
  ctx.stroke();
}

/**
 * ADR-051, ADR-058: the joystick base where the pointer went down and the knob at the finger (clamped); client
 * px. The knob is solid gold with a 3 px void rim while the joystick sprints (ADR-055), else a light glass knob
 * with a 2 px white rim.
 */
function drawJoystick(f           , t           , canvas                               )       {
  const { ctx } = f;
  const bx = t.start.x - canvas.left, by = t.start.y - canvas.top;
  const k = knobOffset(t.at.x - t.start.x, t.at.y - t.start.y);
  ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(56, 225, 255, 0.10)';
  ctx.strokeStyle = 'rgba(56, 225, 255, 0.55)';
  ctx.beginPath();
  ctx.arc(bx, by, JOYSTICK.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = t.sprint ? C.gold : 'rgba(233, 245, 255, 0.35)';
  ctx.strokeStyle = t.sprint ? NEON.void : NEON.white;
  ctx.lineWidth = t.sprint ? 3 : 2;
  ctx.beginPath();
  ctx.arc(bx + k.x, by + k.y, JOYSTICK.knob, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// --- app/layout-probe.ts
// The layout probe (CHUNK-1.6): decides what counts as a layout problem on the current screen. The decision is
// pure (`layoutProblems`, `clipToScroller`); `collectProbeBoxes` reads the real rectangles, a Menu button clipped to
// the scrolling Menu list (ADR-071). Called from the screenshot steps as `rewired.layoutProblems()`.

/** One element the probe checks, in CSS pixels of the viewport (CHUNK-1.6; ADR-041 (1): controls >= 44 px). */
                           
                      
     
                                                                                                                  
                                                                                                                   
                                                                       
     
                                                                   
                                                                              
                                                                                             
                             
                                                                                                              
                             
                                                                                                                  
                              
 

                             

const overlapArea = (a      , b      )         => {
  const w = Math.min(a.left + a.width, b.left + b.width) - Math.max(a.left, b.left);
  const h = Math.min(a.top + a.height, b.top + b.height) - Math.max(a.top, b.top);
  return w > 0 && h > 0 ? w * h : 0;
};

/**
 * Layout problems, one line each, sorted; empty when none: `offscreen <id>` (an edge more than 0.5 px outside the
 * view), `small <id>` (a control under 44 x 44), `overlap <a> <b>` (two controls, two banners, a control and
 * the board, a banner and a control, or a panel and a control, banner or the board share more than 1 px squared;
 * ids sorted), `clipped <id>` (text, a banner, a panel or a button whose text overflows). A control marked
 * `onBoard` may cover the board; a banner may cover the board.
 */
function layoutProblems(boxes                     , view                                   )           {
  const out = new Set        ();
  for (const b of boxes) {
    const r = b.rect;
    if (b.kind !== 'board' && (r.left < -0.5 || r.top < -0.5 || r.left + r.width > view.width + 0.5 ||
      r.top + r.height > view.height + 0.5)) out.add(`offscreen ${b.id}`);
    if (b.kind === 'control' && !b.scrolled && (r.width < 44 || r.height < 44)) out.add(`small ${b.id}`);
    if (b.clipped) out.add(`clipped ${b.id}`);
  }
  const solid = boxes.filter((b) => b.kind !== 'text');
  for (let i = 0; i < solid.length; i++) {
    for (let j = i + 1; j < solid.length; j++) {
      const a = solid[i], b = solid[j];
      if (!mayOverlap(a, b) && overlapArea(a.rect, b.rect) > 1) out.add(`overlap ${[a.id, b.id].sort().join(' ')}`);
    }
  }
  return [...out].sort();
}

/** Pairs never reported: two boards, a banner and the board, the board and an `onBoard` control. */
function mayOverlap(a          , b          )          {
  const kinds = [a.kind, b.kind].sort().join(' ');
  if (kinds === 'board board' || kinds === 'banner board') return true;
  return kinds === 'board control' && (a.onBoard === true || b.onBoard === true);
}

/** ADR-071: the part of `rect` inside the scrolling list's rectangle `scroller`, or null when none of it is. */
function clipToScroller(rect      , scroller      )              {
  const left = Math.max(rect.left, scroller.left), top = Math.max(rect.top, scroller.top);
  const right = Math.min(rect.left + rect.width, scroller.left + scroller.width);
  const bottom = Math.min(rect.top + rect.height, scroller.top + scroller.height);
  return right > left && bottom > top ? { left, top, width: right - left, height: bottom - top } : null;
}

const TEXT_SELECTOR = '#version, #title h1, #title p, #confirm p, #confirm h2';
const BANNER_SELECTOR = '#message, #periscope-label';
const PANEL_SELECTOR = '#itembar, #plaque-box';
const overflows = (el         ) => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;

/**
 * The visible buttons, text and banners of the screen plus the visible board hull (`boardRect`, null outside); a
 * button in the Menu list counts with its part inside the list, and not at all when it is scrolled out (ADR-071).
 */
function collectProbeBoxes(doc          , boardRect             )             {
  const visible = (el         )              => {
    if (el.closest('[hidden]')) return null;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 ? { left: r.left, top: r.top, width: r.width, height: r.height } : null;
  };
  // CHUNK-3.9: the open chip drawer is a popover like the Menu (ADR-088 puts it where the Menu list opens): while it
  // shows, only its buttons are checked.
  const popovers = ['confirm', 'menu', 'chip-drawer'].map((id) => doc.getElementById(id));
  const dialog = popovers.find((d) => d && !d.hidden) ?? null;
  const boxes             = [];
  doc.querySelectorAll('button').forEach((b) => {
    const full = visible(b);
    if (!full || (dialog && !dialog.contains(b))) return;
    const list = b.closest('.menu-list');
    const listRect = list ? visible(list) : null;
    const rect = listRect ? clipToScroller(full, listRect) : full;
    if (!rect) return;
    const scrolled = rect.width < full.width || rect.height < full.height;
    boxes.push({
      id: b.id, kind: 'control', rect, clipped: overflows(b), onBoard: b.hasAttribute('data-on-board'), scrolled,
    });
  });
  if (!dialog) {
    const add = (selector        , kind                             ) => doc.querySelectorAll(selector).forEach((t) => {
      const rect = visible(t);
      if (rect) boxes.push({ id: t.id || t.className || t.tagName.toLowerCase(), kind, rect, clipped: overflows(t) });
    });
    add(TEXT_SELECTOR, 'text');
    add(BANNER_SELECTOR, 'banner');
    add(PANEL_SELECTOR, 'panel');
    if (boardRect) boxes.push({ id: 'board', kind: 'board', rect: boardRect });
  }
  return boxes;
}

// --- app/wall-symbols.ts
// The robot interior's bumper and thruster symbols (ADR-049, ADR-025): geometry in frame units ported 1:1 from
// iOS/App/CircuitEditor/PeripheralSymbol.swift. A frame is 1 deep, centred on the origin, the outside is up
// (-y); the drawing code rotates it onto its wall. DOM-free.

                                                                                    

                                           
// HULL_MARGIN is only read inside wallSymbols, so the import cycle with interior-parts.ts is harmless.



/** One path command in frame units: M and L take x, y; Q takes cx, cy, x, y; Z none (ADR-049). */
                                                                               
/** One stroked or filled part of a wall symbol (ADR-049). */
                             
                           
                           
                          
                           
 

const UNIT = 1 / 44;
const THRUSTER_UNIT = 0.52 / 33;

/** Where the thruster arrow points, in frame units: the middle of the frame's board edge. */
const ARROW_TIP = { x: 0, y: 0.42 };
const ARROW_TAIL = { x: 0, y: 0.17 };

/** Rotation from frame units (outside -y) onto each wall (ADR-049). */
const WALL_ANGLE                                      = {
  north: 0, east: Math.PI / 2, south: Math.PI, west: -Math.PI / 2,
};

const symbolGlyph = (x        , y        )           => [(x - 16) * UNIT, (y - 16) * UNIT];
const thrusterPoint = (x        , y        )           =>
  [(x - 16) * THRUSTER_UNIT, -0.44 + (y + 3) * THRUSTER_UNIT];

const opM = (p                   )           => ({ op: 'M', pts: p });
const opL = (p                   )           => ({ op: 'L', pts: p });
const opQ = (c                   , p                   )           => ({ op: 'Q', pts: [...c, ...p] });
const OP_Z           = { op: 'Z', pts: [] };

/** A polyline through points, as ops. */
const polyline = (pts            , closed = false)             =>
  [opM(pts[0]), ...pts.slice(1).map(opL), ...(closed ? [OP_Z] : [])];

/** The bumper: curved plate, two springs over a base line, and gold impact marks while `contact`. */
function bumperPaths(contact         )               {
  const plate             = {
    ops: [opM(symbolGlyph(5, 12)), opQ(symbolGlyph(16, 7), symbolGlyph(27, 12))],
    paint: 'stroke', colour: 'text', weight: 'plate',
  };
  const zig = [[11, 14], [8, 17], [14, 20], [8, 23], [11, 26]];
  const spring = (dx        ) => polyline(zig.map(([x, y]) => symbolGlyph(x + dx, y)));
  const springs             = {
    ops: [...spring(0), ...spring(10), ...polyline([symbolGlyph(6, 28), symbolGlyph(26, 28)])],
    paint: 'stroke', colour: 'text', weight: 'line',
  };
  const out = [plate, springs];
  if (contact) {
    const marks = [[9, 5, 7, 2], [16, 4, 16, 1], [23, 5, 25, 2]];
    const ops = marks.flatMap(([x0, y0, x1, y1]) => polyline([symbolGlyph(x0, y0), symbolGlyph(x1, y1)]));
    out.push({ ops, paint: 'stroke', colour: 'gold', weight: 'line' });
  }
  return out;
}

/** The thruster: a gold flame first while `firing`, then the nozzle and the arrow of its travel (ADR-025). */
function thrusterPaths(firing         )               {
  const out               = [];
  if (firing) {
    out.push({
      ops: [
        opM(thrusterPoint(10, 9)), opQ(thrusterPoint(16, -3), thrusterPoint(22, 9)),
