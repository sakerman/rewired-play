   * Same run with another compiled circuit for robot `model` (default the first; ADR-011, ADR-021, ADR-069); checks
   * robot and parts like attach against that robot's own equipment (ADR-029, ADR-073) and keeps its matching
   * flip-flops.
   */
  replacing(compiled                 , model                    = this.firstModel)             {
    const robot = this.world && model !== null ? attachedRobot(compiled, this.world.equipmentOf(model)) : null;
    const next = this.clone();
    next.setCircuit(model, compiled, robot);
    return next;
  }

  /** Robot `model`'s circuit becomes `compiled` with `robot`, keeping its flip-flops by key (ADR-021, ADR-080). */
          setCircuit(model                   , compiled                 , robot                    )       {
    const slots = { first: this.first, firstRobot: this.firstRobot, others: this.others, state: this.state };
    const next = withCircuit(slots, this.firstModel, model, compiled, robot);
    this.first = next.first;
    this.firstRobot = next.firstRobot;
    this.others = next.others;
    this.state = next.state;
  }

  /**
   * ADR-026, ADR-071, ADR-073, ADR-074 Reset: tick 0 and fresh flip-flops; the world returns to its arrival with
   * every robot's arrival equipment, and each robot keeps its circuit (ADR-020) except that its part components are
   * matched to that equipment (`withParts`) when a fit or remove changed them.
   */
  reset()       {
    this.world?.reset();
    for (const m of resetMatches(this.world, (x) => this.compiledOf(x))) this.setCircuit(m.model, m.compiled, m.robot);
    this.state = initialState(this.first, this.others);
  }

  /**
   * ADR-066, ADR-073: between ticks, fits `part` from the riding figure's inventory to the ridden robot (its circuit
   * gains the part without wires, its flip-flops kept); a `FitError` (fitting.ts `planFit`) changes nothing.
   */
  fitPart(part           )             {
    const [w, circuit] = fitTarget(this.world, (m) => this.compiledOf(m));
    return this.commit(planFit(w.state, w.equipmentByModel, circuit, part, w.level.editor?.rules.board ?? null));
  }

  /**
   * ADR-066, ADR-073: between ticks, removes `part` from the ridden robot (the part and its wires leave its circuit)
   * and appends it to the inventory; a `FitError` (fitting.ts `planRemove`) changes nothing.
   */
  removePart(part           )             {
    const [w, circuit] = fitTarget(this.world, (m) => this.compiledOf(m));
    return this.commit(planRemove(w.state, w.equipmentByModel, circuit, part));
  }

          commit(plan         )             {
    const done = commitPlan(this.world, plan);
    this.world = done.world;
    this.setCircuit(plan.model, done.compiled, done.robot);
    return done.world.state;
  }

  exitRobot()       {
    this.world = betweenTicks(this.world, (w) => w.exitRobot());
  }

  /** A paused figure move between ticks (ADR-061): only the world changes; tick and flip-flops stay. */
  moveFigure(steering           , sprint = false)             {
    this.world = betweenTicks(this.world, (w) => w.moveFigure(steering, sprint));
    return this.world.state;
  }

  /** ADR-065, ADR-071: stow or take between ticks like `exitRobot`; only the world changes, nothing on a refusal. */
  passItem(action                 , kind          )             {
    this.world = betweenTicks(this.world, (w) => w.passItem(action, kind));
    return this.world.state;
  }
}

// --- core/level-run.ts
// The public LevelRun facade (ADR-010, ADR-011, ADR-015, ADR-021, ADR-024): a level with one circuit per robot,
// stepped by a host. With several robots (ADR-064, ADR-069) `circuit`, `signals`, `flipFlopStates` and
// `replaceCircuit` act on the current robot (the ridden one, else the first); `circuitOf` and `signalsOf` reach any.
// `fitPart` and `removePart` change the ridden robot's equipment and circuit, `equipmentOf` reads any robot's
// (ADR-066, ADR-073). A run starts at its arrival and Reset returns there: tick 0 with the level's equipment, or a
// campaign level's arrival through `atArrival` (ADR-067, ADR-074).

                                            

                                                           
                                                      

                                                
                                              
                                           
                                        


                                           
                                              
                                                 

                                             

function levelRunError(e         )          {
  if (e instanceof GameCoreError && (e.domain === 'CompileError' || e.domain === 'AttachError')) {
    return new GameCoreError('LevelRunError', e.code, e.detail);
  }
  return e;
}

/** ADR-069: the attached simulation of `circuits`: one circuit for a one-robot level, or one per robot model. */
function attach(level       , circuits                                            )             {
  if (circuits instanceof Circuit) {
    if (level.robots.length !== 1) checkCircuitModels(level, [level.robots[0].model]);
    return Simulation.attached(new CompiledCircuit(circuits), level);
  }
  checkCircuitModels(level, [...circuits.keys()]);
  const compiled = new Map([...circuits].map(([model, c]) => [model, new CompiledCircuit(c)]));
  return Simulation.attachedAll(level, compiled);
}

/**
 * A level with its robot circuits, stepped by a host (ADR-010, ADR-011, ADR-015). A one-robot level takes one
 * circuit; any level takes a map with exactly its models (ADR-069, else `LevelRunError.circuitsMismatch`).
 * `clone()` copies.
 */
class LevelRun {
          simulation            ;
           level       ;

  constructor(level       , circuits                                            , simulation             ) {
    this.level = level;
    if (simulation) {
      this.simulation = simulation;
      return;
    }
    try {
      this.simulation = attach(level, circuits);
    } catch (e) {
      throw levelRunError(e);
    }
  }

  /**
   * ADR-067, ADR-074: a run of `level` that starts at `arrival` and resets to it, each robot's circuit attached
   * against its arrival equipment; errors as the constructor's.
   */
  static atArrival(level       , circuits                                  , arrival         )           {
    let simulation            ;
    try {
      checkCircuitModels(level, [...circuits.keys()]);
      const compiled = new Map([...circuits].map(([model, c]) => [model, new CompiledCircuit(c)]));
      simulation = Simulation.attachedAll(level, compiled, arrival);
    } catch (e) {
      throw levelRunError(e);
    }
    // Non-null: the map has the level's first robot, checked above.
    return new LevelRun(level, circuits.get(level.robots[0].model) , simulation);
  }

  clone()           {
    return new LevelRun(this.level, this.circuit, this.simulation.clone());
  }

  /** ADR-069: the level's robot models in robot order. */
  get models()                        {
    return this.level.robots.map((r) => r.model);
  }

  /** ADR-069: the robot the figure rides, else the first in robot order. */
  get current()             {
    const f = this.world.figure;
    return f?.isRiding ? f.robot ?? this.models[0] : this.models[0];
  }

  /** The current robot's circuit (ADR-069). */
  get circuit()          { return this.circuitOf(this.current); }
  get tick()         { return this.simulation.state.tick; }
  /**
   * ADR-089: the last `step` or `moveFigure` walked the figure on foot into the fab console, which left it where it
   * was; false after any other change. CHUNK-3.5 opens the fab view on it.
   */
  get enteredFab()          { return this.simulation.enteredFab; }
  // Non-null: Only used by a LevelRun, which is created with a world.
  get world()             { return this.simulation.world .state; }
  /** ADR-039, ADR-097: the first plaque the standing figure reads in the committed world, or null. */
  get plaqueInReach()                { return plaqueInReach(this.level.plaques, this.world); }

  /** ADR-069: robot `model`'s circuit; `LevelRunError.unknownRobot(model)` when the level has no such robot. */
  circuitOf(model            )          {
    const compiled = this.simulation.compiledOf(model);
    if (!compiled) throw new GameCoreError('LevelRunError', 'unknownRobot', model);
    return compiled.circuit;
  }

  /** One tick; `steering` walks a standing figure (ADR-026, ADR-027), `sprint` runs it (ADR-055). */
  step(steering                   = null, sprint = false)             {
    this.simulation.step(new Map(), steering, sprint);
    return this.world;
  }

  /**
   * ADR-026, ADR-073, ADR-074: tick 0 at the arrival, every robot's equipment back to its arrival equipment and each
   * circuit matched to it.
   */
  reset()       {
    this.simulation.reset();
  }

  exitRobot()       {
    this.simulation.exitRobot();
  }

  /** Moves only the figure, not a tick (ADR-061); riding or without a figure nothing changes. */
  moveFigure(steering           , sprint = false)             {
    this.simulation.moveFigure(steering, sprint);
    return this.world;
  }

  /**
   * ADR-065, ADR-071: the riding figure puts the first `kind` of its inventory into the ridden robot's hold as
   * kept, between ticks; `HoldError` `notRiding`, `notInInventory(kind)` or `holdFull` leave the run unchanged.
   */
  stow(kind          )             {
    return this.simulation.passItem('stow', kind);
  }

  /**
   * ADR-065, ADR-071: the riding figure takes the first `kind` of the ridden robot's hold into its inventory,
   * between ticks; `HoldError` `notRiding` or `notInHold(kind)` leave the run unchanged.
   */
  take(kind          )             {
    return this.simulation.passItem('take', kind);
  }

  /**
   * ADR-066, ADR-073: between ticks, fits the first `part` of the riding figure's inventory to the ridden robot,
   * whose circuit gains the part without wires; `FitError` `notRiding`, `notInInventory(part)`,
   * `alreadyFitted(part)`, `idInUse(part)` or `boardTooSmall(wall)` leave the run unchanged.
   */
  fitPart(part           )             {
    return this.simulation.fitPart(part);
  }

  /**
   * ADR-066, ADR-073: between ticks, removes `part` and its wires from the ridden robot and appends it to the
   * inventory; `FitError` `notRiding`, `notFitted(part)`, `notRemovable(battery)` or `armInUse` leave the run
   * unchanged.
   */
  removePart(part           )             {
    return this.simulation.removePart(part);
  }

  /** ADR-073: robot `model`'s fitted parts; `LevelRunError.unknownRobot(model)` when the level has no such robot. */
  equipmentOf(model            )            {
    if (!this.models.includes(model)) throw new GameCoreError('LevelRunError', 'unknownRobot', model);
    // Non-null: Only used by a LevelRun, which is created with a world.
    return this.simulation.world .equipmentOf(model);
  }

  /**
   * ADR-074: robot `model`'s fitted parts at the arrival (the level's in a practice level);
   * `LevelRunError.unknownRobot(model)` when the level has no such robot.
   */
  arrivalEquipmentOf(model            )            {
    if (!this.models.includes(model)) throw new GameCoreError('LevelRunError', 'unknownRobot', model);
    // Non-null: Only used by a LevelRun, which is created with a world, whose arrival has every robot's parts.
    return this.simulation.world .arrival.equipment.get(model) ;
  }

  /** ADR-063, ADR-074: the lift is ready in the committed world (false without a lift). */
  get liftReady()          {
    return liftReady(this.level, this.world);
  }

  get canEditCircuit()          {
    return this.world.figure?.isRiding ?? true;
  }

  /** What the current robot's next step resolves (ADR-024, ADR-069). */
  get signals()               {
    return this.simulation.resolveOf(this.current);
  }

  /**
   * ADR-024, ADR-069: what robot `model`'s next step resolves, every pin off while it is asleep;
   * `LevelRunError.unknownRobot(model)` when the level has no such robot.
   */
  signalsOf(model            )               {
    if (!this.models.includes(model)) throw new GameCoreError('LevelRunError', 'unknownRobot', model);
    return this.simulation.resolveOf(model);
  }

  /** The current robot's committed flip-flops (ADR-069). */
  get flipFlopStates()                                    {
    // Non-null: `current` is always one of the level's robots.
    return this.simulation.flipFlopsOf(this.current) ;
  }

  /**
   * Replaces the current robot's circuit between ticks (ADR-011, ADR-021, ADR-023, ADR-069); refusals leave the
   * run unchanged.
   */
  replaceCircuit(circuit         )       {
    if (!this.canEditCircuit) throw new GameCoreError('LevelRunError', 'figureOutside');
    try {
      this.simulation = this.simulation.replacing(new CompiledCircuit(circuit), this.current);
    } catch (e) {
      throw levelRunError(e);
    }
  }
}

// --- core/carry.ts
// What a campaign level hands to the next (ADR-067, ADR-074): the robots that come along with their circuits, parts
// and holds, the inventory and the parts unlocked so far; the arrival a carry gives the next level and the carry a
// run at its ready lift gives. The campaign level that uses both is in campaign.ts.


                                            

                                                          
                                             
                                                

                                                      

                                        
                                               

                                                          

/** ADR-067, ADR-074: one robot that comes along: its circuit as a Schematic, its fitted parts, its hold. */
                               
                             
                                
                                
                                      
 

/** ADR-067: what a level hands to the next. */
                        
                                           
                                          
                                           
 

/** ADR-067, ADR-074: the carry the campaign's first level starts from: no robot, no item, no part. */
const EMPTY_CARRY        = { robots: [], inventory: [], parts: [] };

/** `CampaignError` with its code and detail (ADR-067, ADR-074). */
function campaignError(code        , detail          )                {
  return new GameCoreError('CampaignError', code, detail);
}

/** A carried robot's state at its line: awake, its hold, its battery full (null without one), arm empty. */
function arrivedRobot(r            , c              )             {
  const charge = c.equipment.battery ? c.equipment.battery.capacity : null;
  return { ...r, asleep: false, hold: [...c.hold], charge, holding: false, towedBy: null };
}

/**
 * ADR-074: the arrival of `level` with `carry` applied (carried robots awake, holds, equipment, full charge); the
 * other robots keep the level's start and equipment, the inventory is the carry's.
 */
function arrivalOf(level       , carry       )          {
  const start = initialWorldState(level);
  const carried = new Map(carry.robots.map((c) => [c.model, c]));
  const all = robotStates(start).map((r) => {
    const c = carried.get(r.model);
    return c ? arrivedRobot(r, c) : r;
  });
  const state = withRobotStates({ ...start, inventory: [...carry.inventory] }, all);
  const equipment = new Map(level.robots.map((r) => [r.model, carried.get(r.model)?.equipment ?? level.equipment]));
  return { state, equipment };
}

/** Canonical JSON of a circuit, so two circuits compare by content (ADR-074 `circuitMismatch`). */
const circuitText = (c                      ) => encodeSwiftJSON(c.toJSON());

/**
 * ADR-074: the carry of `run` with the host's `schematics` (one per robot model, which keep the component
 * positions) and the level's `parts`, first fault wins: `liftNotReady` while the lift is not ready, then per robot in
 * robot order `circuitMismatch(model)` for a missing schematic or one whose circuit differs from the run's. A carried
 * `*` crystal goes first into its carrier's hold as `{ kind: 'crystal', kept: false }`.
 */
function carryFrom(
  run          , schematics                                    , parts                          ,
)        {
  if (!run.liftReady) throw campaignError('liftNotReady');
  for (const model of run.models) {
    const s = schematics.get(model);
    const same = s !== undefined && circuitText(s.circuit) === circuitText(run.circuitOf(model));
    if (!same) throw campaignError('circuitMismatch', model);
  }
  const w = run.world;
  const all = robotStates(w);
  const carrier = crystalCarrier(all, w.crystal);
  const robots = all.map((r, i)               => ({
    model: r.model,
    // Non-null: every model was checked above.
    schematic: schematics.get(r.model) ,
    equipment: run.equipmentOf(r.model),
    hold: [...(i === carrier ? [{ kind: 'crystal'         , kept: false }] : []), ...r.hold.map((h) => ({ ...h }))],
  }));
  return { robots, inventory: [...w.inventory], parts: [...parts] };
}

// --- core/content.ts
// Port of GameCore/Content: TileSketch (ADR-038). The slice itself is levels/slice.level (ADR-044).


                                              

                                                        

/** ADR-038's tile-to-cell conversion for levels drawn as old tile pictures; `+` fills its block (ADR-044). */
const TileSketch = {
  blockSide: 5,

  room(rows          )       {
    const sketch = Room.fromRows(rows);
    const side = TileSketch.blockSide;
    const width = sketch.width * side;
    const height = sketch.height * side;
    if (width > Room.maxSide || height > Room.maxSide) {
      throw new GameCoreError('WorldError', 'invalidRoomSize', { width, height });
    }
    const cells             = new Array(width * height).fill('floor');
    const centre = Math.floor(side / 2);
    const isLine = (k                 ) => k === 'wall' || k === 'hatch';
    const drawsArm = (d           , tx        , ty        ) => {
      const nx = tx + DX[d], ny = ty + DY[d];
      if (sketch.contains({ x: nx, y: ny })) return isLine(sketch.tileXY(nx, ny));
      const ox = tx + DX[OPPOSITE[d]], oy = ty + DY[OPPOSITE[d]];
      return !sketch.contains({ x: ox, y: oy }) || isLine(sketch.tileXY(ox, oy));
    };
    for (let ty = 0; ty < sketch.height; ty++) {
      for (let tx = 0; tx < sketch.width; tx++) {
        const kind = sketch.tileXY(tx, ty);
        if (kind === null || kind === 'floor') continue;
        const set = (cx        , cy        ) => { cells[(ty * side + cy) * width + tx * side + cx] = kind; };
        if (kind === 'gap' || kind === 'charger') {
          for (let cy = 0; cy < side; cy++) for (let cx = 0; cx < side; cx++) set(cx, cy);
          continue;
        }
        set(centre, centre);
        for (const d of DIRECTIONS) {
          if (!drawsArm(d, tx, ty)) continue;
          for (let step = 1; step <= centre; step++) set(centre + DX[d] * step, centre + DY[d] * step);
        }
      }
    }
    return new Room(width, height, cells);
  },

  robot(tile              )               { return { x: tile.x * 5, y: tile.y * 5 }; },
  goal(tile              )               { return { x: tile.x * 5, y: tile.y * 5 }; },
  figure(tile              )               { return { x: tile.x * 5 + 1, y: tile.y * 5 + 1 }; },
  crystal(tile              )               { return { x: tile.x * 5 + 1, y: tile.y * 5 + 1 }; },
  /** A crate marker's anchor at `scale 5`: tile × 5 + (1, 1) (ADR-032, ADR-044). */
  crate(tile              )               { return { x: tile.x * 5 + 1, y: tile.y * 5 + 1 }; },
};

// --- core/level-text-header.ts
// Level text files (ADR-044), header half: the error helpers, the token readers shared with the solution steps,
// and the header keys other than `map`, `fab` (ADR-089) and `plaque` (ADR-097) included. The line loop and the
// solution steps are in level-text-parse.ts.



                                           

                                                          
                                       
                                                    




/** A `LevelTextError` with its code and detail (ADR-044). */
const textError = (code        , detail          ) => new GameCoreError('LevelTextError', code, detail);
/** The `{ line }` detail of a line error (ADR-044). */
const atLine = (line        ) => ({ line });

/** Trims leading and trailing spaces (never tabs). */
const trimSpaces = (s        ) => s.replace(/^ +| +$/g, '');

function integer(raw        , n        )         {
  const v = /^-?[0-9]+$/.test(raw) ? Number(raw) : NaN;
  if (!Number.isSafeInteger(v)) throw textError('badArguments', atLine(n));
  return v;
}

/**
 * A `part` kind: anything but `robot` and `chipPins` (ADR-086); a robot part reaches EditorRules and its error
 * (ADR-029).
 */
function kindOf(raw        , n        )                {
  if (!isComponentKind(raw) || raw === 'robot' || raw === 'chipPins') throw textError('badArguments', atLine(n));
  return raw;
}

/**
 * A `place` kind: never `robot` or a robot part, which come from `equipment` (ADR-029, ADR-044), nor `chip` or
 * `chipPins`, which need a definition (ADR-086).
 */
function placeableKind(raw        , n        )                {
  const kind = kindOf(raw, n);
  if (isRobotPart(kind) || kind === 'chip') throw textError('badArguments', atLine(n));
  return kind;
}

function pinOf(raw        , n        )         {
  const parts = raw.split('.');
  if (parts.length !== 2 || parts[0] === '' || parts[1] === '') throw textError('badArguments', atLine(n));
  return { component: componentID(parts[0]), pin: parts[1] };
}

function arity(args          , min        , max        , n        )       {
  if (args.length < min || args.length > max) throw textError('badArguments', atLine(n));
}

/** `goal robotAt <x> <y>`, `goal crystalToFigure` or `goal leave` (ADR-063, ADR-074); else `badArguments(line)`. */
function parseGoal(args          , n        )       {
  if (args[0] === 'crystalToFigure' && args.length === 1) return { kind: 'crystalToFigure' };
  if (args[0] === 'leave' && args.length === 1) return { kind: 'leave' };
  if (args[0] !== 'robotAt' || args.length !== 3) throw textError('badArguments', atLine(n));
  return { kind: 'robotAt', position: { x: integer(args[1], n), y: integer(args[2], n) } };
}

const HEADER_KEYS = ['id', 'title', 'scale', 'goal', 'board', 'part', 'lock', 'place', 'wire', 'equipment', 'battery',
  'beacon', 'robot', 'lift', 'item', 'fab', 'plaque'];

/**
 * ADR-089: `fab <x> <y> [<name> ...]` (unique), 2 to 6 arguments; a name failing `CHIP_NAME` or listed twice is
 * `badArguments(line)`.
 */
function parseFab(args          , n        , p        )       {
  arity(args, 2, 6, n);
  const at = { x: integer(args[0], n), y: integer(args[1], n) };
  const chips = args.slice(2);
  if (chips.some((c, i) => !CHIP_NAME.test(c) || chips.indexOf(c) !== i)) throw textError('badArguments', atLine(n));
  p.fab = { at, chips, line: n };
}

/**
 * ADR-097: `plaque <x> <y> <wire> [<wire> ...]` (repeatable), 3 to 6 arguments; a wire the diagram rules refuse or a
 * sink driven twice is `badArguments(line)`.
 */
function parsePlaque(args          , n        , p        )       {
  arity(args, 3, 6, n);
  const at = { x: integer(args[0], n), y: integer(args[1], n) };
  const diagram = args.slice(2);
  if (!validDiagram(diagram)) throw textError('badArguments', atLine(n));
  p.plaques.push({ at, diagram, line: n });
}

/**
 * ADR-069, ADR-071: `robot <model> <x> <y> [found]` and `item <kind> <x> <y>` (repeatable) and `lift <x> <y>`
 * (unique), in cells at both scales. An unknown model or kind, a fourth `robot` argument other than `found` or a
 * wrong count is `badArguments(line)`.
 */
function parseRobotKey(key                           , args          , n        , p        )       {
  if (key === 'item') {
    arity(args, 3, 3, n);
    if (!isItemKind(args[0])) throw textError('badArguments', atLine(n));
    p.items.push({ kind: args[0], at: { x: integer(args[1], n), y: integer(args[2], n) }, line: n });
    return;
  }
  if (key === 'lift') {
    arity(args, 2, 2, n);
    p.lift = { at: { x: integer(args[0], n), y: integer(args[1], n) }, line: n };
    return;
  }
  arity(args, 3, 4, n);
  if (!isRobotModel(args[0]) || (args.length === 4 && args[3] !== 'found')) throw textError('badArguments', atLine(n));
  const at = { x: integer(args[1], n), y: integer(args[2], n) };
  p.robots.push({ model: args[0], at, found: args.length === 4, line: n });
}

/** `equipment antenna|arm` (repeatable, each value once) and `battery <capacity> [start]` (ADR-029, ADR-031). */
function parsePartKey(key                         , args          , n        , p        , seen             )       {
  if (key === 'battery') {
    arity(args, 1, 2, n);
    const capacity = integer(args[0], n);
    p.battery = { capacity, start: args.length === 2 ? integer(args[1], n) : capacity };
    return;
  }
  arity(args, 1, 1, n);
  if (args[0] !== 'antenna' && args[0] !== 'arm') throw textError('badArguments', atLine(n));
  if (seen.has(`equipment ${args[0]}`)) throw textError('duplicateKey', atLine(n));
  seen.add(`equipment ${args[0]}`);
  p.equipment[args[0]] = true;
}

function parseScale(args          , n        , p        )       {
  arity(args, 1, 1, n);
  if (args[0] !== '1' && args[0] !== '5') throw textError('badArguments', atLine(n));
  p.scale = args[0] === '1' ? 1 : 5;
}

function parseTitle(raw        , n        , p        )       {
  const title = trimSpaces(trimSpaces(raw).slice('title'.length));
  if (title.length < 1 || title.length > 40) throw textError('badArguments', atLine(n));
  p.title = title;
}

/**
 * `part`, `lock`, `place` and `wire` lines (the editor keys); the first `lock`, `place` or `wire` line and the first
 * `part` line with a max (ADR-074) are kept.
 */
function parseEditorKey(key        , args          , n        , p        )       {
  if (key !== 'part' && p.firstStartKeyLine === null) p.firstStartKeyLine = n;
  switch (key) {
    case 'part':
      arity(args, 1, 2, n);
      p.parts.push({ kind: kindOf(args[0], n), max: args.length === 2 ? integer(args[1], n) : null });
      if (args.length === 2 && p.partMaxLine === null) p.partMaxLine = n;
      break;
    case 'lock':
      arity(args, 1, 1, n);
      p.locks.push(componentID(args[0]));
      break;
    case 'place':
      arity(args, 4, 4, n);
      p.places.push({
        id: componentID(args[1]), kind: placeableKind(args[0], n),
        at: { x: integer(args[2], n), y: integer(args[3], n) },
      });
      break;
    default:
      arity(args, 2, 2, n);
      p.wires.push({ from: pinOf(args[0], n), to: pinOf(args[1], n) });
  }
}

function parseHeader(key        , args          , raw        , n        , p        , seen             )       {
  const unique = ['id', 'title', 'scale', 'board', 'battery', 'lift', 'fab'];
  if (!HEADER_KEYS.includes(key)) throw textError('unknownKeyword', atLine(n));
  if (unique.includes(key)) {
    if (seen.has(key)) throw textError('duplicateKey', atLine(n));
    seen.add(key);
  }
  const editorKey = ['part', 'lock', 'place', 'wire'].includes(key);
  if (editorKey && p.firstEditorKeyLine === null) p.firstEditorKeyLine = n;
  if (editorKey) return parseEditorKey(key, args, n, p);
  if (key === 'robot' || key === 'lift' || key === 'item') return parseRobotKey(key, args, n, p);
  if (key === 'fab') return parseFab(args, n, p);
  if (key === 'plaque') return parsePlaque(args, n, p);
  switch (key) {
    case 'id':
      arity(args, 1, 1, n);
      p.id = { value: args[0], line: n };
      break;
    case 'title':
      parseTitle(raw, n, p);
      break;
    case 'scale':
      parseScale(args, n, p);
      break;
    case 'goal':
      p.goals.push(parseGoal(args, n));
      p.goalLines.push(n);
      break;
    case 'board':
      arity(args, 2, 2, n);
      p.board = { width: integer(args[0], n), height: integer(args[1], n), line: n };
      break;
    case 'equipment': case 'battery':
      parsePartKey(key, args, n, p, seen);
      break;
    default:
      arity(args, 3, 3, n);
      p.beacons.push({ position: { x: integer(args[0], n), y: integer(args[1], n) }, range: integer(args[2], n) });
  }
}

// --- core/level-text-chips.ts
// Level text files (ADR-044), the chip steps of a reference solution (ADR-093): `chip <chip-id> <x> <y>` places a
// library chip in the ridden robot, `bench open <chip-id>`, `bench place <kind> <x> <y>`, `bench connect <from> <to>`
// and `bench disconnect <to>` edit the fab's bench, and `burn` burns it. level-text-parse.ts dispatches to it; the
// runner is solution-chips.ts.


                                        

                                                          

/** ADR-093: a chip id argument; one that fails `chipID` is `badArguments(line)`. */
function chipOf(raw        , n        )         {
  try {
    return chipID(raw);
  } catch {
    throw textError('badArguments', atLine(n));
  }
}

/** ADR-093: `bench open|place|connect|disconnect ...`; another verb or a wrong arity is `badArguments(line)`. */
function parseBenchStep(args          , n        )               {
  const [verb, ...rest] = args;
  switch (verb) {
    case 'open':
      arity(rest, 1, 1, n);
      return { op: 'benchOpen', chip: chipOf(rest[0], n), line: n };
    case 'place':
      arity(rest, 3, 3, n);
      return {
        op: 'benchPlace', kind: placeableKind(rest[0], n), at: { x: integer(rest[1], n), y: integer(rest[2], n) },
        line: n,
      };
    case 'connect':
      arity(rest, 2, 2, n);
      return { op: 'benchConnect', from: pinOf(rest[0], n), to: pinOf(rest[1], n), line: n };
    case 'disconnect':
      arity(rest, 1, 1, n);
      return { op: 'benchDisconnect', to: pinOf(rest[0], n), line: n };
    default:
      throw textError('badArguments', atLine(n));
  }
}

/**
 * ADR-093: one chip step of the solution section (`chip`, `bench ...` or `burn`), with its 1-based line `n`;
 * malformed arguments are `badArguments(line)`.
 */
function parseChipStep(key                           , args          , n        )               {
  if (key === 'bench') return parseBenchStep(args, n);
  if (key === 'burn') {
    arity(args, 0, 0, n);
    return { op: 'burn', line: n };
  }
  arity(args, 3, 3, n);
  return { op: 'placeChip', chip: chipOf(args[0], n), at: { x: integer(args[1], n), y: integer(args[2], n) }, line: n };
}

// --- core/level-text-parse.ts
// Level text files (ADR-044), parsing half: limits, the line loop and solution steps, with a campaign's `stow`,
// `take`, `fit`, `remove` and `expect leave` (ADR-067, ADR-074), `disconnect` (ADR-076) and the chip steps `chip`,
// `bench` and `burn` (ADR-093, parsed in level-text-chips.ts). Needs only the text; the header keys are in
// level-text-header.ts, compiling the map and building the validated types in level-text.ts.

                                        
                                                                   
                                                          
                                                 
                                                      
                                       




                                              
                                              

                                           

                                              

/** ADR-044 limits, checked before parsing; `maxSolutionTicks` bounds the summed walk, wait and expect ticks. */
const LevelText = { version: 1, maxBytes: 262_144, maxLines: 1_000, maxSolutionTicks: 100_000 }         ;

/**
 * One step of a level's reference solution (ADR-044); `stow`, `take`, `fit`, `remove` and `expectLeave` per
 * ADR-067 and ADR-074, `disconnect` per ADR-076, the chip steps `placeChip`, `benchOpen`, `benchPlace`,
 * `benchConnect`, `benchDisconnect` and `burn` per ADR-093. `line` is the 1-based source line.
 */
                          
                                                                                                         
                                                                          
                                                                                                            
                                                                                                 
                                                                                
                                                                             
                                                  
                                                                                                     
                                                                                    
                                                                                      
                                                                                 
                                                                                                
                                                                                                         
                                         
                                                                              
                                               
                                                                                                                 
                                              
                                                                                                      
                                          
                                                                                  
                                                                     
                                                   

const isSpaceOnly = (s        ) => /^ *$/.test(s);

/** Splits a header or solution line into tokens; tabs are never whitespace here. */
function tokens(line        , n        )           {
  if (line.includes('\t')) throw textError('badArguments', atLine(n));
  return trimSpaces(line).split(/ +/);
}

function count(raw        , n        )         {
  const v = integer(raw, n);
  if (v < 1 || v > LevelText.maxSolutionTicks) throw textError('badArguments', atLine(n));
  return v;
}

/** Everything a level text says, before the validating types are built (ADR-044). */
                         
                                             
                       
                      
                
                                                                  
                                                                
                         
                       
                                                                       
                                        
                                                
                          
                    
                                    
                                                                                               
                                   
                                                  
                                                                                  
                                           
                                                  
                                          
                                                                  
                                                   
                                                                   
                                                 
                                                              
                                                    
                      
                                                                                
                             
                                         
                  
                                  
 

                                                          

/** ADR-074: `stow <item>`, `take <item>`, `fit <part>`, `remove <part>` and `expect leave <n>`; else badArguments. */
function parseItemStep(key        , args          , n        )               {
  if (key === 'expect') {
    arity(args, 2, 2, n);
    return { op: 'expectLeave', ticks: count(args[1], n), line: n };
  }
  arity(args, 1, 1, n);
  if (key === 'stow' || key === 'take') {
    if (!isItemKind(args[0])) throw textError('badArguments', atLine(n));
    return { op: key, item: args[0], line: n };
  }
  if (!isFoundPart(args[0])) throw textError('badArguments', atLine(n));
  return { op: key === 'fit' ? 'fit' : 'remove', part: args[0], line: n };
}

/** One solution step (ADR-044; `disconnect` per ADR-076; the chip steps per ADR-093). */
function parseStep(key        , args          , n        )               {
  switch (key) {
    case 'walk':
      arity(args, 2, 2, n);
      if (!isDirection(args[0])) throw textError('badArguments', atLine(n));
      return { op: 'walk', direction: args[0], ticks: count(args[1], n), line: n };
    case 'wait':
      arity(args, 1, 1, n);
      return { op: 'wait', ticks: count(args[0], n), line: n };
    case 'place':
      arity(args, 3, 3, n);
      return {
        op: 'place', kind: placeableKind(args[0], n), at: { x: integer(args[1], n), y: integer(args[2], n) }, line: n,
      };
    case 'connect':
      arity(args, 2, 2, n);
      return { op: 'connect', from: pinOf(args[0], n), to: pinOf(args[1], n), line: n };
    case 'disconnect':
      arity(args, 1, 1, n);
      return { op: 'disconnect', to: pinOf(args[0], n), line: n };
    case 'exit':
      arity(args, 0, 0, n);
      return { op: 'exit', line: n };
    case 'expect':
      if (args[0] === 'leave') return parseItemStep(key, args, n);
      arity(args, 2, 2, n);
      if (args[0] !== 'crystal') throw textError('badArguments', atLine(n));
      return { op: 'expect', item: 'crystal', ticks: count(args[1], n), line: n };
    case 'stow': case 'take': case 'fit': case 'remove':
      return parseItemStep(key, args, n);
    case 'chip': case 'bench': case 'burn':
      return parseChipStep(key, args, n);
    default:
      throw textError('unknownKeyword', atLine(n));
  }
}

                     
                   
                       
                  
                  
                                                                               
                
                    
 

/** Handles one source line (1-based `n`), updating `p` and the section state. */
function parseLine(rawLine        , n        , p        , st           )       {
  const line = rawLine.endsWith('\r') ? rawLine.slice(0, -1) : rawLine;
  if (st.section === 'map') {
    if (line === 'end') {
      p.endLine = n;
      st.sawEnd = true;
      st.section = 'afterEnd';
    } else {
      p.rows.push({ text: line, line: n });
    }
    return;
  }
  if (isSpaceOnly(line) || trimSpaces(line).startsWith('#')) return;
  const [key, ...args] = tokens(line, n);
  if (!st.versionSeen) {
    if (key !== 'rewired-level' || args.length !== 1 || args[0] !== String(LevelText.version)) {
      throw textError('unsupportedVersion', atLine(n));
    }
    st.versionSeen = true;
  } else if (st.section === 'header') {
    if (key === 'map') {
      arity(args, 0, 0, n);
      st.sawMap = true;
      st.section = 'map';
    } else {
      parseHeader(key, args, line, n, p, st.seen);
    }
  } else if (st.section === 'afterEnd') {
    if (key !== 'solution' || args.length > 0) throw textError('textAfterEnd', atLine(n));
    p.solution = [];
    st.section = 'solution';
  } else {
    parseSolutionLine(key, args, n, p, st);
  }
}

/** Handles one step line of the `solution` section, enforcing one final `expect` or `expect leave` and the budget. */
function parseSolutionLine(key        , args          , n        , p        , st           )       {
  // Invariant: section is 'solution' only after parseLine set p.solution = [].
  const steps = p.solution;
  if (!steps) throw new Error('level-text: solution section without a solution list');
  if (steps.some((s) => s.op === 'expect' || s.op === 'expectLeave')) throw textError('badArguments', atLine(n));
  const step = parseStep(key, args, n);
  if ('ticks' in step) {
    st.ticks += step.ticks;
    if (st.ticks > LevelText.maxSolutionTicks) throw textError('tooLarge', { ticks: st.ticks });
  }
  steps.push(step);
}

/** Splits the text into lines and fills `Parsed` (everything that needs only the text; ADR-044). */
function parseLevelText(text        )         {
  const bytes = utf8Length(text);
  if (bytes > LevelText.maxBytes) throw textError('tooLarge', { bytes });
  const lines = text.split('\n');
  if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
  if (lines.length > LevelText.maxLines) throw textError('tooLarge', { lines: lines.length });
  const p         = {
    id: null, title: null, scale: null, goals: [], board: null, parts: [], locks: [], places: [], wires: [],
    equipment: { antenna: false, arm: false }, battery: null, beacons: [],
    firstEditorKeyLine: null, firstStartKeyLine: null, robots: [], lift: null, fab: null, items: [], goalLines: [],
    plaques: [], partMaxLine: null, rows: [], endLine: 0, solution: null,
  };
  const state            = {
    section: 'header', versionSeen: false, sawMap: false, sawEnd: false, ticks: 0, seen: new Set(),
  };
  lines.forEach((rawLine, index) => { parseLine(rawLine, index + 1, p, state); });
  if (!state.versionSeen) throw textError('unsupportedVersion', atLine(1));
  if (!state.sawMap || !state.sawEnd) throw textError('missingMap');
  return p;
}

// --- core/level-text-campaign.ts
// Campaign level text (ADR-063, ADR-064, ADR-067, ADR-069, ADR-071, ADR-074): a level file with a `lift` line. The
// checks of its `robot`, `item`, `goal` and `part` lines that need the whole file, in ADR-069's, ADR-071's and
// ADR-074's order; the `R` marker and `missingRobot` follow in level-text.ts's map reading.


                                                    
                                              

/** ADR-063: a level file is a campaign level exactly when it has a `lift` line. */
function isCampaignText(p        )          {
  return p.lift !== null;
}

/**
 * ADR-074, after the other checks: without `lift` the first `goal leave` line is `goalNeedsLift(line)`; with it the
 * first goal other than `leave` is `campaignGoal(line)` (no goal line at all: at the `lift` line), then the first
 * `part` line with a max `campaignPartMax(line)`.
 */
function checkCampaignGoals(p        )       {
  const leave = p.goals.findIndex((g) => g.kind === 'leave');
  if (!p.lift) {
    if (leave >= 0) throw textError('goalNeedsLift', atLine(p.goalLines[leave]));
    return;
  }
  const other = p.goals.findIndex((g) => g.kind !== 'leave');
  if (other >= 0) throw textError('campaignGoal', atLine(p.goalLines[other]));
  if (p.goals.length === 0) throw textError('campaignGoal', atLine(p.lift.line));
  if (p.partMaxLine !== null) throw textError('campaignPartMax', atLine(p.partMaxLine));
}

/**
 * ADR-069's, ADR-071's and ADR-074's campaign text checks, first fault wins. Without `lift` the first `robot` line
 * is `robotLineOutsideCampaign(line)`, then the first `item` line `itemLineOutsideCampaign(line)`, then the first
 * `goal leave` line `goalNeedsLift(line)`. With it: a `board` line is `campaignBoard(line)`, a model's second line
 * `duplicateRobot(line)`, a second `found` `duplicateFoundRobot(line)`, the first `place`, `lock` or `wire` line
 * with no robot found `campaignStartWithoutFoundRobot(line)` (ADR-067), then `campaignGoal(line)` and
 * `campaignPartMax(line)` (`checkCampaignGoals`). Returns the found robot's model, or null.
 */
function checkCampaign(p        )                    {
  if (!isCampaignText(p)) {
    if (p.robots.length > 0) throw textError('robotLineOutsideCampaign', atLine(p.robots[0].line));
    if (p.items.length > 0) throw textError('itemLineOutsideCampaign', atLine(p.items[0].line));
    checkCampaignGoals(p);
    return null;
  }
  if (p.board) throw textError('campaignBoard', atLine(p.board.line));
  const seen = new Set            ();
  for (const r of p.robots) {
    if (seen.has(r.model)) throw textError('duplicateRobot', atLine(r.line));
    seen.add(r.model);
  }
  const found = p.robots.filter((r) => r.found);
  if (found.length > 1) throw textError('duplicateFoundRobot', atLine(found[1].line));
  if (found.length === 0 && p.firstStartKeyLine !== null) {
    throw textError('campaignStartWithoutFoundRobot', atLine(p.firstStartKeyLine));
  }
  checkCampaignGoals(p);
  return found.length > 0 ? found[0].model : null;
}

// --- core/level-text.ts
// Level text files and reference solutions (ADR-044): a line-based header, a text map and a solution that
// compile through the existing validating types. Pure: the host reads the file, the core reads the string.
// Parsing the text is in level-text-parse.ts; this file reads the map and builds the level.


                                                
                                                          








                                                                  


                                                          

                                              


/** A compiled level file: the validated level, its starting schematic and its reference solution (ADR-044). */
class LevelPackage {
           id        ;
           title        ;
  /** `editor.startingSchematic` is `${id}-start` when the level has a `board`. */
           level       ;
  /** Null when the level has no `board`. */
           startingSchematic                  ;
           solution                                ;
  /** ADR-069: the campaign level's `found` robot, whose starting circuit `startingSchematic` is; else null. */
           foundRobot                   ;
  /** ADR-074: the kinds of the `part` lines in line order (a campaign adds them up over its levels). */
           partKinds                          ;

  constructor(
    id        , title        , level       , startingSchematic                  ,
    solution                                , foundRobot                    = null,
    partKinds                           = level.editor?.rules.parts.map((p) => p.kind) ?? [],
  ) {
    this.id = id;
    this.title = title;
    this.level = level;
    this.startingSchematic = startingSchematic;
    this.solution = solution;
    this.foundRobot = foundRobot;
    this.partKinds = partKinds;
  }

  /** ADR-063: the level has a lift, so it is a campaign level. */
  get isCampaign()          {
    return this.level.lift !== null;
  }

  /** A fresh editor session on the starting schematic; throws `LevelTextError.notEditable` without a board. */
  session()                {
    if (!this.level.editor || !this.startingSchematic) throw textError('notEditable');
    return this.level.editor.session(this.startingSchematic, this.level.equipment);
  }

  /**
   * ADR-069, ADR-070: a fresh editor session for robot `model`. A one-robot level's robot and the campaign's found
   * robot get `session()`; every other campaign robot gets its robot-and-parts schematic on CAMPAIGN_BOARD with the
   * level's parts and no locks. Throws `LevelTextError.notEditable` without an editor and
   * `LevelTextError.unknownRobot(model)` for a model the level lacks. This is a campaign file opened on its own
   * (fixtures, checks); the campaign starts its levels through `startCampaignLevel` (campaign.ts, ADR-074).
   */
  sessionOf(model            )                {
    const editor = this.level.editor, start = this.startingSchematic;
    if (!editor || !start) throw textError('notEditable');
    if (!this.level.robots.some((r) => r.model === model)) throw textError('unknownRobot', model);
    if (!this.isCampaign || model === this.foundRobot) return this.session();
    const rules = new EditorRules(start.board, editor.rules.parts, []);
    const bare = new Schematic(robotCircuit(this.level.equipment), start.board, new Map());
    return new EditorSession(rules, bare, undefined, this.level.equipment);
  }

  /**
   * A fresh run at tick 0 with the starting circuit (robot and fitted parts only when not editable). In a campaign
   * level opened on its own each robot gets the starting circuit of its `sessionOf` (ADR-069, ADR-070); the
   * campaign's arrival run is `CampaignLevel.startingRun` (ADR-074).
   */
  startingRun()           {
    if (this.isCampaign) {
      const circuits = this.level.robots.map((r) => [r.model, this.sessionOf(r.model).starting.circuit]         );
      return new LevelRun(this.level, new Map(circuits));
    }
    if (this.level.editor && this.startingSchematic) {
      return new LevelRun(this.level, this.session().starting.circuit);
    }
    return new LevelRun(this.level, robotCircuit(this.level.equipment));
  }
}

/** The `robot` component plus one component per fitted part, IDs `antenna`, `battery`, `arm` (ADR-044). */
function robotCircuit(equipment           )          {
  const circuit = new Circuit();
  circuit.addComponent('robot', 'robot');
  for (const part of equipment.parts) circuit.addComponent(part, part);
  return circuit;
}

// MARK: - Map

const MAP_SYMBOLS = '.#_h+';

                     
                 
                                                                                          
                             
                              
                               
                                                                
                         
 

/**
 * Checks the rows, takes the markers out (they stand on floor) and returns the tile rows. An `R` in a campaign level
 * is `robotMarkerInCampaign` (ADR-069).
 */
function readMap(p        )            {
  const campaign = isCampaignText(p);
  const found                                                                                   = {};
  const rows           = [];
  const crates                 = [];
  const width = p.rows.length > 0 ? [...p.rows[0].text].length : 0;
  for (const [y, row] of p.rows.entries()) {
    const chars = [...row.text];
    if (chars.length !== width) throw textError('raggedMap', atLine(row.line));
    rows.push(chars.map((ch, x) => {
      if (MAP_SYMBOLS.includes(ch)) return ch;
      if (ch === 'x') {
        crates.push({ x, y });
        return '.';
      }
      if (ch !== 'R' && ch !== '@' && ch !== '*') {
        throw textError('unknownSymbol', { line: row.line, column: x + 1 });
      }
      if (ch === 'R' && campaign) throw textError('robotMarkerInCampaign', { line: row.line, column: x + 1 });
      if (found[ch]) throw textError('duplicateMarker', { line: row.line, column: x + 1 });
      found[ch] = { cell: { x, y }, line: row.line, column: x + 1 };
      return '.';
    }).join(''));
  }
  if (campaign ? p.robots.length === 0 : !found.R) throw textError('missingRobot', atLine(p.endLine));
  return {
    rows, robot: found.R?.cell ?? null, figure: found['@']?.cell ?? null, crystal: found['*']?.cell ?? null, crates,
  };
}

// MARK: - Compile

/** `robot`, the fitted parts (antenna, battery, arm), the `place` components and the wires (ADR-044). */
function startingSchematic(p        , board                                   , equipment           )            {
  const circuit = robotCircuit(equipment);
  const positions = new Map                           ();
  for (const place of p.places) {
    circuit.addComponent(place.id, place.kind);
    positions.set(place.id, place.at);
  }
  for (const wire of p.wires) circuit.connect(wire.from, wire.to);
  return new Schematic(circuit, boardSize(board.width, board.height), positions);
}

/**
 * The checks of the header keys that need the whole file (ADR-044), after the campaign checks (ADR-069); a campaign
 * file's solution ends with `expect leave`, any other with `expect crystal`, else `missingKey(expect)` (ADR-074).
 */
function checkKeys(p        )       {
  const editable = p.board !== null || isCampaignText(p);
  const firstKey = p.firstEditorKeyLine;
  if (!editable && firstKey !== null) throw textError('editorKeyWithoutBoard', atLine(firstKey));
  const solutionEdit = p.solution?.find((s) => ['place', 'connect', 'disconnect', 'placeChip'].includes(s.op));
  if (!editable && solutionEdit) throw textError('editorKeyWithoutBoard', atLine(solutionEdit.line));
  if (!p.id) throw textError('missingKey', { key: 'id' });
  if (p.title === null) throw textError('missingKey', { key: 'title' });
  if (p.goals.length === 0) throw textError('missingKey', { key: 'goal' });
  const last = isCampaignText(p) ? 'expectLeave' : 'expect';
  if (p.solution && p.solution[p.solution.length - 1]?.op !== last) throw textError('missingKey', { key: 'expect' });
}

/** The editor on the `board` line, or on `CAMPAIGN_BOARD` in a campaign level (ADR-069); none without either. */
function levelEditor(
  p        , id        , equipment           ,
)                                                              {
  const board = isCampaignText(p) ? CAMPAIGN_BOARD : p.board;
  if (!board) return { schematic: null, editor: null };
  const schematic = startingSchematic(p, board, equipment);
  const rules = new EditorRules(schematic.board, p.parts, p.locks);
  const editor = new LevelEditor(rules, contentID(`${id}-start`));
  editor.session(schematic, equipment);
  return { schematic, editor };
}

/** The `R` robot as one Scout (scale-converted), or a campaign level's `robot` lines in cells (ADR-069). */
function levelRobots(p        , map           , scale       )                              {
  if (map.robot === null) return p.robots.map((r) => ({ model: r.model, position: r.at, found: r.found }));
  return scale === 1 ? map.robot : TileSketch.robot(map.robot);
}

/**
 * Compiles one level file's text (ADR-044, ADR-069). Throws `LevelTextError` or the core's validation errors. With
 * `catalogue`, the found-chip names the host has, the first `fab` name not in it is `badArguments` at the `fab` line
 * (ADR-089); without it the names are not looked up.
 */
function compileLevelText(text        , catalogue                      )               {
  const p = parseLevelText(text);
  const foundRobot = checkCampaign(p);
  checkKeys(p);
  const fab = p.fab;
  if (catalogue && fab && fab.chips.some((c) => !catalogue.has(c))) throw textError('badArguments', atLine(fab.line));
  // Non-null: checkKeys threw missingKey without an id.
  const id = contentID(p.id .value);
  const map = readMap(p);
  const scale = p.scale ?? 5;
  const room = scale === 1 ? Room.fromRows(map.rows) : TileSketch.room(map.rows);
  const anchor = (cell                     , tile                                   ) =>
    cell === null ? null : scale === 1 ? cell : tile(cell);
  const equipment = new Equipment({ ...p.equipment, battery: p.battery });
  const { schematic, editor } = levelEditor(p, id, equipment);
  const level = new Level(room, levelRobots(p, map, scale), p.goals, {
    figureStart: anchor(map.figure, TileSketch.figure),
    crystal: anchor(map.crystal, TileSketch.crystal),
    editor,
    equipment,
    beacons: p.beacons,
    crates: map.crates.map((c) => (scale === 1 ? c : TileSketch.crate(c))),
    lift: p.lift?.at ?? null,
    items: p.items.map((i) => ({ kind: i.kind, position: i.at })),
    fab: p.fab ? { position: p.fab.at, chips: p.fab.chips } : null,
    plaques: p.plaques.map((pl) => ({ position: pl.at, diagram: pl.diagram })),
  });
  const kinds = p.parts.map((part) => part.kind);
  // Non-null: checkKeys threw missingKey without a title.
  return new LevelPackage(id, p.title , level, schematic, p.solution, foundRobot, kinds);
}

// --- core/campaign.ts
// A campaign level started from what the last one carried (ADR-067, ADR-074): `startCampaignLevel` checks the carry
// against the level's `robot` lines and gives a `CampaignLevel` with the arrival, the parts unlocked so far (no
// max), each robot's rules, starting circuit and editor session, the arrival run and the next carry. The carry and
// the arrival state are in carry.ts; a campaign file opened on its own keeps `LevelPackage`'s rules (level-text.ts).

                                            
                                                          


                                             



                                                      

                                                    


                                              

/** ADR-067, ADR-074: a campaign level started from a carry: its arrival run, sessions and starting circuits. */
class CampaignLevel {
  /** The compiled level file. */
           pkg              ;
  /** What the previous level carried (EMPTY_CARRY for the first). */
           carry       ;
  /** The state and equipment the level starts from and Reset returns to. */
           arrival         ;
  /** The carry's parts, then this level's new kinds in line order; no max. */
           parts                          ;
                   carried                                       ;

  /** Use `startCampaignLevel`, which checks the carry first. */
  constructor(pkg              , carry       ) {
    this.pkg = pkg;
    this.carry = carry;
    this.arrival = arrivalOf(pkg.level, carry);
    this.parts = [...carry.parts, ...pkg.partKinds.filter((k) => !carry.parts.includes(k))];
    this.carried = new Map(carry.robots.map((r) => [r.model, r]));
  }

  /** ADR-074: robot `model`'s rules: every part without max on CAMPAIGN_BOARD; the level's locks for the found one. */
  rulesOf(model            )              {
    const locks = model === this.pkg.foundRobot ? this.pkg.level.editor?.rules.locked ?? [] : [];
    return new EditorRules(CAMPAIGN_BOARD, this.parts.map((kind) => ({ kind, max: null })), [...locks]);
  }

  /** ADR-074: a carried robot's schematic as carried, the found robot's the level's starting schematic. */
  startOf(model            )            {
    const c = this.carried.get(model);
    if (c) return c.schematic;
    if (!this.pkg.level.robots.some((r) => r.model === model)) throw textError('unknownRobot', model);
    // Non-null: a campaign level always has an editor and a starting schematic on CAMPAIGN_BOARD (level-text.ts).
    return this.pkg.startingSchematic ;
  }

  /** ADR-074: a fresh session on `startOf(model)` with the robot's arrival parts; `LevelTextError.unknownRobot`. */
  sessionOf(model            )                {
    const equipment = this.arrival.equipment.get(model);
    if (!equipment) throw textError('unknownRobot', model);
    return new EditorSession(this.rulesOf(model), this.startOf(model), undefined, equipment);
  }

  /** ADR-067, ADR-074: a fresh run at the arrival with each robot's `startOf` circuit (`LevelRun.atArrival`). */
  startingRun()           {
    const circuits = this.pkg.level.robots.map((r) => [r.model, this.startOf(r.model).circuit]         );
    return LevelRun.atArrival(this.pkg.level, new Map(circuits), this.arrival);
  }

  /** ADR-074: the next carry of `run` with the host's `schematics` and this level's parts (carry.ts `carryFrom`). */
  carryFrom(run          , schematics                                    )        {
    return carryFrom(run, schematics, this.parts);
  }
}

/** ADR-074: `robotUnexpected` and `robotMissing` per model in robot order. */
function checkCarriedModels(pkg              , carry       )       {
  for (const model of ROBOT_MODELS) {
    const times = carry.robots.filter((r) => r.model === model).length;
    const line = pkg.level.robots.find((r) => r.model === model);
    if (times > 1 || (times === 1 && (!line || line.found))) throw campaignError('robotUnexpected', model);
    if (times === 0 && line && !line.found) throw campaignError('robotMissing', model);
  }
}

/** ADR-074: `invalidRobot` for a carried robot on another board, with unmatched parts or an over-full hold. */
function checkCarriedRobots(carry       )       {
  const order = (r              ) => ROBOT_MODELS.indexOf(r.model);
  for (const r of [...carry.robots].sort((a, b) => order(a) - order(b))) {
    const board = r.schematic.board;
    const sameBoard = board.width === CAMPAIGN_BOARD.width && board.height === CAMPAIGN_BOARD.height;
    const parts = partFault(partIDs(r.schematic.circuit.components), r.equipment) === null;
    if (!sameBoard || !parts || r.hold.length > HOLD_CAPACITY[r.model]) throw campaignError('invalidRobot', r.model);
  }
}

/** ADR-067, ADR-074: notCampaign(id), robotUnexpected(model), robotMissing(model), invalidRobot(model). */
function startCampaignLevel(pkg              , carry       )                {
  if (!pkg.isCampaign) throw campaignError('notCampaign', pkg.id);
  checkCarriedModels(pkg, carry);
  checkCarriedRobots(carry);
  return new CampaignLevel(pkg, carry);
}

// --- core/save-chips.ts
// The chips in a save (ADR-083, ADR-092): the game-wide library and the fab's bench as JSON, and the decoder that
// checks them in ADR-083's order, each fault a `SaveError`. Pure; `SaveGame` calls it for version 2.




                                        


                                           


const chipsCorrupted = () => saveError('dataCorrupted', 'chips');
const tooManyChips = () => saveError('tooManyItems', 'chips');
const isSavedRecord = (v         )                               =>
  typeof v === 'object' && v !== null && !Array.isArray(v);

/** ADR-083, ADR-092: the game-wide chips a save holds: the library (burned and found) and the fab's bench. */
class SavedChips {
  /** ADR-092: no chips and an empty bench. */
  static          empty             = new SavedChips(ChipLibrary.empty, ChipBench.empty);

           library             ;
           bench           ;

  constructor(library             , bench           ) {
    this.library = library;
    this.bench = bench;
  }
}

/** ADR-083, ADR-092: the `chips` object: `bench`, `found` (left out when nothing was found), `library`, `next`. */
function savedChipsJSON(chips            )            {
  const lib = chips.library;
  const found = [...lib.found].map(([chip, name]) => ({ chip, name }));
  return {
    bench: chips.bench.toJSON(),
    found: found.length === 0 ? undefined : found,
    library: lib.chips.map((c) => c.toJSON()),
    next: lib.next,
  };
}

/** One library entry: a valid, compiling definition; its number below `next` and above `last`. */
function savedLibraryEntry(raw         , next        , last        )                 {
  const rawID = isSavedRecord(raw) && typeof raw.id === 'string' ? raw.id : null;
  let def                ;
  try {
    def = ChipDefinition.fromJSON(raw);
    new CompiledCircuit(def.circuit);
  } catch {
    throw saveError('invalidChip', rawID);
  }
  const n = chipNumber(def.id);
  if (n >= next || n <= last) throw saveError('invalidChip', def.id);
  return def;
}

/** Steps 3 to 5: the library array, its size, and each entry in order. */
function savedLibraryFrom(raw         , next        )                   {
  if (!Array.isArray(raw)) throw chipsCorrupted();
  if (raw.length > CHIP_LIBRARY_MAX + CHIP_FOUND_MAX) throw tooManyChips();
  const chips                   = [];
  let last = 0;
  for (const entry of raw) {
    const def = savedLibraryEntry(entry, next, last);
    last = chipNumber(def.id);
    chips.push(def);
  }
  return chips;
}

/** One `found` entry's chip ID: held, with a valid name, ascending and with no chip or name twice. */
function savedFoundEntry(entry         , chips                           , last        , names             )         {
  const chip = isSavedRecord(entry) && typeof entry.chip === 'string' ? entry.chip : null;
  const name = isSavedRecord(entry) ? entry.name : undefined;
  if (chip === null || !chips.some((c) => c.id === chip)) throw saveError('invalidChip', chip);
  if (typeof name !== 'string' || !CHIP_NAME.test(name)) throw saveError('invalidChip', chip);
  if (chipNumber(chip) <= last || names.has(name)) throw saveError('invalidChip', chip);
  names.add(name);
  return chip;
}

/** Steps 6 to 8: `found` (absent is none), its size, and each entry in order. */
function savedFoundFrom(raw         , chips                           )                      {
  const found = new Map                ();
  if (raw === undefined) return found;
  if (!Array.isArray(raw)) throw chipsCorrupted();
  if (raw.length > CHIP_FOUND_MAX) throw tooManyChips();
  const names = new Set        ();
  let last = 0;
  for (const entry of raw) {
    const chip = savedFoundEntry(entry, chips, last, names);
    last = chipNumber(chip);
    found.set(chip, (entry                    ).name);
  }
  return found;
}

/** Step 10: the bench is a schematic `ChipBench` accepts. */
function savedBenchFrom(raw         )            {
  try {
    const schematic = Schematic.fromJSON(raw);
    new ChipBench(schematic);
    return schematic;
  } catch {
    throw saveError('invalidChip', 'bench');
  }
}

/** ADR-083, ADR-092: the chips of a version 2 save in ADR-083's order, first fault wins; always a `SaveError`. */
function savedChipsFromJSON(raw         )             {
  if (!isSavedRecord(raw)) throw chipsCorrupted();
  const next = raw.next;
  if (typeof next !== 'number' || !Number.isInteger(next) || next < 1 || next > CHIP_MAX_NUMBER + 1) {
    throw chipsCorrupted();
  }
  const chips = savedLibraryFrom(raw.library, next);
  const found = savedFoundFrom(raw.found, chips);
  if (chips.length - found.size > CHIP_LIBRARY_MAX) throw tooManyChips();
  const bench = savedBenchFrom(raw.bench);
  try {
    return new SavedChips(new ChipLibrary(chips, next, found), bench);
  } catch {
    throw saveError('invalidChip', null);
  }
}

// --- core/save-game.ts
// Campaign progress as a file (ADR-068, ADR-075, ADR-083): the level reached, the carry its arrival starts from and
// the game-wide chips (library and bench, save-chips.ts), as JSON at its own schemaVersion (2; 1 still reads), and
// the strict decoder that refuses anything it does not fully understand (SEC.4, SEC.5).
// Pure: no storage and no host globals; the host keeps the text (app/save-store.ts).



                                                          




                                                      

                                                      

                                              


/** ADR-068, ADR-075: `SaveError` with its code and detail. */
function saveError(code        , detail          )                {
  return new GameCoreError('SaveError', code, detail);
}

/** ADR-067, ADR-075: most inventory items a carry may hold in a campaign of `levelCount` levels. */
function maxCarryItems(levelCount        )         {
  return MAX_ITEMS * levelCount;
}

/** The kinds a player may place from the toolbox: every kind but `robot`, the robot parts (ADR-075) and `chipPins`
 *  (ADR-086), so `chip` may be carried. */
const PLACEABLE_KINDS                           =
  COMPONENT_KINDS.filter((k) => k !== 'robot' && !isRobotPart(k) && k !== 'chipPins');

const corrupted = (what        ) => saveError('dataCorrupted', what);

const isObject = (v         )                               => typeof v === 'object' && v !== null && !Array.isArray(v);

                                                                 

function checkSize(text        )       {
  const max = SaveGame.maxBytes;
  if (text.length > max || utf8Length(text) > max) throw saveError('tooLarge', max);
}

/** The top object; text that is not JSON or not an object is `dataCorrupted`. */
function parseObject(text        )                          {
  let top         ;
  try {
    top = JSON.parse(text);
  } catch {
    throw corrupted('not JSON');
  }
  if (!isObject(top)) throw corrupted('not an object');
  return top;
}

/** The three lists, each an array within its limit, before any entry is read (SEC.4). */
function checkLists(carry                         , levelCount        )        {
  const limits = { robots: ROBOT_MODELS.length, inventory: maxCarryItems(levelCount), parts: PLACEABLE_KINDS.length };
  const keys = ['robots', 'inventory', 'parts']         ;
  for (const key of keys) if (!Array.isArray(carry[key])) throw corrupted(key);
  for (const key of keys) if ((carry[key]             ).length > limits[key]) throw saveError('tooManyItems', key);
  return carry         ;
}

function holdFromJSON(raw         , model            )              {
  const bad = () => saveError('invalidRobot', model);
  if (!Array.isArray(raw) || raw.length > HOLD_CAPACITY[model]) throw bad();
  return raw.map((e) => {
    if (!isObject(e) || !isItemKind(e.kind)) throw bad();
    if (e.kept !== undefined && typeof e.kept !== 'boolean') throw bad();
    return { kind: e.kind, kept: e.kept === true };
  });
}

/** One robot; every cause, including a decoder throwing, is `invalidRobot` (the raw model for an unknown one). */
function robotFromJSON(raw         , seen                 )               {
  const rawModel = isObject(raw) ? raw.model : undefined;
  if (!isObject(raw) || !isRobotModel(rawModel) || seen.has(rawModel)) throw saveError('invalidRobot', rawModel);
  const model = rawModel;
  seen.add(model);
  try {
    const schematic = Schematic.fromJSON(raw.schematic);
    const equipment = Equipment.fromJSON(raw.equipment);
    const { width, height } = schematic.board;
    if (width !== CAMPAIGN_BOARD.width || height !== CAMPAIGN_BOARD.height) throw new Error('board');
    if (equipment.battery) validateBattery(equipment.battery);
    if (partFault(partIDs(schematic.circuit.components), equipment) !== null) throw new Error('parts');
    return { model, schematic, equipment, hold: holdFromJSON(raw.hold, model) };
  } catch {
    throw saveError('invalidRobot', model);
  }
}

function inventoryFromJSON(raw           )             {
  return raw.map((k) => {
    if (!isItemKind(k)) throw corrupted('inventory');
    return k;
  });
}

function partsFromJSON(raw           )                  {
  const parts = raw.map((k) => {
    if (typeof k !== 'string' || !(PLACEABLE_KINDS                     ).includes(k)) throw corrupted('parts');
    return k                 ;
  });
  if (new Set(parts).size !== parts.length) throw saveError('tooManyItems', 'parts');
  return parts;
}

/** ADR-068, ADR-075, ADR-083: campaign progress, the arrival of the level reached, and the chips. */
class SaveGame {
  static          schemaVersion = 2;
  static          maxBytes = 1_048_576;
           level        ;
           carry       ;
  /** ADR-083, ADR-092: the library and the bench; `SavedChips.empty` for a version 1 save. */
           chips            ;

  constructor(level        , carry       , chips             = SavedChips.empty) {
    this.level = level;
    this.carry = carry;
    this.chips = chips;
  }

  /** ADR-083, ADR-092: this save's `level` and `carry` with `chips`. */
  withChips(chips            )           {
    return new SaveGame(this.level, this.carry, chips);
  }

  /** ADR-068's object as Swift-compatible JSON with sorted keys (`kept` only when true). */
  encode()         {
    const c = this.carry;
    return encodeSwiftJSON({
      carry: {
        inventory: [...c.inventory],
        parts: [...c.parts],
        robots: c.robots.map((r) => ({
          equipment: r.equipment.toJSON(),
          hold: r.hold.map(holdEntryJSON),
          model: r.model,
          schematic: r.schematic.toJSON(),
        })),
      },
      chips: savedChipsJSON(this.chips),
      level: this.level,
      schemaVersion: SaveGame.schemaVersion,
    });
  }

  /**
   * ADR-075's order, first fault wins: size, JSON, version, carry, level, list limits, robots, items, parts, then
   * (version 2) the chips (ADR-083).
   */
  static decode(text        , levelIDs                   )           {
    checkSize(text);
    const top = parseObject(text);
    const version = top.schemaVersion;
    if (version !== 1 && version !== 2) {
      throw saveError('unsupportedSchemaVersion', top.schemaVersion ?? null);
    }
    if (!isObject(top.carry)) throw corrupted('carry');
    if (typeof top.level !== 'string') throw corrupted('level');
    if (!levelIDs.includes(top.level)) throw saveError('unknownLevel', top.level);
    const lists = checkLists(top.carry, levelIDs.length);
    const seen = new Set            ();
    const robots = lists.robots.map((r) => robotFromJSON(r, seen));
    const inventory = inventoryFromJSON(lists.inventory);
    const carryOut = { robots, inventory, parts: partsFromJSON(lists.parts) };
    return new SaveGame(top.level, carryOut, version === 2 ? savedChipsFromJSON(top.chips) : SavedChips.empty);
  }
}

// --- core/solution-chips.ts
// The chips of a reference solution's run (ADR-093): the runner's own chip library and fab bench, the console visit
// after a tick or paused move that walked the figure into the console (ADR-089, as the app's walk-in rule, ADR-091),
// and the chip steps: `chip` places a library chip through the ridden robot's session, `bench ...` edits the bench
// and `burn` burns it into the library. level-solution.ts owns the run and calls it; a refused core call is
// `solutionStepRefused({ line, error })`.



                                                         


                                                        

                                                         

                                                          
                                               

/** ADR-093: the solution steps that act on chips. */
                                              
                                                                                             
   

const CHIP_OPS                    = ['placeChip', 'benchOpen', 'benchPlace', 'benchConnect', 'benchDisconnect', 'burn'];

/** ADR-093: true for a `chip`, `bench` or `burn` step. */
function isChipStep(step              )                   {
  return CHIP_OPS.includes(step.op);
}

/** Runs `call`; a `GameCoreError` it throws is `solutionStepRefused({ line, error: '<domain>.<code>' })`. */
function refusedAt   (line        , call         )    {
  try {
    return call();
  } catch (e) {
    if (!(e instanceof GameCoreError)) throw e;
    throw textError('solutionStepRefused', { line, error: `${e.domain}.${e.code}` });
  }
}

/** ADR-093: a solution run's chip library (empty at the start), its bench and the found-chip catalogue. */
class SolutionChips {
           #catalogue               ;
           #bench           ;
  #library             ;

  /** ADR-093: `ChipLibrary.empty` and an empty `ChipBench` over `catalogue` (ADR-089). */
  constructor(catalogue               ) {
    this.#catalogue = catalogue;
    this.#bench = new ChipBench();
    this.#library = ChipLibrary.empty;
  }

  /** ADR-093: the library now: the chips found at the console and burned so far. */
  get library()              {
    return this.#library;
  }

  /**
   * ADR-089, ADR-093: when `run` reports `enteredFab`, finds the console's chips into the library (`visitFab`); a
   * refused visit (`ChipError.notInCatalogue`) is `solutionStepRefused` at `line`, the step that walked in.
   */
  visit(run          , line        )       {
    const fab = run.level.fab;
    if (!fab || !run.enteredFab) return;
    this.#library = refusedAt(line, () => visitFab(this.#library, fab.chips, this.#catalogue).library);
  }

  /** ADR-093: places a copy of library chip `step.chip` through `session`; `ChipError.unknownChip` when not held. */
  placeChip(session               , step                                        )       {
    refusedAt(step.line, () => { session.placeChip(this.#held(step.chip), step.at); });
  }

  /** ADR-093: a bench step (`openOnBench`, an edit through `ChipBench.edit`) or `burn` into the library. */
  apply(step                                        )       {
    refusedAt(step.line, () => {
      const bench = this.#bench;
      if (step.op === 'benchOpen') bench.openOnBench(this.#held(step.chip));
      else if (step.op === 'benchPlace') bench.edit((s) => s.place(step.kind, step.at));
      else if (step.op === 'benchConnect') bench.edit((s) => { s.connect(step.from, step.to); });
      else if (step.op === 'benchDisconnect') bench.edit((s) => { s.disconnect(step.to); });
      else this.#library = bench.burn(this.#library).library;
    });
  }

  /** The held chip `id`, else `ChipError.unknownChip(id)`. */
  #held(id        )                 {
    const chip = this.#library.chip(id);
    if (!chip) throw chipError('unknownChip', id);
    return chip;
  }
}

// --- core/level-solution.ts
// Runs a level's reference solution (ADR-044) on a fresh LevelRun; `walk` is paused figure moves (ADR-061) and
// `disconnect` removes the wire into an input through the current robot's session, like `connect` (ADR-076). A
// campaign file runs from `startCampaignLevel` with one editor session per robot, and its `stow`, `take`, `fit`,
// `remove` and `expect leave` steps act on the run; the result gives the tick `leave` first held and the carry then
// (ADR-067, ADR-074). The runner holds a chip library and bench of its own (solution-chips.ts, ADR-093): after each
// tick and paused move that walks the figure into the fab console it finds the console's chips, and the `chip`,
// `bench` and `burn` steps act on them. A practice file runs exactly as before.


                                              

                                                   

                                        
                                                         
                                                     
                                             



                                                          
                                                    
                                               
                                              

                                                    
                                             

/**
 * Result of running a solution: the first tick the inventory held the crystal, or null; in a campaign level the
 * tick count when `leave` first held and the carry at that moment (both null if never, and `carry` null without
 * edits; ADR-074). `solved` is the crystal (practice) or `leave` (campaign) within the final expect.
 */
                                 
                                           
                                 
                           
                         
                                                                                              
                                    
                                                                                                     
                               
                                                                                                              
                              
 

/** One robot's editor session and the starting schematic a refit matches to its parts (ADR-073). */
                                                                   

/** Mutable state of one solution run. */
