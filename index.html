<style>
:root {
  --gold: #FFCF3F; --outside: #0A2F23; --panel: #071F17; --button: #123F30; --border: #1F5A45;
  --text: #E9F5EE; --silk: #A8D5BF; --chip: #15201B; --chipEdge: #3B4A43; --pinBorder: #C9A35C; --bg: #1C2129;
  --float: rgba(219,224,232,0.88); --floatText: #1C2129;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 16px/1.3 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; font-weight: 600; min-width: 44px; min-height: 44px; padding: 0 14px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--button); color: var(--text); cursor: pointer;
  touch-action: manipulation; }
button:disabled { opacity: 0.4; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: safe center; overflow-y: auto; gap: 18px;
  background: radial-gradient(circle at 50% 40%, #0E4A36, var(--outside)); text-align: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#title h1 { font-size: clamp(40px, 9vw, 72px); margin: 0; letter-spacing: 0.04em; color: var(--gold); }
#title p { margin: 0; color: var(--silk); max-width: 30em; }
#title-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
#tutorial, #new-game { font-size: 22px; min-height: 56px; }
@media (max-height: 520px) {
  #title { gap: 10px; padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #title h1 { font-size: 36px; }
  #play, #tutorial, #new-game { min-height: 48px; font-size: 20px; }
}
#play { font-size: 22px; min-width: 160px; min-height: 56px; background: var(--gold); color: #1C2129;
  border-color: var(--gold); }

#playview { position: fixed; inset: 0; }
#room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#room-ui .float { display: flex; gap: 8px; padding: 6px; border-radius: 14px; background: var(--float); }
#room-ui .float button { background: #fff; color: var(--floatText); border-color: #1C2129; padding: 0 10px; }
#room-ui #r-exit, #room-ui #r-look { width: 44px; height: 44px; padding: 0; } /* ADR-077: a 44 x 44 px icon button */
#room-ui .tl { position: absolute; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px;
  top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); max-width: 50vw; }
#room-ui .tr { position: absolute; display: flex; align-items: center; gap: 8px;
  top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
#room-ui .tr .float { gap: 6px; }
/* ADR-047: the outside view's periscope frame, a separate layer over the room that never moves or scales it. */
#periscope { position: absolute; inset: 0; pointer-events: none; }
#periscope-lens { position: absolute; top: calc(env(safe-area-inset-top) + 6px);
  right: calc(env(safe-area-inset-right) + 6px); bottom: calc(env(safe-area-inset-bottom) + 6px);
  left: calc(env(safe-area-inset-left) + 6px); border-radius: min(18vmin, 120px); border: 10px solid #0B0F0D;
  background: rgba(51,199,230,0.12);
  box-shadow: 0 0 0 100vmax rgba(4,10,8,0.62), inset 0 0 0 2px var(--gold),
    inset 0 0 min(12vmin, 80px) rgba(0,0,0,0.55); }
#periscope-label { position: absolute; left: 50%; transform: translateX(-50%);
  bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px)); font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); background: #0B0F0D;
  border: 1.5px solid var(--gold); border-radius: 12px; padding: 3px 12px; white-space: nowrap; }
/* ADR-094: Look mode. Pressed: dark fill, white icon, a 3 px edge and a filled pupil (not colour alone). */
#room-ui #r-look[aria-pressed="true"] {
  --look-fill: #1C2129;
  --look-icon: #FFFFFF;
  background: var(--look-fill); color: var(--look-icon); border-color: var(--look-icon); border-width: 3px; }
#r-look[aria-pressed="true"] circle { fill: currentColor; }
#look-frame {
  --look-line: #FFFFFF;
  --look-void: #05070F;
  position: absolute; pointer-events: none; border-radius: 12px; border: 3px solid var(--look-line);
  box-shadow: 0 0 0 1.5px var(--look-void), inset 0 0 0 1.5px var(--look-void);
  top: calc(env(safe-area-inset-top) + 4px); right: calc(env(safe-area-inset-right) + 4px);
  bottom: calc(env(safe-area-inset-bottom) + 4px); left: calc(env(safe-area-inset-left) + 4px); }
body[data-screen="outside"] #room-ui .tl .float { flex-direction: column; }
/* ADR-097: the diagram plaque's box, placed and sized by plaque-box.ts; a drawing on Scout's hull, no input. */
#plaque-box {
  --plaque-hull: #0E4A36;
  --plaque-rim: #C9E8D8;
  --plaque-void: #05070F;
  position: absolute; box-sizing: border-box; top: var(--plaque-top, 64px); left: 50%;
  height: clamp(72px, 24vh, 128px); max-width: calc(100vw - 2 * max(14px, env(safe-area-inset-left),
  env(safe-area-inset-right))); background: var(--plaque-hull); border: 2px solid var(--plaque-rim);
  border-radius: 10px; box-shadow: 0 0 0 1.5px var(--plaque-void); pointer-events: none; overflow: hidden; z-index: 3; }
#plaque-canvas { display: block; width: 100%; height: 100%; }
/* ADR-052: the steering pad is one toggle that opens into a compact semi-transparent cross. */
#pad { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
  display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px;
  grid-template-areas: ". n ." "w t e" ". s ."; }
#pad[data-open="false"] { display: block; width: 44px; height: 44px; }
#pad button { width: 44px; height: 44px; min-width: 44px; padding: 0; font-size: 20px; border-radius: 12px;
  background: rgba(255,255,255,0.55); color: var(--floatText); border-color: rgba(28,33,41,0.6); }
#pad button:active { background: #fff; }
#pad-north { grid-area: n; } #pad-west { grid-area: w; } #pad-toggle { grid-area: t; }
#pad-east { grid-area: e; } #pad-south { grid-area: s; }
#itembar { padding: 6px 14px; min-height: 44px; display: flex; align-items: center; gap: 10px; border-radius: 22px;
  background: rgba(7,31,23,0.85); border: 1.5px solid var(--border); font-weight: 600; z-index: 5; }
.item { display: flex; align-items: center; gap: 6px; color: var(--gold); }
.gem { display: inline-block; width: 14px; height: 18px; background: #33C7E6;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#version { font: 13px ui-monospace, Menlo, monospace; color: var(--silk); }

/* ADR-046, ADR-077: the board covers the screen; the controls sit in one container inside the safe area. */
#safe-area { position: fixed; visibility: hidden; pointer-events: none; top: env(safe-area-inset-top);
  right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
#interior { position: absolute; inset: 0; overflow: hidden; background: var(--outside);
  --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); --st: env(safe-area-inset-top);
  --sb: env(safe-area-inset-bottom); }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* ADR-077: every interior control sits in #i-controls straight on the board's green (no panels): a 92 px column at
   the left (column) or a 92 px two-row band at the top (row), 4 px inside the safe area; the toolbox is last. */
#i-controls { position: absolute; display: flex; gap: 4px; left: calc(var(--sl) + 4px); top: calc(var(--st) + 4px); }
#i-controls button { width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; font-size: 20px;
  line-height: 1; background: var(--button); color: var(--text); border: 1.5px solid var(--silk);
  border-radius: 10px; }
#i-controls svg.icon, #r-exit svg.icon,
#r-look svg.icon { display: block; width: 28px; height: 28px; margin: auto; fill: none;
  stroke: currentColor;  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#i-nav { display: grid; grid-template-columns: repeat(2, 44px); gap: 4px; }
#i-runbox { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#i-controls #i-run { width: 92px; font-size: 14px; }
#i-items #itembar { flex-direction: column; justify-content: center; min-height: 44px; width: 56px; padding: 4px 2px;
  gap: 2px; border-radius: 9px; font-size: 12px; }
#i-items .item { flex-direction: column; gap: 2px; }
[data-layout="column"] #i-controls { flex-direction: column; width: 92px; bottom: calc(var(--sb) + 4px); }
[data-layout="column"] #toolbox { margin-top: auto; }
[data-layout="row"] #i-controls { display: grid; height: 92px; right: calc(var(--sr) + 4px);
  grid-template-columns: auto 1fr auto; grid-template-rows: 44px 44px; }
[data-layout="row"] #i-nav { display: flex; grid-area: 1 / 1; }
[data-layout="row"] #i-runbox { flex-direction: row; grid-area: 1 / 3; justify-self: end; }
[data-layout="row"] #i-controls #i-run { width: 56px; }
[data-layout="row"] #i-items { grid-area: 2 / 1; }
[data-layout="row"] #toolbox { grid-area: 2 / 3; display: flex; }
/* ADR-091: the fab has no item place, so its five tools may take the whole second row of the band. */
body[data-screen="fab"] [data-layout="row"] #toolbox { grid-area: 2 / 1 / 3 / 4; justify-self: end; }
/* ADR-071: item icons; a campaign interior's fixed 56 x 44 bar: the items carried, a divider, the hold's slots. */
#itembar .icon { display: block; width: 16px; height: 16px; flex: none; }
#i-items #itembar[data-hold] { box-sizing: border-box; width: 56px; height: 44px; min-height: 44px; padding: 2px 1px;
  gap: 0; }
#itembar[data-hold] #items { display: flex; flex-direction: column; align-items: center; gap: 1px; }
#itembar .inv, #itembar .hold { display: flex; gap: 1px; height: 16px; justify-content: center; }
#itembar .divider { display: block; width: 48px; height: 1px; background: var(--silk); }
#itembar .inv-item { position: relative; display: block; width: 16px; height: 16px; }
#itembar[data-hold] .gem { display: block; width: 11px; height: 16px; margin: 0 auto; }
#itembar .count { position: absolute; right: -3px; bottom: -3px; min-width: 7px; padding: 0 2px; border-radius: 6px;
  font: 700 11px/11px ui-monospace, Menlo, monospace; color: var(--gold); background: var(--bg); text-align: center; }
#itembar .slot { box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 16px;
  height: 16px; border: 1.5px solid var(--silk); border-radius: 4px; }
#itembar .slot .icon { width: 12px; height: 12px; }
#itembar .slot .gem { width: 8px; height: 12px; }
#toolbox { display: grid; grid-template-columns: repeat(2, 44px); gap: 4px; }
#interior #toolbox button { font-size: 12px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px; background: var(--chip); color: var(--text); border-color: var(--silk); }
#toolbox svg.gate { width: 28px; height: 18px; fill: var(--chip); stroke: var(--text); stroke-width: 1.5;
  stroke-linejoin: round; }
#toolbox svg.gate .stub { stroke: var(--pinBorder); fill: none; stroke-width: 1.5; }
#toolbox svg.gate .half { fill: var(--text); stroke: none; }
#toolbox button[id="tool-srFlipFlop"] svg.gate { width: 18px; height: 22px; }
#toolbox .count { color: var(--gold); font-size: 11px; }
#toolbox button.used { opacity: 0.45; }
/* ADR-088: the chip drawer opens where the Menu list does and floats over the board's edge only while open: four
   44 px chip buttons to a row (207 px wide); the armed chip has a 3 px gold edge and a gold ring (visible in greyscale). */
#chip-drawer { position: absolute; z-index: 4; box-sizing: border-box; width: 207px; padding: 8px; display: grid;
  grid-template-columns: repeat(4, 44px); grid-auto-rows: 44px; gap: 4px; align-content: start;
  background: var(--panel); border: 1.5px solid var(--silk); border-radius: 16px; }
#chip-drawer button { width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 600 12px/1 ui-monospace, Menlo, monospace; background: var(--chip); color: var(--text);
  border: 1.5px solid var(--silk); touch-action: none; }
#chip-drawer button[aria-pressed="true"] { border: 3px solid var(--gold);
  box-shadow: 0 0 0 2px var(--gold); }
#toolbox svg.chip, #chip-drawer svg.chip { width: 28px; height: 18px; fill: var(--chip); stroke: var(--text);
  stroke-width: 1.5; stroke-linejoin: round; }
#toolbox svg.chip .stub, #chip-drawer svg.chip .stub { stroke: var(--pinBorder); fill: none; }
/* ADR-091: the drawer's actions in the fab span its width above the chip buttons; the chip buttons scroll inside it
   when its height is clamped to the safe area. The burned chip flies from Burn to the Chips tool in 400 ms. */
#chip-drawer { overflow-y: auto; }
#chip-drawer button.chip-action { grid-column: 1 / -1; width: auto; font: 600 14px/1 system-ui, sans-serif;
  background: var(--button); }
#burn-fly { position: fixed; z-index: 6; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: flex;
  align-items: center; justify-content: center; pointer-events: none; transition: transform 400ms ease-out; }
#burn-fly svg.chip { width: 28px; height: 18px; fill: var(--chip); stroke: var(--text); stroke-width: 1.5; }
#burn-fly svg.chip .stub { stroke: var(--pinBorder); fill: none; }
@media (prefers-reduced-motion: reduce) { #burn-fly { transition: none; } }
#i-delete { position: absolute; z-index: 4; padding: 0 8px; font-size: 14px; background: #7A1F12;
  border-color: #FF8F7A; color: #FFE5DF; }
#i-context { position: absolute; z-index: 4; display: flex; gap: 0; }
#i-context[hidden], #i-context button[hidden] { display: none; }
#i-context button { flex: 1; min-width: 44px; min-height: 44px; padding: 0 8px; font-size: 14px; }
#i-context-move { background: var(--button); border-color: var(--border); color: var(--text); }
#i-context-delete { background: #7A1F12; border-color: #FF8F7A; color: #FFE5DF; }
#message { position: absolute; left: 50%; bottom: max(64px, calc(env(safe-area-inset-bottom) + 58px));
  transform: translateX(-50%);
  max-width: min(92vw, 560px); padding: 10px 16px; border-radius: 12px; background: #2A0F0A;
  border: 1.5px solid #FF8F7A;
  color: #FFE5DF; z-index: 10; }
/* UI.11: with the open pad cross (3 x 44 + 2 x 4 = 140 px wide, 14 px from the edge) on screen, the message
   ends left of it. */
body[data-pad="open"] #message { left: max(8px, env(safe-area-inset-left));
  right: calc(max(14px, env(safe-area-inset-right)) + 140px + 8px);
  width: fit-content; max-width: none; margin: 0 auto; transform: none; }
/* ADR-077: the refusal message at the bottom of the fit area: centred in the width right of the column, or in the
   full width under the band; the column's strip is INTERIOR.column in board-camera.ts, set on #playview. */
body[data-screen="interior"] #interior[data-layout="column"] ~ #message,
body[data-screen="fab"] #interior[data-layout="column"] ~ #message { left: calc(env(safe-area-inset-left) +
  var(--strip)); right: env(safe-area-inset-right); bottom: calc(env(safe-area-inset-bottom) + 16px);
  width: fit-content; max-width: none; margin: 0 auto; transform: none; }
body[data-screen="interior"] #interior[data-layout="row"] ~ #message,
body[data-screen="fab"] #interior[data-layout="row"] ~ #message {
  bottom: calc(env(safe-area-inset-bottom) + 16px); max-width: min(calc(100vw - 32px), 560px); }
#confirm { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 21; }
/* ADR-052: the Menu is a drop-down; its backdrop is transparent and a tap on it closes the Menu. */
#menu { position: fixed; inset: 0; z-index: 19; }
.menu-list { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 8px; width: 240px;
  overflow-y: auto; background: var(--panel); border: 1.5px solid var(--border); border-radius: 16px; padding: 12px; }
.menu-row { display: flex; gap: 8px; }
.menu-row button { flex: 1; padding: 0 6px; }
#confirm > div { background: var(--panel); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px;
  max-width: 340px; }
#confirm h2 { margin: 0 0 6px; font-size: 20px; }
#confirm p { margin: 0 0 16px; color: var(--silk); }
#confirm .row { display: flex; gap: 10px; justify-content: flex-end; }
#confirm-yes { background: #7A1F12; border-color: #FF8F7A; }
/* ADR-091: "Scrap" in its question: the destructive look with a 3 px edge. */
#confirm-yes.destructive { border-width: 3px; }
/* ADR-074: the lift's fade to the next level over every overlay, catching every pointer event; a cut under reduced
   motion (UX.18). */
/* lint: decorative the fade to the neon palette's void black */
#lift-fade { position: fixed; inset: 0; background: #05070F; z-index: 30; opacity: 0;
  animation: lift-fade 800ms linear forwards; }
@keyframes lift-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #lift-fade { animation: none; opacity: 1; } }
</style>

<script>
(() => {
'use strict';
// --- core/json.ts
// Swift `JSONEncoder` output with `[.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]`:
// two-space indent, `"key" : value`, keys sorted by code unit, empty containers as "[\n\n<indent>]".
// `undefined` members are left out, like `encodeIfPresent(nil)`.

                       
        
           
          
          
               
                                             

function escapeString(s        )         {
  let out = '"';
  for (const ch of s) {
    // Non-null: for..of over a string yields non-empty code points.
    const c = ch.codePointAt(0) ;
    if (ch === '"') out += '\\"';
    else if (ch === '\\') out += '\\\\';
    else if (ch === '\n') out += '\\n';
    else if (ch === '\r') out += '\\r';
    else if (ch === '\t') out += '\\t';
    else if (ch === '\b') out += '\\b';
    else if (ch === '\f') out += '\\f';
    else if (c < 0x20) out += '\\u' + c.toString(16).padStart(4, '0');
    else out += ch;
  }
  return out + '"';
}

function compareKeys(a        , b        )         {
  return a < b ? -1 : a > b ? 1 : 0;
}

/** Pretty, sorted-key encoding byte-compatible with Swift's JSONEncoder (no trailing newline). */
function encodeSwiftJSON(value           , indent = '')         {
  if (value === null) return 'null';
  if (typeof value === 'boolean') return value ? 'true' : 'false';
  if (typeof value === 'number') {
    if (!Number.isInteger(value)) throw new Error('only integers are encoded');
    return String(value);
  }
  if (typeof value === 'string') return escapeString(value);
  const inner = indent + '  ';
  if (Array.isArray(value)) {
    if (value.length === 0) return '[\n\n' + indent + ']';
    return '[\n' + value.map((v) => inner + encodeSwiftJSON(v, inner)).join(',\n') + '\n' + indent + ']';
  }
  const keys = Object.keys(value).filter((k) => value[k] !== undefined).sort(compareKeys);
  if (keys.length === 0) return '{\n\n' + indent + '}';
  return (
    '{\n' +
    keys.map((k) => inner + escapeString(k) + ' : ' + encodeSwiftJSON(value[k]             , inner)).join(',\n') +
    '\n' + indent + '}'
  );
}

/** UTF-8 size of `text` without `TextEncoder`, so the core needs no host globals. */
function utf8Length(text        )         {
  let bytes = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0) ?? 0; // a for-of over a string yields non-empty code points
    bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }
  return bytes;
}

// --- core/component-kinds.ts
// Component kinds and their pins (ADR-004, ADR-009, ADR-015, ADR-029, ADR-080, ADR-086), moved out of circuit.ts
// (CQ.8). No run-time import, so it loads before circuit.ts; the pin tables use the pin names as string literals.

                                                         

/**
 * Component kinds (ADR-004, ADR-009, ADR-015); `antenna`, `battery` and `arm` are robot parts (ADR-029); `chip` is a
 * placed chip and `chipPins` the wall-mounted pins inside a chip's definition (ADR-080, ADR-086).
 */
                           
                                                                                                      
/** `ComponentKind.allCases`, declaration order; the robot parts are appended (ADR-029), the chip kinds go before
 *  `robot` (ADR-086). */
const COMPONENT_KINDS                           = [
  'and', 'or', 'not', 'srFlipFlop', 'chip', 'chipPins', 'robot', 'antenna', 'battery', 'arm',
];

/** A fixed robot part with connectors, wall-mounted and always locked (ADR-029); `Equipment.parts` order. */
                                                      
/** The robot parts in ADR-029's order: antenna, battery, arm. */
const ROBOT_PARTS                       = ['antenna', 'battery', 'arm'];

/** True for the robot part kinds `antenna`, `battery` and `arm` (ADR-029). */
function isRobotPart(kind               )                    {
  return (ROBOT_PARTS                     ).includes(kind);
}

/** ADR-086: a chip's possible input pins `i1` to `i4`, which are the output pins of its `chipPins` component. */
const CHIP_INPUT_PINS                     = ['i1', 'i2', 'i3', 'i4'];
/** ADR-086: a chip's possible output pins `o1` to `o4`, which are the input pins of its `chipPins` component. */
const CHIP_OUTPUT_PINS                     = ['o1', 'o2', 'o3', 'o4'];

/** Input pins per kind; a `chip`'s come from its definition (`Circuit.inputPinsOf`, ADR-086). */
const INPUT_PINS                                            = {
  and: ['a', 'b'],
  or: ['a', 'b'],
  not: ['in'],
  srFlipFlop: ['s', 'r'],
  chip: [],
  chipPins: CHIP_OUTPUT_PINS,
  robot: ['thrusterN', 'thrusterE', 'thrusterS', 'thrusterW'],
  antenna: ['tx'], battery: [], arm: ['grab'],
};

/** Output pins per kind; a `chip`'s come from its definition (`Circuit.outputPinsOf`, ADR-086). */
const OUTPUT_PINS                                            = {
  and: ['out'],
  or: ['out'],
  not: ['out'],
  srFlipFlop: ['q', 'qBar'],
  chip: [],
  chipPins: CHIP_INPUT_PINS,
  robot: ['bumperN', 'bumperE', 'bumperS', 'bumperW'],
  antenna: ['rx'], battery: ['low'], arm: ['hold'],
};

function inputPins(kind               )                     {
  return INPUT_PINS[kind];
}

function outputPins(kind               )                     {
  return OUTPUT_PINS[kind];
}

function pinDirection(kind               , pin         )                            {
  if (INPUT_PINS[kind].includes(pin)) return 'input';
  if (OUTPUT_PINS[kind].includes(pin)) return 'output';
  return null;
}

function isComponentKind(raw         )                       {
  return typeof raw === 'string' && (COMPONENT_KINDS                     ).includes(raw);
}

function isCombinational(kind               )          {
  return kind === 'and' || kind === 'or' || kind === 'not';
}

                            
                           
                               
 

// --- core/circuit.ts
// Port of GameCore/Circuit: identifiers, pins and Circuit (ADR-004 to ADR-009, ADR-015, ADR-029); kinds are in
// component-kinds.ts, chip definitions and their JSON in chip.ts (ADR-080, ADR-086), which imports this file back:
// neither touches the other's bindings at module top level, so either loads first. Gate evaluation is in
// compiled-circuit.ts. Swift value types become classes with `clone()`; typed throws become `GameCoreError` with a
// `domain` (the Swift error type) and a `code` (its case).


                                                

                                                                     
                                           

class GameCoreError extends Error {
  domain        ;
  code        ;
  detail         ;
  constructor(domain        , code        , detail          ) {
    super(`${domain}.${code}${detail === undefined ? '' : ' ' + JSON.stringify(detail)}`);
    this.domain = domain;
    this.code = code;
    this.detail = detail;
  }
}

const circuitError = (code        , detail          ) => new GameCoreError('CircuitError', code, detail);

/** UTF-8 byte order; for the ASCII IDs and pin names it equals code-unit order. */
function compareStrings(a        , b        )         {
  return a < b ? -1 : a > b ? 1 : 0;
}

// MARK: - Identifiers

                                 
                             

const ID_PATTERN = /^[A-Za-z0-9_-]{1,64}$/;

/** Validates a ComponentID: 1-64 ASCII characters from `[A-Za-z0-9_-]`. */
function componentID(raw        )              {
  if (!ID_PATTERN.test(raw)) throw circuitError('invalidID', raw);
  return raw;
}

const Pin = {
  a: 'a', b: 'b', in: 'in', out: 'out', s: 's', r: 'r', q: 'q', qBar: 'qBar',
  bumperN: 'bumperN', bumperE: 'bumperE', bumperS: 'bumperS', bumperW: 'bumperW',
  thrusterN: 'thrusterN', thrusterE: 'thrusterE', thrusterS: 'thrusterS', thrusterW: 'thrusterW',
  tx: 'tx', rx: 'rx', low: 'low', grab: 'grab', hold: 'hold',
}         ;

                                                            
const DIRECTIONS                       = ['north', 'east', 'south', 'west'];

function bumperPin(d           )          {
  return { north: Pin.bumperN, east: Pin.bumperE, south: Pin.bumperS, west: Pin.bumperW }[d];
}

function thrusterPin(d           )          {
  return { north: Pin.thrusterN, east: Pin.thrusterE, south: Pin.thrusterS, west: Pin.thrusterW }[d];
}

                         
                                  
                        
 

function pinRef(component             , pin         )         {
  return { component, pin };
}

/** Map key of a pin: `comp.pin` (neither part contains a dot). */
function pinKey(r        )         {
  return r.component + '.' + r.pin;
}

function parsePinKey(key        )         {
  const dot = key.indexOf('.');
  return { component: key.slice(0, dot), pin: key.slice(dot + 1) };
}

function comparePinRefs(l        , r        )         {
  return compareStrings(l.component, r.component) || compareStrings(l.pin, r.pin);
}

function samePin(l        , r        )          {
  return l.component === r.component && l.pin === r.pin;
}

                             
                        
                      
 

function compareConnections(l            , r            )         {
  return comparePinRefs(l.from, r.from) || comparePinRefs(l.to, r.to);
}

// MARK: - Circuit

/**
 * Value-type circuit graph (ADR-008). Mutating methods change this instance; `clone()` copies. A `chip` component
 * keeps its definition, which gives its pins (ADR-080, ADR-086).
 */
class Circuit {
  static          schemaVersion = 1;
  static          maxComponents = 4096;
  static          maxConnections = 4 * 4096;

          kinds = new Map                            ();
  /** Keyed by `pinKey(input)`; value is the driving output. */
          drivers = new Map                ();
  /** The definition of every `chip` component (ADR-086); definitions never change, so clones share them. */
          definitions = new Map                             ();

  clone()          {
    const c = new Circuit();
    c.kinds = new Map(this.kinds);
    c.drivers = new Map(this.drivers);
    c.definitions = new Map(this.definitions);
    return c;
  }

  get components()              {
    return [...this.kinds].map(([id, kind]) => ({ id, kind })).sort((a, b) => compareStrings(a.id, b.id));
  }

  get connections()               {
    return [...this.drivers].map(([key, from]) => ({ from, to: parsePinKey(key) })).sort(compareConnections);
  }

  component(id             )                   {
    const kind = this.kinds.get(id);
    return kind === undefined ? null : { id, kind };
  }

  /** ADR-086: the definition of chip component `id`; null for any other component or an unknown ID. */
  chip(id             )                        {
    return this.definitions.get(id) ?? null;
  }

  /** ADR-086: the distinct definitions the chip components use, ascending by chip number. */
  get chips()                   {
    const byID = new Map                        ();
    for (const d of this.definitions.values()) if (!byID.has(d.id)) byID.set(d.id, d);
    return [...byID.values()].sort((a, b) => chipNumber(a.id) - chipNumber(b.id));
  }

  /** ADR-086: the input pins of component `id`: its definition's for a chip, else its kind's; [] when unknown. */
  inputPinsOf(id             )                     {
    const kind = this.kinds.get(id);
    if (kind === undefined) return [];
    return kind === 'chip' ? (this.definitions.get(id)?.inputs ?? []) : inputPins(kind);
  }

  /** ADR-086: the output pins of component `id`: its definition's for a chip, else its kind's; [] when unknown. */
  outputPinsOf(id             )                     {
    const kind = this.kinds.get(id);
    if (kind === undefined) return [];
    return kind === 'chip' ? (this.definitions.get(id)?.outputs ?? []) : outputPins(kind);
  }

  /** ADR-086: the direction of `ref` on its component, a chip's from its definition; null for an unknown pin. */
  pinDirectionOf(ref        )                            {
    if (this.inputPinsOf(ref.component).includes(ref.pin)) return 'input';
    if (this.outputPinsOf(ref.component).includes(ref.pin)) return 'output';
    return null;
  }

  driver(input        )                {
    return this.drivers.get(pinKey(input)) ?? null;
  }

  unconnectedInputs()           {
    const result           = [];
    for (const id of this.kinds.keys()) {
      for (const pin of this.inputPinsOf(id)) {
        if (!this.drivers.has(id + '.' + pin)) result.push({ component: id, pin });
      }
    }
    return result.sort(comparePinRefs);
  }

  /** ADR-086: `chip` is given exactly when `kind` is `chip`, else `CircuitError.chipDefinition(id)`; a definition
   *  under a ChipID this circuit holds with other contents is `chipConflict(chipID)`. */
  addComponent(id             , kind               , chip                 )       {
    if (this.kinds.has(id)) throw circuitError('duplicateComponent', id);
    if (this.kinds.size >= Circuit.maxComponents) {
      throw circuitError('tooManyComponents', { count: this.kinds.size + 1 });
    }
    if ((kind === 'chip') !== (chip !== undefined)) throw circuitError('chipDefinition', id);
    if (chip) {
      for (const d of this.definitions.values()) {
        if (d !== chip && d.id === chip.id && !d.equals(chip)) throw circuitError('chipConflict', chip.id);
      }
      this.definitions.set(id, chip);
    }
    this.kinds.set(id, kind);
  }

  removeComponent(id             )       {
    if (!this.kinds.has(id)) throw circuitError('unknownComponent', id);
    this.kinds.delete(id);
    this.definitions.delete(id);
    for (const [key, from] of [...this.drivers]) {
      if (parsePinKey(key).component === id || from.component === id) this.drivers.delete(key);
    }
  }

  connect(output        , input        )       {
    if (!this.kinds.has(output.component)) throw circuitError('unknownComponent', output.component);
    if (!this.kinds.has(input.component)) throw circuitError('unknownComponent', input.component);
    const fromDir = this.pinDirectionOf(output);
    if (fromDir === null) throw circuitError('unknownPin', output);
    const toDir = this.pinDirectionOf(input);
    if (toDir === null) throw circuitError('unknownPin', input);
    if (fromDir !== 'output') throw circuitError('expectedOutputPin', output);
    if (toDir !== 'input') throw circuitError('expectedInputPin', input);
    const existing = this.drivers.get(pinKey(input));
    if (existing) {
      if (samePin(existing, output)) throw circuitError('duplicateConnection', { from: output, to: input });
      throw circuitError('inputAlreadyDriven', { input, existingDriver: existing });
    }
    this.drivers.set(pinKey(input), { component: output.component, pin: output.pin });
  }

  disconnect(input        )       {
    if (!this.drivers.has(pinKey(input))) throw circuitError('notConnected', input);
    this.drivers.delete(pinKey(input));
  }

  /** Same components and wires, and an equal definition for each chip component (ADR-086). */
  equals(other         )          {
    if (this.kinds.size !== other.kinds.size || this.drivers.size !== other.drivers.size) return false;
    for (const [id, kind] of this.kinds) if (other.kinds.get(id) !== kind) return false;
    for (const [key, from] of this.drivers) {
      const o = other.drivers.get(key);
      if (!o || !samePin(o, from)) return false;
    }
    for (const [id, d] of this.definitions) {
      const o = other.definitions.get(id);
      if (!o || !(o === d || o.equals(d))) return false;
    }
    return true;
  }

  /** A chip component carries `chip`; `chips` lists the definitions and is omitted when empty (ADR-080, ADR-086). */
  toJSON()            {
    return {
      schemaVersion: Circuit.schemaVersion,
      components: this.components.map((c) => ({ id: c.id, kind: c.kind, chip: this.definitions.get(c.id)?.id })),
      connections: this.connections.map(connectionJSON),
      chips: chipsJSON(this.chips),
    };
  }

  /** `depth`: how deep in chip definitions this circuit sits, 0 at the top; it bounds decoding (ADR-086). */
  static fromJSON(json     , depth = 0)          {
    if (json.schemaVersion !== Circuit.schemaVersion) {
      throw circuitError('unsupportedSchemaVersion', json.schemaVersion);
    }
    const c = new Circuit();
    if (json.components.length > Circuit.maxComponents) {
      throw circuitError('tooManyComponents', { count: json.components.length });
    }
    const chipOf = chipsFromJSON(json, depth);
    for (const comp of json.components) {
      if (!isComponentKind(comp.kind)) throw new GameCoreError('DecodingError', 'dataCorrupted', comp.kind);
      c.addComponent(componentID(comp.id), comp.kind, chipOf.get(comp.id));
    }
    if (json.connections.length > Circuit.maxConnections) {
      throw circuitError('tooManyConnections', { count: json.connections.length });
    }
    for (const conn of json.connections) c.connect(pinRefFromJSON(conn.from), pinRefFromJSON(conn.to));
    return c;
  }
}

function pinRefJSON(r        )            {
  return { component: r.component, pin: r.pin };
}

function connectionJSON(c            )            {
  return { from: pinRefJSON(c.from), to: pinRefJSON(c.to) };
}

function pinRefFromJSON(json     )         {
  if (typeof json?.pin !== 'string') throw new GameCoreError('DecodingError', 'typeMismatch', 'pin');
  return { component: componentID(json.component), pin: json.pin };
}

// --- core/chip.ts
// Chips (ADR-080, ADR-081, ADR-086): the ChipID, ChipDefinition with its checks in ADR-086's order, the pins rule,
// a chip's footprint and pin rows, and the Circuit JSON helpers for `chips` and a component's `chip`.
// chip.ts and circuit.ts import each other: neither touches the other's bindings at module top level, so either
// loads first (in Node and in the bundle).


                                                         

                                                          
                                             
                                           

/** ADR-080, ADR-086: a chip definition's ID, `chip-<n>` with n from 1 to 999 and no leading zero. */
                            

/** ADR-086: the ID of the one `chipPins` component inside a definition. */
const CHIP_PINS_ID = 'pins';
/** ADR-081: the deepest nesting of chips; a chip without chips has depth 1. */
const CHIP_MAX_DEPTH = 4;
/** ADR-081 as amended by ADR-086: the most parts (gates, flip-flops and chip components, inlined) in a chip. */
const CHIP_MAX_PARTS = 64;
/** ADR-081: the most chips a library holds. */
const CHIP_LIBRARY_MAX = 12;
/** ADR-081: the highest chip number; numbers are never reused. */
const CHIP_MAX_NUMBER = 999;
/** ADR-086, ADR-089: a found chip's catalogue name: a lower-case letter, then up to 31 of a-z, 0-9 and `-`. */
const CHIP_NAME = /^[a-z][a-z0-9-]{0,31}$/;
/** ADR-081, ADR-086: the most found chips a library holds; they do not count toward `CHIP_LIBRARY_MAX`. */
const CHIP_FOUND_MAX = 12;

const CHIP_ID_PATTERN = /^chip-[1-9][0-9]{0,2}$/;
const CHIP_INNER_KINDS                           = ['and', 'or', 'not', 'srFlipFlop', 'chip', 'chipPins'];

/** ADR-086: a `ChipError` with its code and detail. */
const chipError = (code        , detail          ) => new GameCoreError('ChipError', code, detail);
const chipCorrupted = (what        ) => new GameCoreError('DecodingError', 'dataCorrupted', what);

/** ADR-086: validates a ChipID, else `ChipError.invalidID(raw)`. */
function chipID(raw        )         {
  if (typeof raw !== 'string' || !CHIP_ID_PATTERN.test(raw)) throw chipError('invalidID', raw);
  return raw;
}

/** ADR-086: the number n of a valid ChipID `chip-<n>`. */
function chipNumber(id        )         {
  return Number(id.slice('chip-'.length));
}

/** ADR-080's pins rule: inputs are the `iK` of `pins` that drive a wire, outputs the `oK` that are driven, K order. */
function pinsRule(circuit         )                                            {
  const driving = new Set(circuit.connections.filter((c) => c.from.component === CHIP_PINS_ID).map((c) => c.from.pin));
  return {
    inputs: CHIP_INPUT_PINS.filter((pin) => driving.has(pin)),
    outputs: CHIP_OUTPUT_PINS.filter((pin) => circuit.driver({ component: CHIP_PINS_ID, pin }) !== null),
  };
}

/** ADR-086 check 1, components in ID order: only gates, flip-flops, chips and the one `pins`, else `forbiddenKind`. */
function checkChipKinds(circuit         )       {
  for (const c of circuit.components) {
    if (!CHIP_INNER_KINDS.includes(c.kind) || (c.kind === 'chipPins' && c.id !== CHIP_PINS_ID)) {
      throw chipError('forbiddenKind', c.kind);
    }
  }
}

/** The definitions of the chip components of `circuit`, in component ID order, with their component IDs. */
function innerChips(circuit         )                                              {
  // Non-null: every chip component of a Circuit has its definition (Circuit.addComponent).
  return circuit.components.filter((c) => c.kind === 'chip').map((c) => ({ id: c.id, chip: circuit.chip(c.id)  }));
}

/**
 * A chip's definition (ADR-080, ADR-086): its ID, its pins by the pins rule, and its own copy of the circuit inside.
 * Immutable; `depth` is 1 plus its deepest inner chip's, `parts` its gates, flip-flops and chip components plus each
 * inner chip's parts (ADR-081 as amended by ADR-086).
 */
class ChipDefinition {
           id        ;
  /** ADR-080's pins rule: the `iK` of `pins` that drive a wire, in K order. */
           inputs                    ;
  /** ADR-080's pins rule: the `oK` of `pins` that are driven, in K order; never empty. */
           outputs                    ;
  /** ADR-081: 1 for a chip without chips, else 1 plus its deepest inner chip's; at most `CHIP_MAX_DEPTH`. */
           depth        ;
  /** ADR-086: gates, flip-flops and chip components inside plus each inner chip's parts; at most `CHIP_MAX_PARTS`. */
           parts        ;
                   inside         ;

  /**
   * Checks `circuit`, first fault wins (ADR-086): `invalidID`, `forbiddenKind(kind)`, `missingPins`,
   * `laterChip(componentID)`, `noOutputs`, `tooDeep(depth)`, `tooLarge(parts)`, all `ChipError`; keeps a clone.
   */
  constructor(id        , circuit         ) {
    this.id = chipID(id);
    const inside = circuit.clone();
    checkChipKinds(inside);
    if (inside.component(CHIP_PINS_ID)?.kind !== 'chipPins') throw chipError('missingPins');
    const inner = innerChips(inside);
    const later = inner.find((c) => chipNumber(c.chip.id) >= chipNumber(this.id));
    if (later) throw chipError('laterChip', later.id);
    const pins = pinsRule(inside);
    if (pins.outputs.length === 0) throw chipError('noOutputs');
    const depth = 1 + Math.max(0, ...inner.map((c) => c.chip.depth));
    if (depth > CHIP_MAX_DEPTH) throw chipError('tooDeep', depth);
    const own = inside.components.filter((c) => c.kind !== 'chipPins').length;
    const parts = inner.reduce((n, c) => n + c.chip.parts, own);
    if (parts > CHIP_MAX_PARTS) throw chipError('tooLarge', parts);
    this.inputs = pins.inputs;
    this.outputs = pins.outputs;
    this.depth = depth;
    this.parts = parts;
    this.inside = inside;
  }

  /** ADR-086: a copy of the circuit inside, so a definition never changes. */
  get circuit()          {
    return this.inside.clone();
  }

  /** ADR-086: the same ID and an equal circuit inside. */
  equals(o                )          {
    return this === o || (this.id === o.id && this.inside.equals(o.inside));
  }

  /** ADR-080: `{ circuit, id, inputs, outputs }`, the circuit with its own `chips`. */
  toJSON()            {
    return { circuit: this.inside.toJSON(), id: this.id, inputs: [...this.inputs], outputs: [...this.outputs] };
  }

  /** ADR-086: one definition at nesting `depth` (1 inside a top-level circuit); `tooDeep` before reading past 4. */
  static fromJSON(json         , depth = 1)                 {
    const entry = chipEntryCircuit(json, depth);
    return new ChipDefinition(entry.id, entry.circuit);
  }
}

/** ADR-081: 3 cells wide and max(2, inputs, outputs) high. */
function chipFootprint(def                )            {
  return { width: 3, height: Math.max(2, def.inputs.length, def.outputs.length) };
}

/** ADR-081: the row of `pin` on its side from the top (inputs west, outputs east); null for a pin the chip lacks. */
function chipPinRow(def                , pin         )                {
  const input = def.inputs.indexOf(pin);
  if (input >= 0) return input;
  const output = def.outputs.indexOf(pin);
  return output >= 0 ? output : null;
}

// MARK: - JSON (ADR-080, ADR-086)

const isChipRecord = (v         )                           => typeof v === 'object' && v !== null && !Array.isArray(v);

const sameChipPins = (raw         , pins                    )          =>
  Array.isArray(raw) && raw.length === pins.length && raw.every((p, i) => p === pins[i]);

/** ADR-086: a circuit's `chips`, omitted (undefined) when there are none. */
function chipsJSON(chips                           )            {
  return chips.length === 0 ? undefined : chips.map((d) => d.toJSON());
}

/** One `chips` entry up to its own checks: depth, ID, its circuit, then inputs and outputs against the pins rule. */
function chipEntryCircuit(json         , depth        )                                   {
  if (depth > CHIP_MAX_DEPTH) throw chipError('tooDeep', depth);
  if (!isChipRecord(json) || !isChipRecord(json.circuit)) throw chipCorrupted('chips');
  const id = chipID(json.id);
  const circuit = Circuit.fromJSON(json.circuit, depth);
  const rule = pinsRule(circuit);
  if (!sameChipPins(json.inputs, rule.inputs) || !sameChipPins(json.outputs, rule.outputs)) {
    throw chipCorrupted('chips');
  }
  return { id, circuit };
}

/** `chips` absent, or a non-empty array of records with valid IDs ascending by number; else `dataCorrupted`. */
function chipEntries(raw         )                        {
  if (raw === undefined) return [];
  if (!Array.isArray(raw) || raw.length === 0) throw chipCorrupted('chips');
  let last = 0;
  for (const e of raw) {
    if (!isChipRecord(e)) throw chipCorrupted('chips');
    const n = chipNumber(chipID(e.id));
    if (n <= last) throw chipCorrupted('chips');
    last = n;
  }
  return raw;
}

/** The ChipID each chip component names, by its raw ID (other components and non-string fields skipped). */
function namedChips(components       )                      {
  const named = new Map                ();
  for (const c of components) {
    if (isChipRecord(c) && c.kind === 'chip' && typeof c.chip === 'string') named.set(c.id, c.chip);
  }
  return named;
}

/**
 * ADR-086: a circuit JSON's chip definitions per chip component (by raw ID), first fault wins: `chips` not a
 * non-empty array, not ascending, or with an unused entry; an entry's inputs or outputs against the pins rule (all
 * `DecodingError.dataCorrupted`); a chip component without `chip` or `chip` on another kind (`dataCorrupted`); a
 * `chip` naming no entry (`CircuitError.unknownChip`); then each definition's own checks. `depth` is the circuit's.
 */
function chipsFromJSON(json     , depth        )                              {
  const entries = chipEntries(json.chips);
  const named = namedChips(json.components);
  const used = new Set(named.values());
  if (entries.some((e) => !used.has(e.id))) throw chipCorrupted('chips');
  const decoded = entries.map((e) => chipEntryCircuit(e, depth + 1));
  for (const c of json.components) {
    const has = isChipRecord(c) && c.chip !== undefined;
    if ((isChipRecord(c) && c.kind === 'chip') !== has || (has && typeof c.chip !== 'string')) {
      throw chipCorrupted('chip');
    }
  }
  const byID = new Map(decoded.map((d) => [d.id, d]));
  for (const chip of named.values()) {
    if (!byID.has(chip)) throw new GameCoreError('CircuitError', 'unknownChip', chip);
  }
  const defs = new Map(decoded.map((d) => [d.id, new ChipDefinition(d.id, d.circuit)]));
  // Non-null: every named ChipID is in byID (checked above), and defs has the same keys.
  return new Map([...named].map(([component, chip]) => [component, defs.get(chip) ]));
}

// --- core/signals.ts
// Port of GameCore/Simulation/SignalValues (ADR-005, ADR-024), moved out of circuit.ts (CQ.8).


                                           

/** Pin values across a circuit; absent reads false (ADR-005). */
class SignalValues {
                   trueSet = new Set        ();

  get(ref        )          {
    return this.trueSet.has(pinKey(ref));
  }

  getKey(key        )          {
    return this.trueSet.has(key);
  }

  setKey(key        , value         )       {
    if (value) this.trueSet.add(key);
    else this.trueSet.delete(key);
  }

  set(ref        , value         )       {
    this.setKey(pinKey(ref), value);
  }

  /** Pins whose value is true, sorted by PinRef (ADR-024). */
  get truePins()           {
    return [...this.trueSet].map(parsePinKey).sort(comparePinRefs);
  }
}

// --- core/chip-inline.ts
// The net a CompiledCircuit runs (ADR-008, ADR-080, ADR-086): every gate and flip-flop of the circuit and of the
// chips inside it under its full key (`c/<inner id>`, nested `c/d/<inner id>`), plus one pass-through step per chip
// pin, keyed by that pin (`c.i1`, `c/d.o2`), which copies its driver. Steps are ordered by Kahn's algorithm, ties by
// key; a cycle without a flip-flop is reported as the outer components on it. A circuit without chips gives exactly
// its gates, in the order and with the drivers it had before chips.


                                                                          

                                                          


/** ADR-086: one read of the net: the pin's full key, and its driver's full key or null when unwired. */
                          
                       
                                 
 

/** ADR-086: a gate, or a pass-through step that copies a chip pin's driver to that pin. */
                          
                                                                         
                       
                                               
                                                                                                     
                                     
                                                                            
                                      
 

/** ADR-086: the inlined circuit: steps in evaluation order, the sinks read after them, flip-flops and kinds by key. */
               
                                     
                                                                                                            
                                     
                                               
                                        
                                              
 

                      
                   
                   
                      
                                     
 

/** ADR-086: the net of `circuit`; throws `CompileError.combinationalLoops` with the loops (ADR-008). */
function buildNet(circuit         )      {
  const b             = { steps: [], sinks: [], flipFlops: [], kindOf: new Map() };
  inlineCircuit(b, circuit, '');
  b.flipFlops.sort(compareStrings);
  return { steps: orderSteps(b.steps), sinks: b.sinks, flipFlops: b.flipFlops, kindOf: b.kindOf };
}

/**
 * The full key of the driver of `ref` in `circuit` at `prefix` (`''` at the top, `c/` inside chip `c`); `pins.iK`
 * inside chip `c` is the chip's own input pin `c.iK`, the key of its pass step.
 */
function netDriver(circuit         , prefix        , ref        )                {
  const d = circuit.driver(ref);
  if (!d) return null;
  if (prefix !== '' && d.component === CHIP_PINS_ID) return prefix.slice(0, -1) + '.' + d.pin;
  return prefix + d.component + '.' + d.pin;
}

function netRead(circuit         , prefix        , component             , pin         )          {
  return { pin: prefix + component + '.' + pin, driver: netDriver(circuit, prefix, { component, pin }) };
}

/** Adds the components of `circuit` at `prefix`; outside the top level there is no robot, part or `chipPins` node. */
function inlineCircuit(b            , circuit         , prefix        )       {
  for (const c of circuit.components) {
    const key = prefix + c.id;
    b.kindOf.set(key, c.kind);
    const reads = () => inputPins(c.kind).map((pin) => netRead(circuit, prefix, c.id, pin));
    if (c.kind === 'and' || c.kind === 'or' || c.kind === 'not') {
      b.steps.push({ key, kind: c.kind, reads: reads(), outputs: outputPins(c.kind).map((pin) => key + '.' + pin) });
    } else if (c.kind === 'srFlipFlop') {
      b.flipFlops.push(key);
      b.sinks.push(...reads());
    } else if (c.kind === 'chip') {
      inlineChip(b, circuit, prefix, c.id);
    } else if (prefix === '') {
      b.sinks.push(...reads());
    }
  }
}

/** A chip at `prefix`: a pass step per input pin (its outer wire) and per output pin (the wire into `pins.oK`). */
function inlineChip(b            , circuit         , prefix        , id             )       {
  // Non-null: every chip component of a Circuit has its definition (Circuit.addComponent).
  const def = circuit.chip(id) ;
  const key = prefix + id;
  for (const pin of def.inputs) {
    b.steps.push({ key: key + '.' + pin, kind: 'pass', reads: [netRead(circuit, prefix, id, pin)], outputs: [] });
  }
  const inside = def.circuit;
  const inner = key + '/';
  for (const pin of def.outputs) {
    const driver = netDriver(inside, inner, { component: CHIP_PINS_ID, pin });
    b.steps.push({ key: key + '.' + pin, kind: 'pass', reads: [{ pin: key + '.' + pin, driver }], outputs: [] });
  }
  inlineCircuit(b, inside, inner);
}

                                           

/** The edges from the step owning a driver key (a gate's output, a pass step's key) to each step reading it. */
function netSuccessors(steps                    )                {
  const owner = new Map                ();
  for (const s of steps) {
    if (s.kind === 'pass') owner.set(s.key, s.key);
    for (const out of s.outputs) owner.set(out, s.key);
  }
  const successors                = new Map();
  for (const s of steps) {
    for (const r of s.reads) {
      const from = r.driver === null ? undefined : owner.get(r.driver);
      if (from === undefined) continue;
      if (!successors.has(from)) successors.set(from, []);
      // Non-null: successors.has(from) is ensured by the line above.
      successors.get(from) .push(s.key);
    }
  }
  return successors;
}

/** Kahn's algorithm, always taking the smallest ready key; throws the loop report if a cycle remains. */
function orderSteps(steps                    )            {
  const byKey = new Map(steps.map((s) => [s.key, s]));
  const keys = [...byKey.keys()].sort(compareStrings);
  const successors = netSuccessors(steps);
  const inDegree = new Map                (keys.map((k) => [k, 0]));
  for (const list of successors.values()) for (const s of list) inDegree.set(s, (inDegree.get(s) ?? 0) + 1);
  const ready = keys.filter((k) => inDegree.get(k) === 0);
  const order           = [];
  while (ready.length > 0) {
    // Non-null: The loop condition guarantees ready is non-empty.
    const next = ready.shift() ;
    order.push(next);
    for (const s of successors.get(next) ?? []) {
      const remaining = (inDegree.get(s) ?? 0) - 1;
      inDegree.set(s, remaining);
      if (remaining === 0) insertSorted(ready, s);
    }
  }
  if (order.length < keys.length) {
    const processed = new Set(order);
    const leftover = keys.filter((k) => !processed.has(k));
    throw new GameCoreError('CompileError', 'combinationalLoops', outerLoops(sccLoops(leftover, successors)));
  }
  // Non-null: order holds keys of byKey only.
  return order.map((k) => byKey.get(k) );
}

/** Inserts `key` into the sorted `ready` list before the first larger key. */
function insertSorted(ready          , key        )       {
  let index = ready.findIndex((r) => compareStrings(key, r) < 0);
  if (index < 0) index = ready.length;
  ready.splice(index, 0, key);
}

/** ADR-086: each loop as the distinct outer components on it (a chip by its own ID), sorted; equal loops once. */
function outerLoops(loops            )                  {
  const seen = new Map                       ();
  for (const loop of loops) {
    const outer = [...new Set(loop.map((key) => key.split(/[./]/)[0]))].sort(compareStrings);
    seen.set(outer.join(' '), outer);
  }
  return [...seen.values()].sort(compareLoops);
}

/** By first ID, then the rest in order (loops through one chip can share a first ID). */
function compareLoops(a               , b               )         {
  for (let i = 0; i < Math.min(a.length, b.length); i++) {
    const c = compareStrings(a[i], b[i]);
    if (c !== 0) return c;
  }
  return a.length - b.length;
}

/** Tarjan state: DFS index, low-link and the component stack. */
                  
                             
                               
                       
                  
 

/** Pops the strongly connected component rooted at `node` off the stack. */
function popComponent(t        , node        )           {
  const members           = [];
  for (;;) {
    // Non-null: node is on the stack: it was pushed when opened and is popped only here.
    const m = t.stack.pop() ;
    t.onStack.delete(m);
    members.push(m);
    if (m === node) return members;
  }
}

/** Tarjan SCCs that are loops (size > 1 or a self-edge), iterative; each sorted. */
function sccLoops(nodes          , successors               )             {
  const inSubgraph = new Set(nodes);
  const t         = { index: new Map(), lowLink: new Map(), onStack: new Set(), stack: [] };
  let nextIndex = 0;
  const result             = [];
  const edges = (n        ) => (successors.get(n) ?? []).filter((s) => inSubgraph.has(s));
  const open = (n        ) => {
    t.index.set(n, nextIndex);
    t.lowLink.set(n, nextIndex);
    nextIndex += 1;
    t.stack.push(n);
    t.onStack.add(n);
    return { node: n, edges: edges(n), next: 0 };
  };
  for (const root of nodes) {
    if (t.index.has(root)) continue;
    const work = [open(root)];
    while (work.length > 0) {
      const top = work[work.length - 1];
      const node = top.node;
      if (top.next < top.edges.length) {
        const s = top.edges[top.next++];
        if (!t.index.has(s)) work.push(open(s));
        // Non-null: Every node on the DFS stack has an index and a lowLink (set in open()).
        else if (t.onStack.has(s)) t.lowLink.set(node, Math.min(t.lowLink.get(node) , t.index.get(s) ));
        continue;
      }
      work.pop();
      const parent = work[work.length - 1];
      // Non-null: parent and node were both opened, so both have a lowLink.
      if (parent) t.lowLink.set(parent.node, Math.min(t.lowLink.get(parent.node) , t.lowLink.get(node) ));
      if (t.lowLink.get(node) !== t.index.get(node)) continue;
      const members = popComponent(t, node);
      if (members.length > 1 || edges(node).includes(node)) result.push(members.sort(compareStrings));
    }
  }
  return result;
}

// --- core/compiled-circuit.ts
// Port of GameCore/Circuit/CompiledCircuit (ADR-008): the net to evaluate and its order (chip-inline.ts: gates and
// flip-flops under full keys and a pass-through step per chip pin, ADR-080, ADR-086), the combinational loop report,
// and gate evaluation (ADR-004, ADR-005, ADR-009). Robot parts are loop boundaries like `robot` (ADR-029).


                                                                  

                                                                                

                                                         

/** Output values of a combinational kind (ADR-004, ADR-005); null for stateful kinds, `robot` and parts. */
function evaluateGate(kind               , read                           )                                  {
  switch (kind) {
    case 'and': return { out: read('a') && read('b') };
    case 'or': return { out: read('a') || read('b') };
    case 'not': return { out: !read('in') };
    default: return null;
  }
}

/** Next committed q (ADR-009, reset-dominant SR); null for every kind but `srFlipFlop`. */
function nextState(kind               , q         , read                           )                 {
  if (kind !== 'srFlipFlop') return null;
  if (read('r')) return false;
  if (read('s')) return true;
  return q;
}

/** The IDs of each robot part kind among `components`, ascending (ADR-029); every part has a list. */
function partIDs(components                      )                                   {
  const parts                                   = { antenna: [], battery: [], arm: [] };
  for (const c of components) if (isRobotPart(c.kind)) parts[c.kind].push(c.id);
  for (const part of ROBOT_PARTS) parts[part].sort(compareStrings);
  return parts;
}

/** A circuit validated for running: no unbroken combinational loops, fixed evaluation order. */
class CompiledCircuit {
           circuit         ;
  /**
   * ADR-086: the gates and the chip pins' pass-through steps in evaluation order (dependencies first, ties by key);
   * without chips, exactly the combinational components.
   */
           steps                    ;
  /** ADR-086: the reads after the steps: flip-flop inputs (all depths), top-level robots, antennas, arms, chipPins. */
           sinks                    ;
  /** The keys of `steps`, in order: gate IDs (full keys inside chips) and chip pin keys (ADR-086). */
           order          ;
  /** Every flip-flop's full key (`c/<inner id>` inside chip `c`), ascending (ADR-080, ADR-086). */
           flipFlops          ;
  /** Components of kind `robot` only, ascending. */
           robots               ;
  /** The IDs of each robot part kind, ascending; parts are loop boundaries (ADR-029). */
           parts                                            ;
  /** ADR-086: the top-level `chipPins` components, ascending; their inputs are read like thrusters. */
           chipPins                        ;
  /** Kind of every component and of every component inside a chip, by full key, for the hot loop. */
           kindOf                            ;

  /** Throws `CompileError.combinationalLoops` with the loops (ADR-008), chips named by their own ID (ADR-086). */
  constructor(circuit         ) {
    const components = circuit.components;
    const net = buildNet(circuit);
    this.circuit = circuit;
    this.steps = net.steps;
    this.sinks = net.sinks;
    this.order = net.steps.map((s) => s.key);
    this.flipFlops = [...net.flipFlops];
    this.robots = components.filter((c) => c.kind === 'robot').map((c) => c.id);
    this.parts = partIDs(components);
    this.chipPins = components.filter((c) => c.kind === 'chipPins').map((c) => c.id);
    this.kindOf = net.kindOf;
  }
}

// --- core/chip-library.ts
// The chip library (ADR-081, ADR-086): the burned chips (at most 12) and the found chips (at most 12, each with its
// catalogue name, ADR-082), in number order, numbers never reused. Immutable: `burn`, `find` and `scrap` return a
// new library. The bench burns through `burn` (`ChipBench`, ADR-090) and its view is CHUNK-3.5; consoles find chips
// through `visitFab` (chip-catalogue.ts, ADR-089); the save keeps them (save-chips.ts, ADR-083).

                                            

                                        


/** ADR-086: `found` keys held among `chips`, names valid and each once, at most `CHIP_FOUND_MAX`. */
function checkFound(chips                           , found                             )       {
  if (found.size > CHIP_FOUND_MAX) throw chipError('invalidLibrary');
  const names = new Set        ();
  for (const [id, name] of found) {
    if (typeof name !== 'string' || !CHIP_NAME.test(name) || names.has(name)) throw chipError('invalidLibrary');
    if (!chips.some((c) => c.id === id)) throw chipError('invalidLibrary');
    names.add(name);
  }
}

/** ADR-081, ADR-086: the held chips, ascending by number, which of them were found, and the next chip number. */
class ChipLibrary {
  /** ADR-086: no chips; the next burn is `chip-1`. */
  static          empty              = new ChipLibrary();

  /** ADR-086: the held chips, burned and found, ascending by number. */
           chips                           ;
  /** ADR-081: the next chip number, 1 to 1000 (1000 once `chip-999` was burned or found). */
           next        ;
  /** ADR-086, ADR-089: each found chip's ID and catalogue name, ascending by number; read-only. */
           found                             ;

  /**
   * ADR-086: over 12 burned chips (held chips not in `found`) is `ChipError.libraryFull`; numbers not ascending, not
   * below `next`, or `next` outside 1 to 1000 is `ChipError.invalidLibrary`; so is over 12 found chips, a found name
   * not matching `CHIP_NAME` or given twice, or a found ID not held.
   */
  constructor(chips                            = [], next = 1, found                              = new Map()) {
    if (chips.length - found.size > CHIP_LIBRARY_MAX) throw chipError('libraryFull');
    if (!Number.isInteger(next) || next < 1 || next > CHIP_MAX_NUMBER + 1) throw chipError('invalidLibrary');
    let last = 0;
    for (const c of chips) {
      const n = chipNumber(c.id);
      if (n <= last || n >= next) throw chipError('invalidLibrary');
      last = n;
    }
    checkFound(chips, found);
    this.chips = [...chips];
    this.next = next;
    this.found = new Map([...found].sort(([a], [b]) => chipNumber(a) - chipNumber(b)));
  }

  /** ADR-086: the held chip `id`, or null. */
  chip(id        )                        {
    return this.chips.find((c) => c.id === id) ?? null;
  }

  /** ADR-086: the number of held chips that were burned, not found; `libraryFull` counts these only. */
          get burned()         {
    return this.chips.length - this.found.size;
  }

  /**
   * ADR-086: `circuit` as chip `chip-<next>`, first fault wins: `libraryFull` (burned chips only), `numbersUsedUp`,
   * the definition's checks, then `CompileError.combinationalLoops`. The library is unchanged; the new one holds the
   * chip and `next` one higher.
   */
  burn(circuit         )                                                 {
    if (this.burned >= CHIP_LIBRARY_MAX) throw chipError('libraryFull');
    if (this.next > CHIP_MAX_NUMBER) throw chipError('numbersUsedUp');
    const chip = new ChipDefinition(`chip-${this.next}`, circuit);
    new CompiledCircuit(chip.circuit);
    return { library: new ChipLibrary([...this.chips, chip], this.next + 1, this.found), chip };
  }

  /**
   * ADR-086, ADR-089: the found chip `name` with `circuit`, first fault wins: a name already found returns this
   * library and `chip` null; `numbersUsedUp`; the definition's checks under `chip-<next>`;
   * `CompileError.combinationalLoops`; then the constructor's (`invalidLibrary` for a bad name or a 13th found chip).
   * The new library holds the chip, records it as found and has `next` one higher.
   */
  find(name        , circuit         )                                                        {
    if ([...this.found.values()].includes(name)) return { library: this, chip: null };
    if (this.next > CHIP_MAX_NUMBER) throw chipError('numbersUsedUp');
    const chip = new ChipDefinition(`chip-${this.next}`, circuit);
    new CompiledCircuit(chip.circuit);
    const found = new Map(this.found).set(chip.id, name);
    return { library: new ChipLibrary([...this.chips, chip], this.next + 1, found), chip };
  }

  /**
   * ADR-086: without chip `id`, keeping `next` so its number is never reused; `ChipError.unknownChip(id)` for a chip
   * not held, then `ChipError.foundChip(id)` for a found one.
   */
  scrap(id        )              {
    if (!this.chip(id)) throw chipError('unknownChip', id);
    if (this.found.has(id)) throw chipError('foundChip', id);
    return new ChipLibrary(this.chips.filter((c) => c.id !== id), this.next, this.found);
  }
}

// --- core/chip-catalogue.ts
// The found-chip catalogue (ADR-082, ADR-089): one Circuit JSON per found chip, keyed by its name, decoded and
// checked when it is loaded so a broken entry never shows first at a console; and a visit to a fab console, which
// finds the console's chips into the library in listed order. The host bundles the texts (web/chips/*.json through
// tools/build.ts into app/chips.ts); the core only reads the strings.



                                                     


/** ADR-089: the found chips' circuits by catalogue name. */
                                                         

/** One catalogue entry: a valid name, JSON, a Circuit without `chip` components, a valid definition that compiles. */
function catalogueEntry(name        , text        )          {
  if (!CHIP_NAME.test(name)) throw new Error('bad name');
  const circuit = Circuit.fromJSON(JSON.parse(text));
  if (circuit.components.some((c) => c.kind === 'chip')) throw new Error('chip component');
  const def = new ChipDefinition('chip-1', circuit);
  new CompiledCircuit(def.circuit);
  return circuit;
}

/**
 * ADR-089: decodes every entry of `texts` in name order; the first fault is `ChipError.invalidCatalogue(name)`: a
 * name not matching `CHIP_NAME`, not JSON, not a Circuit, a `chip` component, not a valid definition as `chip-1`, or
 * a definition that does not compile.
 */
function chipCatalogue(texts                                  )                {
  const catalogue = new Map                 ();
  for (const name of Object.keys(texts).sort()) {
    try {
      catalogue.set(name, catalogueEntry(name, texts[name]));
    } catch {
      throw chipError('invalidCatalogue', name);
    }
  }
  return catalogue;
}

/** ADR-089: the library after a visit to a console, the chips it found in order, and whether numbers are left. */
                           
                                
                                                                                              
                                            
                                                                                                         
                                
 

/**
 * ADR-082, ADR-089: finds each of a console's `names` in listed order with `ChipLibrary.find`. A name the catalogue
 * lacks is `ChipError.notInCatalogue(name)` before anything is found; `numbersUsedUp` ends the visit with
 * `numbersLeft` false.
 */
function visitFab(library             , names                   , catalogue               )           {
  const missing = names.find((n) => !catalogue.has(n));
  if (missing !== undefined) throw chipError('notInCatalogue', missing);
  let current = library;
  const found                   = [];
  for (const name of names) {
    // Non-null: every name is in the catalogue (checked above).
    const result = findOrUsedUp(current, name, catalogue.get(name) );
    if (result === null) return { library: current, found, numbersLeft: false };
    current = result.library;
    if (result.chip) found.push(result.chip);
  }
  return { library: current, found, numbersLeft: true };
}

/** `library.find(name, circuit)`, or null when it is `ChipError.numbersUsedUp`; any other refusal is thrown. */
function findOrUsedUp(
  library             , name        , circuit         ,
)                                                               {
  try {
    return library.find(name, circuit);
  } catch (e) {
    if (e instanceof GameCoreError && e.domain === 'ChipError' && e.code === 'numbersUsedUp') return null;
    throw e;
  }
}

// --- core/robots.ts
// Several robots (ADR-064, ADR-069): the robot models in robot order, their constants, a level's robot starts
// and each robot's committed state. The first robot in robot order keeps the old top-level `WorldState` keys
// (`robot`, `charge`, `holding`, `hold`, `towedBy`); `robotStates` and `withRobotStates` read and write every robot as
// one list; `riddenModel` names the robot the figure rides.


                                            
                                           
                                              
                                             

/** ADR-064: the robot models, in robot order. */
                                                      

/** ADR-064: every robot model in robot order (the order robots sense, move and hand over in). */
const ROBOT_MODELS                        = ['scout', 'hauler', 'relay'];

/** ADR-064: true when `raw` names a robot model. */
function isRobotModel(raw         )                    {
  return typeof raw === 'string' && (ROBOT_MODELS                     ).includes(raw);
}

/** ADR-064: the robot order of two models (negative when `a` comes first). */
function compareRobotModels(a            , b            )         {
  return ROBOT_MODELS.indexOf(a) - ROBOT_MODELS.indexOf(b);
}

/** ADR-064, ADR-065: hold slots per model; the carried `*` crystal fills one while carried (ADR-071). */
const HOLD_CAPACITY                                       = { scout: 1, hauler: 3, relay: 1 };

/** ADR-064: the board of every campaign robot, which fits all three robot parts (ADR-029). */
const CAMPAIGN_BOARD = { width: 27, height: 15 }         ;

/** ADR-063: the lift region's side in cells. */
const LIFT_SIZE = 5;

/** ADR-069: a robot of a level: its model, its start anchor (cells) and whether it starts asleep (`found`). */
                             
                             
                                  
                          
 

/**
 * ADR-064: one robot's committed state; `charge` is null without a battery, `holding` is its claw (ADR-032, a crate
 * or a towed robot, ADR-072), `hold` its hold entries in arrival order (ADR-065, ADR-071).
 */
                             
                             
                                  
                           
                                 
                            
                                      
                                                                                     
                                      
 

/**
 * ADR-064: every robot of `s` in robot order, the first from the top-level keys, then `s.robots`; a missing `hold`
 * reads as empty (ADR-071), a missing `towedBy` as not towed (ADR-072).
 */
function robotStates(s            )               {
  const first             = {
    model: s.model ?? 'scout', position: s.robot, asleep: s.asleep ?? false, charge: s.charge, holding: s.holding,
    hold: s.hold ?? [], towedBy: s.towedBy ?? null,
  };
  return [first, ...(s.robots ?? []).map((r) => ({ ...r, hold: r.hold ?? [], towedBy: r.towedBy ?? null }))];
}

/** ADR-069: the robot the figure rides in `s`: `figure.robot`, else the first robot; null on foot. */
function riddenModel(s            )                    {
  if (!s.figure?.isRiding) return null;
  return s.figure.robot ?? s.model ?? 'scout';
}

/** ADR-064: `s` with every robot from `all` (robot order): the first at the top-level keys, the rest in `robots`. */
function withRobotStates(s            , all                       )             {
  const [first, ...others] = all;
  return {
    ...s, robot: first.position, model: first.model, asleep: first.asleep, charge: first.charge,
    holding: first.holding, hold: first.hold, towedBy: first.towedBy, robots: others,
  };
}

/**
 * ADR-069, ADR-071, ADR-072: a robot after the first as JSON: `asleep`, `charge`, `hold`, `holding` and `towedBy`
 * only when present.
 */
function robotStateJSON(r            )            {
  const hold = r.hold ?? [];
  return {
    asleep: r.asleep ? true : undefined,
    charge: r.charge === null ? undefined : r.charge,
    hold: hold.length > 0 ? hold.map(holdEntryJSON) : undefined,
    holding: r.holding ? true : undefined,
    model: r.model,
    position: { x: r.position.x, y: r.position.y },
    towedBy: r.towedBy ?? undefined,
  };
}

// --- core/room.ts
// Port of GameCore/World, first part: directions, positions, tiles, cell rectangles and rooms
// (ADR-013, ADR-038). Goals and levels are in level.ts; the world state and its tick in world.ts.


                                              
                                           


const worldError = (code        , detail          ) => new GameCoreError('WorldError', code, detail);

const DX                            = { north: 0, east: 1, south: 0, west: -1 };
const DY                            = { north: -1, east: 0, south: 1, west: 0 };
const OPPOSITE                               = { north: 'south', south: 'north', east: 'west', west: 'east' };

function isDirection(raw         )                   {
  return typeof raw === 'string' && (DIRECTIONS                     ).includes(raw);
}

// MARK: - GridPosition

                               
                     
                     
 

function gp(x        , y        )               {
  return { x, y };
}

function moved(p              , d           )               {
  return { x: p.x + DX[d], y: p.y + DY[d] };
}

function samePosition(a                                 , b                                 )          {
  if (!a || !b) return a == b;
  return a.x === b.x && a.y === b.y;
}

/** Row-major order: by y, then x. */
function comparePositions(a              , b              )         {
  return a.y - b.y || a.x - b.x;
}

function positionJSON(p              )            {
  return { x: p.x, y: p.y };
}

function positionFromJSON(json     )               {
  if (!Number.isInteger(json?.x) || !Number.isInteger(json?.y)) {
    throw new GameCoreError('DecodingError', 'typeMismatch', 'GridPosition');
  }
  return { x: json.x, y: json.y };
}

// MARK: - Tiles and rooms

/** Cell kinds; `charger` (`+`) refills a battery and is walkable for robots and the figure (ADR-031). */
                                                                      
/** Every tile kind; `charger` is appended (ADR-031). */
const TILE_KINDS                      = ['floor', 'wall', 'gap', 'hatch', 'charger'];
const SYMBOLS                           = { floor: '.', wall: '#', gap: '_', hatch: 'h', charger: '+' };

function tileFromSymbol(ch        )                  {
  return TILE_KINDS.find((k) => SYMBOLS[k] === ch) ?? null;
}

function tileIsBlocked(k          )          {
  return k === 'wall';
}

/** The figure walks on floor and chargers only (ADR-027, ADR-031). */
function tileBlocksFigure(k          )          {
  return k !== 'floor' && k !== 'charger';
}

const ROBOT_SIZE = 4;
const FIGURE_SIZE = 2;
const CRYSTAL_SIZE = 2;
const GOAL_SIZE = 5;
/** Side of a crate's square footprint in cells (ADR-032), like the crystal's. */
const CRATE_SIZE = 2;
/** ADR-062: an item's footprint side in cells, like the crystal's. */
const ITEM_SIZE = 2;
/** ADR-082, ADR-089: a fab console's footprint side in cells. */
const FAB_SIZE = 4;

/** A rectangle of cells (ADR-038). */
class CellRect {
           x        ;
           y        ;
           width        ;
           height        ;

  constructor(x        , y        , width        , height        ) {
    if (!(width > 0 && height > 0)) throw new Error('CellRect needs a positive size');
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
  }

  static square(anchor              , size        )           {
    return new CellRect(anchor.x, anchor.y, size, size);
  }
  static robot(a              )           { return CellRect.square(a, ROBOT_SIZE); }
  static figure(a              )           { return CellRect.square(a, FIGURE_SIZE); }
  static crystal(a              )           { return CellRect.square(a, CRYSTAL_SIZE); }
  static goal(a              )           { return CellRect.square(a, GOAL_SIZE); }
  /** A crate's 2 × 2 footprint (ADR-032). */
  static crate(a              )           { return CellRect.square(a, CRATE_SIZE); }
  /** An item's 2 × 2 footprint (ADR-062). */
  static item(a              )           { return CellRect.square(a, ITEM_SIZE); }
  /** The lift's 5 × 5 region with its north-west cell at `a` (ADR-063). */
  static lift(a              )           { return CellRect.square(a, LIFT_SIZE); }
  /** A fab console's 4 × 4 region with its north-west cell at `a` (ADR-082, ADR-089). */
  static fab(a              )           { return CellRect.square(a, FAB_SIZE); }

  get maxX()         { return this.x + this.width; }
  get maxY()         { return this.y + this.height; }

  contains(p              )          {
    return p.x >= this.x && p.x < this.maxX && p.y >= this.y && p.y < this.maxY;
  }

  overlaps(o          )          {
    return this.x < o.maxX && o.x < this.maxX && this.y < o.maxY && o.y < this.maxY;
  }

  /** Edge contact at least one cell long; corners do not count (ADR-038 "next to"). */
  sharesEdge(o          )          {
    if (this.overlaps(o)) return false;
    const rowsOverlap = this.y < o.maxY && o.y < this.maxY;
    const columnsOverlap = this.x < o.maxX && o.x < this.maxX;
    if (rowsOverlap && (this.maxX === o.x || o.maxX === this.x)) return true;
    if (columnsOverlap && (this.maxY === o.y || o.maxY === this.y)) return true;
    return false;
  }
}

/** Rectangular grid of cells (ADR-013, ADR-038). */
class Room {
  static          schemaVersion = 2;
  static          maxSide = 320;

           width        ;
           height        ;
                   tiles            ;

  constructor(width        , height        , tiles            ) {
    Room.checkSize(width, height);
    if (tiles.length !== width * height) {
      throw worldError('tileCountMismatch', { expected: width * height, actual: tiles.length });
    }
    this.width = width;
    this.height = height;
    this.tiles = tiles;
  }

  static fromRows(rows          )       {
    return Room.fromSizedRows([...(rows[0] ?? '')].length, rows.length, rows);
  }

          static fromSizedRows(width        , height        , rows          )       {
    Room.checkSize(width, height);
    if (rows.length !== height) throw worldError('rowCountMismatch', { expected: height, actual: rows.length });
    const tiles             = [];
    rows.forEach((row, y) => {
      const chars = [...row];
      if (chars.length !== width) {
        throw worldError('rowLengthMismatch', { row: y, expected: width, actual: chars.length });
