function tick(r        )       {
  noteWorld(r, r.run.step());
}

/** One paused steering tap (ADR-061): a figure move, never a sprint; riding it changes nothing. */
function move(r        , steering           )       {
  noteWorld(r, r.run.moveFigure(steering));
}

/** A handover and `leave` can happen on a tick or on a figure move (ADR-071, ADR-074). */
function noteWorld(r        , world            )       {
  r.chips.visit(r.run, r.line);
  if (r.first === null && world.inventory.includes('crystal')) r.first = r.run.tick;
  if (!r.campaign || r.leaveTick !== null || !world.solved) return;
  r.leaveTick = r.run.tick;
  if (!r.edits) return;
  r.carry = r.campaign.carryFrom(r.run, new Map([...r.sessions].map(([m, s]) => [m, s.session.schematic])));
}

/** The current robot's session; the practice file's one session whatever the current robot. */
function sessionFor(r        )                     {
  if (!r.campaign) return r.sessions.values().next().value ?? null;
  return r.sessions.get(r.run.current) ?? null;
}

function edit(r        , line        , apply                            )       {
  const slot = sessionFor(r);
  if (!slot) return;
  if (!r.run.canEditCircuit) throw textError('solutionEditOutside', { line });
  apply(slot.session);
  r.run.replaceCircuit(slot.session.schematic.circuit);
}

/** Without edits a robot that is not being ridden is tolerated (ADR-044). */
function exitRobot(r        )       {
  try {
    r.run.exitRobot();
  } catch (e) {
    if (r.edits || !(e instanceof GameCoreError && e.domain === 'FigureError' && e.code === 'notRiding')) throw e;
  }
}

/** ADR-073: the current robot's session rebuilt on its new parts after a fit or remove, as the app does. */
function refit(r        )       {
  const model = r.run.current;
  const slot = r.sessions.get(model);
  if (!slot) return;
  const eq = r.run.equipmentOf(model);
  const s = slot.session;
  slot.session = new EditorSession(s.rules, schematicWithParts(slot.origin, eq), schematicWithParts(s.schematic, eq),
    eq);
}

/**
 * ADR-074: `stow`, `take`, `fit` and `remove`; a refused core call is `solutionStepRefused({ line, error })`, or is
 * skipped without edits (fits and removes are left out then).
 */
function applyItemStep(r        , step                                                                   )       {
  const isEdit = step.op === 'fit' || step.op === 'remove';
  if (isEdit && !r.edits) return;
  try {
    if (step.op === 'stow') r.run.stow(step.item);
    else if (step.op === 'take') r.run.take(step.item);
    else if (step.op === 'fit') r.run.fitPart(step.part);
    else r.run.removePart(step.part);
  } catch (e) {
    if (!(e instanceof GameCoreError)) throw e;
    if (!r.edits) return;
    throw textError('solutionStepRefused', { line: step.line, error: `${e.domain}.${e.code}` });
  }
  if (isEdit) refit(r);
}

/** ADR-093: a chip step; left out without edits; `chip` goes through the ridden robot's session as `place` does. */
function applyChipStep(r        , step          )       {
  if (!r.edits) return;
  if (step.op === 'placeChip') edit(r, step.line, (s) => { r.chips.placeChip(s, step); });
  else r.chips.apply(step);
}

/** ADR-074: ticks without steering until `solved` or `n` ticks. */
function expectLeave(r        , n        )       {
  r.expectEnd = r.run.tick + n;
  for (let i = 0; i < n && !r.run.world.solved; i++) tick(r);
}

function applyStep(r        , step              )       {
  switch (step.op) {
    case 'walk':
      for (let i = 0; i < step.ticks; i++) move(r, step.direction);
      break;
    case 'wait':
      for (let i = 0; i < step.ticks; i++) tick(r);
      break;
    case 'place':
      edit(r, step.line, (s) => { s.place(step.kind, step.at); });
      break;
    case 'connect':
      edit(r, step.line, (s) => { s.connect(step.from, step.to); });
      break;
    case 'disconnect':
      edit(r, step.line, (s) => { s.disconnect(step.to); });
      break;
    case 'exit':
      exitRobot(r);
      break;
    case 'expect':
      r.expectEnd = r.run.tick + step.ticks;
      for (let i = 0; i < step.ticks; i++) tick(r);
      break;
    case 'expectLeave':
      expectLeave(r, step.ticks);
      break;
    default:
      if (isChipStep(step)) applyChipStep(r, step);
      else applyItemStep(r, step);
  }
}

/** A fresh runner: the campaign level's arrival run and one session per robot, else the package's run and session. */
function runnerOf(pkg              , edits         , carry       , catalogue               )         {
  const base = {
    edits, chips: new SolutionChips(catalogue), line: 0, first: null, expectEnd: 0, leaveTick: null, carry: null,
  };
  const slot = (session               )              => ({ session, origin: session.starting });
  if (pkg.isCampaign) {
    const campaign = startCampaignLevel(pkg, carry);
    const run = campaign.startingRun();
    const sessions = new Map(edits ? run.models.map((m) => [m, slot(campaign.sessionOf(m))]         ) : []);
    return { ...base, run, sessions, campaign };
  }
  const sessions = new Map                         ();
  if (edits && pkg.startingSchematic) sessions.set(pkg.level.robots[0].model, slot(pkg.session()));
  return { ...base, run: pkg.startingRun(), sessions, campaign: null };
}

/**
 * Runs `pkg.solution` on a fresh run; with `edits: false` the circuit edits (`place`, `connect` and `disconnect`,
 * ADR-076), fits and removes are left out and a refused stow or take is skipped (ADR-044, ADR-074). A campaign file
 * starts from `carry` (default EMPTY_CARRY). ADR-093: the console's chips are found from `catalogue` (default empty)
 * with or without edits; the `chip`, `bench` and `burn` steps are left out without edits.
 */
function runSolution(pkg              ,
  options                                                                = {})                 {
  if (!pkg.solution) throw textError('noSolution');
  const r = runnerOf(pkg, options.edits ?? true, options.carry ?? EMPTY_CARRY, options.catalogue ?? new Map());
  for (const step of pkg.solution) {
    r.line = step.line;
    applyStep(r, step);
  }
  const at = r.campaign ? r.leaveTick : r.first;
  const solved = at !== null && at <= r.expectEnd;
  return {
    firstCrystalTick: r.first, expectEndTick: r.expectEnd, solved, run: r.run, leaveTick: r.leaveTick, carry: r.carry,
    chips: r.chips.library,
  };
}

const DIAGRAM_WALLS                                      = { N: 'north', E: 'east', S: 'south', W: 'west' };
const DIAGRAM_WALL_END = /^(bumper|thruster)([NESW])$/;

/** ADR-097's names of the parts' pins and `grab`, as the description says them. */
const DIAGRAM_END_NAMES                                   = {
  'not.in': 'NOT', 'not.out': 'NOT', 'ff.s': 'flip-flop S', 'ff.r': 'flip-flop R', 'ff.q': 'flip-flop Q',
  'ff.qBar': 'flip-flop Q bar', 'chip.i1': 'chip input 1', 'chip.i2': 'chip input 2', 'chip.o1': 'chip output 1',
  'chip.o2': 'chip output 2', grab: 'arm grab',
};

/** ADR-097: `bumper east`, `thruster north`, `NOT`, `flip-flop Q bar`, `chip input 1`, `arm grab`, ... */
function diagramEndName(end        )         {
  const wall = DIAGRAM_WALL_END.exec(end);
  return wall ? `${wall[1]} ${DIAGRAM_WALLS[wall[2]]}` : DIAGRAM_END_NAMES[end];
}

/** The diagram's wires; tokens the rules refuse are left out (a Level never holds one). */
function diagramWires(diagram                   )                {
  return diagram.map(diagramWireOf).filter((w)                   => w !== null);
}

/**
 * ADR-097: `Diagram: ` then the wires in order as `<from> to <to>` joined by `; `, then `.`; a wire into `not.in`
 * followed by the wire out of `not.out` merges into `<from> to NOT to <to>`.
 */
function describeDiagram(diagram                   )         {
  const wires = diagramWires(diagram);
  const phrases           = [];
  for (let i = 0; i < wires.length; i++) {
    const w = wires[i], next = wires[i + 1];
    if (w.to === 'not.in' && next?.from === 'not.out') {
      phrases.push(`${diagramEndName(w.from)} to NOT to ${diagramEndName(next.to)}`);
      i++;
    } else phrases.push(`${diagramEndName(w.from)} to ${diagramEndName(w.to)}`);
  }
  return `Diagram: ${phrases.join('; ')}.`;
}

/** Design units: the margin, a wall symbol's or the arm icon's box, the gap between columns and between symbols. */
const DIAGRAM_MARGIN = 0.5;
const DIAGRAM_SYMBOL = 1.5;
const DIAGRAM_GAP = 2;
const DIAGRAM_ROW_GAP = 0.75;

                                         

/** Each part's box: ADR-054's NOT 2 × 1 and flip-flop 2 × 2, ADR-081's chip 3 × 2 with two inputs and outputs. */
const DIAGRAM_PART_BOXES                                                                   = {
  not: { width: 2, height: 1 }, ff: { width: 2, height: 2 }, chip: { width: 3, height: 2 },
};

/** Each part pin on its box: west (0) or east (1) side and its row's middle, as on the board. */
const DIAGRAM_PART_PINS                                                        = {
  'not.in': { side: 0, dy: 0.5 }, 'not.out': { side: 1, dy: 0.5 },
  'ff.s': { side: 0, dy: 0.5 }, 'ff.r': { side: 0, dy: 1.5 }, 'ff.q': { side: 1, dy: 0.5 },
  'ff.qBar': { side: 1, dy: 1.5 }, 'chip.i1': { side: 0, dy: 0.5 }, 'chip.i2': { side: 0, dy: 1.5 },
  'chip.o1': { side: 1, dy: 0.5 }, 'chip.o2': { side: 1, dy: 1.5 },
};

const isDiagramPart = (key        )                     => key === 'not' || key === 'ff' || key === 'chip';

/** The column an end's symbol sits in, and the symbol's key there (a part by its name, a robot end by itself). */
function diagramPlace(end        )                                     {
  if (end.includes('.')) return { column: 1, key: end.split('.')[0] };
  return { column: end.startsWith('bumper') ? 0 : 2, key: end };
}

/** The symbol keys of each column in first-use order. */
function diagramColumnKeys(wires                        )             {
  const columns             = [[], [], []];
  for (const w of wires) {
    for (const end of [w.from, w.to]) {
      const { column, key } = diagramPlace(end);
      if (!columns[column].includes(key)) columns[column].push(key);
    }
  }
  return columns;
}

/** A symbol's box size by key. */
function diagramBox(key        )                                    {
  return isDiagramPart(key) ? DIAGRAM_PART_BOXES[key] : { width: DIAGRAM_SYMBOL, height: DIAGRAM_SYMBOL };
}

/** The symbol of `key` with its box at (x, y). */
function diagramSymbol(key        , x        , y        )                {
  const { width, height } = diagramBox(key);
  const wall = DIAGRAM_WALL_END.exec(key);
  if (wall) return { kind: wall[1]                         , wall: DIAGRAM_WALLS[wall[2]], x, y, width, height };
  return { kind: isDiagramPart(key) ? key : 'grab', x, y, width, height };
}

/** The pin of `end` on its placed symbol: a robot end at its box's east (source) or west (sink) middle. */
function diagramPin(end        , byKey                                    )               {
  // Non-null: every end of the diagram has a placed symbol.
  const s = byKey.get(diagramPlace(end).key) ;
  const part = DIAGRAM_PART_PINS[end];
  if (part) return { x: s.x + part.side * s.width, y: s.y + part.dy };
  return { x: end.startsWith('bumper') ? s.x + s.width : s.x, y: s.y + s.height / 2 };
}

/** The right-angle points from `a` to `b` with the vertical run at x = `mx`; a straight line when level. */
function diagramRightAngle(a              , b              , mx        )                 {
  if (a.y === b.y) return [a, b];
  return [a, { x: mx, y: a.y }, { x: mx, y: b.y }, b];
}

/** The placed columns: their symbols by key, each column's east x and the drawing's size. */
                                                                                                            

/** Places the non-empty `columns` left to right, each centred vertically. */
function diagramColumns(columns                     )                {
  const used = columns.filter((c) => c.length > 0);
  const heightOf = (c          ) => c.reduce((h, k) => h + diagramBox(k).height, 0) + (c.length - 1) * DIAGRAM_ROW_GAP;
  const inner = Math.max(...used.map(heightOf));
  const byKey = new Map                       ();
  const ends           = [];
  let x = DIAGRAM_MARGIN;
  for (const c of used) {
    const width = Math.max(...c.map((k) => diagramBox(k).width));
    let y = DIAGRAM_MARGIN + (inner - heightOf(c)) / 2;
    for (const k of c) {
      const box = diagramBox(k);
      byKey.set(k, diagramSymbol(k, x + (width - box.width) / 2, y));
      y += box.height + DIAGRAM_ROW_GAP;
    }
    x += width;
    ends.push(x);
    x += DIAGRAM_GAP;
  }
  return { byKey, ends, width: x - DIAGRAM_GAP + DIAGRAM_MARGIN, height: inner + 2 * DIAGRAM_MARGIN };
}

/**
 * ADR-097: the drawing in design units: the bumpers, the parts and the thrusters with `grab` in three columns in
 * first-use order (an empty column left out), and each wire's right-angle trace from its source pin to its sink pin,
 * its vertical run in the gap after the source's column, the gap's runs spread evenly across it.
 */
function diagramLayout(diagram                   )                {
  const wires = diagramWires(diagram);
  const columns = diagramColumnKeys(wires);
  const { byKey, ends, width, height } = diagramColumns(columns);
  const gapOf = (end        ) => columns.slice(0, diagramPlace(end).column).filter((c) => c.length > 0).length;
  const perGap = new Map                ();
  const runs = wires.map((w) => {
    const gap = gapOf(w.from), k = perGap.get(gap) ?? 0;
    perGap.set(gap, k + 1);
    return { w, gap, k };
  });
  const traces = runs.map(({ w, gap, k }) => {
    // Non-null: every gap in `runs` was counted in `perGap` above.
    const mx = ends[gap] + ((k + 1) * DIAGRAM_GAP) / (perGap.get(gap)  + 1);
    const points = diagramRightAngle(diagramPin(w.from, byKey), diagramPin(w.to, byKey), mx);
    return { from: w.from, to: w.to, points };
  });
  return { width, height, symbols: [...byKey.values()], traces };
}

// --- app/wall-layout.ts
// Where the robot's wall slots, pins and part frames sit on the interior board (ADR-045; the web counterpart
// of WallLayout.swift), and the fab bench's terminals on its west and east walls (ADR-091). DOM-free.


                                                                                         
                                           

/** ADR-045: a part's pins along its wall, in drawing order (west to east or north to south). */
const PART_PINS                                                  = {
  antenna: ['rx', 'tx'], battery: ['low'], arm: ['grab', 'hold'],
};

/** ADR-045: the silkscreen label of each part pin. */
const PIN_LABELS                                   = {
  rx: 'RX', tx: 'TX', low: 'LOW', grab: 'GRAB', hold: 'HOLD',
};

/** ADR-045 (ADR-029): the wall each part sits on. */
const PART_SIDE                                         = { antenna: 'north', battery: 'south', arm: 'east' };

/** ADR-045: a part frame is 2.4 cells along its wall. */
const PART_FRAME_LENGTH = 2.4;
/** ADR-045: a two-pin part's pins sit this far either side of the slot centre. */
const PART_PIN_OFFSET = 0.6;

/** What a wall slot draws: the bumper, the thruster or a fitted part (the periscope is a bar button, ADR-045). */
                                                          

const OPPOSITE_WALL = { north: 'south', south: 'north', east: 'west', west: 'east' }         ;

/** The wall a robot pin sits on: a bumper on its own side, a thruster opposite its travel; null otherwise. */
function wallOf(pin         )                   {
  const m = /^(bumper|thruster)([NESW])$/.exec(pin);
  if (!m) return null;
  const d = ({ N: 'north', E: 'east', S: 'south', W: 'west' }         )[m[2]                         ];
  return m[1] === 'bumper' ? d : OPPOSITE_WALL[d];
}

/** Robot pins in wall order, bumper before thruster on each wall. */
const WALL_PINS            = DIRECTIONS.flatMap((d) => {
  const t = ({ north: 'S', east: 'W', south: 'N', west: 'E' }         )[d];
  return [`bumper${d[0].toUpperCase()}`, `thruster${t}`];
});

/**
 * ADR-045: each wall's drawn slots, parts only when the circuit has them; never a periscope. ADR-091: a board
 * without a `robot` (the fab's bench) has none.
 */
function drawnSlots(s           )                                 {
  const robot = s.circuit.components.some((c) => c.kind === 'robot');
  const base = ()              => (robot ? ['bumper', 'thruster'] : []);
  const slots                                 = { north: base(), east: base(), south: base(), west: base() };
  for (const part of ROBOT_PARTS) {
    if (s.circuit.components.some((c) => c.kind === part)) slots[PART_SIDE[part]].push(part);
  }
  return slots;
}

/** ADR-045: centre of slot `index` of `count` on a wall of `length` cells: length x (index + 1)/(count + 1). */
function slotCentre(length        , index        , count        )         {
  return (length * (index + 1)) / (count + 1);
}

const wallLength = (wall           , s           ) =>
  wall === 'north' || wall === 'south' ? s.board.width : s.board.height;

/** The point on the board edge at `along` cells down `wall`. */
function onWall(wall           , along        , s           )        {
  switch (wall) {
    case 'north': return { x: along, y: 0 };
    case 'south': return { x: along, y: s.board.height };
    case 'west': return { x: 0, y: along };
    default: return { x: s.board.width, y: along };
  }
}

/** Where a pin sits: its wall and slot, or null for a board part's pin. */
function slotOf(pin        , s           )                                              {
  const c = s.circuit.component(pin.component);
  if (!c) return null;
  if (c.kind === 'robot') {
    const wall = wallOf(pin.pin);
    return wall ? { wall, slot: pin.pin.startsWith('bumper') ? 'bumper' : 'thruster' } : null;
  }
  return (ROBOT_PARTS                     ).includes(c.kind)
    ? { wall: PART_SIDE[c.kind             ], slot: c.kind              } : null;
}

/**
 * ADR-091: a bench terminal's wall and number: `iK` (a switch) on the west wall, `oK` (a lamp) on the east wall, K 1
 * to 4; null for any other pin.
 */
function terminalOf(pin        , s           )                                              {
  if (s.circuit.component(pin.component)?.kind !== 'chipPins') return null;
  const i = CHIP_INPUT_PINS.indexOf(pin.pin), o = CHIP_OUTPUT_PINS.indexOf(pin.pin);
  if (i >= 0) return { wall: 'west', k: i + 1 };
  return o >= 0 ? { wall: 'east', k: o + 1 } : null;
}

/** The wall a robot, part or bench terminal pin sits on, or null for a board part's pin (ADR-045, ADR-091). */
function wallPinWall(pin        , s           )                   {
  return terminalOf(pin, s)?.wall ?? slotOf(pin, s)?.wall ?? null;
}

/** Centre and wall of one fitted part's frame on the board edge, or null when it is not fitted (ADR-045). */
function partFrame(part           , s           )                                            {
  const wall = PART_SIDE[part];
  const slots = drawnSlots(s)[wall];
  const i = slots.indexOf(part);
  return i < 0 ? null : { wall, centre: onWall(wall, slotCentre(wallLength(wall, s), i, slots.length), s) };
}

/** Board-cell anchor of a robot or part pin on its wall (ADR-045); a bench terminal K at y = 3K (ADR-091). */
function wallPinAnchor(pin        , s           )        {
  const t = terminalOf(pin, s);
  if (t) return onWall(t.wall, 3 * t.k, s);
  const at = slotOf(pin, s);
  if (!at) throw new Error(`${pin.component}.${pin.pin} is not a wall pin`);
  const slots = drawnSlots(s)[at.wall];
  let along = slotCentre(wallLength(at.wall, s), slots.indexOf(at.slot), slots.length);
  if (at.slot !== 'bumper' && at.slot !== 'thruster') {
    const pins = PART_PINS[at.slot];
    if (pins.length > 1) along += (pins.indexOf(pin.pin) === 0 ? -1 : 1) * PART_PIN_OFFSET;
  }
  return onWall(at.wall, along, s);
}

// --- app/geometry.ts
// Pure geometry of the camera (WorldCamera.swift) and the board (SchematicGeometry.swift,
// WallLayout.swift). DOM-free. A placement's size is `footprintOf` and its pins are its circuit's, so a chip (ADR-081,
// ADR-088) anchors, routes and hits like a gate, with one pin per cell row.


             
                                                                                    
                          

// The frame sizes are only read inside `terminalFrameAt`, so the import cycle with interior-parts.ts is harmless.


// MARK: - Camera (WorldCamera.swift)

const VISIBLE_ROWS = 20;
const SHORT_SIDE_CAP = 402;

function cellSize(viewW        , viewH        )         {
  const short = Math.min(viewW, viewH);
  if (!(short > 0)) return 1;
  return Math.max(1, Math.floor(Math.min(short, SHORT_SIDE_CAP) / VISIBLE_ROWS));
}

/**
 * The footprint the camera follows (ADR-064, ADR-070): the standing figure, else the ridden robot (`figure.robot`,
 * else the first), else, without a figure, the first robot.
 */
function cameraTarget(w            )                                         {
  if (w.figure && !w.figure.isRiding) return { anchor: w.figure.position, size: FIGURE_SIZE };
  const robots = robotStates(w);
  const ridden = w.figure?.robot ?? robots[0].model;
  return { anchor: (robots.find((r) => r.model === ridden) ?? robots[0]).position, size: ROBOT_SIZE };
}

function clampAxis(value        , view        , world        )         {
  const middle = world / 2;
  if (!(world > view)) return middle;
  const low = Math.ceil(view / 2);
  const high = Math.floor(world - view / 2);
  if (low > high) return middle;
  return Math.min(Math.max(Math.round(value), low), high);
}

/**
 * Camera centre in screen-space world pixels (y down). The world is the room plus a one-cell edge
 * line on every side, so room cell (x, y) starts at ((x + 1) * c, (y + 1) * c).
 */
function cameraCenter(w            , roomW        , roomH        , c        , viewW        , viewH        ) {
  const t = cameraTarget(w);
  const px = (t.anchor.x + 1 + t.size / 2) * c;
  const py = (t.anchor.y + 1 + t.size / 2) * c;
  return { x: clampAxis(px, viewW, (roomW + 2) * c), y: clampAxis(py, viewH, (roomH + 2) * c) };
}

// MARK: - Board geometry (SchematicGeometry.swift, WallLayout.swift)

const WALL_MARGIN = 32 * (1.6 / 44);

                                               

/**
 * A pin's anchor in board cells: a wall pin's slot; a gate's pin i of n on its side at y + (i + 0.5) × h / n
 * (ADR-057); a chip's pin in its row r (`chipPinRow`) at y + r + 0.5 (ADR-088). Inputs sit on the west edge,
 * outputs on the east edge.
 */
function anchorOf(pin        , s           )        {
  const c = s.circuit.component(pin.component);
  if (!c) throw new Error(`unknown ${pin.component}`);
  const f = footprintOf(s.circuit, pin.component);
  if (!f) return wallPinAnchor(pin, s);
  // Non-null: A part (non wall-mounted) placed in the schematic has a position.
  const p = s.position(pin.component) ;
  const ins = s.circuit.inputPinsOf(pin.component), outs = s.circuit.outputPinsOf(pin.component);
  const chip = s.circuit.chip(pin.component);
  if (chip) {
    const row = chipPinRow(chip, pin.pin) ?? 0;
    return { x: ins.includes(pin.pin) ? p.x : p.x + f.width, y: p.y + row + 0.5 };
  }
  const i = ins.indexOf(pin.pin);
  if (i >= 0) return { x: p.x, y: p.y + ((i + 0.5) * f.height) / ins.length };
  const o = outs.indexOf(pin.pin);
  return { x: p.x + f.width, y: p.y + ((o + 0.5) * f.height) / outs.length };
}

/** The way a wire leaves `pin`: into the board from a wall pin, west from an input, east from an output. */
function exitDirection(pin        , s           )        {
  if (!footprintOf(s.circuit, pin.component)) {
    // Non-null: Components without a footprint are wall-mounted, so their pins have a wall.
    const wall = wallPinWall(pin, s) ;
    return { north: { x: 0, y: 1 }, south: { x: 0, y: -1 }, west: { x: 1, y: 0 }, east: { x: -1, y: 0 } }[wall];
  }
  return s.circuit.pinDirectionOf(pin) === 'input' ? { x: -1, y: 0 } : { x: 1, y: 0 };
}

/**
 * Every pin: board components in placement order, then the robot's wall pins or the bench's eight terminals
 * (ADR-091), then the parts' (ADR-045).
 */
function allPins(s           )           {
  const out           = [];
  for (const pl of s.placements) {
    const id = pl.component.id;
    for (const pin of [...s.circuit.inputPinsOf(id), ...s.circuit.outputPinsOf(id)]) {
      out.push({ component: id, pin });
    }
  }
  for (const c of s.circuit.components) {
    if (c.kind === 'robot') for (const pin of WALL_PINS) out.push({ component: c.id, pin });
    if (c.kind === 'chipPins') {
      for (const pin of [...CHIP_INPUT_PINS, ...CHIP_OUTPUT_PINS]) out.push({ component: c.id, pin });
    }
  }
  for (const part of ROBOT_PARTS) {
    for (const c of s.circuit.components) {
      if (c.kind === part) for (const pin of PART_PINS[part]) out.push({ component: c.id, pin });
    }
  }
  return out;
}

/** True when the axis-aligned segment p-q passes through the inside of a part's footprint. */
function crosses(p       , q       , s           )          {
  const e = 0.05;
  for (const pl of s.placements) {
    // Non-null: Placements only hold parts and chips, which have a footprint.
    const f = footprintOf(s.circuit, pl.component.id) ;
    const x0 = pl.position.x + e, x1 = pl.position.x + f.width - e;
    const y0 = pl.position.y + e, y1 = pl.position.y + f.height - e;
    if (p.y === q.y) {
      if (p.y > y0 && p.y < y1 && Math.max(p.x, q.x) > x0 && Math.min(p.x, q.x) < x1) return true;
    } else if (p.x > x0 && p.x < x1 && Math.max(p.y, q.y) > y0 && Math.min(p.y, q.y) < y1) return true;
  }
  return false;
}

function routeLength(r         )         {
  let n = 0;
  for (let i = 1; i < r.length; i++) n += Math.abs(r[i].x - r[i - 1].x) + Math.abs(r[i].y - r[i - 1].y);
  return n;
}

/**
 * A right-angle trace from an output to an input, in board cells: out of each pin by a short stub,
 * then the shortest of a mid-column route and detours along lanes beside every part that crosses no
 * footprint (a small stand-in for the iOS WireRouting).
 */
function wireRoute(from        , to        , s           )          {
  const a = anchorOf(from, s), b = anchorOf(to, s);
  const da = exitDirection(from, s), db = exitDirection(to, s);
  const stub = 0.6;
  const a1 = { x: a.x + da.x * stub, y: a.y + da.y * stub };
  const b1 = { x: b.x + db.x * stub, y: b.y + db.y * stub };
  const mx = (a1.x + b1.x) / 2, my = (a1.y + b1.y) / 2;
  const candidates            = [
    da.y === 0
      ? [a, a1, { x: mx, y: a1.y }, { x: mx, y: b1.y }, b1, b]
      : [a, a1, { x: a1.x, y: my }, { x: b1.x, y: my }, b1, b],
  ];
  const { width: W, height: H } = s.board;
  const lanesY = [0.3, H - 0.3], lanesX = [0.3, W - 0.3];
  for (const pl of s.placements) {
    // Non-null: Placements only hold parts and chips, which have a footprint.
    const f = footprintOf(s.circuit, pl.component.id) ;
    lanesY.push(pl.position.y - 0.5, pl.position.y + f.height + 0.5);
    lanesX.push(pl.position.x - 0.5, pl.position.x + f.width + 0.5);
  }
  for (const y of lanesY) candidates.push([a, a1, { x: a1.x, y }, { x: b1.x, y }, b1, b]);
  for (const x of lanesX) candidates.push([a, a1, { x, y: a1.y }, { x, y: b1.y }, b1, b]);
  let best                 = null;
  for (const r of candidates) {
    let ok = true;
    for (let i = 1; i < r.length && ok; i++) if (crosses(r[i - 1], r[i], s)) ok = false;
    if (ok && (!best || routeLength(r) < routeLength(best))) best = r;
  }
  return best ?? candidates[0];
}

/**
 * Nearest pin within `radius` cells of `pt`, else the bench terminal whose frame (FRAME_DEPTH × FRAME_LENGTH, centred
 * half a hull margin outside its pin) holds `pt` (ADR-091), or null.
 */
function pinAt(pt       , s           , radius        )                {
  let best                = null;
  let bestD = radius;
  for (const pin of allPins(s)) {
    const a = anchorOf(pin, s);
    const d = Math.hypot(a.x - pt.x, a.y - pt.y);
    if (d <= bestD) {
      bestD = d;
      best = pin;
    }
  }
  return best ?? terminalFrameAt(pt, s);
}

/**
 * ADR-091: the centre of a bench terminal's frame, half a hull margin outside its pin's wall; null for another pin.
 * Drawing (bench-view.ts) and hit-testing (`terminalFrameAt`) both use it.
 */
function terminalFrameCentre(ref        , s           )               {
  const wall = wallPinWall(ref, s);
  if (wall !== 'west' && wall !== 'east') return null;
  const a = anchorOf(ref, s);
  return { x: a.x + (wall === 'west' ? -1 : 1) * (HULL_MARGIN / 2), y: a.y };
}

/** ADR-091: the bench terminal whose frame holds `pt`, or null (a robot board has none). */
function terminalFrameAt(pt       , s           )                {
  const pins = s.circuit.components.find((c) => c.kind === 'chipPins');
  if (!pins) return null;
  for (const pin of [...CHIP_INPUT_PINS, ...CHIP_OUTPUT_PINS]) {
    const ref = { component: pins.id, pin };
    // Non-null: every bench terminal pin sits on the west or east wall.
    const c = terminalFrameCentre(ref, s) ;
    if (Math.abs(pt.x - c.x) <= FRAME_DEPTH / 2 && Math.abs(pt.y - c.y) <= FRAME_LENGTH / 2) return ref;
  }
  return null;
}

/** How many pins have an anchor within `radius` cells of `pt`. */
function pinsNear(pt       , s           , radius        )         {
  let n = 0;
  for (const pin of allPins(s)) {
    const a = anchorOf(pin, s);
    if (Math.hypot(a.x - pt.x, a.y - pt.y) <= radius) n++;
  }
  return n;
}

/**
 * The part under `pt`: the one whose footprint holds it, else (with `minSide` > 0, in cells) the one whose
 * footprint padded to at least `minSide` x `minSide` around its centre holds it, nearest centre first (UX.4).
 */
function componentAt(pt       , s           , minSide = 0)                     {
  let best                     = null;
  let bestD = Infinity;
  for (const pl of s.placements) {
    // Non-null: Placements only hold parts and chips, which have a footprint.
    const f = footprintOf(s.circuit, pl.component.id) ;
    if (pt.x >= pl.position.x && pt.x < pl.position.x + f.width &&
        pt.y >= pl.position.y && pt.y < pl.position.y + f.height) {
      return pl.component.id;
    }
    const cx = pl.position.x + f.width / 2, cy = pl.position.y + f.height / 2;
    const hw = Math.max(f.width, minSide) / 2, hh = Math.max(f.height, minSide) / 2;
    const d = Math.hypot(pt.x - cx, pt.y - cy);
    if (Math.abs(pt.x - cx) <= hw && Math.abs(pt.y - cy) <= hh && d < bestD) {
      bestD = d;
      best = pl.component.id;
    }
  }
  return best;
}

/** Top-left cell for footprint `f` (a toolbox kind's, a placed part's or a chip's) centred under `pt`. */
function dropCell(f           , pt       )               {
  return { x: Math.round(pt.x - f.width / 2), y: Math.round(pt.y - f.height / 2) };
}

function wireIsOn(signals              , from        )          {
  return signals.get(from);
}

// --- app/wire-targets.ts
// Touch wiring geometry of the robot interior (ADR-050): the pins a wire can go to, snapping the wire end, wire
// hit testing on the right-angle routes, a route's midpoint and the magnifier's placement. DOM-free.


                                                                                              

                                           
                                              

/** Magnifier radius and offset in px and its zoom over the board scale (ADR-050). */
const LOUPE = { radius: 56, offset: 96, zoom: 2, minCell: 96 }         ;

/** The magnifier's px per cell: the zoom over the board scale, at least LOUPE.minCell (ADR-087: pins half a cell
 *  apart are then 48 px apart). */
function loupeScale(scale        )         {
  return Math.max(scale * LOUPE.zoom, LOUPE.minCell);
}

/** Pins `from` can be wired to: a cloned session's connect succeeds and changes the schematic (ADR-050). */
function validTargets(session               , from        )           {
  const out           = [];
  for (const p of allPins(session.schematic)) {
    if (samePin(p, from)) continue;
    const trial = session.clone();
    try {
      trial.connect(from, p);
    } catch {
      continue;
    }
    if (trial.schematic !== session.schematic) out.push(p);
  }
  return out;
}

/** Snap radius in cells: max(44 px, 1 cell) at `scale` px per cell (ADR-050). */
function snapRadius(scale        )         {
  return Math.max(44 / scale, 1);
}

/** Nearest target anchor within `radius` cells of `at`; first in `targets` order on a tie; null if none. */
function snapTarget(targets                   , s           , at       , radius        )                {
  let best                = null;
  let bestD = Infinity;
  for (const t of targets) {
    const a = anchorOf(t, s);
    const d = Math.hypot(a.x - at.x, a.y - at.y);
    if (d <= radius && d < bestD) {
      best = t;
      bestD = d;
    }
  }
  return best;
}

/** The point of segment a-b nearest to `pt` (a clamped projection). */
function nearestOnSegment(a       , b       , pt       )        {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  const t = len2 === 0 ? 0 : Math.min(1, Math.max(0, ((pt.x - a.x) * dx + (pt.y - a.y) * dy) / len2));
  return { x: a.x + t * dx, y: a.y + t * dy };
}

/** The point of `route` nearest to `pt` (the first segment's on a tie). */
function nearestOnRoute(route                  , pt       )        {
  let best = route[0];
  let bestD = Math.hypot(best.x - pt.x, best.y - pt.y);
  for (let i = 1; i < route.length; i++) {
    const q = nearestOnSegment(route[i - 1], route[i], pt);
    const d = Math.hypot(q.x - pt.x, q.y - pt.y);
    if (d < bestD) {
      best = q;
      bestD = d;
    }
  }
  return best;
}

/** Distance from `pt` to the nearest point of `route`, in the route's units. */
function distanceToRoute(route                  , pt       )         {
  const q = nearestOnRoute(route, pt);
  return Math.hypot(q.x - pt.x, q.y - pt.y);
}

/** The input pin of the wire whose route is nearest to `pt` within `radius` cells (ties: connection order). */
function wireAt(pt       , s           , radius        )                {
  let best                = null;
  let bestD = Infinity;
  for (const c of s.circuit.connections) {
    const d = distanceToRoute(wireRoute(c.from, c.to, s), pt);
    if (d <= radius && d < bestD) {
      best = c.to;
      bestD = d;
    }
  }
  return best;
}

/** The point at half the route's length (lock mark; Delete without a tap point). */
function routeMidpoint(route                  )        {
  const lengths = route.slice(1).map((p, i) => Math.hypot(p.x - route[i].x, p.y - route[i].y));
  let left = lengths.reduce((n, l) => n + l, 0) / 2;
  for (let i = 0; i < lengths.length; i++) {
    if (left <= lengths[i] && lengths[i] > 0) {
      const t = left / lengths[i], a = route[i], b = route[i + 1];
      return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
    }
    left -= lengths[i];
  }
  return route[route.length - 1];
}

/** The wires leaving `output`, in connection order. */
function wiresFrom(circuit         , output        )               {
  return circuit.connections.filter((c) => samePin(c.from, output));
}

/** The wire into `to`, or null when it is undriven. */
function wireInto(circuit         , to        )                    {
  const from = circuit.driver(to);
  return from ? { from, to } : null;
}

/** Clamps a centre so a circle of radius `r` lies inside [lo, lo + size]; centred when the span is too small. */
function clampCentre(c        , r        , lo        , size        )         {
  if (size < 2 * r) return lo + size / 2;
  return Math.min(Math.max(c, lo + r), lo + size - r);
}

/** Magnifier circle in canvas px: above the finger, else beside it, clamped into `area` (ADR-050). */
function loupePlacement(finger       , area      )                                      {
  const { radius: r, offset } = LOUPE;
  let x = finger.x, y = finger.y - offset;
  if (y - r < area.top) {
    y = finger.y;
    x = finger.x > area.left + area.width / 2 ? finger.x - offset : finger.x + offset;
  }
  return { x: clampCentre(x, r, area.left, area.width), y: clampCentre(y, r, area.top, area.height), r };
}

// --- app/walk-path.ts
// Tap-to-walk (ADR-051, ADR-070, ADR-072, ADR-089): where a tap on the room sends the figure, and this tick's steering
// toward it over the ADR-038 figure anchors, around every robot on the floor (a towed robot is off the grid: no
// target, no obstacle) and the fab console (solid; a tap on it does nothing). DOM-free; imports the core only. Every
// search is recomputed per tick.


                                                                                                               
                                           

/** Where a tap sends the figure (ADR-051, ADR-070): a figure anchor, or into robot `model`. */
                                                                                                       

/** Neighbour order of the searches and the step's tie order (ADR-051). Not `DIRS`: room-view.ts has one. */
const WALK_ORDER                       = ['north', 'east', 'south', 'west'];

const clampInt = (n        , lo        , hi        ) => Math.min(Math.max(n, lo), hi);

/** ADR-072: the robots of `w` on the floor, in robot order (every robot not towed). */
function floorRobots(w            )               {
  return robotStates(w).filter((r) => !isTowed(r));
}

/** Robot `model`'s anchor in `w`, or null when the level has no such robot or it is towed (ADR-072). */
function robotAnchor(w            , model            )                      {
  return floorRobots(w).find((r) => r.model === model)?.position ?? null;
}

/** True when a cell of the footprint at `anchor` is a hatch, so that robot cannot be entered (ADR-038). */
function robotOnHatch(room      , anchor              )          {
  return room.anyCell(CellRect.robot(anchor), (k) => k === 'hatch');
}

/**
 * The walk target of a tap at `p` (room cells), or null when the tap does nothing (ADR-051); a tap on the footprint
 * of a robot not towed targets that robot, or nothing while it stands on a hatch (ADR-070); a tap on a towed robot's
 * footprint targets the floor under it (ADR-072); a tap on the level's fab console `fab` does nothing (ADR-089).
 */
function walkTargetAt(room      , w            , p       , fab             = null)                    {
  const cx = Math.floor(p.x), cy = Math.floor(p.y);
  const k = room.tileXY(cx, cy);
  if (k === null || tileBlocksFigure(k)) return null;
  const cell = new CellRect(cx, cy, 1, 1);
  if (crateBlocks(cell, w.crates) || fabBlocks(cell, fab)) return null;
  const hit = floorRobots(w).find((r) => CellRect.robot(r.position).overlaps(cell));
  if (hit) return robotOnHatch(room, hit.position) ? null : { kind: 'robot', model: hit.model };
  const anchor = {
    x: clampInt(Math.round(p.x - 1), 0, room.width - 2),
    y: clampInt(Math.round(p.y - 1), 0, room.height - 2),
  };
  return { kind: 'cell', anchor };
}

/**
 * ADR-051, ADR-070, ADR-072, ADR-089 free anchor: the figure's footprint at `a` is inside, walkable, off crates,
 * off the fab console `fab` and off every robot not towed.
 */
function figureFree(room      , w            , a              , fab             = null)          {
  return anchorFree(room, w, floorRobots(w).map((r) => CellRect.robot(r.position)), a, fab);
}

/** `figureFree` with the robots' footprints worked out once. */
function anchorFree(
  room      , w            , robots                     , a              , fab            ,
)          {
  const r = CellRect.figure(a);
  return room.containsRect(r) && !room.isRectBlockedForFigure(r) && !crateBlocks(r, w.crates) &&
    !fabBlocks(r, fab) && !robots.some((k) => r.overlaps(k));
}

/**
 * One search's grid: free anchors computed once each (0 unknown, 1 free, 2 blocked), indexed y × width + x, and
 * the footprint of every robot not towed (ADR-072) and the fab console (ADR-089).
 */
                
                                                                                                                
 

function gridOf(room      , w            , fab            )       {
  const size = room.width * room.height;
  const robots = floorRobots(w).map((r) => CellRect.robot(r.position));
  return { room, w, width: room.width, size, free: new Uint8Array(size), robots, fab };
}

/** The index of the free anchor one step from `i` toward `d`, or -1 when that anchor is not free. */
function neighbour(g      , i        , d           )         {
  const a = moved({ x: i % g.width, y: Math.floor(i / g.width) }, d);
  if (a.x < 0 || a.y < 0 || a.x >= g.width || a.y >= g.room.height) return -1;
  const j = a.y * g.width + a.x;
  if (g.free[j] === 0) g.free[j] = anchorFree(g.room, g.w, g.robots, a, g.fab) ? 1 : 2;
  return g.free[j] === 1 ? j : -1;
}

/** Breadth-first steps over free anchors from `sources` (-1: unreached) and the indices in visit order. */
function search(g      , sources                   )                                                          {
  const steps = new Int32Array(g.size).fill(-1);
  const order = new Int32Array(g.size);
  let count = 0;
  for (const s of sources) {
    if (steps[s] !== -1) continue;
    steps[s] = 0;
    order[count++] = s;
  }
  for (let head = 0; head < count; head++) {
    const i = order[head];
    for (const d of WALK_ORDER) {
      const j = neighbour(g, i, d);
      if (j === -1 || steps[j] !== -1) continue;
      steps[j] = steps[i] + 1;
      order[count++] = j;
    }
  }
  return { steps, order, count };
}

/** The forward search from the figure's anchor (ADR-051 "Goal"). */
const reach = (g      , start        ) => search(g, [start]);

/** The multi-source search back from the goal set: each anchor's steps to the nearest goal. */
const distancesFrom = (g      , goals                   ) => search(g, goals).steps;

/** The first direction from anchor `i` whose moved footprint overlaps the robot at `robot`, or null (ADR-070). */
function enteringStep(g      , i        , robot              )                   {
  const a = { x: i % g.width, y: Math.floor(i / g.width) };
  const rect = CellRect.robot(robot);
  return WALK_ORDER.find((d) => CellRect.figure(moved(a, d)).overlaps(rect)) ?? null;
}

/** A cell target's goal: the target anchor when reached, else the nearest reached anchor (then steps, order). */
function cellGoal(g      , anchor              , found                          )         {
  const t = anchor.y * g.width + anchor.x;
  if (found.steps[t] !== -1) return t;
  let best = found.order[0], bestD = Infinity;
  for (let k = 0; k < found.count; k++) {
    const i = found.order[k];
    const dx = i % g.width - anchor.x, dy = Math.floor(i / g.width) - anchor.y;
    // Visit order is by steps, then search order: the first strictly nearer anchor wins ties.
    if (dx * dx + dy * dy < bestD) { best = i; bestD = dx * dx + dy * dy; }
  }
  return best;
}

/**
 * The reached anchors with an entering step into the target robot at `r` (the robot target's goal set, ADR-070);
 * none on a hatch. Only anchors within one step of overlapping that robot can enter, so only that box is scanned.
 */
function robotGoals(g      , found                          , r              )           {
  if (robotOnHatch(g.room, r)) return [];
  const goals           = [];
  for (let y = Math.max(0, r.y - 2); y <= Math.min(g.room.height - 1, r.y + 4); y++) {
    for (let x = Math.max(0, r.x - 2); x <= Math.min(g.width - 1, r.x + 4); x++) {
      const i = y * g.width + x;
      if (found.steps[i] !== -1 && enteringStep(g, i, r) !== null) goals.push(i);
    }
  }
  return goals;
}

/**
 * This tick's steering toward `target`, or null when the walk has no goal or is there (ADR-051); a robot target
 * steers into that robot (ADR-070), none when the level lacks it; the path goes round the fab console `fab`
 * (ADR-089).
 */
function walkStep(room      , w            , target            , fab             = null)                   {
  const f = w.figure;
  if (!f || f.isRiding) return null;
  const robot = target.kind === 'robot' ? robotAnchor(w, target.model) : null;
  if (target.kind === 'robot' && robot === null) return null;
  const g = gridOf(room, w, fab);
  const start = f.position.y * g.width + f.position.x;
  const found = reach(g, start);
  // Non-null: a robot target without its robot returned above.
  const goals = target.kind === 'cell' ? [cellGoal(g, target.anchor, found)] : robotGoals(g, found, robot );
  if (goals.length === 0) return null;
  if (robot !== null && goals.includes(start)) return enteringStep(g, start, robot);
  if (goals.length === 1 && goals[0] === start) return null;
  const dist = distancesFrom(g, goals);
  return WALK_ORDER.find((d) => {
    const j = neighbour(g, start, d);
    return j !== -1 && dist[j] === dist[start] - 1;
  }) ?? null;
}

// --- app/joystick.ts
// The floor joystick (ADR-051): its sizes, the steering direction of a finger offset, its sprint (ADR-055) and the
// knob position.
// DOM-free; room-input.ts feeds it client-pixel offsets from where the pointer went down.

                                                  
                                           

/** Joystick base and knob radii, the dead zone (ADR-051) and the sprint radius (ADR-055), in px. */
const JOYSTICK = { radius: 48, knob: 22, deadZone: 16, sprintRadius: 40 }         ;

/** The steering of a finger offset (dx, dy) px from the base centre: none in the dead zone, else the dominant axis. */
function joystickDirection(dx        , dy        )                   {
  if (!(dx * dx + dy * dy >= JOYSTICK.deadZone * JOYSTICK.deadZone)) return null;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'east' : 'west';
  return dy > 0 ? 'south' : 'north';
}

/** ADR-055: a steering finger offset at least `sprintRadius` px from the base centre sprints. */
function joystickSprints(dx        , dy        )          {
  return joystickDirection(dx, dy) !== null && Math.hypot(dx, dy) >= JOYSTICK.sprintRadius;
}

/** The knob's offset from the base centre: the finger offset clamped to the base radius. */
function knobOffset(dx        , dy        )        {
  const len = Math.hypot(dx, dy);
  if (!(len > JOYSTICK.radius)) return { x: dx, y: dy };
  return { x: (dx * JOYSTICK.radius) / len, y: (dy * JOYSTICK.radius) / len };
}

// --- app/look.ts
// Look mode's view-only state and camera (ADR-094): a camera centre the player pans over the room while the figure and
// the robots go on as they were. DOM-free; the toggle, the keys and the drag handlers are in look-input.ts. Nothing
// here is saved or part of `LevelRun`.

                                                             
                                              

                                           

/**
 * ADR-094: Look mode's state. `screen` and `run` are the ones it was turned on in (`lookStale`); `center` is the
 * camera centre in world cells (pixels / cell size; null until the first pan); `drag` is the pointer panning, in
 * client px (`moved` once it passed the tap slop).
 */
                            
              
                        
                       
                       
                                                                         
 

const LOOK_OFF            = { on: false, screen: null, run: null, center: null, drag: null };

/**
 * The camera centre in world px: `cameraCenter` while Look is off or has not panned yet, else the look centre
 * clamped on each axis as `cameraCenter` clamps (the world is the room plus a one-cell edge).
 */
function lookCamera(
  look           , w            , roomW        , roomH        , c        , vw        , vh        ,
)        {
  if (!look.on || look.center === null) return cameraCenter(w, roomW, roomH, c, vw, vh);
  return {
    x: clampAxis(look.center.x * c, vw, (roomW + 2) * c),
    y: clampAxis(look.center.y * c, vh, (roomH + 2) * c),
  };
}

/**
 * The look centre in cells after the finger moved (dx, dy) client px: the drawn camera `from` (px) moves the
 * opposite way, then clamps on each axis.
 */
function panLook(
  from       , dx        , dy        , roomW        , roomH        , c        , vw        , vh        ,
)        {
  return {
    x: clampAxis(from.x - dx, vw, (roomW + 2) * c) / c,
    y: clampAxis(from.y - dy, vh, (roomH + 2) * c) / c,
  };
}

/** True when Look is on and `screen` or `run` is not the one it was turned on in. */
function lookStale(look           , screen        , run          )          {
  return look.on && (look.screen !== screen || look.run !== run);
}

// --- app/seen.ts
// The seen map of the room and outside views (ADR-098), DOM-free: which world cells (the room plus its one-cell
// edge, ADR-041) have been inside a follow camera's frame (ADR-041), kept per session and level (ADR-095).

                                                          


/** ADR-098: an inclusive span of world cells in room coordinates (x −1 … width, y −1 … height). */
                                                                            

/** A canvas frame: cell size `c` and the offset of the room's outer edge in a vw × vh canvas. */
                                                                             

/** ADR-098: the cells of one level's world (room plus its one-cell edge, ADR-041) the player has seen. */
class SeenCells {
           level       ;
                   width        ;
                   height        ;
                   cells            ;
          seenCount = 0;

  constructor(level       ) {
    this.level = level;
    this.width = level.room.width;
    this.height = level.room.height;
    this.cells = new Uint8Array((this.width + 2) * (this.height + 2));
  }

  /** Marks every cell of `span` (clipped to the world); returns how many were new. */
  mark(span          )         {
    const x0 = Math.max(span.x0, -1), x1 = Math.min(span.x1, this.width);
    const y0 = Math.max(span.y0, -1), y1 = Math.min(span.y1, this.height);
    let added = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = (y + 1) * (this.width + 2) + x + 1;
        if (this.cells[i] === 0) { this.cells[i] = 1; added++; }
      }
    }
    this.seenCount += added;
    return added;
  }

  /** False outside the world. */
  has(x        , y        )          {
    if (x < -1 || y < -1 || x > this.width || y > this.height) return false;
    return this.cells[(y + 1) * (this.width + 2) + x + 1] === 1;
  }

  /** Cells seen. */
  get count()         { return this.seenCount; }

  /** Cells in the world: (width + 2) × (height + 2). */
  get total()         { return (this.width + 2) * (this.height + 2); }
}

/**
 * The world cells any part of which lies inside the frame's vw × vh canvas, where room cell (x, y) starts at
 * ox + (x + 1) c, oy + (y + 1) c; null when none does.
 */
function framedCells(f       , width        , height        )                  {
  const lo = (off        ) => Math.floor(-off / f.c) - 1;
  const hi = (off        , view        ) => Math.ceil((view - off) / f.c) - 2;
  const span = {
    x0: Math.max(lo(f.ox), -1), x1: Math.min(hi(f.ox, f.vw), width),
    y0: Math.max(lo(f.oy), -1), y1: Math.min(hi(f.oy, f.vh), height),
  };
  return span.x0 > span.x1 || span.y0 > span.y1 ? null : span;
}

/**
 * ADR-041: the follow camera's frame of world `w` in a vw × vh canvas: the cell size, then the offsets from
 * `cameraCenter`, rounded as roomFrameOf rounds them (equal to it while Look is off).
 */
function followFrame(w            , width        , height        , vw        , vh        )        {
  const c = cellSize(vw, vh);
  const cam = cameraCenter(w, width, height, c, vw, vh);
  return { c, ox: Math.round(vw / 2 - cam.x), oy: Math.round(vh / 2 - cam.y), vw, vh };
}

/** The runs of unseen cells of row `y` within x0 … x1, as [start, length]. */
function unseenRuns(seen           , y        , x0        , x1        )                     {
  const runs                     = [];
  let start = -1;
  for (let x = x0; x <= x1 + 1; x++) {
    const open = x <= x1 && !seen.has(x, y);
    if (open && start < 0) start = x;
    if (!open && start >= 0) { runs.push([start, x - start]); start = -1; }
  }
  return runs;
}

/**
 * The unseen cells of `span` as rectangles in cells: per row the runs of unseen cells, consecutive rows with the
 * same runs merged; in row-major order of their top-left cell.
 */
function unseenRects(
  seen           , span          ,
)                                                            {
  const all                                                            = [];
  let open = new Map                                                                 ();
  for (let y = span.y0; y <= span.y1; y++) {
    const next = new Map                                                                 ();
    for (const [x, width] of unseenRuns(seen, y, span.x0, span.x1)) {
      const key = `${x}:${width}`;
      const r = open.get(key) ?? { x, y, width, height: 0 };
      if (!open.has(key)) all.push(r);
      r.height++;
      next.set(key, r);
    }
    open = next;
  }
  return all.sort((a, b) => a.y - b.y || a.x - b.x);
}

/** ADR-098: one map per session (keyed by its Player) and level; another Level object starts a new map. */
class SeenStore {
                   maps = new WeakMap                   ();

  /** The map of `owner`'s `level`, a new empty one when it has none or one of another level. */
  of(owner        , level       )            {
    const have = this.maps.get(owner);
    if (have && have.level === level) return have;
    const fresh = new SeenCells(level);
    this.maps.set(owner, fresh);
    return fresh;
  }

  /** `owner`'s map, or null when nothing has marked one. */
  peek(owner        )                   {
    return this.maps.get(owner) ?? null;
  }
}

// --- app/walker.ts
// The tap-to-walk walk (ADR-051) of the Player: its target, stall count and walk timer. Paused, its steps are
// figure moves (ADR-061); running, they are the figure's steering in each tick. DOM-free.

                                                                          

                                                 
                                                

/** ADR-051: a walk ends after this many walk steps in a row in which the figure's anchor did not change. */
const WALK_STALL_TICKS = 3;
const WALK_STEP_MS = 1000 / 15;

/** What a walk needs from the Player that owns it. */
                           
                  
                      
                       
                  
     
                                                                                                                
                                                                                           
     
                           
 

class Walker {
          walking                    = null;
          handle          = null;
          stalled = 0;

          host          ;
          timers        ;

  constructor(host          , timers        ) {
    this.host = host;
    this.timers = timers;
  }

  /** The walk in progress, or null. */
  get target()                    { return this.walking; }

  /** True when the figure can steer and has a first step toward `target`. */
  canStart(target            )          {
    const run = this.host.run();
    return this.host.canSteer() && walkStep(run.level.room, run.world, target, run.level.fab) !== null;
  }

  /** Starts a walk; false and no change when it cannot start. Paused, moves one step at once, then one per 1/15 s. */
  walkTo(target            )          {
    if (!this.canStart(target)) return false;
    this.cancel();
    this.walking = target;
    if (!this.host.isRunning()) {
      this.tick();
      if (this.walking !== null) this.startTimer();
    }
    this.host.changed();
    return true;
  }

  /** One paused walk step (a figure move); ends the walk when running, not walking or the figure cannot steer. */
  tick()       {
    if (this.walking === null || this.host.isRunning() || !this.host.canSteer()) {
      this.cancel();
      return;
    }
    const d = this.nextDirection();
    if (d === null) return;
    const before = this.host.run().world.figure?.position ?? null;
    this.host.move(d);
    this.afterTick(before);
  }

  /** Ends the walk in progress, if any: target, timer and stall count. */
  cancel()       {
    const was = this.walking !== null;
    this.stopTimer();
    this.walking = null;
    this.stalled = 0;
    if (was) this.host.changed();
  }

  /** This step's walk steering; ends the walk (null) when it has no step. */
  nextDirection()                   {
    if (this.walking === null) return null;
    const run = this.host.run();
    const d = walkStep(run.level.room, run.world, this.walking, run.level.fab);
    if (d === null) this.cancel();
    return d;
  }

  /**
   * After a walk step (a paused move or a running tick): ends the walk on riding, on arriving at a cell target's
   * anchor or after WALK_STALL_TICKS steps without moving. A walk to the nearest reachable anchor ends at its next
   * step, which finds no step.
   */
  afterTick(before                     )       {
    const f = this.host.run().world.figure;
    const target = this.walking;
    if (target === null) return;
    if (!f || f.isRiding) { this.cancel(); return; }
    const still = before !== null && before.x === f.position.x && before.y === f.position.y;
    this.stalled = still ? this.stalled + 1 : 0;
    const arrived = target.kind === 'cell' && target.anchor.x === f.position.x && target.anchor.y === f.position.y;
    if (arrived || this.stalled >= WALK_STALL_TICKS) this.cancel();
  }

  stopTimer()       {
    if (this.handle !== null) this.timers.clearTimeout(this.handle);
    this.handle = null;
  }

          startTimer()       {
    this.stopTimer();
    this.handle = this.timers.setTimeout(() => {
      this.handle = null;
      if (this.walking === null || this.host.isRunning()) return;
      this.tick();
      if (this.walking !== null && !this.host.isRunning()) this.startTimer();
    }, WALK_STEP_MS);
  }
}

// --- app/figure-pose.ts
// The Explorer's motion (ADR-056): the app-side move record the Player keeps per tick, and the pose (facing, mode,
// phase) the room view reads from that record and the frame clock. Presentation only: the simulation never reads
// it, and the phase never reads the tick. DOM-free.

                                                               

/** ADR-056: what the figure did so far; changed only by ticks in which a standing figure's anchor changed. */
                               
                                                           
                
                                      
                
                                                                               
                 
                                                                                                   
                    
                                                   
                  
 

                                                 

                                                                                  

/** Cells per stride cycle walking and running (ADR-056). */
const FIGURE_WALK_CYCLE_CELLS = 8, FIGURE_RUN_CYCLE_CELLS = 12;
/** A figure whose moves did not change for this long stands; one idle breath lasts FIGURE_IDLE_PERIOD_MS. */
const FIGURE_STAND_AFTER_MS = 350, FIGURE_IDLE_PERIOD_MS = 2000;

const initialMotion = ()               => ({ moves: 0, cells: 0, stride: 0, facing: 'south', sprint: false });

/** The direction of a one-axis anchor change, or null when it did not change. */
function deltaFacing(dx        , dy        )                   {
  if (dx > 0) return 'east';
  if (dx < 0) return 'west';
  if (dy > 0) return 'south';
  if (dy < 0) return 'north';
  return null;
}

/** ADR-056: the record after one tick; a move only when the figure stood before and after and its anchor changed. */
function nextMotion(
  m              , before                    , after                    , steering                  ,
  sprint         ,
)               {
  if (!before || !after || before.isRiding || after.isRiding) return m;
  const dx = after.position.x - before.position.x, dy = after.position.y - before.position.y;
  const moved = deltaFacing(dx, dy);
  if (moved === null) return m;
  const cells = Math.abs(dx) + Math.abs(dy);
  const cycle = sprint ? FIGURE_RUN_CYCLE_CELLS : FIGURE_WALK_CYCLE_CELLS;
  return {
    moves: m.moves + 1, cells: m.cells + cells, stride: m.stride + cells / cycle, facing: steering ?? moved, sprint,
  };
}

/** The record with the facing turned south (Reset, Exit robot); `moves` stays, so no walk is shown. */
function facingSouth(m              )               {
  return { ...m, facing: 'south', sprint: false };
}

/** When the view last saw `moves` change, on the frame clock. */
                                                         

const unseenMotion = ()             => ({ moves: 0, at: -Infinity });

/**
 * The view's record of `moves` after a frame at `now`: the time moves only when `moves` changes. A count below the
 * seen one is a new Player (a new puzzle): seen as long ago, so it stands.
 */
function observeMoves(seen            , moves        , now        )             {
  if (moves === seen.moves) return seen;
  return { moves, at: moves < seen.moves ? -Infinity : now };
}

const fraction = (n        )         => n - Math.floor(n);

/** ADR-056: mode and phase from the record and the frame clock; reduced motion is always idle at phase 0. */
function figurePose(m              , seen            , now        , reduceMotion         )             {
  if (reduceMotion) return { facing: m.facing, mode: 'idle', phase: 0 };
  if (now - seen.at < FIGURE_STAND_AFTER_MS) {
    return { facing: m.facing, mode: m.sprint ? 'run' : 'walk', phase: fraction(m.stride) };
  }
  return { facing: m.facing, mode: 'idle', phase: fraction(now / FIGURE_IDLE_PERIOD_MS) };
}

// --- app/world-player.ts
// The WorldPlayer port (WorldPlayer.swift): Step/Run/Reset, steering pad, hold repeat and the display
// throttle, plus the tap-to-walk walk (ADR-051), the sprint of a held direction or a far joystick (ADR-055) and
// the figure's move record (ADR-056). Paused, steering moves only the figure, never a tick (ADR-061); running,
// it steers the figure in each tick. DOM-free.


                                                                                              

                                                     

                                                      
                                                 


                         
                                                  
                                      
 

// MARK: - Player (WorldPlayer.swift)

const TICKS_PER_SECOND = 15;
const HOLD_REPEAT_DELAY_MS = 300;
/** UX.19: the interior changes at most 3 times per second while running. */
const DISPLAY_STRIDE = Math.max(1, Math.ceil(TICKS_PER_SECOND / 3));
/** ADR-055: a held direction walks this many held steps (paused moves or running ticks), then sprints. */
const SPRINT_AFTER_HELD_TICKS = 8;

class Player {
  run          ;
  /** What the interior and the robot marks draw; refreshed every DISPLAY_STRIDE running ticks. */
  shownRun          ;
  isRunning = false;
  onChange             = () => {};

          timers        ;
          runHandle          = null;
          holdHandle          = null;
          held                   = null;
          latched                   = null;
          holding                   = null;
          ticksSinceShown = 0;
          walker        ;
  /** ADR-055, ADR-061: steps (paused figure moves or running ticks) steered by the held direction since its press. */
          heldSteps = 0;
  /** ADR-055: the joystick's sprint (true or false while it steers); null: the held-step rule decides. */
          sprintOverride                 = null;
          motionRecord               = initialMotion();
  /** ADR-059, ADR-070: the way each robot's light points, from its shown thrust; north at the start and after Reset. */
           facings = new RobotFacings();

  constructor(run          , timers        ) {
    this.run = run;
    this.shownRun = run.clone();
    this.timers = timers;
    this.walker = new Walker({
      run: () => this.run,
      canSteer: () => this.canSteer,
      isRunning: () => this.isRunning,
      changed: () => this.onChange(),
      move: (d) => this.moveFigure(d, false),
    }, timers);
  }

  get world()             { return this.run.world; }
  /** ADR-059, ADR-070: the first robot's facing. */
  get heading()              { return this.facings.of(this.run.models[0]); }
  get canSteer()          { return this.run.world.figure !== null && !this.run.world.figure.isRiding; }
  get isHolding()          { return this.holding !== null; }
  /** The walk in progress (ADR-051), or null. */
  get walkTarget()                    { return this.walker.target; }
  /** ADR-056: the app-side move record the figure's animation reads; never read by the simulation. */
  get motion()               { return this.motionRecord; }

  /**
   * One paused tick (the `rewired.step()` debug hook), steered by the direction held while paused, if any, never
   * sprinting; it restarts the held-step count (ADR-055, ADR-061).
   */
  step()       {
    if (this.isRunning) return;
    this.walker.cancel();
    this.heldSteps = 0;
    this.advanceTick(this.canSteer ? this.holding : null, false);
    if (!this.canSteer) this.clearSteering();
    this.showNow();
  }

  press(d           )       {
    if (!this.canSteer) return;
    this.walker.cancel();
    this.heldSteps = 0;
    if (this.isRunning) {
      this.held = d;
      this.latched = d;
    } else {
      this.heldStep(d);
      if (this.canSteer) this.startHold(d);
    }
  }

  release(d           )       {
    if (this.held !== d && this.holding !== d) return;
    if (this.held === d) this.held = null;
    if (this.holding === d) this.stopHold();
    this.heldSteps = 0;
    this.sprintOverride = null;
  }

  /**
   * ADR-055: the joystick past (true) or inside (false) its sprint radius decides whether held steps sprint; null
   * (the default, and after a release or clearSteering) leaves it to the held-step count of the pad and keys.
   */
  setSprint(on                )       {
    this.sprintOverride = on;
  }

  exitRobot()       {
    this.run.exitRobot();
    this.clearSteering();
    this.motionRecord = facingSouth(this.motionRecord);
    this.showNow();
  }

  /** ADR-071: stow or take between ticks, then the shown run at once (UI.10); Run keeps running. */
  passItem(action                 , kind          )       {
    if (action === 'stow') this.run.stow(kind); else this.run.take(kind);
    this.showNow();
  }

  /** ADR-021, ADR-073: a fit is an edit: Run pauses, the run fits `part`, then the shown run at once (UI.10). */
  fitPart(part           )       {
    this.setRunning(false);
    this.run.fitPart(part);
    this.showNow();
  }

  /** ADR-021, ADR-073: a remove is an edit: Run pauses, the run removes `part`, then the shown run at once. */
  removePart(part           )       {
    this.setRunning(false);
    this.run.removePart(part);
    this.showNow();
  }

  replaceCircuit(circuit                      )       {
    this.run.replaceCircuit(circuit);
    this.showNow();
  }

  setRunning(on         )       {
    if (on) {
      if (this.runHandle !== null) return;
      if (this.holding) this.held = this.holding;
      this.stopHold();
      this.walker.stopTimer();
      this.isRunning = true;
      const loop = () => {
        this.runningTick();
        if (this.isRunning) this.runHandle = this.timers.setTimeout(loop, 1000 / TICKS_PER_SECOND);
      };
      this.runHandle = this.timers.setTimeout(loop, 1000 / TICKS_PER_SECOND);
      this.onChange();
    } else {
      if (this.runHandle !== null) this.timers.clearTimeout(this.runHandle);
      this.runHandle = null;
      this.isRunning = false;
      this.clearSteering();
      this.showNow();
    }
  }

  reset()       {
    this.setRunning(false);
    this.run.reset();
    this.motionRecord = facingSouth(this.motionRecord);
    this.facings.reset();
    this.showNow();
  }

  /**
   * One running tick with the walk's steering while a walk runs, else the held or latched steering. A held
   * direction counts toward its sprint (ADR-055); a latched tap and a walk never sprint.
   */
  runningTick()       {
    const walking = this.walker.target !== null && this.canSteer;
    const steering = walking ? this.walker.nextDirection() : this.held ?? this.latched;
    const held = !walking && this.canSteer ? this.held : null;
    this.latched = null;
    const items = this.run.world.inventory.length;
    const before = this.run.world.figure?.position ?? null;
    if (held !== null) this.heldStep(held);
    else this.advanceTick(this.canSteer ? steering : null, false);
    if (walking && steering !== null) this.walker.afterTick(before);
    if (!this.canSteer) this.clearSteering();
    this.countShownTick(items);
  }

  /** Starts a walk to `target` (ADR-051); see Walker.walkTo. Ends any hold or latched steering. */
  walkTo(target            )          {
    if (!this.walker.canStart(target)) return false;
    this.held = null;
    this.latched = null;
    this.heldSteps = 0;
    this.stopHold();
    return this.walker.walkTo(target);
  }

  walkTick()       { this.walker.tick(); }

  cancelWalk()       { this.walker.cancel(); }

  /** One paused hold repeat: a figure move in the held direction (ADR-061). */
  holdTick()       {
    const d = this.holding;
    if (d === null || this.isRunning || !this.canSteer) {
      this.stopHold();
      return;
    }
    this.heldStep(d);
  }

  /**
   * The only place that steps the run: one tick, then the move record from the figure before and after it
   * (ADR-056).
   */
          advanceTick(steering                  , sprint         )       {
    const before = this.run.world.figure;
    this.run.step(steering, sprint);
    this.motionRecord = nextMotion(this.motionRecord, before, this.run.world.figure, steering, sprint);
  }

  /**
   * The only place that moves the figure alone (ADR-061): one figure move, the move record as for a tick, and a
   * redraw; the shown run is refreshed only when the move enters the robot or changes the inventory.
   */
          moveFigure(d           , sprint         )       {
    const before = this.run.world.figure;
    const items = this.run.world.inventory.length;
    this.run.moveFigure(d, sprint);
    this.motionRecord = nextMotion(this.motionRecord, before, this.run.world.figure, d, sprint);
    if (!this.canSteer) this.clearSteering();
    if (!this.canSteer || this.run.world.inventory.length !== items) this.showNow();
    else this.onChange();
  }

  /**
   * ADR-055, ADR-061: a step steered by the held direction, a figure move paused and a tick running; it sprints
   * from the ninth or while the joystick sprints.
   */
          heldStep(d           )       {
    const sprint = this.sprintOverride ?? this.heldSteps >= SPRINT_AFTER_HELD_TICKS;
    this.heldSteps += 1;
    if (this.isRunning) this.advanceTick(d, sprint);
    else this.moveFigure(d, sprint);
  }

          startHold(d           )       {
    if (this.holdHandle !== null) this.timers.clearTimeout(this.holdHandle);
    this.holding = d;
    const loop = (wait        ) => {
      this.holdHandle = this.timers.setTimeout(() => {
        if (this.holding === null) return;
        this.holdTick();
        if (this.holding !== null) loop(1000 / TICKS_PER_SECOND);
      }, wait);
    };
    loop(HOLD_REPEAT_DELAY_MS);
  }

          stopHold()       {
    const was = this.holding !== null;
    if (this.holdHandle !== null) this.timers.clearTimeout(this.holdHandle);
    this.holdHandle = null;
    this.holding = null;
    if (was) this.onChange();
  }

          countShownTick(itemsBefore        )       {
    this.ticksSinceShown += 1;
    if (this.ticksSinceShown >= DISPLAY_STRIDE || this.run.world.inventory.length !== itemsBefore) this.showNow();
    else this.onChange();
  }

          showNow()       {
    this.ticksSinceShown = 0;
    this.shownRun = this.run.clone();
    this.facings.refresh(this.shownRun);
    this.onChange();
  }

          clearSteering()       {
    this.held = null;
    this.latched = null;
    this.heldSteps = 0;
    this.sprintOverride = null;
    this.stopHold();
    this.walker.cancel();
  }
}

// --- app/board-editor.ts
// The board editor the robots and the fab's bench share (ADR-091): the selection, the message and the edits every
// board makes (place, place a chip, move, remove, tap-to-wire, connect, cut, delete, Move's lock check) over an
// abstract session, edit, Undo and Redo. The robots' `EditorModel` (editor-model.ts) and the bench's `BenchEditor`
// (bench-editor.ts) extend it. DOM-free.


             
                                                                                  
                          


/** ADR-091: what the board draws and edits; the robots' EditorModel and the fab's BenchEditor extend it. */
class BoardEditor {
  /** The selected part, or null. */
  selectedComponent                     = null;
  /** The pin a tap-to-wire started from, or null (ADR-050). */
  selectedPin                = null;
  /** The selected wire, by its input pin (ADR-050). */
  selectedWire                = null;
  /** The refusal or loop message shown for 4.5 s, or null. */
  message                = null;

  /** ADR-091: the board's session, for reads; edits go through `edit`. */
                                        
  /** ADR-091: whether Undo has an edit to undo. */
                                  
  /** ADR-091: whether Redo has an edit to redo. */
                                  
  /** ADR-091: the board's combinational loops; empty when it compiles. */
                                        
  /** ADR-091: runs one edit; on success records its Undo, on a refusal shows its message; true when it succeeded. */
                                                             
  /** ADR-091: undoes the last edit. */
                        
  /** ADR-091: redoes the last undone edit. */
                        
  /** Redraw after a change that is not an edit (the player's onChange, or the fab's). */
                                     

  clearSelection()       {
    this.selectedComponent = null;
    this.selectedPin = null;
    this.selectedWire = null;
  }

  /** Selects the part `id` (null: none) as the one selection. */
  selectComponent(id                    )       {
    this.clearSelection();
    this.selectedComponent = id;
  }

  /** Selects the wire into `to` as the one selection (ADR-050). */
  selectWire(to        )       {
    this.clearSelection();
    this.selectedWire = to;
  }

  /** Places a `kind` part at `at`, or at the free cell nearest the board's top middle when null, and selects it. */
  place(kind               , at                     )       {
    let id                     = null;
    const ok = this.edit((s) => {
      id = at ? s.place(kind, at) : s.placeNearest(kind, { x: Math.floor(s.schematic.board.width / 2) - 1, y: 1 });
    });
    if (ok) this.selectComponent(id);
  }

  /**
   * ADR-088: places a copy of chip `def` at `at`, or at the free cell nearest the board's top middle when `at` is
   * null (Enter on a drawer button), and selects it; a refusal shows the core's message, as `place` does.
   */
  placeChip(def                , at                     )       {
    let id                     = null;
    const ok = this.edit((s) => {
      const near = { x: Math.floor(s.schematic.board.width / 2) - 1, y: 1 };
      id = at ? s.placeChip(def, at) : s.placeChipNearest(def, near);
    });
    if (ok) this.selectComponent(id);
  }

  move(id             , to              )       {
    this.edit((s) => s.move(id, to));
  }

  remove(id             )       {
    if (this.edit((s) => s.remove(id))) this.clearSelection();
  }

  /**
   * Tap-to-wire: first tap selects a pin, a tap on another pin connects, a second tap on a wired input cuts it;
   * a quick second tap (`doubleTap`) on an output with exactly one wire cuts that wire (ADR-050).
   */
  tapPin(pin        , doubleTap = false)       {
    const sel = this.selectedPin;
    this.selectedComponent = null;
    this.selectedWire = null;
    if (sel === null) {
      this.selectedPin = pin;
      this.message = null;
      this.changed();
      return;
    }
    this.selectedPin = null;
    if (samePin(sel, pin)) {
      const out = wiresFrom(this.session.schematic.circuit, pin);
      if (this.isDrivenInput(pin)) this.edit((s) => s.disconnect(pin));
      else if (doubleTap && out.length === 1) this.edit((s) => s.disconnect(out[0].to));
      else this.changed();
      return;
    }
    this.edit((s) => s.connect(sel, pin));
  }

  connect(a        , b        )       {
    this.selectedPin = null;
    this.edit((s) => s.connect(a, b));
  }

  cutSelectedWire()       {
    const pin = this.selectedPin;
    if (pin && this.isDrivenInput(pin)) {
      this.selectedPin = null;
      this.edit((s) => s.disconnect(pin));
    }
  }

  /**
   * Removes the selected wire, a starting wire included (ADR-053); a refusal keeps it selected and shows the
   * message.
   */
  deleteSelectedWire()       {
    const to = this.selectedWire;
    if (to && this.edit((s) => s.disconnect(to))) this.clearSelection();
  }

  /** Whether the part `id` can be picked up for Move; a locked part shows "That part is locked." (ADR-050). */
  startMove(id             )          {
    if (!this.session.isLocked(id)) return true;
    this.message = 'That part is locked.';
    this.changed();
    return false;
  }

  isDrivenInput(pin        )          {
    return this.session.schematic.circuit.driver(pin) !== null;
  }
}

// --- app/editor-history.ts
// One robot's editor history, split from the EditorModel (ADR-070, ADR-073); the tap-to-wire step and placing a chip
// are `BoardEditor`'s (board-editor.ts, ADR-091). DOM-free.


                                                                         

/**
 * ADR-070: one robot's editor session with its own Undo and Redo stacks; `origin` is the session's starting
 * schematic when the history was made, which a refit matches to the robot's parts (ADR-073).
 */
                                                                                                                  

/** Fresh histories: one session for the run's current robot, or one per robot model. */
function historiesOf(
  sessions                                                        , current            ,
)                                 {
  const all = sessions instanceof Map ? [...sessions] : [[current, sessions                 ]         ];
  return new Map(all.map(([m, session]) => [m, { session, undo: [], redo: [], origin: session.starting }]));
}

/** ADR-073: `h`'s session rebuilt on `eq` (schematic and starting schematic matched to it), Undo and Redo emptied. */
function refitHistory(h               , eq           )       {
  const s = h.session;
  h.session = new EditorSession(s.rules, schematicWithParts(h.origin, eq), schematicWithParts(s.schematic, eq), eq);
  h.undo = [];
  h.redo = [];
}

// --- app/editor-model.ts
// The robots' circuit editor model (CircuitEditorModel): one session with its own Undo and Redo per robot (ADR-064,
// ADR-070), acting on the current robot's (ADR-069), and applying the circuit to the run; a robot's session is
// rebuilt with its parts after a fit, a remove or a Reset that changed them (ADR-073). The selection and the shared
