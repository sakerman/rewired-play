      }
      chars.forEach((ch, x) => {
        const kind = tileFromSymbol(ch);
        if (kind === null) throw worldError('unknownTileSymbol', { symbol: ch, at: { x, y } });
        tiles.push(kind);
      });
    });
    return new Room(width, height, tiles);
  }

          static checkSize(width        , height        )       {
    if (!(width >= 1 && width <= Room.maxSide && height >= 1 && height <= Room.maxSide)) {
      throw worldError('invalidRoomSize', { width, height });
    }
  }

  contains(p              )          {
    return p.x >= 0 && p.x < this.width && p.y >= 0 && p.y < this.height;
  }

  tile(p              )                  {
    return this.tileXY(p.x, p.y);
  }

  tileXY(x        , y        )                  {
    return x >= 0 && x < this.width && y >= 0 && y < this.height ? this.tiles[y * this.width + x] : null;
  }

  isBlocked(p              )          {
    const t = this.tile(p);
    return t === null ? true : tileIsBlocked(t);
  }

  isBlockedForFigure(p              )          {
    const t = this.tile(p);
    return t === null ? true : tileBlocksFigure(t);
  }

  containsRect(r          )          {
    return r.x >= 0 && r.y >= 0 && r.x <= this.width - r.width && r.y <= this.height - r.height;
  }

  /** True when any cell of `r` passes `test`; cells outside the grid pass null. */
  anyCell(r          , test                                 )          {
    for (let cy = r.y; cy < r.maxY; cy++) {
      for (let cx = r.x; cx < r.maxX; cx++) if (test(this.tileXY(cx, cy))) return true;
    }
    return false;
  }

  isRectBlocked(r          )          {
    return this.anyCell(r, (k) => (k === null ? true : tileIsBlocked(k)));
  }

  isRectBlockedForFigure(r          )          {
    return this.anyCell(r, (k) => (k === null ? true : tileBlocksFigure(k)));
  }

  get rows()           {
    const out           = [];
    for (let y = 0; y < this.height; y++) {
      let row = '';
      for (let x = 0; x < this.width; x++) row += SYMBOLS[this.tiles[y * this.width + x]];
      out.push(row);
    }
    return out;
  }

  equals(o      )          {
    return this.width === o.width && this.height === o.height && this.tiles.every((t, i) => t === o.tiles[i]);
  }

  toJSON()            {
    return { schemaVersion: Room.schemaVersion, width: this.width, height: this.height, rows: this.rows };
  }

  static fromJSON(json     )       {
    if (json.schemaVersion !== Room.schemaVersion) throw worldError('unsupportedSchemaVersion', json.schemaVersion);
    return Room.fromSizedRows(json.width, json.height, json.rows);
  }
}

// --- core/items.ts
// Items on the map (ADR-062, ADR-065, ADR-071): the item kinds, floor items and hold entries, the level's item
// validation (after the crates, before the lift) and their JSON. The hold rules are in holds.ts.


                                           

                                                    

/** ADR-062, ADR-071: the item kinds; `crystal` is ADR-034's, `antenna` and `arm` are found parts. */
                                                     

/** ADR-071: every item kind, in the order the app lists kinds in. */
const ITEM_KINDS                      = ['crystal', 'antenna', 'arm'];

/** ADR-071: true when `raw` names an item kind. */
function isItemKind(raw         )                  {
  return typeof raw === 'string' && (ITEM_KINDS                     ).includes(raw);
}

/** ADR-062: the most items in a level. */
const MAX_ITEMS = 16;

/** ADR-062: an item on the floor: its kind and its footprint's anchor (cells, 2 × 2). */
                            
                          
                                  
 

/** ADR-065: one hold slot's item; `kept` when the figure stowed it, so the handover leaves it in the hold. */
                            
                          
                         
 

/**
 * ADR-062 validation after the crates, first fault wins: more than 16 `tooManyItems(16)`; per item in level order
 * `outOfBounds`, `itemNotOnFloor`, `itemOnStart` (`starts`: robot and figure starts), `itemOverlap` (`objects`:
 * the `*` crystal and the crates, then every earlier item), each with the item's position.
 */
function validateItems(
  room      , items                      , starts                     , objects                     ,
)       {
  if (items.length > MAX_ITEMS) throw worldError('tooManyItems', MAX_ITEMS);
  const placed = [...objects];
  for (const { position } of items) {
    const rect = CellRect.item(position);
    if (!room.containsRect(rect)) throw worldError('outOfBounds', position);
    if (room.anyCell(rect, (k) => k !== 'floor')) throw worldError('itemNotOnFloor', position);
    if (starts.some((s) => s.overlaps(rect))) throw worldError('itemOnStart', position);
    if (placed.some((o) => o.overlaps(rect))) throw worldError('itemOverlap', position);
    placed.push(rect);
  }
}

/** ADR-071: a floor item's JSON, `{ kind, position }`. */
function itemJSON(i           )            {
  return { kind: i.kind, position: positionJSON(i.position) };
}

/** ADR-065, ADR-071: a hold entry's JSON, `{ kind, kept }` with `kept` only when true. */
function holdEntryJSON(h           )            {
  return { kept: h.kept ? true : undefined, kind: h.kind };
}

function itemKindFromJSON(raw         )           {
  if (!isItemKind(raw)) throw new GameCoreError('DecodingError', 'dataCorrupted', `Unknown item kind ${String(raw)}`);
  return raw;
}

/**
 * ADR-071: Level JSON `items`; absent is none; not an array is `typeMismatch(items)`; more than 16 is
 * `tooManyItems(16)` before any entry decodes (SEC.4); an unknown kind is `dataCorrupted`.
 */
function itemsFromJSON(json         )              {
  if (json == null) return [];
  if (!Array.isArray(json)) throw new GameCoreError('DecodingError', 'typeMismatch', 'items');
  if (json.length > MAX_ITEMS) throw worldError('tooManyItems', MAX_ITEMS);
  return json.map((i     ) => ({ kind: itemKindFromJSON(i?.kind), position: positionFromJSON(i?.position) }));
}

// --- core/equipment.ts
// Robot equipment and the level data of the robot parts (ADR-029 to ADR-032): `Equipment`, batteries,
// beacons and crates with their validation and JSON, the attach check and the wall-space constants.
// The world rules that use them are in peripherals.ts.


                                                           

                                                      
                                           

                                              

/** Largest battery capacity (ADR-031). */
const BATTERY_MAX_CAPACITY = 9999;
/** Most beacons in a level (ADR-030). */
const MAX_BEACONS = 16;
/** Most crates in a level (ADR-032). */
const MAX_CRATES = 32;

/** ADR-031: capacity 1…9999, start 0…capacity (validated by Level). */
                          
                            
                         
 

/** ADR-030: a level beacon, one cell, range 1…320 cells. */
                         
                                  
                         
 

const typeMismatch = (what        ) => new GameCoreError('DecodingError', 'typeMismatch', what);

/** The robot's fitted parts (ADR-029). Not validated here; Level validates the battery in order. */
class Equipment {
  /** No parts fitted: the level behaves as before ADR-029. */
  static          none = new Equipment();

           antenna         ;
           arm         ;
           battery                ;

  constructor(opts                                                                 = {}) {
    this.antenna = opts.antenna ?? false;
    this.arm = opts.arm ?? false;
    this.battery = opts.battery ?? null;
  }

  /** The fitted parts in the order antenna, battery, arm (ADR-029). */
  get parts()              {
    return ROBOT_PARTS.filter((p) => this.has(p));
  }

  /** True when `part` is fitted. */
  has(part           )          {
    return part === 'antenna' ? this.antenna : part === 'arm' ? this.arm : this.battery !== null;
  }

  get isEmpty()          {
    return this.parts.length === 0;
  }

  /** ADR-066, ADR-073: this equipment with the found part `part` fitted; the battery is never added. */
  with(part                   )            {
    return new Equipment({ antenna: this.antenna || part === 'antenna', arm: this.arm || part === 'arm',
      battery: this.battery });
  }

  /** ADR-066, ADR-073: this equipment without the found part `part`; the battery is never removed. */
  without(part                   )            {
    return new Equipment({ antenna: this.antenna && part !== 'antenna', arm: this.arm && part !== 'arm',
      battery: this.battery });
  }

  /** ADR-073: the same fitted parts (and the same battery). */
  sameParts(o           )          {
    const b = this.battery, c = o.battery;
    const battery = b === null || c === null ? b === c : b.capacity === c.capacity && b.start === c.start;
    return this.antenna === o.antenna && this.arm === o.arm && battery;
  }

  /** `antenna` and `arm` only when true; `battery` with both fields (ADR-029, ADR-031). */
  toJSON()            {
    return {
      antenna: this.antenna ? true : undefined,
      arm: this.arm ? true : undefined,
      battery: this.battery ? { capacity: this.battery.capacity, start: this.battery.start } : undefined,
    };
  }

  /** Missing flags are false; a battery without `start` starts full (ADR-031). */
  static fromJSON(json     )            {
    if (typeof json !== 'object' || json === null || Array.isArray(json)) throw typeMismatch('Equipment');
    const flag = (v         , key        ) => {
      if (v === undefined) return false;
      if (typeof v !== 'boolean') throw typeMismatch(key);
      return v;
    };
    let battery                 = null;
    if (json.battery != null) {
      const capacity = json.battery.capacity;
      if (!Number.isInteger(capacity)) throw typeMismatch('capacity');
      const start = json.battery.start ?? capacity;
      if (!Number.isInteger(start)) throw typeMismatch('start');
      battery = { capacity, start };
    }
    return new Equipment({ antenna: flag(json.antenna, 'antenna'), arm: flag(json.arm, 'arm'), battery });
  }
}

// MARK: - Attach check (ADR-029)

/** A part mismatch between a circuit and the equipment, for the caller's error domain (ADR-029). */
                            
                                                                    
                                                                       
 

/** ADR-029 attach check: null when the circuit's parts match the equipment, else the first fault. */
function partFault(parts                                            , equipment           )                   {
  for (const part of ROBOT_PARTS) {
    const ids = parts[part];
    const fitted = equipment.has(part);
    if (fitted && ids.length === 0) return { code: 'missingPart', detail: part };
    if (!fitted && ids.length > 0) return { code: 'unexpectedPart', detail: { part, ids: [...ids] } };
    if (ids.length > 1) return { code: 'duplicatePart', detail: { part, ids: [...ids] } };
  }
  return null;
}

// MARK: - Wall space (ADR-029)

/** Board cells each wall slot needs along its wall (ADR-029, constant fixed by CHUNK-1.3). */
const WALL_SLOT_CELLS = 3;

/** What sits on an interior wall: the bumper, thruster and periscope, or a fitted part (ADR-029). */
                                                                       

/** Each wall's slots in the exterior design's order, with the fitted parts only (ADR-029). */
function wallSlots(equipment           )                                {
  const fitted = (part           )             => (equipment.has(part) ? [part] : []);
  return {
    north: ['bumper', 'thruster', 'periscope', ...fitted('antenna')],
    east: ['bumper', 'thruster', ...fitted('arm')],
    south: ['bumper', 'thruster', ...fitted('battery')],
    west: ['bumper', 'thruster'],
  };
}

/** The shortest board side along `wall` that holds its slots: slots × `WALL_SLOT_CELLS` (ADR-029). */
function shortestWall(wall           , equipment           )         {
  return wallSlots(equipment)[wall].length * WALL_SLOT_CELLS;
}

const PART_WALL                               = { antenna: 'north', arm: 'east', battery: 'south' };
const WALL_ORDER                       = ['north', 'east', 'south', 'west'];

/** The first wall (north, east, south, west) holding a fitted part that the board is too short for (ADR-029). */
function shortWall(board                                   , equipment           )                   {
  const walls = new Set(equipment.parts.map((p) => PART_WALL[p]));
  for (const wall of WALL_ORDER) {
    if (!walls.has(wall)) continue;
    const side = wall === 'north' || wall === 'south' ? board.width : board.height;
    if (side < shortestWall(wall, equipment)) return wall;
  }
  return null;
}

// MARK: - Level validation (ADR-030 to ADR-032)

/** ADR-031: capacity 1…9999, then start 0…capacity. */
function validateBattery(battery         )       {
  const { capacity, start } = battery;
  if (!Number.isInteger(capacity) || capacity < 1 || capacity > BATTERY_MAX_CAPACITY) {
    throw worldError('batteryCapacityInvalid', capacity);
  }
  if (!Number.isInteger(start) || start < 0 || start > capacity) throw worldError('batteryStartInvalid', start);
}

/** ADR-030: at most 16; each in the given order inside the grid, range 1…320, position unique. */
function validateBeacons(room      , beacons                   )       {
  if (beacons.length > MAX_BEACONS) throw worldError('tooManyBeacons', MAX_BEACONS);
  const seen = new Set        ();
  for (const b of beacons) {
    const p = b.position;
    if (!room.contains(p)) throw worldError('outOfBounds', p);
    if (!Number.isInteger(b.range) || b.range < 1 || b.range > Room.maxSide) throw worldError('beaconRangeInvalid', p);
    const key = `${p.x},${p.y}`;
    if (seen.has(key)) throw worldError('duplicateBeacon', p);
    seen.add(key);
  }
}

/**
 * ADR-032: at most 32; each in ascending (row-major) order inside the room, on floor, off every robot start
 * (ADR-069) and the figure start, off the crystal and off earlier crates. Returns the crates sorted.
 */
function validateCrates(
  room      , crates                         , robot                                , figure                 ,
  crystal                 ,
)                 {
  if (crates.length > MAX_CRATES) throw worldError('tooManyCrates', MAX_CRATES);
  const robots                      = robot instanceof CellRect ? [robot] : robot;
  const sorted = [...crates].sort(comparePositions);
  const placed             = [];
  for (const p of sorted) {
    const c = CellRect.crate(p);
    if (!room.containsRect(c)) throw worldError('outOfBounds', p);
    if (room.anyCell(c, (k) => k !== 'floor')) throw worldError('crateNotOnFloor', p);
    const onStart = robots.some((r) => c.overlaps(r)) || (figure !== null && c.overlaps(figure));
    if (onStart) throw worldError('crateOnStart', p);
    if (crystal !== null && c.overlaps(crystal)) throw worldError('crateOnCrystal', p);
    if (placed.some((o) => c.overlaps(o))) throw worldError('crateOverlap', p);
    placed.push(c);
  }
  return sorted;
}

// MARK: - JSON (ADR-030, ADR-032)

/** `{"position": {...}, "range": n}` (ADR-030). */
function beaconJSON(b        )            {
  return { position: positionJSON(b.position), range: b.range };
}

/** Beacons in the given order; the count is checked before any beacon is decoded (SEC.4). */
function beaconsFromJSON(json         )           {
  if (json == null) return [];
  if (!Array.isArray(json)) throw typeMismatch('beacons');
  if (json.length > MAX_BEACONS) throw worldError('tooManyBeacons', MAX_BEACONS);
  return json.map((b     ) => {
    if (!Number.isInteger(b?.range)) throw typeMismatch('range');
    return { position: positionFromJSON(b.position), range: b.range };
  });
}

/** Crate anchors; the count is checked before any crate is decoded (SEC.4). */
function cratesFromJSON(json         )                 {
  if (json == null) return [];
  if (!Array.isArray(json)) throw typeMismatch('crates');
  if (json.length > MAX_CRATES) throw worldError('tooManyCrates', MAX_CRATES);
  return json.map(positionFromJSON);
}

// --- core/level-robots.ts
// A level's robots and lift (ADR-063, ADR-064, ADR-069): the robot start list in robot order, the robot and lift
// validation in ADR-069's order and their Level JSON keys. level.ts calls these from its constructor and its JSON.


                                           

                                              

                                                    

/**
 * ADR-069: a position is one Scout that is not found (the levels before several robots); a list is sorted into
 * robot order. An empty list is `noRobots`, a model twice `duplicateRobot(model)`.
 */
function robotStartsOf(robotStart                                      )               {
  if (!Array.isArray(robotStart)) return [{ model: 'scout', position: robotStart                , found: false }];
  const robots = [...(robotStart                         )].sort((a, b) => compareRobotModels(a.model, b.model));
  if (robots.length === 0) throw worldError('noRobots');
  for (let i = 1; i < robots.length; i++) {
    if (robots[i].model === robots[i - 1].model) throw worldError('duplicateRobot', robots[i].model);
  }
  return robots;
}

/**
 * ADR-038, ADR-069: each robot start in robot order inside the room (`outOfBounds`), off walls (`blocked`), off
 * hatches (`robotStartOnHatch`) and off every earlier robot (`robotOverlap`), each with its position. Returns the
 * footprints in robot order.
 */
function validateRobots(room      , robots                       )             {
  const rects             = [];
  for (const { position } of robots) {
    const rect = CellRect.robot(position);
    if (!room.containsRect(rect)) throw worldError('outOfBounds', position);
    if (room.isRectBlocked(rect)) throw worldError('blocked', position);
    if (room.anyCell(rect, (k) => k === 'hatch')) throw worldError('robotStartOnHatch', position);
    if (rects.some((r) => r.overlaps(rect))) throw worldError('robotOverlap', position);
    rects.push(rect);
  }
  return rects;
}

/** The footprints a lift must not overlap or sit on (ADR-063). */
                                
                                                
                                       
                                                                     
                                        
 

/**
 * ADR-063 lift validation, each with the lift's position: inside the grid (`outOfBounds`), every cell floor
 * (`liftNotOnFloor`), off every robot and figure start (`liftOnStart`), off the crystal, crates and items
 * (`liftOverlap`).
 */
function validateLift(room      , lift              , obstacles               )       {
  const rect = CellRect.lift(lift);
  if (!room.containsRect(rect)) throw worldError('outOfBounds', lift);
  if (room.anyCell(rect, (k) => k !== 'floor')) throw worldError('liftNotOnFloor', lift);
  if (obstacles.starts.some((s) => s.overlaps(rect))) throw worldError('liftOnStart', lift);
  if (obstacles.objects.some((o) => o.overlaps(rect))) throw worldError('liftOverlap', lift);
}

// MARK: - JSON (ADR-069)

/** The most robots in a level: one per model (ADR-064). */
const MAX_ROBOTS = ROBOT_MODELS.length;

/**
 * ADR-069 Level JSON keys besides `robotStart` (the first robot's position): `robotModel` (not for `scout`),
 * `robotFound` (only when true), `robots` (the others in robot order, omitted with one) and `lift` (omitted without).
 */
function robotsJSON(robots                       , lift                     )                            {
  const [first, ...others] = robots;
  return {
    robotModel: first.model === 'scout' ? undefined : first.model,
    robotFound: first.found ? true : undefined,
    robots: others.length > 0
      ? others.map((r) => ({ found: r.found ? true : undefined, model: r.model, position: positionJSON(r.position) }))
      : undefined,
    lift: lift ? positionJSON(lift) : undefined,
  }                             ;
}

function modelFromJSON(raw         )                      {
  if (!isRobotModel(raw)) {
    throw new GameCoreError('DecodingError', 'dataCorrupted', `Unknown robot model ${String(raw)}`);
  }
  return raw;
}

function foundFromJSON(raw         )          {
  if (raw === undefined) return false;
  if (typeof raw !== 'boolean') throw new GameCoreError('DecodingError', 'typeMismatch', 'found');
  return raw;
}

/** The robots and lift of a Level JSON object; more than 2 other robots is `tooManyRobots(3)` before any decodes. */
function robotsFromJSON(json     )                                                      {
  const first             = {
    model: json.robotModel === undefined ? 'scout' : modelFromJSON(json.robotModel),
    position: positionFromJSON(json.robotStart), found: foundFromJSON(json.robotFound),
  };
  const raw = json.robots;
  if (raw != null && !Array.isArray(raw)) throw new GameCoreError('DecodingError', 'typeMismatch', 'robots');
  if (raw != null && raw.length > MAX_ROBOTS - 1) throw worldError('tooManyRobots', MAX_ROBOTS);
  const others = ((raw ?? [])         ).map((r)             => ({
    model: modelFromJSON(r?.model), position: positionFromJSON(r?.position), found: foundFromJSON(r?.found),
  }));
  return { robots: [first, ...others], lift: json.lift == null ? null : positionFromJSON(json.lift) };
}

// --- core/fab.ts
// The fab console in a level (ADR-082, ADR-089): its 4 × 4 region, the found chips it holds by catalogue name, its
// checks after the lift's, its Level JSON key and its solid rule. level.ts checks and stores it; the robots' blocked
// rule (towing.ts), the walk (figure.ts), Exit robot (world.ts) and a crate's put-down (peripherals.ts) treat it as
// solid; the figure walking into it is reported by `World.enteredFab`.



                                           

                                                       

                                                    

/** ADR-089: the most found chips one console names. */
const FAB_MAX_CHIPS = 4;

/** ADR-082, ADR-089: a fab console: its region's north-west cell and the catalogue names of its found chips. */
                      
                                  
                                    
 

/** ADR-089: what a console must not overlap or sit on, besides walls and other non-floor cells. */
                               
                                                
                                       
                                                           
                                        
                                                 
                                 
 

/**
 * ADR-089, after the lift, first fault wins, each `WorldError` with the console's position: inside the room
 * (`outOfBounds`), every cell floor (`fabNotOnFloor`), off every robot and figure start (`fabOnStart`), off the
 * crystal, crates, floor items and the lift (`fabOverlap`), then at most 4 names, each matching `CHIP_NAME` and listed
 * once (`fabChips`).
 */
function validateFab(room      , fab     , obstacles              )       {
  const p = fab.position;
  const rect = CellRect.fab(p);
  if (!room.containsRect(rect)) throw worldError('outOfBounds', p);
  if (room.anyCell(rect, (k) => k !== 'floor')) throw worldError('fabNotOnFloor', p);
  if (obstacles.starts.some((s) => s.overlaps(rect))) throw worldError('fabOnStart', p);
  const objects = obstacles.lift ? [...obstacles.objects, obstacles.lift] : obstacles.objects;
  if (objects.some((o) => o.overlaps(rect))) throw worldError('fabOverlap', p);
  const names = fab.chips;
  const bad = names.length > FAB_MAX_CHIPS || names.some((n, i) => !CHIP_NAME.test(n) || names.indexOf(n) !== i);
  if (bad) throw worldError('fabChips', p);
}

/** ADR-063, ADR-089: the lift's checks, then the console's with the lift's region among its obstacles. */
function validateLiftAndFab(
  room      , lift                     , fab            , obstacles               ,
)       {
  if (lift) validateLift(room, lift, obstacles);
  if (fab) validateFab(room, fab, { ...obstacles, lift: lift ? CellRect.lift(lift) : null });
}

/** ADR-089: the console's 4 × 4 region, or null without a console. */
function fabRegion(fab            )                  {
  return fab ? CellRect.fab(fab.position) : null;
}

/** ADR-089: true when `rect` overlaps the console of a level; null means the level has none. */
function fabBlocks(rect          , fab            )          {
  return fab !== null && CellRect.fab(fab.position).overlaps(rect);
}

/** ADR-089: `{ chips, position }`, `chips` omitted when the console holds none. */
function fabJSON(fab     )            {
  return { chips: fab.chips.length > 0 ? [...fab.chips] : undefined, position: positionJSON(fab.position) };
}

/**
 * ADR-089: a Level JSON's `fab` value; absent (or null) is no console. Not an object, or `chips` present and not an
 * array of strings, is `DecodingError.typeMismatch("fab")`; the Level checks the rest.
 */
function fabFromJSON(json         )             {
  if (json === undefined || json === null) return null;
  const mismatch = () => new GameCoreError('DecodingError', 'typeMismatch', 'fab');
  if (typeof json !== 'object' || Array.isArray(json)) throw mismatch();
  const raw = json                           ;
  const chips = raw.chips ?? [];
  if (!Array.isArray(chips) || !chips.every((c) => typeof c === 'string')) throw mismatch();
  return { position: positionFromJSON(raw.position), chips: [...chips] };
}

// --- core/plaques.ts
// Diagram plaques (ADR-084, ADR-039, ADR-097): a cell on a wall or floor and a small diagram of up to 4 named wires.
// level.ts checks and stores them after the fab console; `LevelRun.plaqueInReach` reports the one the standing
// figure reads. Plaques are not in the world state, not solid, not seen by bumpers and never change a tick.


                                           

                                                    
                                             

/** ADR-097: the most plaques one level has. */
const PLAQUE_MAX = 4;
/** ADR-097: the most wires one diagram has. */
const PLAQUE_MAX_WIRES = 4;

/** ADR-097: a diagram wire's two ends, from a source to a sink. */
                              
                        
                      
 

/** ADR-097: a plaque: one cell (wall or floor) and its diagram's wire tokens in order, each `<from>><to>`. */
                         
                                  
                                      
 

/** ADR-097: the robot's sources and sinks. */
const PLAQUE_ROBOT_SOURCES = ['bumperN', 'bumperE', 'bumperS', 'bumperW'];
const PLAQUE_ROBOT_SINKS = ['thrusterN', 'thrusterE', 'thrusterS', 'thrusterW', 'grab'];
/** ADR-097: the parts' pins; there is at most one NOT, one flip-flop and one chip. */
const PLAQUE_PART_SOURCES = ['not.out', 'ff.q', 'ff.qBar', 'chip.o1', 'chip.o2'];
const PLAQUE_PART_SINKS = ['not.in', 'ff.s', 'ff.r', 'chip.i1', 'chip.i2'];

/** ADR-097: true for a part's pin end (`not.in`, `ff.q`, ...), false for the robot's own. */
function isPlaquePartEnd(end        )          {
  return end.includes('.');
}

/**
 * ADR-097: one `<from>><to>` token, or null when it has no `>` or more than one, an end is unknown, the wire runs
 * from a sink or into a source, or it joins a part to a part.
 */
function diagramWireOf(token        )                     {
  const ends = token.split('>');
  if (ends.length !== 2) return null;
  const [from, to] = ends;
  const sourceOK = PLAQUE_ROBOT_SOURCES.includes(from) || PLAQUE_PART_SOURCES.includes(from);
  const sinkOK = PLAQUE_ROBOT_SINKS.includes(to) || PLAQUE_PART_SINKS.includes(to);
  if (!sourceOK || !sinkOK) return null;
  if (isPlaquePartEnd(from) && isPlaquePartEnd(to)) return null;
  return { from, to };
}

/** ADR-097: 1 to 4 wires, each valid, each sink driven once. */
function validDiagram(diagram                   )          {
  if (diagram.length < 1 || diagram.length > PLAQUE_MAX_WIRES) return false;
  const sinks = new Set        ();
  for (const token of diagram) {
    const wire = diagramWireOf(token);
    if (wire === null || sinks.has(wire.to)) return false;
    sinks.add(wire.to);
  }
  return true;
}

/**
 * ADR-097, after the fab console, first fault wins: more than 4 plaques `tooManyPlaques(4)`; then per plaque in order
 * `outOfBounds`, `plaqueNotOnWallOrFloor`, `duplicatePlaque`, `plaqueDiagram`, each with the plaque's position.
 */
function validatePlaques(room      , plaques                   )       {
  if (plaques.length > PLAQUE_MAX) throw worldError('tooManyPlaques', PLAQUE_MAX);
  const seen = new Set        ();
  for (const { position: p, diagram } of plaques) {
    if (!room.contains(p)) throw worldError('outOfBounds', p);
    const kind = room.tile(p);
    if (kind !== 'wall' && kind !== 'floor') throw worldError('plaqueNotOnWallOrFloor', p);
    const key = `${p.x},${p.y}`;
    if (seen.has(key)) throw worldError('duplicatePlaque', p);
    seen.add(key);
    if (!validDiagram(diagram)) throw worldError('plaqueDiagram', p);
  }
}

/** ADR-097: the Level JSON `plaques` value, undefined (omitted) when there are none. */
function plaquesJSON(plaques                   )                        {
  if (plaques.length === 0) return undefined;
  return plaques.map((pl) => ({ diagram: [...pl.diagram], position: positionJSON(pl.position) }));
}

/**
 * ADR-097: a Level JSON's `plaques` value; absent (or null) is none. Not an array is
 * `DecodingError.typeMismatch("plaques")`; more than 4 entries is `tooManyPlaques(4)` before any entry is read; per
 * entry in order, not an object is `typeMismatch`, a `diagram` array of more than 4 entries `plaqueDiagram(position)`
 * before its tokens are read, `diagram` not an array of strings `typeMismatch`. These come before the fab console;
 * the Level checks the rest.
 */
function plaquesFromJSON(json         )           {
  if (json === undefined || json === null) return [];
  const mismatch = () => new GameCoreError('DecodingError', 'typeMismatch', 'plaques');
  if (!Array.isArray(json)) throw mismatch();
  if (json.length > PLAQUE_MAX) throw worldError('tooManyPlaques', PLAQUE_MAX);
  return json.map((entry         ) => {
    if (typeof entry !== 'object' || entry === null || Array.isArray(entry)) throw mismatch();
    const raw = entry                           ;
    const diagram = raw.diagram;
    if (Array.isArray(diagram) && diagram.length > PLAQUE_MAX_WIRES) {
      throw worldError('plaqueDiagram', positionFromJSON(raw.position));
    }
    if (!Array.isArray(diagram) || !diagram.every((t) => typeof t === 'string')) throw mismatch();
    return { position: positionFromJSON(raw.position), diagram: [...diagram] };
  });
}

/**
 * ADR-039, ADR-097: the first plaque in level order whose cell the standing figure's footprint overlaps or shares an
 * edge with (a corner does not count); null while the figure rides, without a figure, or with none in reach.
 */
function plaqueInReach(plaques                   , world            )                {
  const figure = world.figure;
  if (figure === null || figure.isRiding) return null;
  const footprint = CellRect.figure(figure.position);
  const reads = (pl        ) => {
    const cell = CellRect.square(pl.position, 1);
    return footprint.overlaps(cell) || footprint.sharesEdge(cell);
  };
  return plaques.find(reads) ?? null;
}

// --- core/level.ts
// Port of GameCore/World, second part: goals and levels (ADR-014, ADR-029 to ADR-038, ADR-062 to ADR-064, ADR-069,
// ADR-071), with goal `leave` for a lift level (ADR-063, ADR-074). Positions, tiles and rooms are in room.ts;
// equipment, beacons and crates in equipment.ts; floor items in items.ts; the robot starts and the lift in
// level-robots.ts; the fab console in fab.ts (ADR-089); the diagram plaques in plaques.ts (ADR-097); the world state
// and its tick in world.ts.



                                             

                                    

                                            
                                           
                                                     

                                           

                                                       
                                              

                                              

// MARK: - Goals and levels

/** ADR-014's goals and ADR-063's `leave` (the figure leaves by the ready lift, ADR-074). */
                                                                                                                       
                               

function goalRank(g      )         {
  return g.kind === 'robotAt' ? 0 : g.kind === 'crystalToFigure' ? 1 : 2;
}

function compareGoals(a      , b      )         {
  if (goalRank(a) !== goalRank(b)) return goalRank(a) - goalRank(b);
  if (a.kind === 'robotAt' && b.kind === 'robotAt') return comparePositions(a.position, b.position);
  return 0;
}

function goalKey(g      )         {
  return g.kind === 'robotAt' ? `robotAt:${g.position.x},${g.position.y}` : g.kind;
}

function goalJSON(g      )            {
  return g.kind === 'robotAt' ? { kind: 'robotAt', position: positionJSON(g.position) } : { kind: g.kind };
}

function goalFromJSON(json     )       {
  if (json.kind === 'robotAt') return { kind: 'robotAt', position: positionFromJSON(json.position) };
  if (json.kind === 'crystalToFigure') return { kind: 'crystalToFigure' };
  if (json.kind === 'leave') return { kind: 'leave' };
  throw new GameCoreError('DecodingError', 'dataCorrupted', `Unknown goal kind ${json.kind}`);
}

                               
                                    
                                
                              
                                                          
                        
                                                    
                              
                                                                
                                   
                                                                   
                             
                                                                    
                               
                                                         
                   
                                                                            
                              
 

/**
 * Checks every goal against the room and returns the goal regions of the `robotAt` goals; `leave` (ADR-063, ADR-074)
 * once, with a lift (`goalNeedsLift`) and a figure start (`goalNeedsFigure`).
 */
function validateGoals(
  room      , goals        , figureStart                     , crystal                     ,
  lift                     ,
)             {
  const seen = new Set        ();
  const regions             = [];
  for (const goal of goals) {
    if (goal.kind === 'robotAt') {
      const p = goal.position;
      const region = CellRect.goal(p);
      if (!room.containsRect(region)) throw worldError('outOfBounds', p);
      if (room.isRectBlocked(region)) throw worldError('blocked', p);
      if (seen.has(goalKey(goal))) throw worldError('duplicateGoal', goal);
      seen.add(goalKey(goal));
      regions.push(region);
    } else if (goal.kind === 'leave') {
      if (seen.has(goalKey(goal))) throw worldError('duplicateGoal', goal);
      seen.add(goalKey(goal));
      if (lift === null) throw worldError('goalNeedsLift');
      if (figureStart === null) throw worldError('goalNeedsFigure');
    } else {
      if (seen.has(goalKey(goal))) throw worldError('duplicateGoal', goal);
      seen.add(goalKey(goal));
      if (crystal === null) throw worldError('goalNeedsCrystal');
      if (figureStart === null) throw worldError('goalNeedsFigure');
    }
  }
  return regions;
}

/** The figure start must fit, be walkable and not overlap a robot start (ADR-069) or a goal region. */
function validateFigure(room      , figureStart              , robots            , regions            )       {
  const f = CellRect.figure(figureStart);
  if (!room.containsRect(f)) throw worldError('outOfBounds', figureStart);
  if (room.isRectBlockedForFigure(f)) throw worldError('blocked', figureStart);
  if (robots.some((r) => f.overlaps(r))) throw worldError('figureOnRobot', figureStart);
  if (regions.some((r) => f.overlaps(r))) throw worldError('figureOnGoal', figureStart);
}

/** The crystal must sit on floor and not on a robot start (ADR-069) or the figure start. */
function validateCrystal(
  room      , crystal              , robots            , figureStart                     ,
)       {
  const c = CellRect.crystal(crystal);
  if (!room.containsRect(c)) throw worldError('outOfBounds', crystal);
  if (room.anyCell(c, (k) => k !== 'floor')) throw worldError('crystalNotOnFloor', crystal);
  const onFigure = figureStart ? c.overlaps(CellRect.figure(figureStart)) : false;
  if (robots.some((r) => c.overlaps(r)) || onFigure) throw worldError('crystalOnStart', crystal);
}

/** ADR-069: per robot in robot order off every goal region (`startOnGoal`), then the figure and crystal starts. */
function validateStarts(
  room      , robots                       , rects            , regions            , opts              ,
)       {
  for (const [i, rect] of rects.entries()) {
    if (regions.some((r) => rect.overlaps(r))) throw worldError('startOnGoal', robots[i].position);
  }
  const figureStart = opts.figureStart ?? null;
  if (figureStart) validateFigure(room, figureStart, rects, regions);
  if (opts.crystal) validateCrystal(room, opts.crystal, rects, figureStart);
}

/**
 * ADR-063, ADR-071: what a lift must avoid: every robot start and the figure start, then the crystal, the crates
 * and the floor items.
 */
function liftObstacles(
  starts            , objects            , items                      ,
)                {
  return { starts, objects: [...objects, ...items.map((i) => CellRect.item(i.position))] };
}

/**
 * ADR-032, ADR-062, ADR-063, ADR-071, ADR-089, ADR-097: the crates, then the floor items, the lift, the fab console
 * and the plaques, first fault wins; returns the crates ascending, the items and the plaques.
 */
function validatePlacements(
  room      , rects            , opts              ,
)                                                                    {
  const figureStart = opts.figureStart ?? null, crystal = opts.crystal ?? null;
  const figure = figureStart ? CellRect.figure(figureStart) : null;
  const crystalRect = crystal ? CellRect.crystal(crystal) : null;
  const crates = validateCrates(room, opts.crates ?? [], rects, figure, crystalRect);
  const starts = figure ? [...rects, figure] : rects;
  const objects = [...(crystalRect ? [crystalRect] : []), ...crates.map((c) => CellRect.crate(c))];
  const items = [...(opts.items ?? [])];
  validateItems(room, items, starts, objects);
  validateLiftAndFab(room, opts.lift ?? null, opts.fab ?? null, liftObstacles(starts, objects, items));
  const plaques = [...(opts.plaques ?? [])];
  validatePlaques(room, plaques);
  return { crates, items, plaques };
}

/**
 * Room, robots (ADR-064, ADR-069), goals, optional figure start, crystal, editor, robot parts and lift; validated
 * (ADR-014, ADR-038).
 */
class Level {
  static          schemaVersion = 2;

           room      ;
  /** ADR-069: every robot of the level in robot order. */
           robots                       ;
  /** The first robot's start (ADR-069). */
           robotStart              ;
           goals        ;
           figureStart                     ;
           crystal                     ;
           editor                    ;
  /** The fitted parts of every robot (ADR-029, ADR-069). */
           equipment           ;
  /** Beacons in the given order (ADR-030). */
           beacons                   ;
  /** Crate anchors, ascending (row-major) (ADR-032). */
           crates                         ;
  /** ADR-063: the lift region's north-west cell, or null. */
           lift                     ;
  /** ADR-062, ADR-071: the floor items in level order. */
           items                      ;
  /** ADR-082, ADR-089: the fab console, or null. */
           fab            ;
  /** ADR-084, ADR-097: the diagram plaques in level order. */
           plaques                   ;

  /**
   * Validates in ADR-069's order, the floor items after the crates and before the lift (ADR-062, ADR-071), the fab
   * console after the lift (ADR-089), the plaques after the fab console (ADR-097); first fault wins. `robotStart` is
   * one Scout's position or a list of robots in any order.
   */
  constructor(room      , robotStart                                      , goals        , opts               = {}) {
    const figureStart = opts.figureStart ?? null;
    const crystal = opts.crystal ?? null;
    if (goals.length === 0) throw worldError('noGoals');
    const robots = robotStartsOf(robotStart);
    const rects = validateRobots(room, robots);
    const regions = validateGoals(room, goals, figureStart, crystal, opts.lift ?? null);
    validateStarts(room, robots, rects, regions, opts);
    const equipment = opts.equipment ?? Equipment.none;
    if (equipment.battery) validateBattery(equipment.battery);
    const beacons = [...(opts.beacons ?? [])];
    validateBeacons(room, beacons);
    const { crates, items, plaques } = validatePlacements(room, rects, opts);
    const lift = opts.lift ?? null, fab = opts.fab ?? null;
    const editor = opts.editor ?? null;
    const wall = editor ? shortWall(editor.rules.board, equipment) : null;
    if (wall) throw new GameCoreError('EditorRulesError', 'boardTooSmallForEquipment', wall);
    this.room = room;
    this.robots = robots;
    this.robotStart = robots[0].position;
    // Swift's `sorted()` is not guaranteed stable, but goals are unique, so order is total.
    this.goals = [...goals].sort(compareGoals);
    this.figureStart = figureStart;
    this.crystal = crystal;
    this.editor = editor;
    this.equipment = equipment;
    this.beacons = beacons;
    this.crates = crates;
    this.lift = lift;
    this.items = items;
    this.fab = fab;
    this.plaques = plaques;
  }

  toJSON()            {
    return {
      schemaVersion: Level.schemaVersion,
      room: this.room.toJSON(),
      robotStart: positionJSON(this.robotStart),
      goals: this.goals.map(goalJSON),
      figureStart: this.figureStart ? positionJSON(this.figureStart) : undefined,
      crystal: this.crystal ? positionJSON(this.crystal) : undefined,
      editor: this.editor ? this.editor.toJSON() : undefined,
      equipment: this.equipment.isEmpty ? undefined : this.equipment.toJSON(),
      beacons: this.beacons.length > 0 ? this.beacons.map(beaconJSON) : undefined,
      crates: this.crates.length > 0 ? this.crates.map(positionJSON) : undefined,
      items: this.items.length > 0 ? this.items.map(itemJSON) : undefined,
      ...robotsJSON(this.robots, this.lift),
      fab: this.fab ? fabJSON(this.fab) : undefined,
      plaques: plaquesJSON(this.plaques),
    };
  }

  /** `editorFromJSON` decodes the optional editor; passed in to keep world.ts free of editor imports. */
  static fromJSON(json     , editorFromJSON                             )        {
    if (json.schemaVersion !== Level.schemaVersion) throw worldError('unsupportedSchemaVersion', json.schemaVersion);
    const room = Room.fromJSON(json.room);
    const { robots, lift } = robotsFromJSON(json);
    const goals = (json.goals         ).map(goalFromJSON);
    const figureStart = json.figureStart == null ? null : positionFromJSON(json.figureStart);
    const crystal = json.crystal == null ? null : positionFromJSON(json.crystal);
    let editor                     = null;
    if (json.editor != null) {
      if (!editorFromJSON) throw new GameCoreError('DecodingError', 'dataCorrupted', 'editor decoder missing');
      editor = editorFromJSON(json.editor);
    }
    const equipment = json.equipment == null ? Equipment.none : Equipment.fromJSON(json.equipment);
    const beacons = beaconsFromJSON(json.beacons);
    const crates = cratesFromJSON(json.crates);
    const items = itemsFromJSON(json.items);
    const fab = fabFromJSON(json.fab);
    const plaques = plaquesFromJSON(json.plaques);
    return new Level(room, robots, goals, {
      figureStart, crystal, editor, equipment, beacons, crates, lift, items, fab, plaques,
    });
  }
}

// --- core/peripherals.ts
// Pure world rules of the robot parts (ADR-030 to ADR-032): beacon reception, battery charge and LOW, the arm's
// reach strip, its crate grab and put-down (never onto the fab console, ADR-089), and crates as obstacles.
// robot-order.ts calls them per robot in ADR-069's step-5 order; towing.ts builds the arm's full turn (items,
// lifting, setting down, ADR-072) on armStep.

                                                      

                                    

                                                    
                                            
                                                            

/** ADR-030: Manhattan cells from a beacon's cell to the nearest cell of the robot footprint at `robot`. */
function beaconDistance(beacon              , robot              )         {
  const last = ROBOT_SIZE - 1;
  const dx = Math.max(0, robot.x - beacon.x, beacon.x - (robot.x + last));
  const dy = Math.max(0, robot.y - beacon.y, beacon.y - (robot.y + last));
  return dx + dy;
}

/** ADR-030: true when some beacon is within its range of the robot footprint at `robot`. */
function hearsBeacon(beacons                   , robot              )          {
  return beacons.some((b) => beaconDistance(b.position, robot) <= b.range);
}

/** ADR-031: LOW is on at or below a quarter of the capacity (integer division), empty included. */
function isBatteryLow(battery         , charge        )          {
  return charge <= Math.floor(battery.capacity / 4);
}

/** ADR-031: one less when any thruster input resolved on (never below 0), then full on a charger. */
function chargeAfterTick(
  battery         , charge        , anyThruster         , robot              , room      ,
)         {
  const drained = anyThruster ? Math.max(0, charge - 1) : charge;
  return room.anyCell(CellRect.robot(robot), (k) => k === 'charger') ? battery.capacity : drained;
}

/** ADR-032: the 1 × 4 strip just beyond the robot's east side (the `bumperE` strip). */
function armReach(robot              )           {
  return new CellRect(robot.x + ROBOT_SIZE, robot.y, 1, ROBOT_SIZE);
}

/** ADR-032: where a held crate is put down, robot + (4, 1). */
function putDownAnchor(robot              )               {
  return { x: robot.x + ROBOT_SIZE, y: robot.y + 1 };
}

/** ADR-032: true when `rect` overlaps a crate in the room; null means the level has no crates. */
function crateBlocks(rect          , crates                                )          {
  return crates !== null && crates.some((c) => CellRect.crate(c).overlaps(rect));
}

/** Inputs of one arm step: this tick's GRAB, committed holding, the room's crates and the state after pickup. */
                               
                         
                            
                               
                                           
                                  
                               
                      
                                  
                                        
                                                
                                      
                                                                                                                      
                                        
                                                                                                          
                                        
                                                                                       
                            
 

/**
 * True when a crate can be put down at `anchor` (ADR-032), off every other robot (ADR-069), item (ADR-071) and the
 * fab console (ADR-089).
 */
function canPutDown(anchor              , input              )          {
  const rect = CellRect.crate(anchor);
  if (!input.room.containsRect(rect) || input.room.anyCell(rect, (k) => k !== 'floor')) return false;
  if (crateBlocks(rect, input.crates) || fabBlocks(rect, input.fab ?? null)) return false;
  const c = input.crystal;
  if (c && !c.isCarried && rect.overlaps(CellRect.crystal(c.position))) return false;
  if ((input.others ?? []).some((o) => rect.overlaps(o))) return false;
  if ((input.items ?? []).some((i) => rect.overlaps(CellRect.item(i.position)))) return false;
  const f = input.figure;
  return !(f && !f.isRiding && rect.overlaps(CellRect.figure(f.position)));
}

/**
 * ADR-032 arm step: GRAB on with an empty arm takes the first crate (ascending) overlapping the reach strip;
 * GRAB off while holding puts the crate down at robot + (4, 1) when that place is free, else keeps it. towing.ts's
 * armTurn calls it for crates only; a towed robot is set down there instead (ADR-072).
 */
function armStep(input              )                                               {
  const crates = [...input.crates];
  if (input.grab && !input.holding) {
    const reach = armReach(input.robot);
    const index = crates.findIndex((c) => CellRect.crate(c).overlaps(reach));
    if (index < 0) return { crates, holding: false };
    crates.splice(index, 1);
    return { crates, holding: true };
  }
  if (!input.grab && input.holding) {
    const anchor = putDownAnchor(input.robot);
    if (!canPutDown(anchor, input)) return { crates, holding: true };
    crates.push(anchor);
    crates.sort(comparePositions);
    return { crates, holding: false };
  }
  return { crates, holding: input.holding };
}

// --- core/figure.ts
// The figure's rules (ADR-027, ADR-033, ADR-038, ADR-055, ADR-061, ADR-064, ADR-069, ADR-072): walking, entering,
// the sprint and leaving sides, among every robot of the level in robot order (a towed robot is neither entered nor
// in the way), the fab console (solid, a step into it reported, ADR-089) and the carried crystal's carrier. Used by
// the world's tick and by a paused figure move (world.ts); the handover is in holds.ts (ADR-040, ADR-071).

                                              

                                        

                                                          


                                                    
                                                            

/** ADR-055: a sprinting figure takes at most this many checked one-cell sub-steps per tick. */
const SPRINT_STEPS = 2;

/** The anchor of the rider and of the carried crystal: robot + (1, 1) (ADR-038). */
function aboard(robot              )               {
  return { x: robot.x + 1, y: robot.y + 1 };
}

/** Exit candidates N, E, S, W (ADR-038). */
function exitCandidates(robot              )                 {
  return [[1, -2], [ROBOT_SIZE, 1], [1, ROBOT_SIZE], [-FIGURE_SIZE, 1]]
    .map(([dx, dy]) => ({ x: robot.x + dx, y: robot.y + dy }));
}

/** ADR-061: every robot standing still (before = after), for a paused figure move. */
function standingMoves(robots                       )              {
  return robots.map((r) => ({ model: r.model, before: r.position, after: r.position, towed: isTowed(r) }));
}

/**
 * The first exit candidate around `robot` whose figure rectangle is free (ADR-038): not blocked by the room, a crate
 * (ADR-032), the fab console (ADR-089) or one of `others` (ADR-069); undefined when none is.
 */
function freeExitSide(
  robot              , level       , crates                         , others                     ,
)                           {
  const free = (rect          ) => !level.room.isRectBlockedForFigure(rect) && !crateBlocks(rect, crates) &&
    !fabBlocks(rect, level.fab) && !others.some((o) => o.overlaps(rect));
  return exitCandidates(robot).find((c) => free(CellRect.figure(c)));
}

/**
 * ADR-069: the index of the robot carrying `crystal`, the one whose anchor + (1, 1) is the crystal's position
 * (no state field); 0 when none matches, as with one robot.
 */
function carrierIndex(robots                         , crystal              )         {
  const i = robots.findIndex((r) => samePosition(aboard(r), crystal.position));
  return i < 0 ? 0 : i;
}

/**
 * Where a robot was before and is after this tick; a paused figure move passes the same anchor twice. `model` names
 * it among several robots (ADR-069); a single move without one is the level's only robot.
 */
                            
                                
                               
                              
                                                                                                               
                           
 

/** ADR-069: the index of the robot a riding figure rides: `figure.robot`, else the first. */
function riddenIndex(robots                      , figure             )         {
  if (figure.robot === undefined) return 0;
  const i = robots.findIndex((r) => r.model === figure.robot);
  return i < 0 ? 0 : i;
}

/** ADR-089: the figure after a walk, and whether a one-cell sub-step of it met the fab console. */
                             
                               
                                                                                                         
                               
 

/**
 * The figure after this tick (ADR-027, ADR-069, ADR-072): riding follows the ridden robot, towed or not; standing
 * walks among every robot's move, given in robot order; a sprint repeats the walk sub-step (ADR-055). A sub-step into
 * `fab`, the console's region, stops the walk there and sets `enteredFab` (ADR-089); riding never does.
 */
function nextFigure(
  figure             , steering                  , sprint         , robot                                  ,
  room      , crates                                , fab                  = null,
)             {
  const robots                       = 'before' in robot ? [robot] : robot;
  if (figure.isRiding) {
    return { figure: { ...figure, position: aboard(robots[riddenIndex(robots, figure)].after) }, enteredFab: false };
  }
  let current             = { figure, enteredFab: false };
  if (steering === null) return current;
  for (let i = 0; i < (sprint ? SPRINT_STEPS : 1); i++) {
    const next = figureSubStep(current.figure, steering, robots, room, crates, fab);
    if (next.enteredFab || next.figure.isRiding || samePosition(next.figure.position, current.figure.position)) {
      return next;
    }
    current = next;
  }
  return current;
}

/**
 * One one-cell walk step of a standing figure (ADR-027, ADR-038, ADR-069, ADR-072, ADR-089): enter the first robot
 * in robot order that is not towed, did not move, is overlapped and has no hatch cell; else stay and mark
 * `enteredFab` when the moved footprint meets the console; else move if free of the room, crates and every robot's
 * new footprint except the towed ones.
 */
function figureSubStep(
  figure             , steering           , robots                      , room      ,
  crates                                , fab                 ,
)             {
  const stay             = { figure, enteredFab: false };
  const target = moved(figure.position, steering);
  const movedRect = CellRect.figure(target);
  const entered = robots.findIndex((r) => !r.towed && samePosition(r.after, r.before) &&
    movedRect.overlaps(CellRect.robot(r.before)) && !room.anyCell(CellRect.robot(r.before), (k) => k === 'hatch'));
  if (entered >= 0) {
    const r = robots[entered];
    const riding              = { position: aboard(r.after), isRiding: true };
    return { figure: entered > 0 && r.model !== undefined ? { ...riding, robot: r.model } : riding, enteredFab: false };
  }
  if (fab && movedRect.overlaps(fab)) return { figure, enteredFab: true };
  if (room.isRectBlockedForFigure(movedRect) || crateBlocks(movedRect, crates)) return stay;
  if (robots.some((r) => !r.towed && movedRect.overlaps(CellRect.robot(r.after)))) return stay;
  return { figure: { position: target, isRiding: false }, enteredFab: false };
}

// --- core/holds.ts
// Holds (ADR-065, ADR-071, ADR-072): a robot's free slots, its pickup of floor items by its footprint and by its
// arm, the handover of its carried `*` crystal and its hold to the figure (a standing figure never meets a towed
// robot), and passing an item between the riding figure and the ridden robot's hold (stow and take). robot-order.ts
// calls the pickup per robot, towing.ts the arm's, world.ts the handover and passing.



                                                                 

                                              

                                                                        

/** A `HoldError` with its code and detail (ADR-065). */
const holdError = (code        , detail          ) => new GameCoreError('HoldError', code, detail);

/** ADR-065, ADR-071: robot `r`'s free slots: capacity minus its hold minus one while it carries the `*` crystal. */
function freeSlots(r            , carriesCrystal         )         {
  return HOLD_CAPACITY[r.model] - (r.hold ?? []).length - (carriesCrystal ? 1 : 0);
}

/**
 * ADR-071: the index in `robots` of the robot carrying the `*` crystal (ADR-069's `carrierIndex`), or -1 when the
 * crystal is not carried.
 */
function crystalCarrier(robots                       , crystal                     )         {
  if (crystal?.isCarried !== true) return -1;
  return carrierIndex(robots.map((r) => r.position), crystal);
}

/**
 * ADR-065, ADR-071 step 5 (2), for one awake robot after its `*` crystal pickup: each floor item in `items` order
 * overlapping its new footprint goes into its hold as `{ kind, kept: false }` while a slot is free; the others stay.
 */
function pickUpItems(r            , items                      , carriesCrystal         ) 
                                            {
  const footprint = CellRect.robot(r.position);
  let free = freeSlots(r, carriesCrystal);
  const hold              = [...(r.hold ?? [])];
  const left              = [];
  for (const item of items) {
    if (free > 0 && footprint.overlaps(CellRect.item(item.position))) {
      hold.push({ kind: item.kind, kept: false });
      free -= 1;
    } else {
      left.push(item);
    }
  }
  return { robot: { ...r, hold }, items: left };
}

/**
 * ADR-065, ADR-072 step 5 (2), the arm with GRAB on and an empty claw: the first item in `items` order overlapping
 * `reach` goes into `r`'s hold as `{ kind, kept: false }` when a slot is free; null when none is taken (the arm turn
 * goes on to lifting).
 */
function takeItemByArm(r            , items                      , reach          , carriesCrystal         ) 
                                                   {
  if (freeSlots(r, carriesCrystal) <= 0) return null;
  const at = items.findIndex((item) => reach.overlaps(CellRect.item(item.position)));
  if (at < 0) return null;
  const hold              = [...(r.hold ?? []), { kind: items[at].kind, kept: false }];
  return { robot: { ...r, hold }, items: items.filter((_, k) => k !== at) };
}

/**
 * ADR-038, ADR-069, ADR-072: the figure meets robot `i` of `robots`: it rides it, or stands with a shared edge and
 * the robot is not towed.
 */
function meets(robots                       , i        , figure             )          {
  if (figure.isRiding) {
    const ridden = figure.robot === undefined ? 0 : robots.findIndex((r) => r.model === figure.robot);
    return Math.max(0, ridden) === i;
  }
  if (robots[i].towedBy !== null && robots[i].towedBy !== undefined) return false;
  return CellRect.figure(figure.position).sharesEdge(CellRect.robot(robots[i].position));
}

/**
 * ADR-040, ADR-065, ADR-071 step 5 (4): per robot in robot order that the figure meets (rides, or a shared edge),
 * its carried `*` crystal, then its hold entries not `kept`, in hold order, appended to `inventory`.
 */
function handOverAll(
  robots                       , figure                    , crystal                     ,
  inventory                     ,
)                                                                                {
  const out = { robots: [...robots], crystal, inventory: [...inventory] };
  if (!figure) return out;
  const carrier = crystalCarrier(robots, crystal);
  for (const [i, r] of robots.entries()) {
    if (!meets(robots, i, figure)) continue;
    if (i === carrier) {
      out.crystal = null;
      out.inventory.push('crystal');
    }
    const hold = r.hold ?? [];
    if (hold.every((h) => h.kept)) continue;
    out.inventory.push(...hold.filter((h) => !h.kept).map((h) => h.kind));
    out.robots[i] = { ...r, hold: hold.filter((h) => h.kept) };
  }
  return out;
}

/**
 * ADR-065, ADR-071: stow or take between ticks; `HoldError.notRiding` (no figure, on foot), then for stow
 * `notInInventory(kind)` and `holdFull`, for take `notInHold(kind)`. Stow moves the first `kind` of the inventory
 * to the end of the ridden robot's hold as kept; take moves the first `kind` of that hold to the end of the
 * inventory. Returns the new state; nothing else changes.
 */
function passItem(s            , action                 , kind          )             {
  const model = riddenModel(s);
  if (model === null) throw holdError('notRiding');
  const all = robotStates(s);
  const i = Math.max(0, all.findIndex((r) => r.model === model));
  const r = all[i];
  const inventory = [...s.inventory];
  const hold = [...r.hold];
  if (action === 'stow') {
    const at = inventory.indexOf(kind);
    if (at < 0) throw holdError('notInInventory', kind);
    if (freeSlots(r, crystalCarrier(all, s.crystal) === i) <= 0) throw holdError('holdFull');
    inventory.splice(at, 1);
    hold.push({ kind, kept: true });
  } else {
    const at = hold.findIndex((h) => h.kind === kind);
    if (at < 0) throw holdError('notInHold', kind);
    hold.splice(at, 1);
    inventory.push(kind);
  }
  all[i] = { ...r, hold };
  return withRobotStates({ ...s, inventory }, all);
}

// --- core/towing.ts
// Towing and the arm's full turn (ADR-065, ADR-072): which robot tows which, the towed robots following their
// towers, the blocked rule every robot moves, senses and sets down by (towed robots are off the grid, a towed rider
// keeps ADR-033's hatch seal, and the fab console blocks like a crate, ADR-089), and the arm turn of step 5 (2): a
// crate, else a floor item into the hold, else another robot lifted; with GRAB off a towed robot set down or a crate
// put down. robot-order.ts calls these per robot in ADR-069's step-5 order; world.ts uses the blocked rule for bumpers
// and Exit robot.


                                        


                                            

                                                          

                                                    
                                                           

/** ADR-065: a towed robot's anchor is its tower's + (4, 0). */
const TOW_OFFSET = { x: 4, y: 0 }         ;

/** ADR-072: the anchor of a robot towed by a tower at `tower`: tower + TOW_OFFSET. */
function towAnchor(tower              )               {
  return { x: tower.x + TOW_OFFSET.x, y: tower.y + TOW_OFFSET.y };
}

/** ADR-072: true when `r` hangs in another robot's claw. */
function isTowed(r            )          {
  return r.towedBy !== null && r.towedBy !== undefined;
}

/** ADR-072: the index of the robot that robot `i` tows, or -1. */
function towedOf(robots                       , i        )         {
  const model = robots[i]?.model;
  return model === undefined ? -1 : robots.findIndex((r) => r.towedBy === model);
}

/** ADR-072: the index of `r`'s tower in `robots`, or -1. */
function towerOf(robots                       , r            )         {
  return isTowed(r) ? robots.findIndex((t) => t.model === r.towedBy) : -1;
}

/** ADR-072 step 5 (1): every towed robot's anchor set to its tower's (new) anchor + TOW_OFFSET. */
function followTowers(robots              )       {
  for (const [j, r] of robots.entries()) {
    const t = towerOf(robots, r);
    if (t >= 0) robots[j] = { ...r, position: towAnchor(robots[t].position) };
  }
}

/**
 * ADR-072 hatch: the committed state's rider sits in a robot that `model` tows, so `model`'s blocked rule also
 * counts a hatch under the towed footprint at its anchor + TOW_OFFSET.
 */
function carriesTowedRider(s            , model            )          {
  const ridden = riddenModel(s);
  if (ridden === null) return false;
  return robotStates(s).some((r) => r.model === ridden && r.towedBy === model);
}

/** True when `rect` overlaps a hatch cell of `room` (ADR-033). */
function hatchUnder(room      , rect          )          {
  return room.anyCell(rect, (k) => k === 'hatch');
}

/**
 * ADR-027, ADR-033, ADR-038, ADR-069, ADR-072, ADR-089: robot `model`'s blocked rule for the footprint at `anchor`:
 * the room, the committed crates, the fab console, the standing figure, `others` (the other robots' footprints, towed
 * robots left out), a hatch for the robot the figure rides, and for a robot towing the ridden robot a hatch under the
 * towed footprint.
 */
function isBlockedFor(
  level       , s            , model            , anchor              , others                     ,
)          {
  const rect = CellRect.robot(anchor);
  const room = level.room;
  if (room.isRectBlocked(rect) || crateBlocks(rect, s.crates) || fabBlocks(rect, level.fab)) return true;
  const f = s.figure;
  if (f && !f.isRiding && rect.overlaps(CellRect.figure(f.position))) return true;
  if (others.some((o) => o.overlaps(rect))) return true;
  if (riddenModel(s) === model && hatchUnder(room, rect)) return true;
  return carriesTowedRider(s, model) && hatchUnder(room, CellRect.robot(towAnchor(anchor)));
}

/** ADR-069, ADR-072: the footprints of every robot in `robots` except the one at `index` and the towed ones. */
function otherFootprints(robots                       , index        )             {
  return robots.filter((r, j) => j !== index && !isTowed(r)).map((r) => CellRect.robot(r.position));
}

/** Inputs of one robot's arm turn (ADR-072). */
                               
                        
                                                                                             
                         
                                                                                                                       
                                
                                   
                     
                         
                                                                                      
                                                  
                                                    
                                       
                                                   
                                        
                                                                               
                                   
                                                                           
                               
 

/** ADR-072: the first other robot in robot order in `i`'s reach, neither towed nor towing nor ridden over a hatch. */
function liftCandidate(input              )         {
  const { robots, i, level, s } = input;
  const tower = robots[i].position;
  const reach = armReach(tower);
  const ridden = riddenModel(s);
  return robots.findIndex((r, j) => j !== i && !isTowed(r) && towedOf(robots, j) < 0 &&
    CellRect.robot(r.position).overlaps(reach) &&
    !(r.model === ridden && hatchUnder(level.room, CellRect.robot(towAnchor(tower)))));
}

/** ADR-072: GRAB off while towing robot `j`: set it down at the tower's anchor + (4, 0) when that footprint is free. */
function setDown(input              , j        )       {
  const { robots, i, level, s } = input;
  const anchor = towAnchor(robots[i].position);
  if (!level.room.containsRect(CellRect.robot(anchor))) return;
  const state = { ...s, crates: input.crates };
  if (isBlockedFor(level, state, robots[j].model, anchor, otherFootprints(robots, j))) return;
  robots[j] = { ...robots[j], position: anchor, towedBy: null };
  robots[i] = { ...robots[i], holding: false };
}

/** ADR-072: GRAB on with an empty claw and no crate taken: an item into the hold, else a robot lifted. */
function takeItemOrLift(input              )              {
  const { robots, i } = input;
  const taken = takeItemByArm(robots[i], input.items, armReach(robots[i].position), input.carriesCrystal);
  if (taken) {
    robots[i] = taken.robot;
    return taken.items;
  }
  const j = liftCandidate(input);
  if (j >= 0) {
    robots[j] = { ...robots[j], towedBy: robots[i].model, position: towAnchor(robots[i].position) };
    robots[i] = { ...robots[i], holding: true };
    input.lifted.add(j);
  }
  return [...input.items];
}

/**
 * ADR-065, ADR-072: robot `i`'s arm turn after its pickups, the level fitting an arm. GRAB on, claw empty: a crate
 * (ADR-032), else the first floor item in reach into a free slot, else the first other robot in robot order in
 * reach, neither towed nor towing (not a ridden one whose lifted footprint meets a hatch). GRAB off and holding: set
 * the towed robot down when free, else put the crate down (ADR-032). Updates `robots`; returns crates and items.
 */
function armTurn(input              )                                                        {
  const { robots, i, grab, crates } = input;
  const r = robots[i];
  const unchanged = () => ({ crates: crates === null ? null : [...crates], items: [...input.items] });
  if (grab === r.holding) return unchanged();
  const towed = towedOf(robots, i);
  if (towed >= 0) {
    setDown(input, towed);
    return unchanged();
  }
  const arm = armStep({
    grab, holding: r.holding, crates: crates ?? [], robot: r.position, room: input.level.room, crystal: input.crystal,
    figure: input.s.figure, others: otherFootprints(robots, i), items: input.items, fab: input.level.fab,
  });
  robots[i] = { ...r, holding: arm.holding };
  const next = crates === null ? null : arm.crates;
  if (!grab || arm.holding) return { crates: next, items: [...input.items] };
  return { crates: next, items: takeItemOrLift(input) };
}

// --- core/arrival.ts
// The state a run starts from and Reset returns to (ADR-067, ADR-074): tick 0 of a level with the level's equipment
// for every robot (every practice level, fixture and trace), or a campaign level's arrival from the carry
// (carry.ts `arrivalOf`). The run's World keeps its arrival (world.ts).

                                                
                                        
                                                          
                                             

/** ADR-067, ADR-074: the state a run starts from and Reset returns to, with each robot's equipment by model. */
                          
                             
                                                         
 

/**
 * The state at tick 0: start positions, found robots asleep (ADR-064), the battery's `start` for every robot (the
 * level's battery; a carried robot's comes with its carry, ADR-074), the level's crates, empty arms (ADR-031,
 * ADR-032), the level's floor items and empty holds (ADR-071).
 */
function initialWorldState(level       )             {
  const charge = level.equipment.battery ? level.equipment.battery.start : null;
  const [first, ...others] = level.robots.map((r)             => ({
    model: r.model, position: r.position, asleep: r.found, charge, holding: false, hold: [], towedBy: null,
  }));
  return {
    robot: first.position,
    model: first.model,
    asleep: first.asleep,
    robots: others,
    solved: false,
    figure: level.figureStart ? { position: level.figureStart, isRiding: false } : null,
    crystal: level.crystal ? { position: level.crystal, isCarried: false } : null,
    inventory: [],
    charge,
    crates: level.crates.length > 0 ? [...level.crates] : null,
    holding: false,
    items: [...level.items],
    hold: [],
    towedBy: null,
  };
}

/** ADR-073: every robot of `level` with the level's equipment, by model in robot order. */
function levelEquipment(level       )                             {
  return new Map(level.robots.map((r) => [r.model, level.equipment]));
}

/** ADR-074: tick 0 with the level's equipment for every robot (every practice level, fixture and trace). */
function levelArrival(level       )          {
  return { state: initialWorldState(level), equipment: levelEquipment(level) };
}

// --- core/lift.ts
// The lift's two rules (ADR-063, ADR-074): when it is ready and when goal `leave` holds. The world evaluates `leave`
// where it evaluates every goal (world.ts `settle`); the app reads `liftReady` to light the lift (app/lift-view.ts).


                                        


                                             

/** ADR-063, ADR-074: a lift, no floor item, the `*` crystal null or carried, and no robot asleep. */
function liftReady(level       , s            )          {
  if (level.lift === null) return false;
  if ((s.items ?? []).length > 0) return false;
  if (s.crystal !== null && !s.crystal.isCarried) return false;
  return robotStates(s).every((r) => !r.asleep);
}

/** ADR-063, ADR-074: ready, and the figure's footprint inside CellRect.lift (on foot or riding). */
function leaveHolds(level       , s            )          {
  if (!s.figure || level.lift === null || !liftReady(level, s)) return false;
  const ridden = riddenModel(s);
  const robot = ridden === null ? null : robotStates(s).find((r) => r.model === ridden);
  const anchor = robot ? aboard(robot.position) : s.figure.position;
  const f = CellRect.figure(anchor), lift = CellRect.lift(level.lift);
  return f.x >= lift.x && f.y >= lift.y && f.maxX <= lift.maxX && f.maxY <= lift.maxY;
}

 * `hold` and `towedBy` are the first robot's in robot order; the others are in `robots` (ADR-064, ADR-071, ADR-072).
 */
                             
                               
                                          
                             
                                                                   
                           
                                                                                  
                                         
                           
                                      
                                        
                                          
                                                                                 
                                 
                                                                                                                
                                                  
                                                                                            
                            
                                                                        
                                       
                                                                            
                                      
                                                                                                        
                                       
 

// MARK: - World

/**
 * A level plus its committed state, each robot's fitted parts (ADR-073: run configuration, not state) and the arrival
 * Reset returns to (ADR-074); `tick` is ADR-010 steps 5 and 6 for the world.
 */
class World {
           level       ;
  /** ADR-074: the state and equipment the run started from and Reset returns to. */
           arrival         ;
  state            ;
          equipment                            ;
  /** ADR-089: set only by `tick` and `moveFigure`; false in a new world, so in every clone. */
          fabEntered = false;

  /**
   * `arrival` defaults to `levelArrival(level)` (tick 0, the level's equipment, ADR-074); `state` and `equipment`
   * default to the arrival's.
   */
  constructor(level       , state             , equipment                                     , arrival          ) {
    this.level = level;
    this.arrival = arrival ?? levelArrival(level);
    this.state = state ?? this.arrival.state;
    this.equipment = new Map(equipment ?? this.arrival.equipment);
  }

  /** A copy with its own state and equipment and the same arrival (ADR-073, ADR-074). */
  clone()        {
    return new World(this.level, this.state, this.equipment, this.arrival);
  }

  /** ADR-089: the last tick or paused move walked the figure on foot into the fab console; false in a clone. */
  get enteredFab()          { return this.fabEntered; }

  /** ADR-073: robot `model`'s fitted parts; the first robot's when the level has no such robot. */
  equipmentOf(model            )            {
    // Non-null: the map holds an entry for every robot of the level, and a level has at least one robot.
    return this.equipment.get(model) ?? this.equipment.get(this.level.robots[0].model) ;
  }

  /** ADR-073: every robot's fitted parts, by model. */
  get equipmentByModel()                                     {
    return this.equipment;
  }

  /** ADR-073: sets robot `model`'s fitted parts; only `Simulation` calls it, between ticks, on a clone. */
  setEquipment(model            , equipment           )       {
    this.equipment = new Map(this.equipment).set(model, equipment);
  }

          get firstModel()             {
    return this.state.model ?? 'scout';
  }

  /** The committed state of robot `model` (ADR-064); the first robot when the level has no such robot. */
  robotState(model            )             {
    const all = robotStates(this.state);
    return all.find((r) => r.model === model) ?? all[0];
  }

  /** The first robot's blocked rule for the footprint at `anchor`, other robots committed (ADR-033, ADR-069). */
  isBlockedForRobot(anchor              )          {
    const all = robotStates(this.state);
    return isBlockedFor(this.level, this.state, all[0].model, anchor, otherFootprints(all, 0));
  }

  /** The first robot's bumper (ADR-012); `bumperOf` is any robot's. */
  isBumperOn(d           )          {
    return this.bumperOf(this.state.model ?? 'scout', d);
  }

  /** ADR-064, ADR-072: robot `model`'s bumper `d`, other robots not towed blocking; a towed robot's are all off. */
  bumperOf(model            , d           )          {
    const all = robotStates(this.state);
    const i = Math.max(0, all.findIndex((r) => r.model === model));
    if (isTowed(all[i])) return false;
    return isBlockedFor(this.level, this.state, all[i].model, moved(all[i].position, d), otherFootprints(all, i));
  }

  /**
   * RX (ADR-030, ADR-073): the antenna fitted to `model` (else the first robot) hears a beacon in range of its
   * committed footprint.
   */
  isAntennaReceiving(model             )          {
    const robot = model === undefined ? this.state.robot : this.robotState(model).position;
    return this.equipmentOf(model ?? this.firstModel).antenna && hearsBeacon(this.level.beacons, robot);
  }

  /** LOW (ADR-031, ADR-073) from the committed charge of `model` (else the first); false without its battery. */
  isBatteryLow(model             )          {
    const battery = this.equipmentOf(model ?? this.firstModel).battery;
    const charge = model === undefined ? this.state.charge : this.robotState(model).charge;
    return battery !== null && charge !== null && isBatteryLow(battery, charge);
  }

  /** HOLD (ADR-032): the first robot's committed arm holds a crate; `holdingOf` is any robot's. */
