  return (x, y) => ({ x: r.x + (x * r.width) / d.width, y: r.y + (y * r.height) / d.height });
}

const gm = (x        , y        )         => ({ op: 'M', pts: [x, y] });
const gl = (x        , y        )         => ({ op: 'L', pts: [x, y] });
const gq = (cx        , cy        , x        , y        )         => ({ op: 'Q', pts: [cx, cy, x, y] });
const GATE_Z         = { op: 'Z', pts: [] };
const stub = (x0        , x1        , y        )           => [gm(x0, y), gl(x1, y)];

/** Body outline in design units (the flip-flop has none: the caller draws a rounded box). */
function gateBodyOps(kind          )           {
  switch (kind) {
    case 'and':
      // One cubic for the half turn: controls 4/3 r beyond the chord give the radius-10 arc.
      return [gm(0, 0), gl(16, 0), { op: 'C', pts: [16 + 40 / 3, 0, 16 + 40 / 3, 20, 16, 20] }, gl(0, 20), GATE_Z];
    case 'or':
      return [gm(0, 0), gq(7, 10, 0, 20), gq(20, 20, 26, 10), gq(20, 0, 0, 0), GATE_Z];
    case 'not':
      return [gm(3, 4), gl(20, 10), gl(3, 16), GATE_Z, { op: 'O', pts: [23, 10, 3] }];
    case 'srFlipFlop':
      return [];
  }
}

/** Short lines from the body to the pin anchors, in design units of the footprint mapping. */
function gateStubOps(kind          )           {
  switch (kind) {
    case 'and': return [...stub(0, 0, 5), ...stub(0, 0, 15), ...stub(26, 32, 10)];
    case 'or': return [...stub(0, 4, 5), ...stub(0, 4, 15), ...stub(26, 32, 10)];
    case 'not': return [...stub(0, 3, 10), ...stub(26, 32, 10)];
    case 'srFlipFlop': return [...stub(0, 0, 10), ...stub(0, 0, 30), ...stub(32, 32, 10), ...stub(32, 32, 30)];
  }
}

/** ADR-054, ADR-087: each stub as a pixel segment at the pin's y, west end first. The pin end lies on footprint
 *  `fp`'s edge: the west end of a stub that starts at design x 0, the east end of one that ends at design x 32. The
 *  other end goes through the symbol box (the body), so a 2 x 1 gate's stubs bridge the 0.2 cell between the
 *  footprint edge and its 1.6 cell wide body. */
function gateStubLines(kind          , fp          )                                          {
  const edge = gateMap(kind, fp), body = gateMap(kind, gateSymbolRect(kind, fp));
  const ops = gateStubOps(kind);
  const lines                                          = [];
  for (let i = 0; i + 1 < ops.length; i += 2) {
    const [ax, ay] = ops[i].pts, [bx] = ops[i + 1].pts;
    lines.push({
      x0: (ax === 0 ? edge : body)(ax, ay).x, x1: (bx === 32 ? edge : body)(bx, ay).x, y: edge(ax, ay).y,
    });
  }
  return lines;
}

/** The flip-flop half that shows its state, in design units of 32 x 40: the top while `q`, else the bottom. */
function flipFlopHalfOps(q         , inset        )           {
  const top = q ? inset : 20, bottom = q ? 20 : 40 - inset;
  return [gm(inset, top), gl(32 - inset, top), gl(32 - inset, bottom), gl(inset, bottom), GATE_Z];
}

/** Outline width of a symbol at `scale` pixels per cell: the design's 1.5 units, never under 1 px. */
const gateOutlineWidth = (scale        )         => Math.max(1, (scale * 1.5 * 3) / 32);
/** Stub width at `scale` pixels per cell, never under 1 px. */
const gateStubWidth = (scale        )         => Math.max(1, scale * 0.1);

/** How a part's mark outline looks; `glyph` is a corner symbol, so no state is told by colour alone (UX.11). */
                                
                          
                
                 
                          
 

/** The mark of a part: refused ghost (loop colour, dotted, ✕), allowed ghost, selected, picked (dashed), loop (⟲). */
function chipMarkStyle(
  ghost                     , selected         , picked         , inLoop         ,
)                       {
  const gold = ghost === 'ok' || selected || picked;
  if (ghost !== 'bad' && !gold && !inLoop) return null;
  const refused = ghost === 'bad';
  return {
    colour: refused || (inLoop && !gold) ? 'loop' : 'gold',
    width: selected || picked ? 3 : 2,
    dash: refused ? [2, 3] : inLoop || picked ? [6, 4] : [],
    glyph: refused ? '✕' : inLoop ? '⟲' : null,
  };
}

// --- app/interior-chips.ts
// Canvas drawing of the logic parts on the interior board (ADR-054): black chips in the standard gate shapes with
// stubs to the pins, the flip-flop's state as a filled half, placed chips as ADR-081's symbol with their number
// (ADR-088, chip-symbol.ts), and selection, picked-up, ghost and loop marks as outlines around the part's space. No
// word is drawn on a part; the canvas description names the parts.


                                                                      


                                                                    

                                                      

                                                     

/**
 * One part to draw: `ghost` marks a drag preview that is valid (`ok`) or refused (`bad`); `picked` the part
 * picked up by the menu's Move (ADR-050); `q` the flip-flop's shown Q signal; `chip` a chip's definition (kind
 * `chip`, ADR-088), else null.
 */
                           
                      
                              
            
            
                    
                             
                   
             
 

/** Replays design-unit path ops on the canvas through `map` (one `beginPath` is the caller's). */
function replayGateOps(ctx                   , ops                   , map                            )       {
  for (const { op, pts } of ops) {
    const a = map(pts[0] ?? 0, pts[1] ?? 0);
    const b = map(pts[2] ?? 0, pts[3] ?? 0), c = map(pts[4] ?? 0, pts[5] ?? 0);
    if (op === 'M') ctx.moveTo(a.x, a.y);
    else if (op === 'L') ctx.lineTo(a.x, a.y);
    else if (op === 'Q') ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
    else if (op === 'C') ctx.bezierCurveTo(a.x, a.y, b.x, b.y, c.x, c.y);
    else if (op === 'O') {
      // A full circle: pts are the centre and the radius, which scales with the horizontal mapping.
      const r = map(pts[2], 0).x - map(0, 0).x;
      ctx.moveTo(a.x + r, a.y);
      ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    } else ctx.closePath();
  }
}

/** The footprint of the part at (x, y) as a pixel rectangle: a chip's from its definition (ADR-081). */
function footprintRect(f            , spec          )           {
  // Non-null: drawChip draws gates (which have a footprint) and chips with their definition.
  const fp = spec.chip ? chipFootprint(spec.chip) : footprint(spec.kind) ;
  return { x: f.X(spec.x), y: f.Y(spec.y), width: fp.width * f.scale, height: fp.height * f.scale };
}

/** Stubs from the body to the pins, in pin colour, on the footprint (so each ends on its pin anchor). */
function drawGateStubs(f            , kind          , fp          )       {
  const { ctx, scale } = f;
  ctx.strokeStyle = C.pinBorder;
  ctx.lineWidth = gateStubWidth(scale);
  ctx.beginPath();
  for (const l of gateStubLines(kind, fp)) {
    ctx.moveTo(l.x0, l.y);
    ctx.lineTo(l.x1, l.y);
  }
  ctx.stroke();
}

/** The flip-flop: a rounded box, its filled half (top while q) and the divider. */
function drawFlipFlopBody(f            , sym          , q         )       {
  const { ctx, scale } = f;
  const map = gateMap('srFlipFlop', sym);
  ctx.beginPath();
  ctx.roundRect(sym.x, sym.y, sym.width, sym.height, sym.width * 0.06);
  ctx.fill();
  const inset = (Math.max(0.5, sym.width * 0.015) * 32) / sym.width;
  ctx.fillStyle = f.theme.text;
  ctx.beginPath();
  replayGateOps(ctx, flipFlopHalfOps(q, inset), map);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(sym.x, sym.y, sym.width, sym.height, sym.width * 0.06);
  ctx.moveTo(sym.x, sym.y + sym.height / 2);
  ctx.lineTo(sym.x + sym.width, sym.y + sym.height / 2);
  ctx.lineWidth = gateOutlineWidth(scale);
  ctx.stroke();
}

/** The flip-flop letters' font size in px at `scale` px per cell. */
const flipFlopFontPx = (scale        ) => Math.max(9, scale * 0.3);

/** Cells from the footprint edge to a letter's centre: 0.45, or further so the glyph clears the pin dot and the
 *  body's outline, which starts 0.2 cell in (ADR-087, UI.11). */
function flipFlopLetterInset(scale        )         {
  const half = flipFlopFontPx(scale) * 0.35; // widest glyph (Q) is about 0.7 em
  const body = gateSymbolRect('srFlipFlop', { x: 0, y: 0, width: 2, height: 2 }).x;
  const clear = body + (gateOutlineWidth(scale) / 2 + half + 0.5) / scale;
  return Math.max(0.45, (pinDrawRadius(scale) + half + 1) / scale, clear);
}

/** S, R, Q and Q̄ at their pins: dark inside the filled half, light elsewhere. */
function drawFlipFlopLetters(f            , spec          )       {
  const { ctx, scale, X, Y } = f;
  // Non-null: srFlipFlop is a part kind and always has a footprint.
  const fp = footprint('srFlipFlop') ;
  ctx.font = `${flipFlopFontPx(scale)}px system-ui, sans-serif`;
  const inset = flipFlopLetterInset(scale);
  ctx.textAlign = 'center';
  const topY = fp.height / 4, bottomY = (3 * fp.height) / 4;
  const letters                                      = [
    ['S', inset, topY, true], ['R', inset, bottomY, false],
    ['Q', fp.width - inset, topY, true], ['Q̄', fp.width - inset, bottomY, false],
  ];
  for (const [text, dx, dy, inTop] of letters) {
    ctx.fillStyle = inTop === spec.q ? f.theme.chip : f.theme.silk;
    ctx.fillText(text, X(spec.x + dx), Y(spec.y + dy), scale * 0.5);
  }
}

/** The gate body at the symbol's box: black chip, white outline; the flip-flop adds its half and letters. */
function drawGateBody(f            , spec          , kind          , fp          )       {
  const { ctx, scale } = f;
  const sym = gateSymbolRect(kind, fp);
  ctx.fillStyle = f.theme.chip;
  ctx.strokeStyle = f.theme.text;
  ctx.lineWidth = gateOutlineWidth(scale);
  ctx.lineJoin = 'round';
  if (kind === 'srFlipFlop') {
    drawFlipFlopBody(f, sym, spec.q);
    drawFlipFlopLetters(f, spec);
    return;
  }
  ctx.beginPath();
  replayGateOps(ctx, gateBodyOps(kind), gateMap(kind, sym));
  ctx.fill();
  ctx.stroke();
}

/** Marks as outlines 0.1 cell outside the footprint: selected, picked up, ghost; a loop is dashed plus a glyph. */
function drawChipMark(f            , fp          , spec          , selected         , inLoop         )       {
  const { ctx, scale } = f;
  const pad = scale * 0.1;
  const style = chipMarkStyle(spec.ghost, selected, !!spec.picked, inLoop);
  if (style === null) return;
  ctx.strokeStyle = style.colour === 'gold' ? C.gold : C.loop;
  ctx.lineWidth = style.width;
  ctx.setLineDash(style.dash);
  ctx.beginPath();
  ctx.roundRect(fp.x - pad, fp.y - pad, fp.width + 2 * pad, fp.height + 2 * pad, scale * 0.15);
  ctx.stroke();
  ctx.setLineDash([]);
  if (style.glyph === null) return;
  ctx.fillStyle = C.loop;
  ctx.textAlign = 'right';
  ctx.font = `700 ${Math.max(10, scale * 0.4)}px system-ui, sans-serif`;
  ctx.fillText(style.glyph, fp.x + fp.width - pad, fp.y + scale * 0.3, scale * 0.6);
}

/** The chip body with its notch cut into the north edge (the hull shows through), filled chip, outlined text. */
function drawChipBody(f            , body          )       {
  const { ctx, scale } = f;
  const k = 0.1 * scale, n = chipNotch(body, scale);
  const right = body.x + body.width, bottom = body.y + body.height;
  ctx.fillStyle = f.theme.chip;
  ctx.strokeStyle = f.theme.text;
  ctx.lineWidth = gateOutlineWidth(scale);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(body.x + k, body.y);
  ctx.lineTo(n.x - n.r, body.y);
  ctx.arc(n.x, n.y, n.r, Math.PI, 0, true);
  ctx.arcTo(right, body.y, right, bottom, k);
  ctx.arcTo(right, bottom, body.x, bottom, k);
  ctx.arcTo(body.x, bottom, body.x, body.y, k);
  ctx.arcTo(body.x, body.y, body.x + k, body.y, k);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

/** ADR-081, ADR-088: a placed chip: its stubs, the body and notch, then its number in silk, at most 2 cells wide. */
function drawChipSymbol(f            , def                , fp          )       {
  const { ctx, scale } = f;
  ctx.strokeStyle = C.pinBorder;
  ctx.lineWidth = gateStubWidth(scale);
  ctx.beginPath();
  for (const l of chipStubLines(def, fp)) {
    ctx.moveTo(l.x0, l.y);
    ctx.lineTo(l.x1, l.y);
  }
  ctx.stroke();
  const body = chipBodyRect(fp);
  drawChipBody(f, body);
  ctx.fillStyle = f.theme.silk;
  ctx.font = `600 ${chipDigitsPx(scale)}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(chipLabel(def), body.x + body.width / 2, body.y + body.height / 2, 2 * scale);
}

/** One part as a gate symbol, or a chip as its chip symbol (ADR-088), with its stubs and marks. */
function drawChip(f            , v             , loops             , spec          )       {
  const { ctx } = f;
  const { kind, id } = spec;
  if (!isGateKind(kind) && !spec.chip) return;
  const fp = footprintRect(f, spec);
  const selected = id !== null && v.game.editor.selectedComponent === id;
  ctx.globalAlpha = spec.ghost || spec.picked ? 0.6 : 1;
  if (spec.chip) drawChipSymbol(f, spec.chip, fp);
  else if (isGateKind(kind)) {
    drawGateStubs(f, kind, fp);
    drawGateBody(f, spec, kind, fp);
  }
  drawChipMark(f, fp, spec, selected, id !== null && loops.has(id));
  ctx.globalAlpha = 1;
}

// --- app/plaque-box.ts
// The diagram plaque's box (ADR-084, ADR-039, ADR-097): shown in the room view while the standing figure reads a
// plaque, centred below the top corner groups, a canvas with the diagram in the board's own symbols on Scout's hull
// (ADR-049's wall symbols, ADR-054's NOT and flip-flop, ADR-081's chip mark, ADR-071's arm icon), all unlit. No words
// on screen: its `aria-label` is the description, announced when a plaque comes into reach. Called from chrome.ts.




                                                          




                                                                        

                                                     

                                                    

/** What the box remembers between updates: the plaque shown (`x,y`) and the key of the last painted canvas. */
                                 
                       
                         
 

/** ADR-097: the box's rim, the gap below the top groups and the least side inset, in CSS px. */
const PLAQUE_RIM = 2;
const PLAQUE_TOP_GAP = 8;
const PLAQUE_SIDE = 14;

/**
 * ADR-097: the box's CSS size (rim included) for `layout` in a `view`: height clamp(72, 24vh, 128), the width the
 * drawing's at that height, at most the view less twice the larger of 14 px and each side inset, scaled down with
 * the aspect kept when wider.
 */
function plaqueBoxSize(
  layout                                   , view                                   ,
  insets                                 ,
)                                    {
  const height = Math.min(128, Math.max(72, 0.24 * view.height));
  const aspect = layout.width / layout.height;
  const maxWidth = view.width - 2 * Math.max(PLAQUE_SIDE, insets.left, insets.right);
  const inner = height - 2 * PLAQUE_RIM;
  const width = inner * aspect + 2 * PLAQUE_RIM;
  if (width <= maxWidth) return { width, height };
  return { width: maxWidth, height: (maxWidth - 2 * PLAQUE_RIM) / aspect + 2 * PLAQUE_RIM };
}

/** The drawing's frame on the canvas: px per design unit and the offset of the design origin, in CSS px. */
                                                                                          

const plaqueX = (f             , x        ) => f.ox + x * f.s;
const plaqueY = (f             , y        ) => f.oy + y * f.s;

/** Replays design-unit gate ops mapped by `map` (one `beginPath` is the caller's). */
function plaqueReplay(ctx                          , ops                   , map                            )       {
  for (const { op, pts } of ops) {
    const a = map(pts[0] ?? 0, pts[1] ?? 0), b = map(pts[2] ?? 0, pts[3] ?? 0), c = map(pts[4] ?? 0, pts[5] ?? 0);
    if (op === 'M') ctx.moveTo(a.x, a.y);
    else if (op === 'L') ctx.lineTo(a.x, a.y);
    else if (op === 'Q') ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
    else if (op === 'C') ctx.bezierCurveTo(a.x, a.y, b.x, b.y, c.x, c.y);
    else if (op === 'O') {
      const r = map(pts[2], 0).x - map(0, 0).x;
      ctx.moveTo(a.x + r, a.y);
      ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    } else ctx.closePath();
  }
}

/** A symbol's box in canvas px. */
function plaqueBoxPx(f             , sym               )           {
  return { x: plaqueX(f, sym.x), y: plaqueY(f, sym.y), width: sym.width * f.s, height: sym.height * f.s };
}

/** Horizontal stubs in the pin colour. */
function plaqueStubs(f             , lines                                                  )       {
  const { ctx } = f;
  ctx.strokeStyle = PLAQUE_COLOURS.pin;
  ctx.lineWidth = Math.max(1, f.s * 0.1);
  ctx.beginPath();
  for (const l of lines) {
    ctx.moveTo(l.x0, l.y);
    ctx.lineTo(l.x1, l.y);
  }
  ctx.stroke();
}

/** ADR-049: an unlit bumper or thruster in its dashed frame, turned to its wall. */
function plaqueWallSymbol(f             , sym                                           )       {
  const { ctx } = f;
  const d = FRAME_DEPTH * f.s, len = FRAME_LENGTH * f.s;
  ctx.save();
  ctx.translate(plaqueX(f, sym.x + sym.width / 2), plaqueY(f, sym.y + sym.height / 2));
  ctx.rotate(WALL_ANGLE[sym.wall]);
  ctx.strokeStyle = PLAQUE_COLOURS.line;
  ctx.lineWidth = Math.max(1, d / 30);
  ctx.setLineDash([Math.max(2, d / 11), Math.max(1.5, d / 15)]);
  ctx.beginPath();
  ctx.roundRect(-len / 2, -d / 2, len, d, f.s * 0.15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.scale(d, d);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const paths               = sym.kind === 'bumper' ? bumperPaths(false) : thrusterPaths(false);
  for (const path of paths) {
    ctx.beginPath();
    for (const { op, pts } of path.ops) {
      if (op === 'M') ctx.moveTo(pts[0], pts[1]);
      else if (op === 'L') ctx.lineTo(pts[0], pts[1]);
      else if (op === 'Q') ctx.quadraticCurveTo(pts[0], pts[1], pts[2], pts[3]);
      else ctx.closePath();
    }
    ctx.lineWidth = strokeWidth(path.weight, d) / d;
    ctx.stroke();
  }
  ctx.restore();
}

/** ADR-054: the NOT with its stubs, filled and outlined. */
function plaqueNot(f             , fp          )       {
  const { ctx } = f;
  plaqueStubs(f, gateStubLines('not', fp));
  ctx.fillStyle = PLAQUE_COLOURS.fill;
  ctx.strokeStyle = PLAQUE_COLOURS.line;
  ctx.lineWidth = Math.max(1, (f.s * 1.5 * 3) / 32);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  plaqueReplay(ctx, gateBodyOps('not'), gateMap('not', gateSymbolRect('not', fp)));
  ctx.fill();
  ctx.stroke();
}

/** ADR-054: the flip-flop's box and divider with no half filled, and its pin letters S, R, Q and Q̄. */
function plaqueFlipFlop(f             , fp          )       {
  const { ctx, s } = f;
  plaqueStubs(f, gateStubLines('srFlipFlop', fp));
  const sym = gateSymbolRect('srFlipFlop', fp);
  ctx.fillStyle = PLAQUE_COLOURS.fill;
  ctx.strokeStyle = PLAQUE_COLOURS.line;
  ctx.lineWidth = Math.max(1, (s * 1.5 * 3) / 32);
  ctx.beginPath();
  ctx.roundRect(sym.x, sym.y, sym.width, sym.height, sym.width * 0.06);
  ctx.fill();
  ctx.moveTo(sym.x, sym.y + sym.height / 2);
  ctx.lineTo(sym.x + sym.width, sym.y + sym.height / 2);
  ctx.stroke();
  ctx.fillStyle = PLAQUE_COLOURS.letter;
  ctx.font = `${Math.max(9, s * 0.3)}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const inset = 0.45 * s, top = fp.y + 0.5 * s, bottom = fp.y + 1.5 * s;
  const letters                             = [
    ['S', fp.x + inset, top], ['R', fp.x + inset, bottom],
    ['Q', fp.x + fp.width - inset, top], ['Q̄', fp.x + fp.width - inset, bottom],
  ];
  for (const [text, x, y] of letters) ctx.fillText(text, x, y, s * 0.5);
}

/** ADR-081: the chip mark with two inputs and two outputs, its notch and no number. */
function plaqueChip(f             , fp          )       {
  const { ctx, s } = f;
  const body = chipBodyRect(fp), n = chipNotch(body, s);
  plaqueStubs(f, [0.5, 1.5].flatMap((row) => [
    { x0: fp.x, x1: body.x, y: fp.y + row * s }, { x0: body.x + body.width, x1: fp.x + fp.width, y: fp.y + row * s },
  ]));
  ctx.fillStyle = PLAQUE_COLOURS.fill;
  ctx.strokeStyle = PLAQUE_COLOURS.line;
  ctx.lineWidth = Math.max(1, (s * 1.5 * 3) / 32);
  ctx.beginPath();
  ctx.moveTo(body.x, body.y);
  ctx.lineTo(n.x - n.r, body.y);
  ctx.arc(n.x, n.y, n.r, Math.PI, 0, true);
  ctx.lineTo(body.x + body.width, body.y);
  ctx.lineTo(body.x + body.width, body.y + body.height);
  ctx.lineTo(body.x, body.y + body.height);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

/** ADR-071: the arm's item icon, its 16-unit box fitted into the symbol's box, in the line colour. */
function plaqueArm(f             , box          )       {
  const { ctx } = f;
  const k = box.width / 16;
  ctx.strokeStyle = PLAQUE_COLOURS.line;
  ctx.fillStyle = PLAQUE_COLOURS.line;
  ctx.lineWidth = Math.max(1, 1.6 * k);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (const stroke of ICON_SHAPES.arm.strokes) {
    if (!('line' in stroke)) continue;
    stroke.line.forEach(([x, y], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, box.x + x * k, box.y + y * k));
  }
  ctx.stroke();
  for (const [x, y, r] of ICON_SHAPES.arm.dots) {
    ctx.beginPath();
    ctx.arc(box.x + x * k, box.y + y * k, r * k, 0, Math.PI * 2);
    ctx.fill();
  }
}

/** The whole drawing: Scout's hull, each wire's trace, then each symbol. */
function paintPlaqueDiagram(f             , layout               , w        , h        )       {
  const { ctx } = f;
  ctx.fillStyle = BOARD_THEMES.scout.hull;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = PLAQUE_COLOURS.trace;
  ctx.lineWidth = Math.max(1.5, f.s * 0.12);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const t of layout.traces) {
    t.points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(plaqueX(f, p.x), plaqueY(f, p.y)); else ctx.lineTo(plaqueX(f, p.x), plaqueY(f, p.y));
    });
  }
  ctx.stroke();
  for (const sym of layout.symbols) {
    const box = plaqueBoxPx(f, sym);
    if (sym.kind === 'bumper' || sym.kind === 'thruster') plaqueWallSymbol(f, sym);
    else if (sym.kind === 'not') plaqueNot(f, box);
    else if (sym.kind === 'ff') plaqueFlipFlop(f, box);
    else if (sym.kind === 'chip') plaqueChip(f, box);
    else plaqueArm(f, box);
  }
}

/** Paints the box canvas `w` × `h` CSS px at `dpr`, the layout fitted and centred with its aspect kept. */
function paintPlaqueCanvas(layout               , w        , h        , dpr        )       {
  const canvas = $('plaque-canvas')                     ;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  // Non-null: A 2d context is always available on a fresh canvas that has no other context type.
  const ctx = canvas.getContext('2d') ;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(w / layout.width, h / layout.height);
  paintPlaqueDiagram({ ctx, s, ox: (w - layout.width * s) / 2, oy: (h - layout.height * s) / 2 }, layout, w, h);
}

/** ADR-097: the box's place and size in the view, below the lower of the top corner groups. */
function placePlaqueBox(box             , layout               )                                    {
  const view = { width: window.innerWidth, height: window.innerHeight };
  const safe = $('safe-area').getBoundingClientRect();
  const size = plaqueBoxSize(layout, view, { left: safe.left, right: view.width - safe.right });
  const top = Math.max($('room-top-left').getBoundingClientRect().bottom,
    $('room-top-right').getBoundingClientRect().bottom) + PLAQUE_TOP_GAP;
  box.style.setProperty('--plaque-top', `${top}px`);
  box.style.left = `${(view.width - size.width) / 2}px`;
  box.style.width = `${size.width}px`;
  box.style.height = `${size.height}px`;
  return size;
}

/**
 * ADR-097: shows the box in the room view while `plaqueInReach` is a plaque, else hides it; announces a plaque that
 * comes into reach (another position, or from none) and nothing on leaving; repaints only when the plaque, the size
 * or the pixel ratio changes.
 */
function updatePlaqueBox(v             , s                )       {
  const plaque = v.game.screen === 'room' ? v.game.player.run.plaqueInReach : null;
  const box = $('plaque-box');
  box.hidden = plaque === null;
  const key = plaque && `${plaque.position.x},${plaque.position.y}`;
  const description = plaque && describeDiagram(plaque.diagram);
  if (key !== s.shown && description) $('announce').textContent = description;
  s.shown = key;
  if (!plaque || !description) return;
  box.setAttribute('aria-label', description);
  const layout = diagramLayout(plaque.diagram);
  const size = placePlaqueBox(box, layout);
  const dpr = window.devicePixelRatio || 1;
  const w = size.width - 2 * PLAQUE_RIM, h = size.height - 2 * PLAQUE_RIM;
  const paintKey = `${key}|${w}|${h}|${dpr}`;
  if (paintKey === s.painted) return;
  s.painted = paintKey;
  paintPlaqueCanvas(layout, w, h, dpr);
}

// --- app/interior-view.ts
// Canvas drawing of the robot interior (style B board): hull, wall bumper and thruster symbols, right-angle traces,
// parts, pins and drag feedback, at the board camera's transform (ADR-046); the chrome is in interior-chrome.ts.
// ADR-091: the fab's bench on the same board in BENCH_THEME, with its terminals (bench-view.ts) on the walls.
// Parts are gate symbols (ADR-054) and chips are chip symbols (ADR-088), both in interior-chips.ts.
// ADR-050 adds target rings, lock marks, the selected wire's halo, the picked-up part and the magnifier.


                                                                                    

                                                    

                                                  





                                                         
                                                      

                                                 



                                                           

const M = HULL_MARGIN;

/** What one board drawing needs besides its frame: the frame-independent state of this render. */
                      
                 
               
                        
                               
                     
                             
                                                                                       
                           
 

/**
 * What the last interior frame drew that the debug hooks report: the magnifier and the board's theme (ADR-070; ADR-091:
 * `bench` in the fab).
 */
                                                                                                

/** The board's signals, part states and theme: the current robot's (ADR-070), or the bench's in the fab (ADR-091). */
                     
                        
                               
                    
                             
                           
 

/** The current robot's look from the shown run (UX.19); ADR-072: the robot its claw tows names the arm's sentence. */
function robotLook(v             , s           )            {
  const shown = v.game.player.shownRun;
  const model = v.game.player.run.current;
  const signals = shown.signalsOf(model);
  // `model` is one of the shown run's robots (the shown run is a copy of the run), so `i` is found.
  const all = robotStates(shown.world);
  const i = all.findIndex((r) => r.model === model);
  const towed = all[towedOf(all, i)]?.model ?? null;
  const states = partStates(s, signals, all[i], shown.equipmentOf(model).battery?.capacity ?? null, towed);
  return { signals, states, theme: BOARD_THEMES[model], name: model, bench: null };
}

/** ADR-091: the bench's look from its shown snapshot (refreshed every DISPLAY_STRIDE running ticks), no parts. */
function benchLook(shown            )            {
  return { signals: shown.signals, states: [], theme: BENCH_THEME, name: 'bench', bench: shown };
}

/**
 * Draws the current robot's board in its theme (ADR-070), or the fab's bench (ADR-091), at `v.boardTransform` (never
 * fits, ADR-046), the magnifier, and updates the chrome.
 */
function renderInterior(v             )                {
  const { ctx, w: vw, h: vh } = sizeCanvas(v.boardCanvas);
  const editor = v.game.editor;
  const s            = editor.session.schematic;
  const look = v.game.screen === 'fab' ? benchLook(v.game.fab.shown) : robotLook(v, s);
  const { signals, states, theme } = look;
  const { scale, ox, oy } = v.boardTransform;
  const f             = { ctx, scale, X: (x) => ox + x * scale, Y: (y) => oy + y * scale, theme };
  ctx.fillStyle = theme.outside;
  ctx.fillRect(0, 0, vw, vh);
  const scene = {
    v, s, signals, states, loops: new Set(editor.loops.flat()), targets: currentTargets(v), bench: look.bench,
  };
  drawBoard(f, scene);
  const drag = v.drag;
  const showLoupe = drag?.type === 'pin' && (drag.aiming || (drag.moved && !drag.part));
  const finger = showLoupe ? { x: f.X(drag.at.x), y: f.Y(drag.at.y) } : null;
  const loupe = finger ? drawLoupe(v, f, finger, (g) => { drawBoard(g, scene); }) : null;
  updateChrome(v, s, signals, states);
  return { loupe, theme: look.name };
}

/** The board at frame `f`: hull, walls, parts, wires with halo, pins, rings, drag feedback. */
function drawBoard(f            , scene            )       {
  const { v, s, signals, states, loops } = scene;
  drawHull(f, s, states);
  if (scene.bench) drawBenchTerminals(f, s, scene.bench); else drawWallSymbols(f, s, signals);
  drawPartFrames(f, s, states);
  const wire = v.game.editor.selectedWire;
  if (wire) drawWireHalo(f, s, wire);
  drawWires(f, v, s, signals);
  for (const pl of s.placements) {
    if (v.drag?.type === 'component' && v.drag.moved && v.drag.part === pl.component.id) continue;
    const id = pl.component.id;
    const q = pl.component.kind === 'srFlipFlop' && signals.get({ component: id, pin: 'q' });
    drawChip(f, v, loops, { kind: pl.component.kind, chip: s.circuit.chip(id), x: pl.position.x, y: pl.position.y,
      id, ghost: null, picked: v.moving === id, q });
  }
  drawPins(f, v, s, signals);
  const snap = v.drag?.type === 'pin' ? v.drag.snap : null;
  drawTargetRings(f, s, scene.targets, snap, f.scale);
  drawDragFeedback(f, v, loops, s);
}

/**
 * Hull with mounting holes, silkscreen, grid dots and the dashed board outline, in the theme's colours; the bench's
 * silver edge is 3 px wide (ADR-091).
 */
function drawHull(f            , s           , states                      )       {
  const { ctx, scale, X, Y, theme } = f;
  const B = s.board;
  ctx.fillStyle = theme.hull;
  ctx.strokeStyle = theme.hullEdge;
  ctx.lineWidth = theme === BENCH_THEME ? 3 : 2;
  ctx.beginPath();
  ctx.roundRect(X(-M), Y(-M), (B.width + 2 * M) * scale, (B.height + 2 * M) * scale, scale * 0.5);
  ctx.fill();
  ctx.stroke();
  const holes = [
    [-M / 2, -M / 2], [B.width + M / 2, -M / 2], [-M / 2, B.height + M / 2], [B.width + M / 2, B.height + M / 2],
  ];
  for (const [hx, hy] of holes) {
    ctx.fillStyle = theme.panel;
    ctx.strokeStyle = C.pinBorder;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(X(hx), Y(hy), scale * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.fillStyle = theme.silk;
  ctx.font = `600 ${Math.max(9, scale * 0.28)}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  // The theme's silkscreen label runs up to the first south frame and is left out when that run is under 3 cells.
  const run = southFrameLeft(s, states) - 0.3 - 0.2;
  if (run >= 3) ctx.fillText(theme.label, X(0.2), Y(B.height + M * 0.78), run * scale);
  ctx.fillStyle = rgba(theme.silk, 0.35);
  for (let y = 0; y <= B.height; y++) for (let x = 0; x <= B.width; x++) ctx.fillRect(X(x) - 1, Y(y) - 1, 2, 2);
  ctx.strokeStyle = rgba(theme.silk, 0.4);
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(X(0), Y(0), B.width * scale, B.height * scale);
  ctx.setLineDash([]);
}

/**
 * The left edge, in board cells, of the first frame on the south wall (the board width if there is none); a board
 * without a `robot` (the bench, ADR-091) has no bumper or thruster frames.
 */
function southFrameLeft(s           , states                      )         {
  let left = s.board.width;
  const robot = s.circuit.component('robot')?.kind === 'robot';
  for (const pin of robot ? WALL_PINS : []) {
    if (wallOf(pin) === 'south') left = Math.min(left, anchorOf({ component: 'robot', pin }, s).x - FRAME_LENGTH / 2);
  }
  for (const st of states) {
    const fr = partFrame(st.part, s);
    if (fr?.wall === 'south') left = Math.min(left, fr.centre.x - PART_FRAME_LENGTH / 2);
  }
  return left;
}

/** Wires: right-angle traces, gold when on, dashed when off (ADR-024). */
function drawWires(f            , v             , s           , signals              )       {
  const { ctx, scale, X, Y } = f;
  for (const conn of s.circuit.connections) {
    const route = wireRoute(conn.from, conn.to, s);
    const lit = signals.get(conn.from);
    ctx.strokeStyle = lit ? C.gold : C.offTrace;
    ctx.lineWidth = lit ? Math.max(2.5, scale * 0.09) : Math.max(1.5, scale * 0.05);
    ctx.setLineDash(lit ? [] : [scale * 0.18, scale * 0.12]);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    route.forEach((pt, i) => (i ? ctx.lineTo(X(pt.x), Y(pt.y)) : ctx.moveTo(X(pt.x), Y(pt.y))));
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/** Pins: filled gold when on, hollow when off; the selected pin gets a white ring. */
function drawPins(f            , v             , s           , signals              )       {
  const { ctx, scale, X, Y } = f;
  const sel = v.game.editor.selectedPin;
  for (const pin of allPins(s)) {
    const a = anchorOf(pin, s);
    const r = pinDrawRadius(scale);
    ctx.fillStyle = signals.get(pin) ? C.gold : f.theme.panel;
    ctx.strokeStyle = C.pinBorder;
    ctx.lineWidth = pinBorderWidth(scale);
    ctx.beginPath();
    if (wallPinWall(pin, s) !== null) ctx.rect(X(a.x) - r, Y(a.y) - r, 2 * r, 2 * r);
    else ctx.arc(X(a.x), Y(a.y), r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (sel && sel.component === pin.component && sel.pin === pin.pin) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(X(a.x), Y(a.y), r + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

/** The wire being dragged, or a ghost of the part being moved or placed (green if allowed, red if refused). */
function drawDragFeedback(f            , v             , loops             , s           )       {
  const drag = v.drag;
  if (!drag?.moved || drag.type === 'pan') return;
  const { ctx, X, Y } = f;
  const session = v.game.editor.session;
  if (drag.type === 'pin' && !drag.part) {
    const a = anchorOf(drag.pin, s);
    const end = drag.snap ? anchorOf(drag.snap, s) : drag.at;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(X(a.x), Y(a.y));
    ctx.lineTo(X(end.x), Y(end.y));
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  if (drag.type === 'new') {
    drawNewGhost(f, v, loops, drag);
    return;
  }
  // A component drag, or a pin drag still inside the part it was pressed in (UX.22).
  // Non-null: Both start from an existing component of this circuit; a pin drag here has `part` set.
  const part = drag.part ;
  const kind = s.circuit.component(part) .kind;
  const cell = { x: Math.round(drag.at.x - drag.grab.x), y: Math.round(drag.at.y - drag.grab.y) };
  let ok = true;
  try { session.clone().move(part, cell); } catch { ok = false; }
  drawChip(f, v, loops, { kind, chip: s.circuit.chip(part), x: cell.x, y: cell.y, id: part, ghost: ok ? 'ok' : 'bad',
    q: false });
}

/** The ghost of a toolbox gate or a drawer chip (ADR-088) under the finger: green where it fits, red where refused. */
function drawNewGhost(
  f            , v             , loops             , drag                                ,
)       {
  const chip = drag.chip;
  // Non-null: a toolbox drag's kind is a gate kind, which has a footprint.
  const cell = dropCell(chip ? chipFootprint(chip) : footprint(drag.kind) , drag.at);
  const trial = v.game.editor.session.clone();
  let ok = true;
  try {
    if (chip) trial.placeChip(chip, cell); else trial.place(drag.kind, cell);
  } catch { ok = false; }
  drawChip(f, v, loops, { kind: drag.kind, chip, x: cell.x, y: cell.y, id: null, ghost: ok ? 'ok' : 'bad', q: false });
}

// --- app/fab-input.ts
// The fab view's input (ADR-091): "Leave fab", Burn, the Menu's "Chip fab" and "Reset bench", the drawer's "Open on
// bench" and "Scrap" (whose presses never reach the window, so they keep the drawer open), the `replaceBench` and
// `scrapChip` confirmations, and the fab's keys. The board's own input is board-input.ts's, on the bench's editor.






                                                     

/** The steering keys (input.ts's arrows and WASD), which do nothing in the fab. */
const STEER_KEYS                    = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft', 'w', 'a', 's', 'd'];

/** ADR-091: "Leave fab" while the fab shows: the drawer, context menu and Move close with it. */
function leaveFab(v             )       {
  closeChipDrawer(v);
  closeMenu(v);
  v.moving = null;
  leaveFabIn(v.game);
}

/** ADR-091: toggles the bench's Run while the fab shows, else the room's (`i-run`, `r-run` and Space). */
function toggleRun(v             )       {
  const game = v.game;
  if (game.screen === 'fab') game.fab.setRunning(!game.fab.isRunning);
  else game.player.setRunning(!game.player.isRunning);
}

/** Installs the fab's buttons, the drawer's actions and the fab's confirmations. */
function wireFab(v             )       {
  const { game } = v;
  const on = (id        , fn            ) => $(id).addEventListener('click', (e) => {
    e.preventDefault();
    if (!($(id)                     ).disabled) fn();
    v.invalidate();
  });
  on('f-exit', () => leaveFab(v));
  on('f-burn', () => burnIn(game, prefersReducedMotion()));
  on('menu-fab', () => openFabIn(game, null));
  on('menu-reset-bench', () => {
    game.dialog = null;
    game.fab.resetBench();
  });
  for (const id of ['chip-open', 'chip-scrap']) {
    $(id).addEventListener('pointerdown', (e) => e.stopPropagation());
  }
  on('chip-open', () => { if (v.chipDrawer.armed) askOpenOnBenchIn(game, v.chipDrawer.armed); });
  on('chip-scrap', () => { if (v.chipDrawer.armed) askScrapIn(game, v.chipDrawer.armed); });
  on('confirm-yes', () => {
    if (game.dialog === 'replaceBench') openOnBenchIn(game);
    else if (game.dialog === 'scrapChip') scrapIn(game);
  });
}

/**
 * ADR-091: a key while the fab shows: arrows and WASD do nothing (the room never moves), Space is the bench's Run,
 * `r` "Reset bench" and `e` "Leave fab". True when the key was one of them.
 */
function fabKey(v             , e               )          {
  const fab = v.game.fab;
  const k = e.key;
  if (STEER_KEYS.includes(k)) e.preventDefault();
  else if (k === ' ') {
    e.preventDefault();
    toggleRun(v);
  } else if (k === 'r') fab.resetBench();
  else if (k === 'e') leaveFab(v);
  else return false;
  return true;
}

// --- app/input.ts
// Input wiring of the web slice: buttons (the title's "Play", "Tutorial" and "New game", ADR-085, and "Main menu",
// ADR-095), steering pad and keyboard; the Menu's other entries are in menu-input.ts,
// board pointer input in board-input.ts, the toolbox and the chip drawer (ADR-088) in toolbox-input.ts, room floor
// taps and the joystick (ADR-051) in room-input.ts, the fab's buttons and keys (ADR-091) in fab-input.ts.
// Every handler ends by asking the view to redraw and reads `game.editor` when it runs (the bench's in the fab).
// While the lift's fade runs every key is ignored (ADR-074). Look mode (look-input.ts, ADR-094) takes the `r-look`
// button and the keys that end it.

                                                  







                                                     



const KEYS                            = {
  ArrowUp: 'north', ArrowRight: 'east', ArrowDown: 'south', ArrowLeft: 'west',
  w: 'north', d: 'east', s: 'south', a: 'west',
};
const PAD_DIRECTIONS              = ['north', 'east', 'south', 'west'];

/** Installs every listener of the page. */
function wireInput(v             )       {
  wireButtons(v);
  wireMenu(v);
  wirePad(v);
  wireKeyboard(v);
  wireBoard(v);
  wireToolbox(v);
  wireContextMenu(v);
  wireRoom(v);
  wireFab(v);
}

/** Deletes the selected part, else the selected wire (ADR-050); true when something was selected to delete. */
function deleteSelection(v             )          {
  const editor = v.game.editor;
  if (editor.selectedComponent) editor.remove(editor.selectedComponent);
  else if (editor.selectedWire) editor.deleteSelectedWire();
  else return false;
  return true;
}

/** ADR-095 "Main menu": the title, with the chip drawer, the board's context menu and any room touch closed. */
function toMainMenu(v             )       {
  v.game.mainMenu();
  if (v.game.screen !== 'title') return;
  closeMenu(v);
  closeChipDrawer(v);
  endRoomTouch(v);
  v.moving = null;
}

function wireButtons(v             )       {
  const { game, invalidate } = v;
  const on = (id        , fn            ) => $(id).addEventListener('click', (e) => {
    e.preventDefault();
    fn();
    invalidate();
  });
  on('play', () => { game.start(); });
  on('tutorial', () => { game.startTutorial(); });
  on('new-game', () => askNewGameIn(game));
  for (const prefix of ['r', 'i']) {
    on(`${prefix}-run`, () => toggleRun(v));
    on(`${prefix}-menu`, () => { game.dialog = 'menu'; });
  }
  on('menu-restore', () => { if (game.restoreEnabled) game.dialog = 'restore'; });
  on('menu-play-again', () => { game.dialog = 'playAgain'; });
  on('menu-leave', () => { game.dialog = 'leave'; });
  on('menu-main', () => toMainMenu(v));
  on('menu-close', () => { game.dialog = null; });
  on('confirm-yes', () => {
    if (game.dialog === 'playAgain') game.playAgain();
    else if (game.dialog === 'leave') game.leaveLevel();
    else if (game.dialog === 'restore') game.restoreStartingCircuit();
    else if (game.dialog === 'removePart') game.removePart();
    else if (game.dialog === 'reset') { game.reset(); game.dialog = null; }
    else if (game.dialog === 'newGame') newGameIn(game);
  });
  on('confirm-no', () => { game.dialog = null; });
  on('i-exit', () => game.exitRobot());
  on('r-exit', () => game.exitRobot());
  on('i-outside', () => { game.lookingOutside = true; game.editor.clearSelection(); });
  on('r-look', () => toggleLook(v));
  on('r-inside', () => { game.lookingOutside = false; });
  on('i-undo', () => game.editor.undo());
  on('i-delete', () => { if (!deleteSelection(v)) game.editor.cutSelectedWire(); });
}

function wirePad(v             )       {
  const player = () => v.game.player;
  $('pad-toggle').addEventListener('click', (e) => {
    e.preventDefault();
    v.padOpen = !v.padOpen;
    v.invalidate();
  });
  for (const d of PAD_DIRECTIONS) {
    const b = $(`pad-${d}`);
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      // ADR-091: the pad is hidden in the fab, and nothing steers the room there.
      if (v.game.screen === 'fab') return;
      b.setPointerCapture?.(e.pointerId);
      player().press(d);
      v.invalidate();
    });
    const up = () => { player().release(d); v.invalidate(); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
}

/** Interior and fab zoom keys (ADR-046): `+` or `=` zoom in, `-` zooms out, `0` fits; true when the key was one. */
function zoomKey(v             , key        )          {
  if (v.game.screen !== 'interior' && v.game.screen !== 'fab') return false;
  if (key === '+' || key === '=') zoomStep(v, true);
  else if (key === '-') zoomStep(v, false);
  else if (key === '0') v.needsFit = true;
  else return false;
  closeMenu(v);
  return true;
}

/**
 * One key press outside the title screen: steering, Run/Reset, Exit, undo/redo, delete, zoom, Escape (which
 * also closes the chip drawer, ADR-088); the fab's own keys first (fab-input.ts, ADR-091).
 */
function handleKey(v             , e               )       {
  const { game } = v;
  if (game.screen === 'fab' && fabKey(v, e)) return;
  if (lookKey(v, e)) return;
  const player = game.player;
  const editor = game.editor;
  const d = KEYS[e.key];
  if (d) {
    e.preventDefault();
    if (!e.repeat) player.press(d);
  } else if (e.key === ' ') {
    e.preventDefault();
    player.setRunning(!player.isRunning);
  } else if (e.key === 'r') game.askReset();
  else if (e.key === 'e' && game.screen !== 'room') game.exitRobot();
  else if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    if (e.shiftKey) editor.redo(); else editor.undo();
  } else if (e.key === 'Backspace' || e.key === 'Delete') deleteSelection(v);
  else if (e.key === 'Escape') {
    editor.clearSelection();
    closeMenu(v);
    closeChipDrawer(v);
    v.moving = null;
  }
  else if (!e.metaKey && !e.ctrlKey && zoomKey(v, e.key)) e.preventDefault();
}

function wireKeyboard(v             )       {
  const { game, invalidate } = v;
  window.addEventListener('keydown', (e) => {
    if (game.fading) return;
    if (game.screen === 'title' && game.dialog === null) {
      if (e.key === 'Enter' || e.key === ' ') { game.start(); invalidate(); }
      return;
    }
    if (game.dialog !== null) {
      if (e.key === 'Escape') game.dialog = null;
      invalidate();
      return;
    }
    handleKey(v, e);
    invalidate();
  });
  window.addEventListener('keyup', (e) => {
    if (game.fading) return;
    const d = KEYS[e.key];
    if (d) { game.player.release(d); invalidate(); }
  });
  window.addEventListener('resize', invalidate);
  window.addEventListener('blur', () => { for (const d of Object.values(KEYS)) game.player.release(d); });
}

// --- app/item-bar.ts
// The item bar (ADR-040, ADR-046, ADR-071): top left in the room and outside views, the inventory grouped by kind
// and hidden while empty; in the interior inside `#i-items` of `#i-controls` (ADR-077), a practice level's
// crystal cell as before or, in a campaign level, a fixed 56 × 44 px bar with the inventory, a divider and the
// ridden robot's hold slots, always shown. Its accessible name and the announcement of added items.
// Called from chrome.ts.

                                                 


                                                     

/** What the item bar remembers between updates: the live inventory's length and where the bar sits. */
                               
                    
                      
 

/** ADR-040, ADR-071: the room bar's markup: one entry per kind, its icon, its name and ` ×<n>` when n > 1. */
function roomItemsHTML(inventory                     )         {
  return groupItems(inventory).map((g) => `<span class="item">${itemIconHTML(g.kind)}${ITEM_NAMES[g.kind]}` +
    `${g.count > 1 ? ` ×${g.count}` : ''}</span>`).join('');
}

/** ADR-071: the campaign interior bar's markup: the inventory row, the divider and the hold row. */
function holdBarHTML(inventory                     , slots                              )         {
  const inv = groupItems(inventory).map((g) => `<span class="inv-item" data-kind="${g.kind}">` +
    `${itemIconHTML(g.kind)}${g.count > 1 ? `<b class="count">${g.count}</b>` : ''}</span>`).join('');
  const hold = slots.map((k) => (k === null ? '<span class="slot"></span>'
    : `<span class="slot" data-kind="${k}">${itemIconHTML(k)}</span>`)).join('');
  return `<span class="inv">${inv}</span><span class="divider"></span><span class="hold">${hold}</span>`;
}

/** Brings the item bar in line with the shown run and announces items the live run added since the last update. */
function updateItemBar(v             , s              )       {
  const game = v.game;
  const p = game.player;
  const items = p.shownRun.world.inventory;
  const bar = $('itembar');
  const inInterior = game.screen === 'interior';
  if (inInterior !== s.inInterior) {
    s.inInterior = inInterior;
    if (inInterior) $('i-items').append(bar); else $('room-top-left').append(bar);
  }
  const campaign = inInterior && p.run.level.lift !== null;
  if (campaign) {
    const slots = riddenSlots(p.shownRun);
    bar.dataset.hold = 'true';
    bar.hidden = false;
    bar.setAttribute('aria-label', `${itemsLabel(items)} ${holdLabel(slots)}`);
    $('items').innerHTML = holdBarHTML(items, slots);
  } else {
    delete bar.dataset.hold;
    bar.hidden = items.length === 0;
    bar.setAttribute('aria-label', itemsLabel(items));
    $('items').innerHTML = roomItemsHTML(items);
  }
  const live = p.run.world.inventory;
  if (live.length > s.lastItems) $('announce').textContent = addedAnnouncement(live.slice(s.lastItems));
  s.lastItems = live.length;
}

// --- app/fab-chrome.ts
// The fab view's chrome (ADR-091) on the interior's controls: "Leave fab" and Burn in the places of Exit robot and
// Outside, the bench's tick and Run/Pause, Burn disabled while the bench has a loop, Burn's refusal placed next to
// Burn as the Menu list is placed next to the Menu button, the burned chip's fly to the Chips tool and its
// announcement. Called from chrome.ts after the interior's own chrome.

                                                            



                                                     

/** ADR-091: the width of Burn's refusal next to Burn, in CSS px. */
const BURN_MESSAGE_WIDTH = 280;

/** The client rectangle of the element `id`. */
function fabRect(id        )       {
  const r = $(id).getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height };
}

/** What the fab chrome remembers between updates: the chip whose fly is shown, if any. */
                                                        

/** ADR-091: brings the fab's controls, Burn's message place, the fly and the announcement in line with the game. */
function updateFabChrome(v             , st                )       {
  const game = v.game;
  const fab = game.screen === 'fab';
  for (const id of ['f-exit', 'f-burn']) $(id).hidden = !fab;
  for (const id of ['i-exit', 'i-outside', 'i-items']) $(id).hidden = fab;
  ($('f-burn')                     ).disabled = fab && game.editor.loops.length > 0;
  if (fab) {
    const running = game.fab.isRunning;
    $('i-run').textContent = running ? 'Pause' : 'Run';
    $('i-run').setAttribute('aria-pressed', String(running));
  }
  placeMessage(v, fab && game.fab.messageAtBurn);
  updateFly(v, st, fab ? game.fab.flying : null);
  if (game.fab.announcement !== null) {
    $('announce').textContent = game.fab.announcement;
    game.fab.announcement = null;
  }
}

/** ADR-091: `#message` next to Burn (`menuListRect` with Burn's rectangle) while `atBurn`, else at its CSS place. */
function placeMessage(v             , atBurn         )       {
  const style = $('message').style;
  if (!atBurn) {
    for (const k of ['left', 'top', 'right', 'bottom', 'width', 'transform']) style[k          ] = '';
    return;
  }
  const layout = ($('interior').dataset.layout                            ) ?? null;
  const anchor = menuAnchor('interior', layout);
  const r = menuListRect(fabRect('f-burn'), fabRect(anchor.cluster), anchor.column, fabRect('safe-area'),
    $('message').getBoundingClientRect().height, BURN_MESSAGE_WIDTH);
  style.left = `${r.left}px`;
  style.top = `${r.top}px`;
  style.right = 'auto';
  style.bottom = 'auto';
  style.width = `${r.width}px`;
  style.transform = 'none';
}

/**
 * ADR-091: while `flying`, `#burn-fly` starts at Burn's centre and moves by a CSS transform to the Chips tool's
 * centre (a 400 ms ease-out transition in the page's CSS); hidden otherwise.
 */
function updateFly(v             , st                , flying               )       {
  const el = $('burn-fly');
  el.hidden = flying === null;
  if (flying === null || flying === st.flown) {
    st.flown = flying;
    return;
  }
  st.flown = flying;
  updateChipTool(v);
  const from = fabRect('f-burn'), to = fabRect('tool-chip');
  el.style.transition = 'none';
  el.style.left = `${from.left + from.width / 2}px`;
  el.style.top = `${from.top + from.height / 2}px`;
  el.style.transform = 'none';
  // Reading the layout commits the start place, so the transform below transitions from it.
  void el.getBoundingClientRect();
  el.style.transition = '';
  const dx = to.left + to.width / 2 - (from.left + from.width / 2);
  const dy = to.top + to.height / 2 - (from.top + from.height / 2);
  el.style.transform = `translate(${dx}px, ${dy}px)`;
}

// --- app/chrome.ts
// The page chrome that follows game state: screen visibility, Run labels, the title's buttons (ADR-085), the Menu
// and its confirmations (with a campaign level's and tutorial room's own texts, ADR-067, ADR-074, ADR-095), the
// lift's fade and the load message (ADR-074), the item bar (item-bar.ts), the diagram plaque's box (plaque-box.ts,
// ADR-097), the chip drawer (chip-drawer.ts, ADR-088), the fab's controls (fab-chrome.ts, ADR-091) and the editor's
// refusal message. The canvases are drawn by room-view.ts and interior-view.ts.


                                                   


                                                     
                                              


                                                      

                                                  

                                                      




/** A confirmation's title, text and confirming button. */
                                                              

                                                                                 

/**
 * The confirmation of each Menu entry in a level file opened with `Game.openPuzzle` (ADR-040 "Start over?", ADR-042
 * "Leave this puzzle?", ADR-043, ADR-078); a campaign level's and tutorial room's are `CAMPAIGN_CONFIRMS` (ADR-095),
 * "Remove the <part>?" is `removeConfirm` (ADR-066, ADR-073).
 */
const CONFIRMS                                 = {
  playAgain: { title: 'Start over?', text: 'The robot, the crystal and your circuit go back to the start.',
    yes: 'Start over' },
  leave: { title: 'Leave this puzzle?', text: 'Your circuit and items are cleared.', yes: 'Leave' },
  restore: { title: 'Restore starting circuit?',
    text: "Your changes to this robot's circuit are replaced. The robot, the tick and your items stay.",
    yes: 'Restore' },
  reset: { title: 'Reset?', text: 'Fitted parts and their wires come off and go back to the floor.', yes: 'Reset' },
  newGame: { title: 'Start a new game?', text: 'Your saved progress is replaced.', yes: 'New game' },
  replaceBench: { title: 'Replace the bench?', text: 'The parts on the bench are removed.', yes: 'Replace' },
};

/**
 * ADR-067, ADR-074, ADR-095: a campaign level's and tutorial room's "Play again" and Reset texts; the rest as above
 * ("Main menu" asks nothing, ADR-085).
 */
const CAMPAIGN_CONFIRMS                                 = {
  ...CONFIRMS,
  playAgain: { title: 'Start this level over?',
    text: 'Robots, circuits and items go back to how they were when you arrived.', yes: 'Play again' },
  reset: { title: 'Reset?', text: 'Parts fitted since you arrived come off with their wires.', yes: 'Reset' },
};

/** ADR-074, ADR-078: the line under "Play" when it could not open; ADR-068, ADR-075: the unreadable save. */
const SAVE_ERROR = 'Your saved game could not be read.';
const LOAD_ERROR = 'This level could not be loaded.';

/** ADR-066, ADR-073: the Remove confirmation for `part`. */
function removeConfirm(part               )          {
  return { title: `Remove the ${part}?`, text: 'Its wires are removed and it goes back to your items.', yes: 'Remove' };
}

/** ADR-082, ADR-091: the Scrap confirmation for chip `id` (null: none pending). */
function scrapConfirm(id               )          {
  const n = id === null ? '' : String(chipNumber(id));
  return { title: `Scrap chip ${n}?`, text: 'Robots that use it keep their copy.', yes: 'Scrap' };
}

class Chrome {
                   v             ;
          messageTimer = 0;
          lastMessage                = null;
                   items               = { lastItems: 0, inInterior: false };
                   fab                 = { flown: null };
                   plaque                 = { shown: null, painted: null };
  /**
   * ADR-070: the robot whose board colours are set on the body, `bench` in the fab (ADR-091), or null (the green
   * defaults of `:root`).
   */
          themed                              = null;

  constructor(v             ) {
    this.v = v;
  }

  /** Brings every DOM element in line with the game state. */
  update()       {
    settleLook(this.v);
    this.showScreen();
    this.showTitle();
    this.showDialog();
    updateItemBar(this.v, this.items);
    updatePlaqueBox(this.v, this.plaque);
    updateChipDrawer(this.v);
    this.showMessage();
    updateFabChrome(this.v, this.fab);
  }

  /**
   * Screen visibility, Run state, the pad; the outside view adds the frame and Exit (ADR-047); the
   * fab shows on the interior's board without the room's controls and the pad (ADR-091).
   */
          showScreen()       {
    const game = this.v.game;
    const screen = game.screen;
    const p = game.player;
    const board = screen === 'interior' || screen === 'fab';
    document.body.dataset.screen = screen;
    $('title').hidden = screen !== 'title';
    $('playview').hidden = screen === 'title';
    $('interior').hidden = !board;
    $('room-ui').hidden = board || screen === 'title';
    const looking = this.v.look.on;
    $('pad').hidden = !p.canSteer || screen === 'fab' || looking;
    $('look-frame').hidden = !looking;
    $('r-look').setAttribute('aria-pressed', String(looking));
    $('pad').dataset.open = String(this.v.padOpen);
    document.body.dataset.pad = p.canSteer && this.v.padOpen && !board && !looking ? 'open' : 'closed';
    $('pad-toggle').setAttribute('aria-expanded', String(this.v.padOpen));
    for (const d of ['north', 'east', 'south', 'west']) $(`pad-${d}`).hidden = !this.v.padOpen;
    $('r-inside').hidden = screen !== 'outside';
    $('r-exit').hidden = screen !== 'outside';
    $('periscope').hidden = screen !== 'outside';
    for (const id of ['r-run', 'i-run']) {
      $(id).textContent = p.isRunning ? 'Pause' : 'Run';
      $(id).setAttribute('aria-pressed', String(p.isRunning));
    }
    this.showTheme(screen === 'interior' ? p.run.current : screen === 'fab' ? 'bench' : null);
  }

  /**
   * ADR-070: while the interior shows, the ridden robot's board colours as CSS custom properties on the body, and
   * BENCH_THEME's in the fab (ADR-091); removed on every other screen, so the title, room and outside view keep
   * `:root`'s green.
   */
          showTheme(model                             )       {
    if (model === this.themed) return;
    this.themed = model;
    const style = document.body.style;
    const theme = model === 'bench' ? BENCH_THEME : BOARD_THEMES[model ?? 'scout'];
    for (const [name, value] of themeProperties(theme)) {
      if (model) style.setProperty(name, value); else style.removeProperty(name);
    }
  }

  /**
   * The title's row and lines (ADR-074, ADR-075, ADR-078, ADR-085): "Tutorial" always, "New game" while a save
   * exists, the load message while the last "Play", "Tutorial" or lift could not open its level and the
   * unreadable-save message.
   */
          showTitle()       {
    const game = this.v.game;
    $('load-error').hidden = !game.playFailed;
    $('load-error').textContent = LOAD_ERROR;
    $('tutorial').hidden = false;
    $('new-game').hidden = !newGameShownIn(game);
    $('save-error').hidden = !game.saveUnreadable;
    $('save-error').textContent = SAVE_ERROR;
  }

  /**
   * The Menu and the confirmation over it (ADR-040, ADR-042, ADR-043, ADR-066, ADR-074; ADR-091's "Replace the
   * bench?" and "Scrap chip <n>?") and the lift's fade.
   */
          showDialog()       {
    const game = this.v.game;
    const d = game.dialog;
    $('lift-fade').hidden = !game.fading;
    $('menu').hidden = d !== 'menu';
    for (const id of ['r-menu', 'i-menu']) $(id).setAttribute('aria-expanded', String(d === 'menu'));
    if (d === 'menu') updateMenuList(this.v);
    $('menu-restore').hidden = !game.restoreVisible;
    ($('menu-restore')                     ).disabled = !game.restoreEnabled;
    $('confirm').hidden = d === null || d === 'menu';
    if (d === null || d === 'menu') return;
    const c = d === 'removePart' ? removeConfirm(game.removing) : d === 'scrapChip' ? scrapConfirm(game.fab.pending)
      : (game.inCampaign || game.inTutorial ? CAMPAIGN_CONFIRMS : CONFIRMS)[d];
    $('confirm-yes').classList.toggle('destructive', d === 'scrapChip');
    $('confirm-title').textContent = c.title;
    $('confirm-text').textContent = c.text;
    $('confirm-yes').textContent = c.yes;
  }

  /** The board editor's refusal message (the bench's in the fab, ADR-091), shown for 4.5 seconds. */
          showMessage()       {
    const editor = this.v.game.editor;
    if (editor.message === this.lastMessage) return;
    this.lastMessage = editor.message;
    $('message').textContent = editor.message ?? '';
    $('message').hidden = !editor.message;
    window.clearTimeout(this.messageTimer);
    if (editor.message) {
      this.messageTimer = window.setTimeout(() => { editor.message = null; this.v.invalidate(); }, 4500);
    }
  }
}

// --- app/view-hooks.ts
// The hooks `mount` returns (view.ts) for the headless checks and the screenshot steps: pin, wire, part and room
// points in client pixels, the board rectangle (L-15), the layout probe, and the board and room touch state as JSON.
// Moved out of view.ts (L-23); ADR-091 adds the fab (the board hooks work on the bench) and `partPoint`.


                                               
                                            

                                           

                                                        



                                              




                                                     

/** The hooks `mount` returns for the headless checks and the screenshot steps. */
                             
             
                                   
                                                                      
                                   
                     
                               
                          
                                                                                                                     
                                   
     
                                                                                                                   
                                                             
     
                        
                                                                                            
                                             
     
                                                                                                           
                               
                                                                                                                
                                                                                                            
                                                                                                     
     
                       
 

const pinText = (r               ) => r && `${r.component}.${r.pin}`;

/** Client coordinates of a board point in cells. */
function clientOf(v             , a       )        {
  const r = v.boardCanvas.getBoundingClientRect();
  const t = v.boardTransform;
  return { x: r.left + t.ox + a.x * t.scale, y: r.top + t.oy + a.y * t.scale };
}

/** Client point of the midpoint of the wire into `to`; throws when that input has no wire. */
function wirePointOf(v             , to        )        {
  const s = v.game.editor.session.schematic;
  const c = wireInto(s.circuit, to);
  if (!c) throw new Error(`no wire into ${pinText(to)}`);
  return clientOf(v, routeMidpoint(wireRoute(c.from, c.to, s)));
}

/**
 * JSON of the ADR-050 touch state; `loupe` in client px and `theme` (the drawn board's model, ADR-070, or `bench` in
 * the fab, ADR-091) from the last board frame (`drawn`).
 */
function boardUIOf(v             , drawn               )         {
  const r = v.boardCanvas.getBoundingClientRect();
  const board = v.game.screen === 'interior' || v.game.screen === 'fab';
  const l = board ? drawn.loupe : null;
  const menu = v.menu && { part: v.menu.part, wire: pinText(v.menu.wire) };
  return JSON.stringify({
    snap: v.drag?.type === 'pin' ? pinText(v.drag.snap) : null, targets: currentTargets(v).map(pinText),
    loupe: l && { x: r.left + l.x, y: r.top + l.y, r: l.r, scale: l.scale }, menu, moving: v.moving,
    selectedWire: pinText(v.game.editor.selectedWire), theme: drawn.theme,
    slots: drawnSlots(v.game.editor.session.schematic),
  });
}

/** Client point of the centre of room cell (x, y), from the frame the room is drawn in. */
function roomPointOf(v             , x        , y        )        {
  const r = v.roomCanvas.getBoundingClientRect();
  const vw = Math.max(1, Math.round(r.width)), vh = Math.max(1, Math.round(r.height));
  const { c, ox, oy } = roomFrameOf(v, v.game.player.run.world, vw, vh);
  return { x: r.left + ox + (x + 1.5) * c, y: r.top + oy + (y + 1.5) * c };
}

/** ADR-094: the camera centre drawn now (canvas px) and whether Look is on. */
function cameraOf(v             )                                          {
  const r = v.roomCanvas.getBoundingClientRect();
  const vw = Math.max(1, Math.round(r.width)), vh = Math.max(1, Math.round(r.height));
  const room = v.game.player.run.level.room;
  const cam = lookCamera(v.look, v.game.player.run.world, room.width, room.height, cellSize(vw, vh), vw, vh);
  return { x: cam.x, y: cam.y, look: v.look.on };
}

/**
 * JSON of the room touch state: the walk target, the joystick shown (ADR-051, ADR-055), the pose (ADR-056) and the
 * Neon look numbers (ADR-058), and `camera`, the drawn camera centre in canvas px with `look`, whether Look is on
 * (ADR-094), and `seen`, the cells seen of the open level and its world's cells (ADR-098), null before a frame
 * marked any.
 */
function roomUIOf(v             )         {
  const t = v.game.player.walkTarget;
  const walk = t && (t.kind === 'cell' ? { kind: 'cell', x: t.anchor.x, y: t.anchor.y }
    : { kind: 'robot', model: t.model });
  const touch = v.roomTouch;
  const k = touch?.moved ? knobOffset(touch.at.x - touch.start.x, touch.at.y - touch.start.y) : null;
  const joystick = touch && k && { x: touch.start.x, y: touch.start.y, knobX: touch.start.x + k.x,
    knobY: touch.start.y + k.y, dir: touch.dir, sprint: touch.sprint };
  const p = v.figurePose;
  const figure = p && { facing: p.facing, mode: p.mode, phase: Math.round(p.phase * 1000) / 1000 };
  const map = v.seen.peek(v.game.player);
  const seen = map && { cells: map.count, total: map.total };
  return JSON.stringify({ walk, joystick, figure, look: v.roomLook, camera: cameraOf(v), seen });
}

/** ADR-091: client point of the centre of placed part `id`'s footprint on the board shown. */
function partPointOf(v             , id        )        {
  const s = v.game.editor.session.schematic;
  const pos = s.position(id), fp = footprintOf(s.circuit, id);
  if (!pos || !fp) throw new Error(`${id} is not placed`);
  return clientOf(v, { x: pos.x + fp.width / 2, y: pos.y + fp.height / 2 });
}

/** The hooks of the mounted view `v`: `render` draws a frame, `drawn` is what the last board frame drew. */
function mountHooks(v             , render            , drawn                     )             {
  const game       = v.game;
  /** The hull in client pixels (null outside the interior and the fab). */
  const hullClient = ()              => {
    if (game.screen !== 'interior' && game.screen !== 'fab') return null;
    const r = v.boardCanvas.getBoundingClientRect();
    const h = hullRect(v.boardTransform, game.editor.session.schematic.board);
    return { left: r.left + h.left, top: r.top + h.top, width: h.width, height: h.height };
  };

  /** JSON of the hull rectangle in client pixels, each value rounded to 0.01 (L-15 checks compare it). */
  const boardRect = ()         => {
    const h = hullClient();
    const round = (n        ) => Math.round(n * 100) / 100;
    return JSON.stringify(h && { left: round(h.left), top: round(h.top), width: round(h.width),
      height: round(h.height) });
  };

  /** Client coordinates of a pin on the board, for the headless check. */
  const pinPoint = (pin        )        => clientOf(v, anchorOf(pin, game.editor.session.schematic));

  /** "ok" or the layout problems of the screen as drawn (layout-probe.ts), for the screenshot steps. */
  const problems = ()         => {
    // The probe checks the part of the hull inside the fit area: zoomed, the hull may pass under the clusters.
    let hull = hullClient();
    if (hull && v.boardArea) {
      const r = v.boardCanvas.getBoundingClientRect();
      hull = intersectRect(hull, { ...v.boardArea, left: v.boardArea.left + r.left, top: v.boardArea.top + r.top });
    }
    const list = layoutProblems(collectProbeBoxes(document, hull),
      { width: window.innerWidth, height: window.innerHeight });
    return list.length ? list.join('; ') : 'ok';
  };

  return {
    game, pinPoint, wirePoint: (to) => wirePointOf(v, to), render, layoutProblems: problems, boardRect,
    partPoint: (id) => partPointOf(v, id), boardUI: () => boardUIOf(v, drawn()),
    roomPoint: (x, y) => roomPointOf(v, x, y), roomUI: () => roomUIOf(v),
  };
}

// --- app/view.ts
// DOM side of the web slice: mounts the game, wires input (input.ts), and redraws the screen state, item bar
// and messages; the room and interior canvases are drawn by room-view.ts and interior-view.ts, which also draws the
// fab's bench (ADR-091). Before each board frame it picks the interior layout and fits the board when ADR-046 or
// ADR-091 says so (board-camera.ts). The room and outside views redraw every animation frame so the Neon lab and the
// Explorer animate (ADR-056, ADR-058); under reduced motion (UX.18) they redraw only on change, like the other views.
// The hooks it returns are view-hooks.ts's.








                                                        

                                              



                                                  




                                              
                                                     

const rectOf = (el             , origin                               )       => {
  const r = el.getBoundingClientRect();
  return { left: r.left - origin.left, top: r.top - origin.top, width: r.width, height: r.height };
};

/** ADR-050, ADR-091: a board just shown: no drag, pinch, press, menu, Move or double-tap left over. */
function freshBoardTouch(v             )       {
  v.drag = null;
  v.gesture = { pointers: new Map(), pinch: null, ignored: new Set() };
  resetTouch(v);
}

/**
 * ADR-077: sets the layout mode on `#interior` and the column's strip size on `#playview`, and fits the board when
 * entering from the room or title, when the fab opens or closes into the interior (ADR-091), on Fit, or when the
 * mode, fit area or board size changed. Nothing else moves the board (L-15).
 */
function layoutInterior(v             , from        , to        )       {
  const interior = $('interior');
  const playview = $('playview');
  const canvas = v.boardCanvas.getBoundingClientRect();
  const safe = rectOf($('safe-area'), canvas);
  const board = v.game.editor.session.schematic.board;
  const { mode, area } = chooseLayout(safe, board);
  if (interior.dataset.layout !== mode) {
    interior.dataset.layout = mode;
    playview.style.setProperty('--strip', `${INTERIOR.column}px`);
  }
  if (from === 'room' || from === 'title' || (from === 'fab') !== (to === 'fab')) {
    v.needsFit = true;
    freshBoardTouch(v);
  }
  const sizeChanged = !v.boardSize || v.boardSize.width !== board.width || v.boardSize.height !== board.height;
  if (v.needsFit || mode !== v.boardMode || !sameRect(area, v.boardArea) || sizeChanged) {
    v.boardTransform = fitTransform(area, board);
    v.boardArea = area;
    v.boardMode = mode;
    v.boardSize = { width: board.width, height: board.height };
    v.needsFit = false;
  }
}

/** The view state of a new page: the board at its default scale, nothing dragged, pressed or open (the chip drawer
 *  closed, ADR-088). */
function freshViewContext(game      , invalidate            )              {
  return {
    game, invalidate, drag: null, boardTransform: { scale: 40, ox: 0, oy: 0 },
    boardArea: null, boardMode: null, boardSize: null, needsFit: true, padOpen: false,
    gesture: { pointers: new Map(), pinch: null, ignored: new Set() },
    press: null, menu: null, moving: null, lastTap: null, wireTapAt: null, roomTouch: null,
    chipDrawer: { open: false, armed: null, robot: null, press: null },
    roomCanvas: $                   ('room'), boardCanvas: $                   ('board'),
    figureSeen: unseenMotion(), figurePose: null, frameMs: 0,
    roomCache: { layer: null, glow: new GlowCache() }, roomLook: null,
    look: { ...LOOK_OFF }, seen: new SeenStore(),
  };
}

/** The window's timers, for the game's clocks. */
const windowTimers = {
  setTimeout: (f            , ms        ) => window.setTimeout(f, ms),
  clearTimeout: (h         ) => window.clearTimeout(h          ),
};

/** Creates the game, installs input and the first redraw; returns hooks for the headless check. */
function mount()             {
  const game = new Game(windowTimers, browserStorage());
  let frame = 0;
  const invalidate = () => {
    if (frame) return;
    frame = window.requestAnimationFrame((t        ) => {
      frame = 0;
      render(t);
    });
  };
  const v = freshViewContext(game, invalidate);
  let lastScreen         = 'title';
  let drawn                = { loupe: null, theme: null };
  game.onChange = invalidate;
  wireInput(v);
  const chrome = new Chrome(v);

  /** One frame at the animation frame's timestamp `t`; a direct call (the hooks) reuses the last one. */
  function render(t         ) {
    if (t !== undefined) v.frameMs = t;
    // ADR-074: the lift's transition starts from the world about to be drawn, before the chrome follows it.
    game.watchLift(prefersReducedMotion());
    chrome.update();
    const screen = game.screen;
    if (screen !== 'room') endRoomTouch(v);
    v.figurePose = null;
    if (screen === 'interior' || screen === 'fab') {
      layoutInterior(v, lastScreen, screen);
      drawn = renderInterior(v);
    } else if (screen !== 'title') renderRoom(v, game.player.run.world, game.player.shownRun, v.frameMs);
    // ADR-091: leaving the fab into the room or outside view drops the bench's touch state.
    if (lastScreen === 'fab' && screen !== 'fab' && screen !== 'interior') freshBoardTouch(v);
    lastScreen = screen;
    // ADR-056, ADR-058: the room and outside views animate every frame, still and unlooped under reduced motion.
    if ((screen === 'room' || screen === 'outside') && !prefersReducedMotion()) invalidate();
  }

  invalidate();
  return mountHooks(v, render, () => drawn);
}

// Re-exported so the pin tables stay referenced by the bundle (and handy in the console).
const pinTables = { inputPins, outputPins };

// --- app/main.ts
// Browser entry point.



const hooks = mount();
const { game, render } = hooks;
// Debug hook (like the iOS `debug.state`): read by tools/check-app.ts and handy in the console. Besides the mount
// hooks (view-hooks.ts), `levels` is the bundled level text table, so a check can break a level file, or add a test
// fixture and open it with `game.openPuzzle` (ADR-078). `seedChips` fills the active session's chip library
// from Circuit JSONs (ADR-088, ADR-095), a shortcut for checks; in play the fab burns and finds chips (ADR-091).
(window       ).rewired = {
  ...hooks, levels: LEVEL_TEXTS,
  state: () => game.debugState(),
  // `step` is the one bench or room tick the player no longer has a control for (ADR-096), for the checks.
  step: () => { if (game.screen === 'fab') game.fab.step(); else game.player.step(); render(); },
  seedChips: (circuits                    ) => { const ids = game.shelf.seed(circuits); render(); return ids; },
};

})();

</script>
</body>
</html>
