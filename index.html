// edits are `BoardEditor`'s (board-editor.ts, ADR-091). DOM-free.


                                                                                                  


                                                         



// MARK: - Editor model (CircuitEditorModel)

/** Each kind's name in messages; `chip` and `chipPins` are ADR-081's and ADR-088's "Chip" and "Pins". */
const KIND_TITLE                                = {
  and: 'AND', or: 'OR', not: 'NOT', srFlipFlop: 'SR', chip: 'Chip', chipPins: 'Pins', robot: 'Robot',
  antenna: 'Antenna', battery: 'Battery', arm: 'Arm',
};
const kindTitle = (k               ) => KIND_TITLE[k];

function describePin(r        )         {
  const m = /^(bumper|thruster)([NESW])$/.exec(r.pin);
  if (m) return `${m[1]} ${m[2]}`;
  const label = PIN_LABELS[r.pin];
  if (label && r.component in PART_PINS) return `${r.component} ${label}`;
  return `${r.component} ${r.pin === 'qBar' ? 'Q̄' : r.pin}`;
}

/** Player-facing text for a refused edit (EditorMessage.swift, shortened). */
function editMessage(e         )         {
  if (!(e instanceof GameCoreError)) return String(e);
  const d = e.detail       ;
  switch (e.code) {
    case 'kindNotAllowed': return `This robot has no ${kindTitle(d)} parts.`;
    case 'limitReached': return `No ${kindTitle(d.kind)} left: this level allows ${d.max}.`;
    case 'locked': return 'That part is locked.';
    case 'outOfBounds': return 'That does not fit on the board.';
    case 'overlap': return `That spot is taken by ${d}.`;
    case 'noFreePosition': return `No room on the board for ${kindTitle(d)}.`;
    case 'notOutputAndInput': return 'A wire joins one output and one input.';
    case 'inputAlreadyDriven': return `${describePin(d.input)} already has a wire. Cut it first.`;
    case 'notConnected': return 'No wire goes into that pin.';
    case 'figureOutside': return 'Edit the circuit from inside the robot.';
    case 'holdFull': return 'The hold is full.';
    case 'armInUse': return 'The arm is holding something.';
    case 'idInUse': return `A part named ${d} is already on the board.`;
    case 'boardTooSmall': return `No room for the part on the ${d} wall.`;
    default: return `${e.domain}.${e.code}`;
  }
}

/** ADR-070, ADR-091: the robots' board editor: one history per robot, the circuit handed to the run. */
class EditorModel extends BoardEditor {
  player        ;
          histories                                ;

  /** `sessions`: one session (for the run's current robot) or one per robot model (ADR-070). */
  constructor(sessions                                                        , player        ) {
    super();
    this.player = player;
    this.histories = historiesOf(sessions, player.run.current);
  }

  /** ADR-069, ADR-070: the current robot's history; the first one when that robot has none. */
          get history()                {
    // Non-null: `histories` always holds at least one entry.
    return this.histories.get(this.player.run.current) ?? this.histories.values().next().value ;
  }

  /** The current robot's editor session (ADR-069, ADR-070). */
  get session()                { return this.history.session; }
  get canUndo()          { return this.history.undo.length > 0; }
  get canRedo()          { return this.history.redo.length > 0; }
  get loops()                  { return this.session.loops; }

  /** Runs one edit on the current robot; on success records its undo and hands the circuit to the run (ADR-021). */
  edit(action                            )          {
    const h = this.history;
    const before = h.session.schematic;
    try {
      action(h.session);
    } catch (e) {
      this.message = editMessage(e);
      this.player.onChange();
      return false;
    }
    if (h.session.schematic !== before) {
      h.undo.push(before);
      h.redo = [];
    }
    this.message = null;
    this.apply();
    return true;
  }

  /** Undoes the current robot's last edit (ADR-070). */
  undo()       {
    const h = this.history;
    const prev = h.undo.pop();
    if (!prev) return;
    h.redo.push(h.session.schematic);
    h.session.schematic = prev;
    this.clearSelection();
    this.apply();
  }

  /** Redoes the current robot's last undone edit (ADR-070). */
  redo()       {
    const h = this.history;
    const next = h.redo.pop();
    if (!next) return;
    h.undo.push(h.session.schematic);
    h.session.schematic = next;
    this.clearSelection();
    this.apply();
  }

  /** ADR-091: a redraw through the player's change hook. */
            changed()       {
    this.player.onChange();
  }

  /** While the circuit has a loop the run keeps its last circuit that compiled (ADR-021). */
          apply()       {
    const loops = this.session.loops;
    if (loops.length > 0) {
      const through = loops.map((l) => l.join(', ')).join('; ');
      this.message = `Loop through ${through}: the robot keeps its last working circuit.`;
      this.player.onChange();
      return;
    }
    try {
      this.player.replaceCircuit(this.session.schematic.circuit);
    } catch (e) {
      this.message = editMessage(e);
      this.player.onChange();
    }
  }

  /**
   * "Restore starting circuit" (ADR-043): one undoable edit of the current robot's circuit (ADR-070) back to its
   * start with the robot's parts now (ADR-073); the run pauses, tick, world and items stay.
   */
  restoreStartingCircuit()       {
    this.player.setRunning(false);
    this.clearSelection();
    this.edit((s) => s.restoreStartingCircuit());
  }

  /**
   * ADR-066, ADR-073: rebuilds robot `model`'s session on the run's equipment for it: its schematic and its starting
   * schematic (from `origin`) matched with `schematicWithParts`; its Undo and Redo, the selection and the message
   * cleared. A model without a history does nothing.
   */
  refit(model            )       {
    const h = this.histories.get(model);
    if (!h) return;
    refitHistory(h, this.player.run.equipmentOf(model));
    this.clearSelection();
    this.message = null;
  }

  /** ADR-073: `refit` for every robot whose session's parts differ from the run's (after a Reset). */
  syncParts()       {
    for (const [model, h] of this.histories) {
      if (!h.session.equipment.sameParts(this.player.run.equipmentOf(model))) this.refit(model);
    }
  }

  /** ADR-074: robot `model`'s current schematic (its history's session), else the current robot's. */
  schematicOf(model            )            {
    return (this.histories.get(model) ?? this.history).session.schematic;
  }

  /** Replaces every robot's history with a fresh one on `sessions` (a new puzzle or Play again, ADR-070). */
  restart(sessions                                        )       {
    this.histories = historiesOf(sessions, this.player.run.current);
    this.clearSelection();
    this.message = null;
  }
}

// --- app/bench-editor.ts
// The fab bench's board editor (ADR-091): every edit goes through `ChipBench.edit` (ADR-090) with its own Undo and
// Redo of schematics; a loop shows the bench's loop message and stops the bench's Run; a tap on a switch terminal
// (`pins.i1` to `pins.i4`) with no pin selected toggles that switch. DOM-free.


                                                                                                 



/** ADR-091: what the bench editor tells its fab: a redraw, and a loop made by an edit (Run stops). */
                      
                  
                 
 

/** ADR-091: "Loop through <ids>: the bench cannot tick.", the ids joined as in the interior's loop message. */
function benchLoopText(loops                                     )         {
  return `Loop through ${loops.map((l) => l.join(', ')).join('; ')}: the bench cannot tick.`;
}

/** ADR-091: whether `pin` is a switch terminal of the bench (`pins.i1` to `pins.i4`). */
function isSwitchPin(pin        )          {
  return pin.component === CHIP_PINS_ID && CHIP_INPUT_PINS.includes(pin.pin);
}

/** ADR-091: the bench's board editor; its Undo and Redo hold schematics, and switches are never undone. */
class BenchEditor extends BoardEditor {
                   bench           ;
                   hooks            ;
          undoStack              = [];
          redoStack              = [];

  /** ADR-091: an editor over `bench`, telling `hooks` of redraws and loops. */
  constructor(bench           , hooks            ) {
    super();
    this.bench = bench;
    this.hooks = hooks;
  }

  /** ADR-090, ADR-091: a copy of the bench's session, for reads. */
  get session()                { return this.bench.session; }
  /** ADR-091: whether the bench has an edit to undo. */
  get canUndo()          { return this.undoStack.length > 0; }
  /** ADR-091: whether the bench has an undone edit to redo. */
  get canRedo()          { return this.redoStack.length > 0; }
  /** ADR-090: the bench's combinational loops; empty when it compiles. */
  get loops()                  { return this.bench.loops; }

  /**
   * ADR-091: one bench edit (`ChipBench.edit`); a refusal shows the core's message and changes nothing; a change is
   * recorded for Undo and empties Redo; then the loop check.
   */
  edit(action                            )          {
    const before = this.bench.schematic;
    try {
      this.bench.edit(action);
    } catch (e) {
      this.message = editMessage(e);
      this.hooks.changed();
      return false;
    }
    if (this.bench.schematic !== before) {
      this.undoStack.push(before);
      this.redoStack = [];
    }
    this.checkLoops();
    return true;
  }

  /** ADR-091: back to the schematic before the last edit; the selection is cleared. */
  undo()       {
    const prev = this.undoStack.pop();
    if (!prev) return;
    this.redoStack.push(this.bench.schematic);
    this.swapTo(prev);
  }

  /** ADR-091: forward to the schematic of the last undone edit; the selection is cleared. */
  redo()       {
    const next = this.redoStack.pop();
    if (!next) return;
    this.undoStack.push(this.bench.schematic);
    this.swapTo(next);
  }

  /**
   * ADR-091: a tap on a switch terminal with no pin selected toggles that switch (not undoable, like a tick); with a
   * pin selected, or on any other pin, tap-to-wire (ADR-050). A double tap toggles twice.
   */
  tapPin(pin        , doubleTap = false)       {
    if (this.selectedPin === null && isSwitchPin(pin)) {
      this.bench.toggleSwitch(pin.pin);
      this.hooks.changed();
      return;
    }
    super.tapPin(pin, doubleTap);
  }

  /** ADR-091: after "Open on bench": Undo, Redo, the selection and the message cleared. */
  opened()       {
    this.undoStack = [];
    this.redoStack = [];
    this.clearSelection();
    this.message = null;
    this.hooks.changed();
  }

            changed()       {
    this.hooks.changed();
  }

          swapTo(schematic           )       {
    this.bench.edit((s) => { s.schematic = schematic; });
    this.clearSelection();
    this.checkLoops();
  }

  /** The bench's loop message and a stopped Run while it has a loop, else no message. */
          checkLoops()       {
    const loops = this.bench.loops;
    if (loops.length > 0) {
      this.message = benchLoopText(loops);
      this.hooks.onLoop();
    } else this.message = null;
    this.hooks.changed();
  }
}

// --- app/fab-model.ts
// The fab view's state (ADR-082, ADR-091): open or not, the bench's editor and its own clock (Run, "Reset bench";
// one tick through the `rewired.step()` debug hook, ADR-096), the chip a pending question acts on, Burn's message
// place, the burned chip's fly and its announcement. The flow that opens, leaves and burns is fab-flow.ts; the chrome
// is fab-chrome.ts. DOM-free.


                                                                      

                                                  

                                                

/** ADR-091: how long the burned chip flies from Burn to the Chips tool, in ms. */
const BURN_FLY_MS = 400;

/** ADR-091: the fab view's state: open or not, the bench's editor and clock, Burn's message and fly. */
class FabModel {
  /** ADR-091: the bench's board editor (`Game.editor` while the fab is open). */
           editor             ;
  /** ADR-091: the chip a pending `replaceBench` or `scrapChip` question acts on, else null. */
  pending                = null;
  /** ADR-091: the screen-reader announcement of the last burn ("Chip <n> burned."), else null. */
  announcement                = null;
  #open = false;
  #handled                    = null;
  #runHandle          = null;
  #flyHandle          = null;
  #flying                = null;
  #shown            ;
  #sinceShown = 0;
  #burnText                = null;
                   bench           ;
                   timers        ;
                   changed            ;

  /** ADR-091: the fab over the game-wide `bench`, ticking on `timers`, redrawing through `changed`. */
  constructor(bench           , timers        , changed            ) {
    this.bench = bench;
    this.timers = timers;
    this.changed = changed;
    this.#shown = this.snapshot();
    this.editor = new BenchEditor(bench, {
      changed: () => {
        this.showNow();
        this.changed();
      },
      onLoop: () => this.setRunning(false),
    });
  }

  /**
   * UX.19, ADR-091: what the fab draws: the bench's signals as of the last refresh, which is every DISPLAY_STRIDE
   * running ticks and at once on Pause, a debug step (`rewired.step()`), Reset bench, a switch tap, an edit and
   * opening the fab.
   */
  get shown()             { return this.#shown; }
  /** ADR-091: whether the fab view is open. */
  get isOpen()          { return this.#open; }
  /** ADR-091: whether the bench's Run is on. */
  get isRunning()          { return this.#runHandle !== null; }
  /** ADR-091: the chip just burned, for BURN_FLY_MS after the burn (never under reduced motion); else null. */
  get flying()                { return this.#flying; }
  /** ADR-091: true while the bench editor's message came from Burn (shown next to Burn). */
  get messageAtBurn()          { return this.#burnText !== null && this.editor.message === this.#burnText; }

  /** ADR-091: marks the fab open; only `openFabIn` (fab-flow.ts) calls it. */
  open()       {
    this.#open = true;
    this.#burnText = null;
    this.showNow();
  }

  /** ADR-091: stops the bench's Run and marks the fab closed; only `leaveFabIn` (fab-flow.ts) calls it. */
  close()       {
    this.setRunning(false);
    this.#open = false;
    this.#burnText = null;
    this.pending = null;
  }

  /** ADR-091: true the first time `world` is offered (the walk-in rule: one opening per world); only fab-flow.ts. */
  claim(world            )          {
    if (world === this.#handled) return false;
    this.#handled = world;
    return true;
  }

  /**
   * ADR-091: Run ticks the bench every 1000 / TICKS_PER_SECOND ms and redraws after each tick; with a loop it shows
   * the loop message instead and stays paused.
   */
  setRunning(on         )       {
    if (!on) {
      if (this.#runHandle !== null) this.timers.clearTimeout(this.#runHandle);
      this.#runHandle = null;
      this.showNow();
      this.changed();
      return;
    }
    if (this.#runHandle !== null || this.refuseLoop()) return;
    const loop = () => {
      this.#runHandle = null;
      if (this.refuseLoop()) return;
      this.bench.step();
      if (++this.#sinceShown >= DISPLAY_STRIDE) this.showNow();
      this.#runHandle = this.timers.setTimeout(loop, 1000 / TICKS_PER_SECOND);
      this.changed();
    };
    this.#runHandle = this.timers.setTimeout(loop, 1000 / TICKS_PER_SECOND);
    this.#sinceShown = 0;
    this.showNow();
    this.changed();
  }

  /**
   * ADR-091, ADR-096: one bench tick while paused, called by the `rewired.step()` debug hook; the loop message instead
   * while the bench has a loop.
   */
  step()       {
    if (this.isRunning || this.refuseLoop()) return;
    this.bench.step();
    this.showNow();
    this.changed();
  }

  /** ADR-090, ADR-091: "Reset bench": Run stops, tick 0, flip-flops and switches off, the circuit kept. */
  resetBench()       {
    this.setRunning(false);
    this.bench.reset();
    this.showNow();
    this.changed();
  }

  /** ADR-091: a burn's refusal `text`, shown next to Burn. */
  refuseBurn(text        )       {
    this.editor.message = text;
    this.#burnText = text;
    this.changed();
  }

  /**
   * ADR-091: chip `id` was burned: no text on screen, the announcement for screen readers, and the fly for
   * BURN_FLY_MS unless `reduced` (UX.18).
   */
  burned(id        , reduced         )       {
    this.editor.message = null;
    this.#burnText = null;
    this.announcement = `Chip ${chipNumber(id)} burned.`;
    if (this.#flyHandle !== null) this.timers.clearTimeout(this.#flyHandle);
    this.#flyHandle = null;
    this.#flying = reduced ? null : id;
    if (!reduced) {
      this.#flyHandle = this.timers.setTimeout(() => {
        this.#flyHandle = null;
        this.#flying = null;
        this.changed();
      }, BURN_FLY_MS);
    }
    this.changed();
  }

  /** Refreshes the shown snapshot from the bench now. */
          showNow()       {
    this.#shown = this.snapshot();
    this.#sinceShown = 0;
  }

          snapshot()             {
    return { signals: this.bench.signals, switches: new Set(CHIP_INPUT_PINS.filter((p) => this.bench.switchOn(p))) };
  }

  /** While the bench has a loop: Run stops and the loop message shows; true then. */
          refuseLoop()          {
    const loops = this.bench.loops;
    if (loops.length === 0) return false;
    if (this.#runHandle !== null) this.timers.clearTimeout(this.#runHandle);
    this.#runHandle = null;
    this.editor.message = benchLoopText(loops);
    this.showNow();
    this.changed();
    return true;
  }
}

// --- app/fab-flow.ts
// The fab view's flow (ADR-082, ADR-091), split from Game as part-menu.ts is: opening it by walking into a console
// (the player's change hook) or from "Chip fab", leaving it, Burn and its texts, "Open on bench" and "Scrap" with
// their questions; each change that matters writes the campaign save (`saveChipsIn`, ADR-092). DOM-free.


                                                                                         

                                            


/** ADR-082's refusal texts for Burn, and ADR-091's for a chip that does not fit on the bench. */
const BURN_TEXTS                                   = {
  noOutputs: 'No output pin is wired.',
  tooDeep: 'Chips nest at most 4 deep.',
  tooLarge: 'A chip holds at most 64 parts.',
  libraryFull: 'The chip library is full.',
  numbersUsedUp: 'No chip numbers are left.',
  benchFull: 'The chip does not fit on the bench.',
};

/** ADR-082, ADR-091: the player-facing text of a Burn or "Open on bench" refusal; other errors as in the interior. */
function burnMessage(e         )         {
  if (!(e instanceof GameCoreError)) return editMessage(e);
  if (e.domain === 'ChipError' && e.code in BURN_TEXTS) return BURN_TEXTS[e.code];
  if (e.code === 'combinationalLoops') {
    return `Loop through ${(e.detail                   ).map((l) => l.join(', ')).join('; ')}.`;
  }
  return editMessage(e);
}

/**
 * ADR-091: opens the fab: Run and all steering stop, the dialog closes; with `names` (a console's) the visit finds
 * them into the library ("No chip numbers are left." when numbers ran out); null (the Menu's "Chip fab") visits
 * nothing.
 */
function openFabIn(game      , names                          )       {
  game.player.setRunning(false);
  game.dialog = null;
  let message                = null;
  if (names) {
    try {
      const visit = game.shelf.visit(names);
      if (!visit.numbersLeft) message = BURN_TEXTS.numbersUsedUp;
      if (visit.found.length > 0) saveChipsIn(game);
    } catch (e) {
      message = burnMessage(e);
    }
  }
  game.fab.open();
  game.fab.editor.message = message;
  game.onChange();
}

/** ADR-091: "Leave fab": the bench's Run stops, the dialog closes, the screen the fab was opened from shows, paused. */
function leaveFabIn(game      )       {
  game.dialog = null;
  game.fab.close();
  saveChipsIn(game);
  game.onChange();
}

/**
 * ADR-091, the walk-in rule, after every tick and paused move: when the run's last change walked the figure into
 * the console and that world was not handled yet, the fab opens with the console's chips.
 */
function watchFabIn(game      )       {
  const run = game.player.run;
  if (!run.enteredFab || game.fab.isOpen || !game.fab.claim(run.world)) return;
  openFabIn(game, run.level.fab?.chips ?? []);
}

/** ADR-082, ADR-091: Burn: the library gains the chip and it flies to the Chips tool (none when `reduced`). */
function burnIn(game      , reduced         )       {
  try {
    game.fab.burned(game.shelf.burn().id, reduced);
    saveChipsIn(game);
  } catch (e) {
    game.fab.refuseBurn(burnMessage(e));
  }
}

/** ADR-091: "Scrap" is offered for a burned chip only (not in `library.found`). */
function scrapOffered(library             , id        )          {
  return library.chip(id) !== null && !library.found.has(id);
}

/** ADR-082, ADR-091: replaces the bench with `chip` laid out; Run stops; `benchFull` shows its text. */
function openNow(game      , chip                )       {
  const fab = game.fab;
  fab.setRunning(false);
  try {
    game.shelf.bench.openOnBench(chip);
    fab.editor.opened();
    saveChipsIn(game);
  } catch (e) {
    fab.editor.message = burnMessage(e);
    game.onChange();
  }
}

/** ADR-082, ADR-091: "Open on bench": at once on an empty bench, else the `replaceBench` question. */
function askOpenOnBenchIn(game      , id        )       {
  const chip = game.chipLibrary.chip(id);
  if (!chip) return;
  if (game.shelf.bench.isEmpty) {
    openNow(game, chip);
    return;
  }
  game.fab.pending = id;
  game.dialog = 'replaceBench';
}

/** ADR-091: "Replace" in the `replaceBench` question. */
function openOnBenchIn(game      )       {
  const chip = game.fab.pending === null ? null : game.chipLibrary.chip(game.fab.pending);
  game.fab.pending = null;
  game.dialog = null;
  if (chip) openNow(game, chip);
}

/** ADR-082, ADR-091: "Scrap": the `scrapChip` question, only for a burned chip. */
function askScrapIn(game      , id        )       {
  if (!scrapOffered(game.chipLibrary, id)) return;
  game.fab.pending = id;
  game.dialog = 'scrapChip';
}

/** ADR-091: "Scrap" in the `scrapChip` question: the chip leaves the library only; placed copies stay. */
function scrapIn(game      )       {
  const id = game.fab.pending;
  game.fab.pending = null;
  game.dialog = null;
  if (id === null) return;
  try {
    game.shelf.scrap(id);
    saveChipsIn(game);
  } catch (e) {
    game.fab.editor.message = burnMessage(e);
  }
  game.onChange();
}

// --- app/hold-menu.ts
// The play Menu's Put and Take (ADR-065, ADR-071), split from Game as part-menu.ts holds Fit and Remove: what the
// Menu offers and the Put or Take tap. DOM-free.


                                                 
                                            



/** ADR-071: Put and Take exist only in a campaign level's interior. */
function holdsShownIn(game      )          {
  return game.screen === 'interior' && game.player.run.level.lift !== null;
}

/**
 * ADR-065, ADR-071: the kinds "Put <item> in hold" offers, in ITEM_KINDS order: each kind in the inventory while the
 * ridden robot has a free slot; none outside a campaign level's interior.
 */
function stowableIn(game      )             {
  if (!holdsShownIn(game)) return [];
  const run = game.player.run;
  if (!riddenSlots(run).includes(null)) return [];
  return ITEM_KINDS.filter((k) => run.world.inventory.includes(k));
}

/** ADR-065, ADR-071: the kinds "Take <item> from hold" offers: each kind in the ridden robot's hold. */
function takeableIn(game      )             {
  if (!holdsShownIn(game)) return [];
  const run = game.player.run;
  const ridden = robotStates(run.world).find((r) => r.model === run.current);
  return ITEM_KINDS.filter((k) => ridden?.hold.some((h) => h.kind === k) ?? false);
}

/** ADR-071: a Put or Take tap: closes the Menu and passes the item; a refusal shows its message (UX.23). */
function passItemIn(game      , action                 , kind          )       {
  game.dialog = null;
  try {
    game.player.passItem(action, kind);
  } catch (e) {
    game.robotEditor.message = editMessage(e);
    game.player.onChange();
  }
}

// --- app/part-state.ts
// What the fitted robot parts show (ADR-045): each part's pins on or off in the shown signals, the battery's
// bars, the arm's holding (a crate, or the robot it tows, ADR-072), and the interior canvas's accessible
// description. DOM-free.


             
                                                                                           
                          





/** ADR-045: lit bars of four, ceil(4 x charge / capacity); LOW (ADR-031) is on exactly when this is at most 1. */
function chargeBars(charge        , capacity        )         {
  if (!(capacity > 0) || charge <= 0) return 0;
  return Math.min(4, Math.floor((4 * charge + capacity - 1) / capacity));
}

/** ADR-045: one fitted part with its pins' on/off, the battery's lit bars and the arm's holding. */
                            
                  
                  
                                        
                                                   
                      
                                                                                       
                          
                                                                            
                            
 

/**
 * ADR-045, ADR-070, ADR-072: the state of each fitted part in the order antenna, battery, arm, from the shown run:
 * `robot`'s own charge and claw (a robot state, or the world, whose top-level keys are the first robot's), and
 * `towing`, the robot its claw tows (null for none or a crate).
 */
function partStates(
  s           , signals              , robot                                        , capacity               ,
  towing                    = null,
)              {
  const out              = [];
  for (const part of ROBOT_PARTS) {
    const c = s.circuit.components.find((k) => k.kind === part);
    if (!c) continue;
    out.push({
      part, id: c.id,
      pins: PART_PINS[part].map((pin) => ({ pin, on: signals.get({ component: c.id, pin }) })),
      bars: part === 'battery' && robot.charge !== null && capacity !== null
        ? chargeBars(robot.charge, capacity) : null,
      holding: part === 'arm' ? robot.holding : null,
      towing: part === 'arm' && robot.holding ? towing : null,
    });
  }
  return out;
}

/**
 * One part's sentence of the description (ADR-045), for example `Battery LOW off, 3 of 4 bars`; a towing arm says
 * "holding <Name>" (ADR-072).
 */
function describePart(p           )         {
  const pins = p.pins.map((q) => `${PIN_LABELS[q.pin]} ${q.on ? 'on' : 'off'}`);
  if (p.bars !== null) pins.push(`${p.bars} of 4 bars`);
  const held = p.towing ? `holding ${BOARD_THEMES[p.towing].name}` : 'holding a crate';
  if (p.holding !== null) pins.push(p.holding ? held : 'empty');
  return `${kindTitle(p.part)} ${pins.join(', ')}`;
}

const pinName = (r        ) => `${r.component}.${r.pin}`;

/** The selected-pin or selected-wire sentence (ADR-050), with a leading space; empty when neither. */
function describeSelection(s           , sel                                             )         {
  const from = sel.wire && s.circuit.driver(sel.wire);
  if (sel.wire && from) return ` Selected wire: ${pinName(from)} to ${pinName(sel.wire)}.`;
  return sel.pin ? ` Selected pin: ${pinName(sel.pin)}.` : '';
}

/** A placed part's name in the description: "NOT n1", or for a chip "chip <n> <id>" (ADR-088). */
function describePlaced(s           , id             )         {
  const chip = s.circuit.chip(id);
  // Non-null: `id` is a placement's component.
  return chip ? `chip ${chipNumber(chip.id)} ${id}` : `${kindTitle(s.circuit.component(id) .kind)} ${id}`;
}

/**
 * The board canvas's accessible description; parts per ADR-045, a chip as "chip <n> <id>" (ADR-088); a selected
 * wire gets its sentence (ADR-050). With a robot `name` (several robots, ADR-070) it starts "<name> circuit.", else
 * "Robot circuit.".
 */
function describeCircuit(
  s           , signals              , parts                      , sel                                             ,
  name                = null,
)         {
  const fitted = parts.length > 0 ? ` Robot parts: ${parts.map(describePart).join('; ')}.` : '';
  const pick = describeSelection(s, sel);
  return `${name ?? 'Robot'} circuit. ${describeBoardParts(s, signals)} ${describeWalls(signals)}${fitted}${pick}`;
}

/** "Parts: <placed>. Wires: <from> to <to> on|off; ...." of a board, robot or bench (ADR-045, ADR-091). */
function describeBoardParts(s           , signals              )         {
  const placed = s.placements.map((p) => describePlaced(s, p.component.id));
  const wires = s.circuit.connections.map((c) => `${pinName(c.from)} to ${pinName(c.to)} ` +
    `${signals.get(c.from) ? 'on' : 'off'}`);
  return `Parts: ${placed.join(', ') || 'none'}. Wires: ${wires.join('; ') || 'none'}.`;
}

// --- app/part-menu.ts
// The play Menu's Fit and Remove flow (ADR-066, ADR-073), split from Game as menu-chrome.ts is from the Menu: what

// changes parts (against the arrival, ADR-074). DOM-free.


                                                  

                                            

/** The parts "Fit <part>" offers, in FOUND_PARTS order: each in the inventory and not fitted on the ridden robot. */
function fittableParts(game      )              {
  if (!game.holdsShown) return [];
  const run = game.player.run;
  const eq = run.equipmentOf(run.current);
  return FOUND_PARTS.filter((p) => run.world.inventory.includes(p) && !eq.has(p));
}

/** The parts "Remove <part>" offers: each antenna or arm fitted on the ridden robot. */
function removableParts(game      )              {
  if (!game.holdsShown) return [];
  const run = game.player.run;
  return FOUND_PARTS.filter((p) => run.equipmentOf(run.current).has(p));
}

/** A fit or remove, then the ridden robot's session rebuilt; a refusal's message instead (UX.23). */
function changePart(game      , act            )       {
  try {
    act();
    game.robotEditor.refit(game.player.run.current);
  } catch (e) {
    game.robotEditor.message = editMessage(e);
    game.player.onChange();
  }
}

/** A Fit tap: closes the Menu, fits `part` (Run pauses), rebuilds the ridden robot's session, Undo and Redo emptied. */
function fitPartIn(game      , part           )       {
  game.dialog = null;
  changePart(game, () => game.player.fitPart(part));
}

/**
 * A Remove tap: "Remove the <part>?" opens, except that while the ridden robot's arm holds something "Remove arm"
 * closes the Menu and shows "The arm is holding something." (UX.23).
 */
function askRemoveIn(game      , part           )       {
  const run = game.player.run;
  if (part === 'arm' && robotStates(run.world).find((r) => r.model === run.current)?.holding) {
    game.dialog = null;
    game.robotEditor.message = 'The arm is holding something.';
    game.player.onChange();
    return;
  }
  game.removing = part;
  game.dialog = 'removePart';
}

/** "Remove" in the confirmation: removes the part asked about, as `fitPartIn` does a fit. */
function removePartIn(game      )       {
  const part = game.removing;
  game.dialog = null;
  game.removing = null;
  if (part) changePart(game, () => game.player.removePart(part));
}

/**
 * Whether any robot's parts differ from its arrival parts (the level's in a file opened with `openPuzzle`): a Reset
 * then takes parts and their wires off (ADR-073, ADR-074).

function partsChanged(game      )          {
  const run = game.player.run;

// --- app/save-store.ts
// The save on the host's storage (ADR-068, ADR-075): the keys, `browserStorage` and `SaveStore`, which catches every
// storage error so a missing, full or blocked storage plays on without a message. DOM-free: the storage is injected.



/** ADR-068: the localStorage key of the save. */
const SAVE_KEY = 'rewired.save';
/** ADR-018, ADR-068: where an unreadable save is kept. */
const UNREADABLE_KEY = 'rewired.save.unreadable';

/** The part of `Storage` the store uses (a fake in tests). */
                              
                                      
                                            
                                
 

/** ADR-075: `window.localStorage`, or null when it is missing or reading it throws. */
function browserStorage()                     {
  try {
    return (globalThis                                  ).localStorage ?? null;
  } catch {
    return null;
  }
}

/** ADR-075: what `read` found. */
                                                                                                    

/** ADR-068, ADR-075: the save on a storage; every storage throw is caught and plays on. */
class SaveStore {
                   storage                    ;
          frozen = false;

  constructor(storage                    ) {
    this.storage = storage;
  }

  /**
   * The save under SAVE_KEY. A text `decode` refuses is copied to UNREADABLE_KEY (replacing an earlier copy) and
   * reported `unreadable`; when that copy cannot be written the store stops writing for the page's life, so the
   * unread text is never overwritten (ADR-018).
   */
  read(levelIDs                   )           {
    let text               ;
    try {
      text = this.storage?.getItem(SAVE_KEY) ?? null;
    } catch {
      return { kind: 'none' };
    }
    if (text === null) return { kind: 'none' };
    try {
      return { kind: 'save', save: SaveGame.decode(text, levelIDs) };
    } catch {
      this.keepUnreadable(text);
      return { kind: 'unreadable' };
    }
  }

          keepUnreadable(text        )       {
    try {
      this.storage?.setItem(UNREADABLE_KEY, text);
    } catch {
      this.frozen = true;
    }
  }

  /** Writes the whole save; nothing while frozen or without storage. */
  write(save          )       {
    if (this.frozen) return;
    try {
      this.storage?.setItem(SAVE_KEY, save.encode());
    } catch {
      // Storage full or blocked: the game plays on, the progress is only in memory.
    }
  }

  /** Removes SAVE_KEY only (the unreadable copy stays); nothing while frozen. */
  clear()       {
    if (this.frozen) return;
    try {
      this.storage?.removeItem(SAVE_KEY);
    } catch {
      // Nothing to do: see `write`.
    }
  }
}

// --- app/chip-shelf.ts
// A session's chip library (ADR-088), the found-chip catalogue it reads (ADR-089) and its bench (ADR-083, ADR-091),
// split from the Game class; each kept session has its own (ADR-095: the tutorial's starts empty, a level file opened
// with `openPuzzle` shares the campaign's). Only `visit`, `burn`, `scrap`, `seed` and `restore` replace the library;
// `saved` is what the campaign save keeps (ADR-092). DOM-free.


                                                                              


/** ADR-088, ADR-091: a session's chip library, catalogue and bench; no level, Reset or Play again clears them. */
class ChipShelf {
  #library              = ChipLibrary.empty;
  /** ADR-089: the bundled found-chip catalogue, decoded at start so a broken bundle fails here, not at a console. */
           catalogue                = chipCatalogue(CHIP_TEXTS);
  /** ADR-083, ADR-091: the session's bench, kept across the fab's opening and leaving, levels, Reset and Play again. */
           bench = new ChipBench();

  /** ADR-088, ADR-091: the chips the drawer offers (read-only; replaced by `visit`, `burn`, `scrap` and `seed`). */
  get library()              { return this.#library; }

  /** ADR-083, ADR-092: the library and the bench's schematic, as the campaign save keeps them. */
  get saved()             { return new SavedChips(this.#library, this.bench.schematic); }

  /**
   * ADR-092: takes `chips` as the library and the bench (`bench.replace`: switches off, tick 0). The bench editor's
   * history is cleared by the caller (`useCampaignIn`).
   */
  restore(chips            )       {
    this.bench.replace(chips.bench);
    this.#library = chips.library;
  }

  /**
   * ADR-089, ADR-091: finds a console's `names` (`visitFab`) into the library; returns the chips found and whether
   * numbers were left. A name the catalogue lacks throws the core's error and changes nothing.
   */
  visit(names                   )                                                             {
    const visit = visitFab(this.#library, names, this.catalogue);
    this.#library = visit.library;
    return { found: visit.found, numbersLeft: visit.numbersLeft };
  }

  /** ADR-090, ADR-091: burns the bench into the library; throws the core's refusal and changes nothing. */
  burn()                 {
    const burned = this.bench.burn(this.#library);
    this.#library = burned.library;
    return burned.chip;
  }

  /**
   * ADR-086, ADR-091: scraps chip `id` from the library (`foundChip` / `unknownChip` from the core); placed copies
   * stay.
   */
  scrap(id        )       {
    this.#library = this.#library.scrap(id);
  }

  /**
   * ADR-088's debug hook (`rewired.seedChips`): burns each Circuit JSON in order from an empty library, so the first
   * is `chip-1`, and returns their IDs; a bad entry throws the core's error and the library stays as it was. The fab
   * burns and finds chips in play (ADR-091).
   */
  seed(circuits                    )           {
    let library = ChipLibrary.empty;
    for (const json of circuits) library = library.burn(Circuit.fromJSON(json)).library;
    this.#library = library;
    return library.chips.map((c) => c.id);
  }
}

  constructor(kind             , timers        , hooks              , shelf            = new ChipShelf()) {

/** ADR-095: the sessions a `Game` keeps: the campaign (always one), the tutorial and puzzle (at most one each). */
class SessionSet {
  campaign             ;
  tutorial                     = null;
  puzzle                     = null;
  active             ;
           #timers        ;
           #changed            ;
           #activePlayerChanged            ;

  /** `activePlayerChanged` runs (before the redraw) when the active session's player changes: the walk-in rule. */
  constructor(timers        , changed            , activePlayerChanged            ) {
    this.#timers = timers;
    this.#changed = changed;
    this.#activePlayerChanged = activePlayerChanged;
    this.campaign = this.active = this.#make('campaign');
  }

  #make(kind             , shelf            )              {
    const s              = new PlaySession(kind, this.#timers, {
      changed: this.#changed,
      playerChanged: () => {
        if (s === this.active) this.#activePlayerChanged();
        this.#changed();
      },
    }, shelf);
    return s;
  }

  /** Makes `s` the active session; the one it replaces pauses (only the active session's clocks run). */
  switchTo(s             )       {
    if (s !== this.active) this.active.pause();
    this.active = s;
  }

  /** Makes the campaign or tutorial session active, the tutorial's created with an empty shelf when none is kept. */
  activate(kind                         )       {
    if (kind === 'tutorial') this.tutorial ??= this.#make('tutorial');
    this.switchTo(kind === 'tutorial' ? this.tutorial  : this.campaign);
  }

  /**
   * Drops the tutorial session, or replaces the campaign session with a fresh one and drops the puzzle session that
   * shared the old shelf (ADR-099); the campaign is then active.
   */
  drop(kind                         )       {
    this.active.pause();
    if (kind === 'tutorial') this.tutorial = null;
    else {
      this.campaign = this.#make('campaign');
      this.puzzle = null;
    }
    this.active = this.campaign;
  }

  /** Makes the puzzle session (sharing the campaign's shelf, created when none is kept) active. */
  openPuzzle()       {
    this.puzzle ??= this.#make('puzzle', this.campaign.shelf);
    this.switchTo(this.puzzle);
  }

  /** Pauses the active session; a puzzle session is dropped and the campaign becomes active. */
  leave()       {
    this.active.pause();
    if (this.active === this.puzzle) {
      this.puzzle = null;
      this.active = this.campaign;
    }
  }
}

  /** ADR-066, ADR-073: the parts "Remove <part>" offers (part-menu.ts). */

  /** A Remove tap: its confirmation, or the held-arm message (part-menu.ts). */
  askRemove(part           )       { askRemoveIn(this, part); }

  removePart()       { removePartIn(this); }

  /** ADR-026, ADR-073: Reset, then the session of every robot whose parts it changed is rebuilt. */
  reset()       {
    this.player.reset();
    this.robotEditor.syncParts();
  }

  /** The Menu's Reset and the `r` key: asks first when a fitted part would come off with its wires (UX.24). */
  askReset()       {
    if (partsChanged(this)) this.dialog = 'reset';
    else {
      this.reset();

    }
  }

  get screen()         {
    if (!this.started) return 'title';
    if (this.fab.isOpen) return 'fab';
    const f = this.player.world.figure;
    if (!f || !f.isRiding) return 'room';
    return this.lookingOutside ? 'outside' : 'interior';

  /** "Play again": a fresh run and session of the open level file (ADR-040), or the level's or room's arrival. */
  playAgain()       {

  exitRobot()       {

  /** `debug.state` equivalent for the headless check (debug-state.ts). */
  debugState() {
    return debugStateOf(this);
  }

/** The ADR-050 touch state of a fresh view or one just entered: no press, menu, Move or double-tap pending. */
function resetTouch(v             )       {
  if (v.press) window.clearTimeout(v.press.timer);
  v.press = null;

/** Sizes a canvas to its CSS box at the device pixel ratio and returns a 2D context in CSS pixels. */
function sizeCanvas(cv                   )                                                          {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  // Non-null: A 2d context is always available on a fresh canvas that has no other context type.
  const ctx = cv.getContext('2d') ;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

 * content height, `width` its width (ADR-088: the chip drawer's is CHIP_DRAWER_WIDTH).
 */
function menuListRect(
  button      , cluster      , column         , safe      , height        , listWidth = MENU_WIDTH,
)       {
  const width = Math.min(listWidth, safe.width - 2 * MENU_GAP);
  const h = Math.min(height, safe.height - 2 * MENU_GAP);
  const wantLeft = column ? cluster.left + cluster.width + MENU_GAP : cluster.left;
  const wantTop = column ? button.top : cluster.top + cluster.height + MENU_GAP;
  const left = Math.max(safe.left + MENU_GAP, Math.min(wantLeft, safe.left + safe.width - MENU_GAP - width));
  const top = Math.max(safe.top + MENU_GAP, Math.min(wantTop, safe.top + safe.height - MENU_GAP - h));
  return { left, top, width, height: h };
}

/** ADR-088: the chip drawer opens where the Menu list does (`menuListRect`), CHIP_DRAWER_WIDTH wide. */
function chipDrawerRect(button      , cluster      , column         , safe      , height        )       {
  return menuListRect(button, cluster, column, safe, height, CHIP_DRAWER_WIDTH);
}

/** `[r, g, b]` in 0..255 of `#RRGGBB`; throws on any other form. */
function rgbOf(hex        )                           {
  if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) throw new Error(`not a #RRGGBB colour: ${hex}`);
  return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))                            ;
}

const hex2 = (n        ) => n.toString(16).toUpperCase().padStart(2, '0');

/** `#RRGGBB` of whole channel values. */
function hexOf(rgb                   )         {
  return `#${rgb.map(hex2).join('')}`;
}

/** `rgba(r, g, b, alpha)` of `#RRGGBB`. */
function rgba(hex        , alpha        )         {
  const [r, g, b] = rgbOf(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/** WCAG 2.2 relative luminance of `#RRGGBB`. */
function relativeLuminance(hex        )         {
  const lin = (v        ) => {
    const s = v / 255;
    return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  };
  const [r, g, b] = rgbOf(hex).map(lin);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/** WCAG 2.2 contrast ratio of two colours, 1..21; symmetric. */
function contrastRatio(a        , b        )         {
  const la = relativeLuminance(a), lb = relativeLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

/** `src` at `alpha` over `dst` (source-over in sRGB), each channel rounded to a whole value like a canvas. */
function over(dst        , src        , alpha        )         {
  const d = rgbOf(dst), s = rgbOf(src);
  return hexOf(d.map((v, i) => Math.round(v * (1 - alpha) + s[i] * alpha)));
}

/** An unlit battery bar: the robot's trim at half strength over the lens-dark backing (3:1 or more, UX.10). */

}

/** The point at `deg` degrees (clockwise from east) on the circle at (x, y) of radius r, rounded to 0.01. */
function onCircle(x        , y        , r        , deg        )         {
  const a = (deg * Math.PI) / 180;
  const q = (v        ) => Math.round(v * 100) / 100;
  return `${q(x + r * Math.cos(a))} ${q(y + r * Math.sin(a))}`;

// --- app/room-layout.ts
// Where the Neon lab's static room drawing goes (ADR-058), as lists in room cells: wall edges, gap rims and tops,
// floor seams, tile runs and region rectangles, the floor tile shade and the chunks of the static layer a view
// needs. The room's one-cell edge line (cells -1 and width / height) counts as wall; past it is the void. Every
// list is maximal runs in row-major order of their first cell, so drawing them is deterministic. DOM-free.

                                                                  

/** Floor tiles are 4 × 4 cells, so seams never draw the movement grid (ADR-038, L-08). */
const FLOOR_TILE = 4;
/** A wall's top face is drawn this many cells north of its cell. */
const WALL_LIFT = 0.45;
/** The static layer's chunks are this many world cells square. */
const CHUNK_CELLS = 12;

/** A run of cell edges: `side` is the side of the cells x..x+len-1 (along x for north/south, y for east/west). */
                                                                               

/** A rectangle of cells; plain data. */
                                                                                

/** One chunk of the static layer: chunk column and row in world cells / CHUNK_CELLS. */
                                                    

const SIDES                       = ['north', 'east', 'south', 'west'];
const STEP                                      = { north: [0, -1], east: [1, 0], south: [0, 1], west: [-1, 0] };

/** The kind at room cell (x, y): the edge line is `wall`, past it null (the void). */
function kindAt(room      , x        , y        )                  {
  const k = room.tileXY(x, y);
  if (k !== null) return k;
  return x >= -1 && x <= room.width && y >= -1 && y <= room.height ? 'wall' : null;
}

/** Edge runs of the cells (edge line included) that `own` accepts, on sides whose neighbour `faces` accepts. */
function edgeRuns(
  room      , own                          , faces                          , sides = SIDES,
)            {
  const hit = (x        , y        , d           ) => {
    const k = kindAt(room, x, y);
    const n = kindAt(room, x + STEP[d][0], y + STEP[d][1]);
    return k !== null && n !== null && own(k) && faces(n);
  };
  const runs            = [];
  for (const side of sides) {
    const alongX = side === 'north' || side === 'south';
    collectRuns(room, alongX, (x, y) => hit(x, y, side), (x, y, len) => runs.push({ x, y, len, side }));
  }
  return sortRuns(runs);
}

/**
 * Calls `emit` for every maximal run of cells (edge line included) where `test` holds: along x row by row when
 * `alongX`, else along y column by column.
 */
function collectRuns(
  room      , alongX         , test                                   ,
  emit                                             ,
)       {
  const outer = alongX ? room.height : room.width, inner = alongX ? room.width : room.height;
  for (let a = -1; a <= outer; a++) {
    let start                = null;
    for (let b = -1; b <= inner + 1; b++) {
      const on = b <= inner && (alongX ? test(b, a) : test(a, b));
      if (on && start === null) start = b;
      if (!on && start !== null) {
        if (alongX) emit(start, a, b - start); else emit(a, start, b - start);
        start = null;
      }
    }
  }
}

/** Row-major by first cell, then by side (north, east, south, west). */
function sortRuns(runs           )            {
  return runs.sort((p, q) => p.y - q.y || p.x - q.x || SIDES.indexOf(p.side) - SIDES.indexOf(q.side));
}

const isWall = (k          ) => k === 'wall';
const notWall = (k          ) => k !== 'wall';
const walkable = (k          ) => k === 'floor' || k === 'charger';

/** Wall and edge-line cells facing a non-wall room cell; nothing faces the void. */
function wallEdges(room      )            {
  return edgeRuns(room, isWall, notWall);
}

/** Gap cells facing floor, charger or hatch (not walls, not other gap cells). */
function gapRims(room      )            {
  return edgeRuns(room, (k) => k === 'gap', (k) => walkable(k) || k === 'hatch');
}

/** North edges of gap cells whose north neighbour is not gap: where the chasm's depth band goes. */
function gapTops(room      )            {
  return edgeRuns(room, (k) => k === 'gap', (k) => k !== 'gap', ['north']);
}

/**
 * Floor seams: `west` (the default) the west edges of floor and charger cells with x mod 4 = 0 and no wall to
 * their south (those lie under a lifted wall top), merged along y; `north` the north edges of floor and charger
 * cells with y mod 4 = 0, merged along x.
 */
function seamRuns(room      , side                   = 'west')            {
  const runs            = [];
  const open = (x        , y        ) => walkable(room.tileXY(x, y) ?? 'wall');
  const test = side === 'west'
    ? (x        , y        ) => x % FLOOR_TILE === 0 && open(x, y) && kindAt(room, x, y + 1) !== 'wall'
    : (x        , y        ) => y % FLOOR_TILE === 0 && open(x, y);
  collectRuns(room, side === 'north', test, (x, y, len) => runs.push({ x, y, len, side }));
  return sortRuns(runs);
}

/** Horizontal runs of `kind` (the edge line counts as `wall`), as one-row boxes, row-major. */
function tileRuns(room      , kind          )            {
  const out            = [];
  const emit = (x        , y        , len        ) => { out.push({ x, y, width: len, height: 1 }); };
  collectRuns(room, true, (x, y) => kindAt(room, x, y) === kind, emit);
  return out;
}

/** Runs of `kind` merged into rectangles: a run extends the rectangle above it when both span the same columns. */
function regionRects(room      , kind                     )            {
  const done            = [];
  let open            = [];
  const runs = tileRuns(room, kind);
  for (let y = 0; y <= room.height; y++) {
    const row = runs.filter((r) => r.y === y);
    const next            = [];
    for (const r of row) {
      const above = open.find((o) => o.x === r.x && o.width === r.width);
      if (above) { above.height++; next.push(above); } else next.push({ ...r });
    }
    done.push(...open.filter((o) => !next.includes(o)));
    open = next;
  }
  return done.sort((p, q) => p.y - q.y || p.x - q.x);
}

/** The floor tile's shade at room cell (x, y): (⌊x / 4⌋ + ⌊y / 4⌋) mod 2; 1 is NEON.floorA, 0 floorB. */
function tileShade(x        , y        )        {
  const s = Math.floor(x / FLOOR_TILE) + Math.floor(y / FLOOR_TILE);
  return (((s % 2) + 2) % 2)         ;
}

/**
 * The chunks a view needs, row-major: those whose CHUNK_CELLS squares of world cells (room cell x is world cell
 * x + 1; the world is the room and its edge line) intersect the vw × vh view of a frame at cell size `c` and
 * offset (ox, oy) of world cell (0, 0).
 */
function chunksInView(
  f                                                               , room                                   ,
)             {
  const side = CHUNK_CELLS * f.c;
  const range = (o        , view        , cells        )                   => {
    const last = Math.ceil(cells / CHUNK_CELLS) - 1;
    return [Math.max(0, Math.floor(-o / side)), Math.min(last, Math.floor((view - 1 - o) / side))];
  };
  const [x0, x1] = range(f.ox, f.vw, room.width + 2), [y0, y1] = range(f.oy, f.vh, room.height + 2);
  const out             = [];
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) out.push({ cx, cy });
  return out;
}

// --- app/room-motion.ts
// The Neon lab's decorative motion (ADR-058): light sweep, beacon ring, hatch, lens, flame, crystal and lift (ADR-074)
// pulses, all from the frame clock (the requestAnimationFrame timestamp), never the tick, so a paused run still glows
// and the simulation never sees them. Reduced motion (UX.18) gives fixed values. DOM-free.

/** One frame's motion values: `sweepX` in room cells (null: no sweep), the others in 0..1. */
                             
                        
                    
                     
                    
                  
                       
 

/** Periods in ms; the shortest is 400 ms, so nothing changes faster than 3 times a second (UX.19). */
const MOTION_PERIODS_MS = {
  ring: 1250, hatch: 1000, lens: 3000, flicker: 400, crystal: 2600, lift: 2400,
}         ;

/** The sweep's speed in cells per second; it travels from 6 cells before the room to 6 cells past it. */
const SWEEP_CELLS_PER_S = 10;

/** ADR-058's values under reduced motion: no sweep and every pulse still. */
const STILL_MOTION                       = {
  sweepX: null, ringPhase: 0.4, hatchPulse: 0.5, lensPulse: 1, flicker: 1, crystalPulse: 1,
};

/** `ms` modulo `period`, in 0..period even for negative times. */
const wrap = (ms        , period        ) => ((ms % period) + period) % period;

/** 0.5 + 0.5 sin(2π ms / period). */
const pulse = (ms        , period        ) => 0.5 + 0.5 * Math.sin((2 * Math.PI * wrap(ms, period)) / period);

/** The motion at frame time `ms` in a room `roomWidth` cells wide; `reduced` returns STILL_MOTION's values. */
function roomMotion(ms        , reduced         , roomWidth        )             {
  if (reduced) return { ...STILL_MOTION };
  const P = MOTION_PERIODS_MS;
  const travel = roomWidth + 12;
  return {
    sweepX: wrap((ms * SWEEP_CELLS_PER_S) / 1000, travel) - 6,
    ringPhase: wrap(ms, P.ring) / P.ring,
    hatchPulse: pulse(ms, P.hatch),
    lensPulse: pulse(ms, P.lens),
    flicker: pulse(ms, P.flicker),
    crystalPulse: pulse(ms, P.crystal),
  };
}

/** ADR-074: the ready lift's pulse at frame time `ms`, period MOTION_PERIODS_MS.lift; 1 under reduced motion. */
function liftPulse(ms        , reduced         )         {
  return reduced ? 1 : pulse(ms, MOTION_PERIODS_MS.lift);
}

// --- app/robot-heading.ts
// Each robot's facing for the room's light (ADR-059, ADR-070): app-side, worked out from the thruster signals the
// screen shows so the light always matches the flames, and never read by the simulation. DOM-free.

                                                                                      

/** The four thrusters' state, by the direction each pushes. */
                                                                                        

/** A robot faces north at the start of a puzzle and after Reset. */
const ROBOT_START_FACING            = 'north';

/** The thruster signals of the robot in `signals`. */
function thrustOf(signals              )         {
  return {
    north: signals.getKey('robot.thrusterN'), east: signals.getKey('robot.thrusterE'),
    south: signals.getKey('robot.thrusterS'), west: signals.getKey('robot.thrusterW'),
  };
}

/**
 * The facing after a refresh of the shown signals: dx = east - west, dy = south - north; a nonzero dx faces east or
 * west, else a nonzero dy faces south or north, else (no thrust, or opposed thrusters) the facing stays.
 */
function nextFacing(facing           , t        )            {
  const dx = Number(t.east) - Number(t.west);
  if (dx !== 0) return dx > 0 ? 'east' : 'west';
  const dy = Number(t.south) - Number(t.north);
  if (dy !== 0) return dy > 0 ? 'south' : 'north';
  return facing;
}

/** The robot's facing as the app tracks it: refreshed from each shown run, back to north on Reset. */
class RobotFacing {
  facing            = ROBOT_START_FACING;
  refresh(signals              )       { this.facing = nextFacing(this.facing, thrustOf(signals)); }
  reset()       { this.facing = ROBOT_START_FACING; }
}

/** ADR-059, ADR-070: one RobotFacing per robot model, created at north on first use. */
class RobotFacings {
                   byModel = new Map                         ();

  /** Robot `model`'s facing (north until its shown thrust turns it). */
  of(model            )              {
    let f = this.byModel.get(model);
    if (!f) {
      f = new RobotFacing();
      this.byModel.set(model, f);
    }
    return f;
  }

  /** Each of `run`'s robots refreshed from its own shown signals, `run.signalsOf(model)`. */
  refresh(run          )       {
    for (const m of run.models) this.of(m).refresh(run.signalsOf(m));
  }

  /** Every facing back to north (Reset, a new puzzle). */
  reset()       {
    for (const f of this.byModel.values()) f.reset();
  }
}

// --- app/glow-sprites.ts
// Cached glow sprites of the Neon lab (ADR-058): light pools and glows are radial gradients painted once into
// small offscreen canvases and drawn with one `drawImage` each (no canvas shadow blur); the vignette keeps one gradient
// per view size. The robot body and its light cones (ADR-059) use the same cache (robot-view.ts, light-cones.ts).



/** At most this many sprites are kept; the least recently used is dropped first. */
const GLOW_CACHE_SIZE = 64;

/** An offscreen canvas and its size in CSS px. */
                                                                           

/** Sprites by key, least recently used first. */
class GlowCache {
          sprites = new Map                ();
          shade                                               = null;
  /** How many sprites were painted (a hit paints none). */
  painted = 0;

  get size()         { return this.sprites.size; }

  /**
   * The sprite under `key`, painted by `paint` into a w × h CSS px canvas at `dpr` (the context is scaled, so
   * `paint` draws in CSS px) when it is not cached.
   */
  sprite(key        , w        , h        , dpr        , paint                                         )         {
    const hit = this.sprites.get(key);
    if (hit) {
      this.sprites.delete(key);
      this.sprites.set(key, hit);
      return hit;
    }
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil(w * dpr));
    canvas.height = Math.max(1, Math.ceil(h * dpr));
    // Non-null: a fresh canvas always has a 2d context.
    const ctx = canvas.getContext('2d') ;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(ctx);
    this.painted++;
    const s = { canvas, w, h };
    this.sprites.set(key, s);
    // Non-null: the map holds more than GLOW_CACHE_SIZE entries here.
    if (this.sprites.size > GLOW_CACHE_SIZE) this.sprites.delete(this.sprites.keys().next().value );
    return s;
  }

  /** A light pool: `colour` at `alpha` in the centre fading to transparent at `radiusPx`. */
  pool(colour        , alpha        , radiusPx        , dpr        )         {
    const r = radiusPx;
    return this.sprite(`pool|${colour}|${alpha}|${r}|${dpr}`, 2 * r, 2 * r, dpr, (ctx) => {
      const g = ctx.createRadialGradient(r, r, 0, r, r, r);
      g.addColorStop(0, rgba(colour, alpha));
      g.addColorStop(1, rgba(colour, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 2 * r, 2 * r);
    });
  }

  /**
   * ADR-058's vignette over the whole vw × vh view: transparent to 0.3 × the diagonal from the centre, black at
   * VIGNETTE_ALPHA at 0.5 × it (the corners). One gradient per view size.
   */
  vignette(ctx                          , vw        , vh        )       {
    const key = `${vw}x${vh}`;
    if (this.shade?.key !== key) {
      const d = Math.hypot(vw, vh);
      const g = ctx.createRadialGradient(vw / 2, vh / 2, 0.3 * d, vw / 2, vh / 2, 0.5 * d);
      g.addColorStop(0, 'rgba(0, 0, 0, 0)');
      g.addColorStop(1, `rgba(0, 0, 0, ${VIGNETTE_ALPHA})`);
      this.shade = { key, fill: g };
    }
    ctx.fillStyle = this.shade.fill;
    ctx.fillRect(0, 0, vw, vh);
  }
}

/** Draws a round sprite of radius `radiusPx` centred at (x, y), scaled by `scale`, with one `drawImage`. */
function drawSprite(
  ctx                          , s        , x        , y        , radiusPx        , scale = 1,
)       {
  const r = radiusPx * scale;
  ctx.drawImage(s.canvas, x - r, y - r, 2 * r, 2 * r);
}

// --- app/robot-bodies.ts
// The three robot bodies of the room and outside views in the Neon look (ADR-058, ADR-070, from the approved
// `docs/design/robot-exterior/` sheets): Scout's rounded square, Hauler's square with its cargo bed of three slots
// and Relay's octagon with its dish, each filling the 4 × 4 footprint, and the cached body sprite per (model,
// asleep, c, dpr). The geometry is DOM-free; the parts on the hull are in room-parts.ts.

                                                   
                                           
                                                           

                                                   

/** ADR-070: each model's body shape and the sizes of its parts, in cells. */
                            
                                                 
                                                                   
                          
                                                               
                              
                                                                         
                             
 

/** ADR-070: Scout round, Hauler square with a stub whip and a heavy claw, Relay octagonal with a tall whip. */
const ROBOT_BODIES                                          = {
  scout: { shape: 'round', corner: 1, whipHeight: 1.3, clawScale: 1 },
  hauler: { shape: 'square', corner: 0.35, whipHeight: 0.8, clawScale: 1.4 },
  relay: { shape: 'octagon', corner: 1, whipHeight: 2.0, clawScale: 1 },
};

/** ADR-070: a rectangle in px: its top-left corner and size. */
                                                                                 

/** Robot side in cells. */
const BODY_SIDE = 4;

/**
 * ADR-070: the eight corners of an octagon at (x, y), size × size, with chamfer `k` (clockwise from the north-west).
 */
function octagonPoints(x        , y        , size        , k        )          {
  const r = x + size, b = y + size;
  return [
    { x: x + k, y }, { x: r - k, y }, { x: r, y: y + k }, { x: r, y: b - k },
    { x: r - k, y: b }, { x: x + k, y: b }, { x, y: b - k }, { x, y: y + k },
  ];
}

/** ADR-070: Hauler's cargo bed and its three slots in px from the body's top-left, for a cell size `c`. */
function cargoBed(c        )                                                           {
  const bed = { x: 0.55 * c, y: 0.9 * c, width: 2.9 * c, height: 2.0 * c };
  const w = bed.width / 3;
  const slot = (i        )           => ({ x: bed.x + i * w, y: bed.y, width: w, height: bed.height });
  return { bed, slots: [slot(0), slot(1), slot(2)] };
}

/** ADR-070: Relay's dish: centre and radii in px from the body's top-left (`feed` is the feed line's length). */
function dishOf(c        )                                                                                {
  return { x: 2.35 * c, y: 2.0 * c, r: 0.7 * c, inner: 0.45 * c, dot: 0.15 * c, feed: 0.6 * c };
}

/** Traces a closed polygon through `pts` (one `beginPath` included). */
function polygon(ctx                          , pts                  )       {
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
}

/** The body's outline path inset 1 px in its shape (ADR-070). */
function outline(ctx                          , model            , rs        , c        )       {
  const b = ROBOT_BODIES[model];
  if (b.shape === 'octagon') polygon(ctx, octagonPoints(1, 1, rs - 2, b.corner * c));
  else {
    ctx.beginPath();
    ctx.roundRect(1, 1, rs - 2, rs - 2, b.corner * c);
  }
}

/** The inner trim line at alpha 0.35 inset 0.7 cell (Scout, Relay; none for Hauler), dashed while asleep. */
function innerLine(
  ctx                          , model            , look           , asleep         , c        ,
)       {
  if (model === 'hauler') return;
  const rs = BODY_SIDE * c;
  ctx.strokeStyle = rgba(look.trim, 0.35);
  ctx.lineWidth = 1;
  if (asleep) ctx.setLineDash([0.25 * c, 0.25 * c]);
  if (model === 'relay') polygon(ctx, octagonPoints(0.7 * c, 0.7 * c, rs - 1.4 * c, 0.6 * c));
  else {
    ctx.beginPath();
    ctx.roundRect(c * 0.7, c * 0.7, rs - c * 1.4, rs - c * 1.4, c * 0.5);
  }
  ctx.stroke();
  if (asleep) ctx.setLineDash([]);
}

/** Hauler's cargo bed: filled in body with a 1.5 px trim edge, two 1 px ribs in trim at 0.6 between the slots. */
function drawCargoBed(ctx                          , look           , c        )       {
  const { bed, slots } = cargoBed(c);
  ctx.fillStyle = look.body;
  ctx.strokeStyle = look.trim;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bed.x, bed.y, bed.width, bed.height, 0.2 * c);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = rgba(look.trim, 0.6);
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const s of slots.slice(1)) {
    ctx.moveTo(s.x, bed.y);
    ctx.lineTo(s.x, bed.y + bed.height);
  }
  ctx.stroke();
}

/** Relay's dish: a lens-dark disc with a 1.5 px trim ring, an inner ring, a centre dot and a feed line to the NE. */
function drawDish(ctx                          , look           , c        )       {
  const d = dishOf(c);
  ctx.fillStyle = look.lensDark;
  ctx.strokeStyle = look.trim;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = rgba(look.trim, 0.5);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.inner, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = look.trim;
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.dot, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = look.trim;
  ctx.beginPath();
  ctx.moveTo(d.x, d.y);
  ctx.lineTo(d.x + d.feed * Math.SQRT1_2, d.y - d.feed * Math.SQRT1_2);
  ctx.stroke();
}

/**
 * ADR-058, ADR-070: the body sprite per (model, asleep, c, dpr): the body's shape inset 1 px, a radial gradient from
 * body light at (0.35, 0.3) to body at its edge (flat while asleep; pass `asleepLook` then), a 2 px trim stroke, the
 * inner line, and Hauler's cargo bed or Relay's dish.
 */
function bodySprite(
  glow           , model            , look           , asleep         , c        , dpr        ,
)         {
  const rs = BODY_SIDE * c;
  return glow.sprite(`body|${model}|${asleep}|${look.body}|${c}|${dpr}`, rs, rs, dpr, (ctx) => {
    if (asleep) ctx.fillStyle = look.body;
    else {
      const g = ctx.createRadialGradient(rs * 0.35, rs * 0.3, 0, rs * 0.35, rs * 0.3, rs * 0.8);
      g.addColorStop(0, look.bodyLight);
      g.addColorStop(1, look.body);
      ctx.fillStyle = g;
    }
    ctx.strokeStyle = look.trim;
    ctx.lineWidth = 2;
    outline(ctx, model, rs, c);
    ctx.fill();
    ctx.stroke();
    innerLine(ctx, model, look, asleep, c);
    if (model === 'hauler') drawCargoBed(ctx, look, c);
    if (model === 'relay') drawDish(ctx, look, c);
  });
}

// --- app/light-cones.ts
// The robot's light cones (ADR-059): a soft wedge from the middle of its front side in the direction it faces (the
// lens cone) and one behind each firing thruster. A cone is a cached sprite per (kind, direction, length, dpr) drawn
// with one `drawImage`; the pulse scales its length in the draw, so a steady frame paints nothing new.

                                                  
                                                           

                                                 

                                           
                                                        
                                                                    

const CONE_AWAY                               = { north: 'south', south: 'north', east: 'west', west: 'east' };
const PUSH_DIRS              = ['north', 'east', 'south', 'west'];

/** The direction a thruster's cone points: away from its push. */
const thrusterConeDir = (push           )            => CONE_AWAY[push];

/** The middle of the robot's side in `d` (robot at rx, ry, side rs, px). */
function lensConeApex(rx        , ry        , rs        , d           )                           {
  if (d === 'north') return { x: rx + rs / 2, y: ry };
  if (d === 'south') return { x: rx + rs / 2, y: ry + rs };
  if (d === 'east') return { x: rx + rs, y: ry + rs / 2 };
  return { x: rx, y: ry + rs / 2 };
}

/** The cones to draw: one per firing thruster, and the lens cone unless a thruster cone already points in `facing`. */
function conesFor(facing           , t        )         {
  const thrusters = PUSH_DIRS.filter((d) => t[d]).map((d)       => ({ kind: 'thruster', dir: thrusterConeDir(d) }));
  const lens         = thrusters.some((c) => c.dir === facing) ? [] : [{ kind: 'lens', dir: facing }];
  return [...lens, ...thrusters];
}

/** Half the wedge's width at its far end. */
const coneHalfWidth = (lengthPx        , halfAngle        ) => lengthPx * Math.tan((halfAngle * Math.PI) / 180);

/**
 * The drawImage rectangle of a cone from `apex` pointing `d`: `lengthPx × scale` along its axis and
 * 2 × lengthPx × tan(half-angle) across.
 */
function coneRect(
  apex                          , d           , lengthPx        , halfAngle        , scale = 1,
)       {
  const hw = coneHalfWidth(lengthPx, halfAngle), len = lengthPx * scale;
  if (d === 'north') return { x: apex.x - hw, y: apex.y - len, w: 2 * hw, h: len };
  if (d === 'south') return { x: apex.x - hw, y: apex.y, w: 2 * hw, h: len };
  if (d === 'east') return { x: apex.x, y: apex.y - hw, w: len, h: 2 * hw };
  return { x: apex.x - len, y: apex.y - hw, w: len, h: 2 * hw };
}

/** The wedge sprite of `kind` pointing `d`: a triangle fading radially from its apex (alpha, 0.45 alpha, 0). */
function coneSprite(glow           , kind          , d           , lengthPx        , dpr        )         {
  const spec = CONES[kind];
  const hw = coneHalfWidth(lengthPx, spec.halfAngle);
  const alongX = d === 'east' || d === 'west';
  const w = alongX ? lengthPx : 2 * hw, h = alongX ? 2 * hw : lengthPx;
  return glow.sprite(`cone|${kind}|${d}|${lengthPx}|${dpr}`, w, h, dpr, (ctx) => {
    const apex = { north: [hw, h], south: [hw, 0], east: [0, hw], west: [w, hw] }[d];
    const far = { north: [[0, 0], [w, 0]], south: [[0, h], [w, h]], east: [[w, 0], [w, h]], west: [[0, 0], [0, h]] }[d];
    const g = ctx.createRadialGradient(apex[0], apex[1], 0, apex[0], apex[1], Math.hypot(lengthPx, hw));
    g.addColorStop(0, rgba(spec.colour, spec.alpha));
    g.addColorStop(0.5, rgba(spec.colour, spec.alpha * 0.45));
    g.addColorStop(1, rgba(spec.colour, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(apex[0], apex[1]);
    ctx.lineTo(far[0][0], far[0][1]);
    ctx.lineTo(far[1][0], far[1][1]);
    ctx.closePath();
    ctx.fill();
  });
}

/** One `drawImage` of a cone sprite into `r`. */
function drawCone(ctx                          , s        , r      )       {
  ctx.drawImage(s.canvas, r.x, r.y, r.w, r.h);
}

// --- app/room-parts.ts
// Canvas drawing of the things the robot parts add to the room and outside views in the Neon lab look (ADR-045,
// ADR-058): crates, beacon masts with their pulse ring, every part on each robot's hull (the lit periscope lens or,
// asleep, the closed one, whip, battery bars and claw in that robot's trim, gold while on, sized per model, ADR-070)
// and the held crate in the claw; a towing claw closes without a crate (ADR-072, tow-view.ts draws the towed robot).
// The charger is static and drawn by room-static-draw.ts.

                                                                         


                                                   

                                                


/** Room drawing frame: canvas context, cell size c and the pixel origin of the room's outer wall. */
                            
                                
            
             
             
             
             
 

/** Pixel x of room cell column `x`'s left edge. */
const cellLeft = (f           , x        ) => f.ox + (x + 1) * f.c;
/** Pixel y of room cell row `y`'s top edge. */
const cellTop = (f           , y        ) => f.oy + (y + 1) * f.c;

/** ADR-045, ADR-058: a crate is a 2 x 2 dark square with a light edge and brace; `size` cells wide at (px, py). */
function drawCrateAt(f           , px        , py        , size        )       {
  const { ctx, c } = f;
  const s = size * c;
  ctx.fillStyle = NEON.crate;
  ctx.strokeStyle = NEON.crateEdge;
  ctx.lineWidth = Math.max(1.5, c * 0.12);
  ctx.fillRect(px, py, s, s);
  ctx.strokeRect(px + 1, py + 1, s - 2, s - 2);
  ctx.beginPath();
  ctx.moveTo(px + 1, py + 1);
  ctx.lineTo(px + s - 1, py + s - 1);
  ctx.moveTo(px + s - 1, py + 1);
  ctx.lineTo(px + 1, py + s - 1);
  ctx.stroke();
}

/** ADR-032, ADR-045: the crates in the room; null or none draws nothing. */
function drawCrates(f           , crates                                )       {
  for (const p of crates ?? []) drawCrateAt(f, cellLeft(f, p.x), cellTop(f, p.y), 2);
}

/** Radio waves, two arcs either side of (mx, my) up to radius r. */
function drawWaves(f           , mx        , my        , r        )       {
  const { ctx } = f;
  for (const k of [0.6, 1]) {
    ctx.beginPath();
    ctx.arc(mx, my, r * k, Math.PI * 1.15, Math.PI * 1.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mx, my, r * k, Math.PI * 1.6, Math.PI * 1.85);
    ctx.stroke();
  }
}

/** The point a beacon's waves and pulse ring come from: its mast top, 1.2 cells above its cell's bottom. */
function beaconTop(f           , b        )                           {
  return { x: cellLeft(f, b.position.x) + f.c / 2, y: cellTop(f, b.position.y) + f.c - f.c * 1.2 };
}

/**
 * ADR-030, ADR-045, ADR-058: each beacon as a mast on its cell with a dot, two wave arcs and a pulse ring of radius
 * (0.3 + 2.2 × ringPhase) cells, 2 px, fading out as it grows; always on air, range not drawn. Its pool is drawn
 * with the other dynamic pools (room-view.ts).
 */
function drawBeacons(f           , beacons                   , ringPhase        )       {
  const { ctx, c } = f;
  ctx.strokeStyle = NEON.beacon;
  ctx.fillStyle = NEON.beacon;
  ctx.lineCap = 'round';
  for (const b of beacons) {
    const top = beaconTop(f, b), base = top.y + c * 1.2;
    ctx.lineWidth = Math.max(1.5, c * 0.14);
    ctx.beginPath();
    ctx.moveTo(top.x, base);
    ctx.lineTo(top.x, top.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(top.x, top.y, c * 0.22, 0, Math.PI * 2);
    ctx.fill();
    drawWaves(f, top.x, top.y, c * 1.1);
    ctx.lineWidth = 2;
    ctx.globalAlpha = 1 - ringPhase;
    ctx.beginPath();
    ctx.arc(top.x, top.y, (0.3 + 2.2 * ringPhase) * c, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.lineCap = 'butt';
}

/** One robot's hull parts as drawn: its look (asleep or awake), whether it sleeps, whip height and claw scale. */
                                                                                                

/**
 * ADR-029, ADR-045, ADR-058, ADR-070: every part on the hull of `robot`, fitted or not: the periscope lens (lit, or
 * closed with a lid line while asleep) and the antenna whip at its model's height (waves while `tx` is on) on the
 * north side, the battery bars at the south side's east end (`bars` of four lit, gold; all unlit while asleep) and
 * the claw at its model's scale on the east side, closed while `holding`, on a crate drawn 1.4 cells wide when
 * `crate` (false while it tows a robot, ADR-072). Whip and claw are in the robot's trim (asleep trim while asleep),
 * gold while on.
 */
function drawRobotParts(
  f           , robot            , tx         , bars        , n          , crate = robot.holding,
)       {
  const rx = cellLeft(f, robot.position.x), ry = cellTop(f, robot.position.y), rs = 4 * f.c;
  const body = ROBOT_BODIES[robot.model];
  const h           = {
    n, look: robotLookOf(robot.model, robot.asleep), asleep: robot.asleep, whip: body.whipHeight,
    claw: body.clawScale,
  };
  drawLens(f, rx + rs * 0.3, ry + f.c * 0.2, h);
  drawWhip(f, rx + rs - f.c * 0.9, ry, tx && !robot.asleep, h);
  drawBars(f, rx + rs - f.c * 2.1, ry + rs - f.c, robot.asleep ? 0 : bars, ROBOT_LOOKS[robot.model], h);
  drawHullClaw(f, rx + rs, ry + rs / 2, robot.holding, crate, h);
}

/**
 * The periscope lens at (x, y): a lens-dark disc of 0.45 cell, a glow and the glass of 0.25 cell × the pulse; asleep,
 * the disc with a lid line of max(1.5, 0.1 c) px from −0.3 c to +0.3 c in the asleep trim (ADR-070).
 */
function drawLens(f           , x        , y        , h          )       {
  const { ctx, c } = f;
  const { n, look } = h;
  ctx.fillStyle = look.lensDark;
  ctx.beginPath();
  ctx.arc(x, y, c * 0.45, 0, Math.PI * 2);
  ctx.fill();
  if (h.asleep) {
    ctx.strokeStyle = look.trim;
    ctx.lineWidth = Math.max(1.5, c * 0.1);
    ctx.beginPath();
    ctx.moveTo(x - c * 0.3, y);
    ctx.lineTo(x + c * 0.3, y);
    ctx.stroke();
    return;
  }
  drawSprite(ctx, n.glow.pool(look.lens, 0.45, c * 0.7, n.dpr), x, y, c * 0.7);
  ctx.fillStyle = look.lens;
  ctx.beginPath();
  ctx.arc(x, y, c * 0.25 * (0.9 + 0.1 * n.m.lensPulse), 0, Math.PI * 2);
  ctx.fill();
}

/** The antenna whip at x from the robot's top `ry`, `h.whip` cells high, gold with waves while `tx`, else trim. */
function drawWhip(f           , x        , ry        , tx         , h          )       {
  const { ctx, c } = f;
  const top = ry - c * h.whip;
  const colour = tx ? C.gold : h.look.trim;
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = Math.max(1.5, c * 0.12);
  ctx.beginPath();
  ctx.moveTo(x, ry + c * 0.4);
  ctx.lineTo(x, top);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, top, c * 0.2, 0, Math.PI * 2);
  ctx.fill();
  if (tx) drawWaves(f, x, top, c * 1.1);
}

/** The battery's four bars from (bx, by), the first `bars` lit gold, the rest in the awake look's unlit colour. */
function drawBars(f           , bx        , by        , bars        , awake           , h          )       {
  const { ctx, c } = f;
  const bw = c * 0.3;
  ctx.fillStyle = h.look.lensDark;
  ctx.fillRect(bx - c * 0.1, by - c * 0.1, 4 * bw + c * 0.5, c * 0.7);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < bars ? C.gold : unlitBarColour(awake);
    ctx.fillRect(bx + i * (bw + c * 0.1), by, bw, c * 0.5);
  }
}

/**
 * The claw on the east side at (x, y), its finger offsets and line width × `h.claw`: open in trim, closed in gold
 * (trim while asleep) while `holding`, on a 1.4-cell crate when `crate` (ADR-032), with none while towing (ADR-072).
 */
