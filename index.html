  get isHolding()          {
    return this.state.holding;
  }

  /** HOLD (ADR-032, ADR-069) of robot `model`. */
  holdingOf(model            )          {
    return this.robotState(model).holding;
  }

  /** The one-robot tick: `command` and `grab` drive the first robot only (ADR-032 order, ADR-055 sprint). */
  advance(command                 , steering                   = null, grab = false, sprint = false)             {
    return this.tick(new Map([[this.state.model ?? 'scout', { thrust: command, grab }]]), steering, sprint);
  }

  /**
   * ADR-069, ADR-071, ADR-072 step 5: robots move in robot order (towed ones follow), then pickups (the `*` crystal,
   * floor items) and arm turns per robot (its own battery and arm, ADR-073), the figure (which neither enters nor
   * bumps a towed robot), the handover per robot and `solved`. A missing command or an asleep robot means no thrust
   * and no grab; `sprint` per ADR-055.
   */
  tick(commands                                       , steering                   = null, sprint = false)             {
    const s = this.state;
    const before = robotStates(s);
    const after = moveRobots(this.level, s, commands, this.equipment);
    const { crystal, crates, items } = pickUpAndGrab(this.level, s, after, commands, this.equipment);
    const moves              = before.map((r, i) => ({
      model: r.model, before: r.position, after: after[i].position, towed: isTowed(after[i]),
    }));
    const fab = fabRegion(this.level.fab);
    const walk = s.figure ? nextFigure(s.figure, steering, sprint, moves, this.level.room, crates, fab) : null;
    const figure = walk ? walk.figure : null;
    this.fabEntered = walk?.enteredFab ?? false;
    const awake = wakeRidden(after, riddenOf(figure, before[0].model));
    this.state = this.settle({ ...s, figure, crates, items }, awake, crystal);
    return this.state;
  }

  /**
   * A paused figure move (ADR-061, ADR-069): the walking rule with every robot standing, entering wakes the robot,
   * then the handover and `solved`; robots, charge, crates and arms stay. Riding or without a figure nothing changes.
   * Sets `enteredFab` (ADR-089).
   */
  moveFigure(steering           , sprint = false)             {
    const s = this.state;
    this.fabEntered = false;
    if (!s.figure || s.figure.isRiding) return s;
    const all = robotStates(s);
    const still = standingMoves(all);
    const walk = nextFigure(s.figure, steering, sprint, still, this.level.room, s.crates, fabRegion(this.level.fab));
    const figure = walk.figure;
    this.fabEntered = walk.enteredFab;
    this.state = this.settle({ ...s, figure }, wakeRidden(all, riddenOf(figure, all[0].model)), s.crystal);
    return this.state;
  }

  /**
   * The handover per robot in robot order (the `*` crystal, then the hold's entries not kept; ADR-040, ADR-069,
   * ADR-071) and `solved`, on `s` with the robots `all`; goal `leave` is read on the state after the handover
   * (ADR-074).
   */
          settle(s            , all              , crystal                     )             {
    const handed = handOverAll(all, s.figure, crystal, s.inventory);
    const next = withRobotStates({ ...s, crystal: handed.crystal, inventory: handed.inventory }, handed.robots);
    const leave = this.level.goals.some((g) => g.kind === 'leave') && leaveHolds(this.level, next);
    const solved = this.state.solved || leave ||
      this.level.goals.some((g) => goalHolds(g, handed.robots, handed.inventory));
    return { ...next, solved };
  }

  /** ADR-065, ADR-071: stow or take between ticks (`HoldError` on a refusal, the state unchanged). */
  passItem(action                 , kind          )             {
    this.state = passItem(this.state, action, kind);
    return this.state;
  }

  /**
   * "Exit robot" between ticks (ADR-027, ADR-038): the figure leaves the ridden robot; a side covered by a crate
   * (ADR-032), the fab console (ADR-089) or another robot not towed (ADR-069, ADR-072) is not free; a towed robot has
   * no free side (ADR-072).
   */
  exitRobot()       {
    const figure = this.state.figure;
    if (!figure) throw new GameCoreError('FigureError', 'noFigure');
    if (!figure.isRiding) throw new GameCoreError('FigureError', 'notRiding');
    const all = robotStates(this.state);
    const i = Math.max(0, all.findIndex((r) => r.model === riddenModel(this.state)));
    const side = isTowed(all[i]) ? undefined
      : freeExitSide(all[i].position, this.level, this.state.crates, otherFootprints(all, i));
    if (!side) throw new GameCoreError('FigureError', 'noFreeSide');
    this.state = { ...this.state, figure: { position: side, isRiding: false } };
  }

  /**
   * ADR-026 Reset (a), ADR-040, ADR-069, ADR-071, ADR-073, ADR-074: back to the arrival (every robot at its arrival
   * position with its crates, arms, charges, floor items, holds and equipment, found robots asleep), except that a
   * riding figure stays inside the robot it rides, at that robot's arrival position, which stays awake.
   */
  reset()       {
    const initial = this.arrival.state;
    this.fabEntered = false;
    this.equipment = new Map(this.arrival.equipment);
    const ridden = riddenModel(this.state);
    if (ridden === null) {
      this.state = initial;
      return;
    }
    const all = wakeRidden(robotStates(initial), ridden);
    const start = all.find((r) => r.model === ridden) ?? all[0];
    const figure = ridingFigure(aboard(start.position), start.model, all[0].model);
    this.state = withRobotStates({ ...initial, figure }, all);
  }
}

// --- core/world-json.ts
// World state JSON for traces and checks (ADR-031, ADR-032, ADR-064, ADR-069, ADR-071, ADR-072), and the figure's
// and crystal's equality, moved from world.ts unchanged (CHUNK-2.6).

                                           



                                                                        

/**
 * Trace JSON of a state; `charge`, `crates` and `holding` only when present (ADR-031, ADR-032); `model` (not
 * `scout`), `asleep`, `robots` and `figure.robot` only when present (ADR-064, ADR-069); `items` and `hold` only
 * when not empty (ADR-071); `towedBy` only while the first robot is towed (ADR-072).
 */
function worldStateJSON(s            )            {
  const f = s.figure;
  const others = s.robots ?? [];
  const items = s.items ?? [];
  const hold = s.hold ?? [];
  return {
    robot: positionJSON(s.robot),
    model: s.model === undefined || s.model === 'scout' ? undefined : s.model,
    asleep: s.asleep ? true : undefined,
    robots: others.length > 0 ? others.map(robotStateJSON) : undefined,
    solved: s.solved,
    figure: f ? { position: positionJSON(f.position), riding: f.isRiding, robot: f.robot } : undefined,
    crystal: s.crystal ? { position: positionJSON(s.crystal.position), carried: s.crystal.isCarried } : undefined,
    inventory: s.inventory.length > 0 ? [...s.inventory] : undefined,
    charge: s.charge === null ? undefined : s.charge,
    crates: s.crates === null ? undefined : s.crates.map(positionJSON),
    holding: s.holding ? true : undefined,
    items: items.length > 0 ? items.map(itemJSON) : undefined,
    hold: hold.length > 0 ? hold.map(holdEntryJSON) : undefined,
    towedBy: s.towedBy ?? undefined,
  };
}

/** Same position, riding flag and ridden model (ADR-069). */
function sameFigure(a                    , b                    )          {
  if (!a || !b) return a === b;
  return a.isRiding === b.isRiding && a.robot === b.robot && samePosition(a.position, b.position);
}

/** Same position and carried flag. */
function sameCrystal(a                     , b                     )          {
  if (!a || !b) return a === b;
  return a.isCarried === b.isCarried && samePosition(a.position, b.position);
}

// --- core/robot-order.ts
// Step 5 of the tick with several robots (ADR-064, ADR-069, ADR-072): the moves in robot order (a towed robot
// follows its tower), then per robot in robot order the crystal pickup, the floor items' pickup (holds.ts, ADR-065,
// ADR-071) and the arm turn (towing.ts: a crate, an item, a robot lifted or set down), the carried crystal following
// its carrier, the movement rule, waking a ridden robot and the goals over every robot not towed. The blocked rule
// and the other robots' footprints are in towing.ts; world.ts calls these around the figure and the handover, with
// each robot's own equipment (its battery and arm, ADR-073).

                                                
                                              



                                                      

                                                          

                                              

                                                                        

/** The four thruster inputs a robot's circuit resolved this tick (ADR-012). */
                                  
                          
                         
                          
                         
 

/** ADR-069: what one robot's circuit commands this tick: its thrusters and its arm's GRAB. */
                               
                                   
                         
 

const STILL                  = { north: false, east: false, south: false, west: false };

const anyOn = (t                 ) => t.north || t.east || t.south || t.west;

/**
 * ADR-064, ADR-069, ADR-072, ADR-073 step 5 (1): each awake robot in robot order takes its battery gate, move, drain
 * and charger (ADR-031, its own battery from `equipment`, else the level's); the robots before it block at their
 * new footprints, the ones after it at their committed ones, towed robots not at all. An asleep robot stays as it
 * is; a towed one does not move and only drains (no charger), and after the moves every towed robot follows its
 * tower. Returns every robot after the moves, in robot order.
 */
function moveRobots(
  level       , s            , commands                                       ,
  equipment                                     = new Map(),
)               {
  const next = robotStates(s);
  for (const [i, r] of next.entries()) {
    if (r.asleep) continue;
    const battery = (equipment.get(r.model) ?? level.equipment).battery;
    const thrust = commands.get(r.model)?.thrust ?? STILL;
    if (isTowed(r)) {
      const charge = battery && r.charge !== null && anyOn(thrust) ? Math.max(0, r.charge - 1) : r.charge;
      next[i] = { ...r, charge };
      continue;
    }
    const others = otherFootprints(next, i);
    const position = destination(r.position, r.charge === 0 ? STILL : thrust, (p) =>
      isBlockedFor(level, s, r.model, p, others));
    const charge = battery && r.charge !== null
      ? chargeAfterTick(battery, r.charge, anyOn(thrust), position, level.room) : r.charge;
    next[i] = { ...r, position, charge };
  }
  followTowers(next);
  return next;
}

/** The values step 5 (2) shares between the robots' turns (ADR-069, ADR-072). */
                     
                               
                  
                                         
                     
                               
 

/**
 * ADR-034, ADR-065, ADR-071, ADR-072 step 5 (2) for robot `i` unless it is asleep, towed in the committed state or
 * lifted earlier this tick: its `*` crystal pickup (into a free slot), its floor items' pickup while a slot is free,
 * then its arm turn when `arm` (the robot's own arm is fitted, ADR-073). Updates `moved` and `turn`.
 */
function robotTurn(
  level       , s            , moved              , i        , grab         , turn           , arm         ,
)       {
  const r = moved[i];
  if (r.asleep || isTowed(robotStates(s)[i]) || turn.lifted.has(i)) return;
  const c = turn.crystal;
  if (c && !c.isCarried && freeSlots(r, false) > 0 &&
    CellRect.robot(r.position).overlaps(CellRect.crystal(c.position))) {
    turn.crystal = { position: aboard(r.position), isCarried: true };
    turn.carrier = i;
  }
  const picked = pickUpItems(r, turn.items, turn.carrier === i);
  turn.items = picked.items;
  moved[i] = picked.robot;
  if (!arm) return;
  const after = armTurn({
    level, s, robots: moved, i, grab, crates: turn.crates, items: turn.items, crystal: turn.crystal,
    carriesCrystal: turn.carrier === i, lifted: turn.lifted,
  });
  turn.crates = after.crates;
  turn.items = after.items;
}

/**
 * ADR-032, ADR-034, ADR-065, ADR-069, ADR-071, ADR-072 step 5 (2): per robot in robot order `robotTurn` (the crystal
 * pickup, floor items, the arm turn with the robot's own arm from `equipment`, else the level's, ADR-073); then the
 * carried crystal follows its carrier's anchor, so it goes along with a lift. `moved` is every robot after
 * `moveRobots`; it is updated with each hold, claw, lift and set-down.
 */
function pickUpAndGrab(
  level       , s            , moved              , commands                                       ,
  equipment                                     = new Map(),
)                                                                                               {
  const crystal = s.crystal;
  const carrier = crystal?.isCarried ? carrierIndex(robotStates(s).map((r) => r.position), crystal) : -1;
  const turn            = { crystal, carrier, crates: s.crates, items: [...(s.items ?? [])], lifted: new Set() };
  for (const [i, r] of moved.entries()) {
    const arm = (equipment.get(r.model) ?? level.equipment).arm;
    robotTurn(level, s, moved, i, commands.get(r.model)?.grab ?? false, turn, arm);
  }
  const placed = turn.crystal?.isCarried
    ? { position: aboard(moved[turn.carrier].position), isCarried: true } : turn.crystal;
  return { crystal: placed, crates: turn.crates, items: turn.items };
}

// MARK: - Movement (ADR-012), waking and goals

/** Robot movement (ADR-012, ADR-033, ADR-038, ADR-100): one cell per tick; a diagonal whose one-axis steps are not
 *  both free slides along the free one, and stays if neither is free or only the diagonal cell is blocked. */
function destination(
  p              , command                 , blocked                              ,
)               {
  const dx = (command.east ? 1 : 0) - (command.west ? 1 : 0);
  const dy = (command.south ? 1 : 0) - (command.north ? 1 : 0);
  if (dx === 0 && dy === 0) return p;
  const target = { x: p.x + dx, y: p.y + dy };
  if (dx === 0 || dy === 0) return blocked(target) ? p : target;
  const alongX = { x: p.x + dx, y: p.y };
  const alongY = { x: p.x, y: p.y + dy };
  const freeX = !blocked(alongX);
  const freeY = !blocked(alongY);
  if (freeX && freeY) return blocked(target) ? p : target;
  if (freeX) return alongX;
  return freeY ? alongY : p;
}

/** ADR-064: `robots` with `model` awake: entering a robot wakes it at that commit. */
function wakeRidden(robots              , model                   )               {
  return robots.map((r) => (r.model === model && r.asleep ? { ...r, asleep: false } : r));
}

/** A figure riding `model`, with `robot` only when it is not the first robot (ADR-069). */
function ridingFigure(position              , model            , first            )              {
  return model === first ? { position, isRiding: true } : { position, isRiding: true, robot: model };
}

/** ADR-069: the model a figure rides after a move (`robot`, else `first`), or null on foot. */
function riddenOf(figure                    , first            )                    {
  if (!figure?.isRiding) return null;
  return figure.robot ?? first;
}

/**
 * ADR-014, ADR-069, ADR-072: `robotAt` holds when the footprint of any robot not towed overlaps its region,
 * `crystalToFigure` when the inventory has the crystal; `leave` is false here, the world evaluates it (ADR-074).
 */
function goalHolds(goal      , robots                       , inventory                     )          {
  if (goal.kind === 'leave') return false;
  if (goal.kind === 'robotAt') {
    return robots.some((r) => !isTowed(r) && CellRect.robot(r.position).overlaps(CellRect.goal(goal.position)));
  }
  return inventory.includes('crystal');
}

// --- core/editor.ts
// Port of GameCore/Circuit/Schematic* and EditorRules (ADR-006, ADR-008, ADR-019 to ADR-021, ADR-025, ADR-029);
// placed chips take their footprint from their definition (ADR-081, ADR-086).



                                                

                                                                     

                                              
                                           

const schematicError = (code        , detail          ) => new GameCoreError('SchematicError', code, detail);
const rulesError = (code        , detail          ) => new GameCoreError('EditorRulesError', code, detail);

// MARK: - Board and footprints

                            
                         
                          
 

const BOARD_MAX_SIDE = 128;

function boardSize(width        , height        )            {
  const ok = (n        ) => Number.isInteger(n) && n >= 1 && n <= BOARD_MAX_SIDE;
  if (!ok(width) || !ok(height)) throw schematicError('invalidBoardSize', { width, height });
  return { width, height };
}

                            
                         
                          
 

/** Board cells of a kind (ADR-087: AND, OR and NOT 2 x 1, flip-flop 2 x 2); null for the wall-mounted
 *  robot (ADR-025), robot parts (ADR-029) and `chipPins`, and for `chip`, whose size is its definition's (ADR-086). */
function footprint(kind               )                   {
  switch (kind) {
    case 'and': case 'or': case 'not': return { width: 2, height: 1 };
    case 'srFlipFlop': return { width: 2, height: 2 };
    default: return null;
  }
}

/** ADR-086: the board cells of component `id` of `circuit`: `chipFootprint` for a chip, else its kind's. */
function footprintOf(circuit         , id             )                   {
  const chip = circuit.chip(id);
  if (chip) return chipFootprint(chip);
  const c = circuit.component(id);
  return c ? footprint(c.kind) : null;
}

/**
 * ADR-086 (moved from EditorSession.freePosition): the free top-left cell for footprint `f` nearest to `near` on
 * `schematic`'s board, Manhattan distance, ties by y then x; null when none fits.
 */
function freeCell(schematic           , f           , near              )                      {
  const board = schematic.board;
  if (f.width > board.width || f.height > board.height) return null;
  const occupied = new Array         (board.width * board.height).fill(false);
  for (const pl of schematic.placements) {
    // Non-null: every placement has a footprint (the Schematic constructor checks it).
    const pf = footprintOf(schematic.circuit, pl.component.id) ;
    for (let y = pl.position.y; y < pl.position.y + pf.height; y++) {
      for (let x = pl.position.x; x < pl.position.x + pf.width; x++) occupied[y * board.width + x] = true;
    }
  }
  const isFree = (x        , y        )          => {
    for (let cy = y; cy < y + f.height; cy++) {
      for (let cx = x; cx < x + f.width; cx++) if (occupied[cy * board.width + cx]) return false;
    }
    return true;
  };
  let best                                                      = null;
  for (let y = 0; y <= board.height - f.height; y++) {
    for (let x = 0; x <= board.width - f.width; x++) {
      const distance = Math.abs(x - near.x) + Math.abs(y - near.y);
      if ((!best || distance < best.distance) && isFree(x, y)) best = { distance, position: { x, y } };
    }
  }
  return best?.position ?? null;
}

                            
                                
                                  
 

// MARK: - Schematic

/** A circuit laid out on the editor board; immutable. Layout never affects simulation. */
class Schematic {
  static          schemaVersion = 1;

           circuit         ;
           board           ;
                   positions                                ;
  /** Board components with positions, ascending ID; never the robot. */
           placements             ;

  constructor(circuit         , board           , positions                                ) {
    const components = circuit.components;
    const ids = [...positions.keys()].sort(compareStrings);
    for (const id of ids) if (circuit.component(id) === null) throw schematicError('unknownComponent', id);
    for (const id of ids) if (footprintOf(circuit, id) === null) throw schematicError('wallMounted', id);
    const built              = [];
    const rects                                                                    = [];
    for (const c of components) {
      const f = footprintOf(circuit, c.id);
      if (!f) continue;
      const p = positions.get(c.id);
      if (!p) throw schematicError('unplaced', c.id);
      built.push({ component: c, position: p });
      rects.push({ id: c.id, x: p.x, y: p.y, w: f.width, h: f.height });
    }
    for (const r of rects) {
      if (!(r.x >= 0 && r.y >= 0 && r.x <= board.width - r.w && r.y <= board.height - r.h)) {
        throw schematicError('outOfBounds', r.id);
      }
    }
    for (let i = 0; i < rects.length; i++) {
      for (let j = i + 1; j < rects.length; j++) {
        const a = rects[i], b = rects[j];
        if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) {
          throw schematicError('overlap', [a.id, b.id]);
        }
      }
    }
    this.circuit = circuit;
    this.board = board;
    this.positions = new Map(positions);
    this.placements = built;
  }

  position(id             )                      {
    return this.positions.get(id) ?? null;
  }

  get positionsByID()                                 {
    return new Map(this.positions);
  }

  replacing(circuit         , positions                                )            {
    return new Schematic(circuit, this.board, positions);
  }

  equals(o           )          {
    if (this.board.width !== o.board.width || this.board.height !== o.board.height) return false;
    if (!this.circuit.equals(o.circuit) || this.positions.size !== o.positions.size) return false;
    for (const [id, p] of this.positions) if (!samePosition(p, o.positions.get(id))) return false;
    return true;
  }

  /** A chip component carries `chip`; `chips` lists the definitions and is omitted when empty (ADR-080, ADR-086). */
  toJSON()            {
    return {
      schemaVersion: Schematic.schemaVersion,
      board: { width: this.board.width, height: this.board.height },
      components: this.circuit.components.map((c) => {
        const p = this.position(c.id);
        return { id: c.id, kind: c.kind, chip: this.circuit.chip(c.id)?.id, position: p ? positionJSON(p) : undefined };
      }),
      connections: this.circuit.connections.map(connectionJSON),
      chips: chipsJSON(this.circuit.chips),
    };
  }

  /** Decodes `chips` and each component's `chip` like `Circuit.fromJSON` (ADR-086). */
  static fromJSON(json     )            {
    if (json.schemaVersion !== Schematic.schemaVersion) {
      throw schematicError('unsupportedSchemaVersion', json.schemaVersion);
    }
    const board = boardSize(json.board?.width, json.board?.height);
    const circuit = new Circuit();
    const positions = new Map                           ();
    if (json.components.length > Circuit.maxComponents) {
      throw new GameCoreError('CircuitError', 'tooManyComponents', { count: json.components.length });
    }
    const chipOf = chipsFromJSON(json, 0);
    for (const e of json.components) {
      const id = componentID(e.id);
      if (!isComponentKind(e.kind)) throw new GameCoreError('DecodingError', 'dataCorrupted', e.kind);
      const p = e.position == null ? null : positionFromJSON(e.position);
      circuit.addComponent(id, e.kind, chipOf.get(e.id));
      if (p) positions.set(id, p);
    }
    if (json.connections.length > Circuit.maxConnections) {
      throw new GameCoreError('CircuitError', 'tooManyConnections', { count: json.connections.length });
    }
    for (const c of json.connections) circuit.connect(pinRefFromJSON(c.from), pinRefFromJSON(c.to));
    return new Schematic(circuit, board, positions);
  }
}

// MARK: - Editor rules

                                
                               
                                        
                              
 

class EditorRules {
  /**
   * The placeable kinds and, or, not, srFlipFlop and chip (ADR-086); robot parts (ADR-029) and chipPins are never
   * listed.
   */
  static          maxParts = 5;

           board           ;
  /** In `COMPONENT_KINDS` order. */
           parts                 ;
  /** Ascending. */
           locked               ;

  constructor(board           , parts                 , locked               ) {
    if (parts.some((p) => p.kind === 'robot')) throw rulesError('robotInPartsList');
    const part = COMPONENT_KINDS.find((k) => isRobotPart(k) && parts.some((p) => p.kind === k));
    if (part) throw rulesError('robotPartInPartsList', part);
    if (parts.some((p) => p.kind === 'chipPins')) throw rulesError('chipPinsInPartsList');
    const byKind = new Map                              ();
    const duplicates = new Set               ();
    for (const p of parts) {
      if (byKind.has(p.kind)) duplicates.add(p.kind);
      byKind.set(p.kind, p);
    }
    const dup = COMPONENT_KINDS.find((k) => duplicates.has(k));
    if (dup) throw rulesError('duplicatePart', dup);
    const ordered = COMPONENT_KINDS.flatMap((k) => (byKind.has(k) ? [byKind.get(k) ] : []));
    for (const p of ordered) if (p.max !== null && p.max < 1) throw rulesError('invalidMaximum', [p.kind, p.max]);
    const sortedLocked = [...locked].sort(compareStrings);
    for (let i = 1; i < sortedLocked.length; i++) {
      if (sortedLocked[i] === sortedLocked[i - 1]) throw rulesError('duplicateLocked', sortedLocked[i]);
    }
    this.board = board;
    this.parts = ordered;
    this.locked = sortedLocked;
  }

  allowance(kind               )                       {
    return this.parts.find((p) => p.kind === kind) ?? null;
  }
}

// --- core/editor-session.ts
// Port of GameCore/Circuit/EditorSession(+Wiring) (ADR-019, ADR-020, ADR-029): the validating editing session;
// placing a chip copies its definition into the schematic (ADR-081, ADR-086).


                                                

                                                        

                                                          



                                              

                                             

const editError = (code        , detail          ) => new GameCoreError('EditError', code, detail);
const sessionRulesError = (code        , detail          ) => new GameCoreError('EditorRulesError', code, detail);

// MARK: - Editor session

const ID_PREFIX                                         = {
  and: 'and', or: 'or', not: 'not', srFlipFlop: 'ff', chip: 'chip',
};

/**
 * The player's circuit under a level's editor rules (ADR-019, ADR-020). Every edit validates first and
 * then replaces `schematic`, so a refused edit leaves the session unchanged (CQ.11). `clone()` copies.
 */
class EditorSession {
           rules             ;
           starting           ;
  /**
   * This robot's fitted parts (the level's until a fit or remove, ADR-073); the starting schematic holds exactly one
   * of each (ADR-029).
   */
           equipment           ;
  schematic           ;

  constructor(rules             , starting           , current            , equipment            = Equipment.none) {
    this.rules = rules;
    this.starting = starting;
    this.equipment = equipment;
    if (current) {
      this.schematic = current;
      return;
    }
    if (starting.board.width !== rules.board.width || starting.board.height !== rules.board.height) {
      throw sessionRulesError('boardMismatch', { rules: rules.board, schematic: starting.board });
    }
    const components = starting.circuit.components;
    const robots = components.filter((c) => c.kind === 'robot').map((c) => c.id);
    if (robots.length === 0) throw sessionRulesError('missingRobot');
    if (robots.length > 1) throw sessionRulesError('multipleRobots', robots);
    const fault = partFault(partIDs(components), equipment);
    if (fault) throw sessionRulesError(fault.code, fault.detail);
    try {
      new CompiledCircuit(starting.circuit);
    } catch (e) {
      if (e instanceof GameCoreError && e.code === 'combinationalLoops') {
        throw sessionRulesError('combinationalLoops', e.detail);
      }
      throw e;
    }
    for (const id of rules.locked) {
      if (starting.circuit.component(id) === null) throw sessionRulesError('lockedComponentMissing', id);
    }
    const locked = new Set(rules.locked);
    const unlocked = components.filter((c) => c.kind !== 'robot' && !isRobotPart(c.kind) && !locked.has(c.id));
    for (const c of unlocked) if (rules.allowance(c.kind) === null) throw sessionRulesError('partNotAllowed', c.kind);
    for (const p of rules.parts) {
      if (p.max === null) continue;
      const count = unlocked.filter((c) => c.kind === p.kind).length;
      if (count > p.max) throw sessionRulesError('partLimitExceeded', { kind: p.kind, count, max: p.max });
    }
    this.schematic = starting;
  }

  clone()                {
    return new EditorSession(this.rules, this.starting, this.schematic, this.equipment);
  }

  /** `robot`, the robot parts (ADR-029) and the rules' locked IDs (ADR-020). */
  isLocked(id             )          {
    const kind = this.schematic.circuit.component(id)?.kind;
    if (kind === 'robot' || (kind !== undefined && isRobotPart(kind))) return true;
    return this.rules.locked.includes(id);
  }

  isAllowed(kind               )          {
    return this.rules.allowance(kind) !== null;
  }

  /** null = unlimited, 0 = none left or not allowed. */
  remaining(kind               )                {
    const a = this.rules.allowance(kind);
    if (!a) return 0;
    if (a.max === null) return null;
    return Math.max(0, a.max - this.unlockedCount(kind));
  }

  /** Nearest free top-left cell for `kind` (`freeCell`): Manhattan distance, ties by y then x. */
  freePosition(kind               , near              )                      {
    const f = footprint(kind);
    return f ? freeCell(this.schematic, f, near) : null;
  }

  place(kind               , position              )              {
    this.checkCanAdd(kind);
    this.checkFits(footprint(kind), kind, position, null);
    return this.added(kind, position);
  }

  placeNearest(kind               , near              )              {
    this.checkCanAdd(kind);
    const p = this.freePosition(kind, near);
    if (!p) throw editError('noFreePosition', kind);
    return this.place(kind, p);
  }

  /**
   * ADR-081, ADR-086: places a copy of `chip` with the lowest free ID `chip<n>` at `position`, checked like `place`
   * against `chip`'s allowance and limit and its footprint (`chipFootprint`).
   */
  placeChip(chip                , position              )              {
    this.checkCanAdd('chip');
    this.checkFits(chipFootprint(chip), 'chip', position, null);
    return this.added('chip', position, chip);
  }

  /** ADR-086: `placeChip` at the free cell nearest to `near` (`freeCell`), else `noFreePosition('chip')`. */
  placeChipNearest(chip                , near              )              {
    this.checkCanAdd('chip');
    const p = freeCell(this.schematic, chipFootprint(chip), near);
    if (!p) throw editError('noFreePosition', 'chip');
    return this.placeChip(chip, p);
  }

  move(id             , position              )       {
    const c = this.schematic.circuit.component(id);
    if (!c) throw editError('unknownComponent', id);
    if (this.isLocked(id)) throw editError('locked', id);
    if (samePosition(this.schematic.position(id), position)) return;
    this.checkFits(footprintOf(this.schematic.circuit, id), c.kind, position, id);
    const positions = this.schematic.positionsByID;
    positions.set(id, position);
    this.schematic = this.rebuilt(this.schematic.circuit, positions);
  }

  remove(id             )       {
    if (!this.schematic.circuit.component(id)) throw editError('unknownComponent', id);
    if (this.isLocked(id)) throw editError('locked', id);
    const circuit = this.schematic.circuit.clone();
    circuit.removeComponent(id);
    const positions = this.schematic.positionsByID;
    positions.delete(id);
    this.schematic = this.rebuilt(circuit, positions);
  }

  /** True while the circuit differs from the starting schematic (ADR-043: "Restore" is disabled otherwise). */
  get differsFromStart()          {
    return !this.schematic.equals(this.starting);
  }

  /** Replaces the circuit with the starting schematic; it always compiles (ADR-020, ADR-043). */
  restoreStartingCircuit()       {
    this.schematic = this.starting;
  }

  /** Wires an output of `a` or `b` to the other's input, either order (ADR-006). */
  connect(a        , b        )       {
    const circuit = this.schematic.circuit;
    if (!circuit.component(a.component)) throw editError('unknownComponent', a.component);
    if (!circuit.component(b.component)) throw editError('unknownComponent', b.component);
    const da = circuit.pinDirectionOf(a);
    if (!da) throw editError('unknownPin', a);
    const db = circuit.pinDirectionOf(b);
    if (!db) throw editError('unknownPin', b);
    let output        , input        ;
    if (da === 'output' && db === 'input') [output, input] = [a, b];
    else if (da === 'input' && db === 'output') [output, input] = [b, a];
    else throw editError('notOutputAndInput', [a, b]);
    const existing = circuit.driver(input);
    if (existing) {
      if (samePin(existing, output)) return;
      throw editError('inputAlreadyDriven', { input, existingDriver: existing });
    }
    const next = circuit.clone();
    next.connect(output, input);
    this.schematic = this.rebuilt(next, this.schematic.positionsByID);
  }

  /** Removes the wire into `input`, starting wires included (ADR-053). */
  disconnect(input        )       {
    const circuit = this.schematic.circuit;
    if (!circuit.component(input.component)) throw editError('unknownComponent', input.component);
    if (circuit.pinDirectionOf(input) === null) throw editError('unknownPin', input);
    const driver = circuit.driver(input);
    if (!driver) throw editError('notConnected', input);
    const next = circuit.clone();
    next.disconnect(input);
    this.schematic = this.rebuilt(next, this.schematic.positionsByID);
  }

  /** Combinational loops of the current schematic (ADR-008, ADR-021); empty when it compiles. */
  get loops()                  {
    try {
      new CompiledCircuit(this.schematic.circuit);
      return [];
    } catch (e) {
      if (e instanceof GameCoreError && e.code === 'combinationalLoops') return e.detail                   ;
      throw e;
    }
  }

  equals(o               )          {
    return this.schematic.equals(o.schematic) && this.starting.equals(o.starting);
  }

          unlockedCount(kind               )         {
    return this.schematic.circuit.components.filter((c) => c.kind === kind && !this.isLocked(c.id)).length;
  }

          checkCanAdd(kind               )       {
    const a = this.rules.allowance(kind);
    if (!a) throw editError('kindNotAllowed', kind);
    if (a.max !== null && this.unlockedCount(kind) >= a.max) throw editError('limitReached', { kind, max: a.max });
    if (this.schematic.circuit.components.length >= Circuit.maxComponents) throw editError('tooManyComponents');
  }

  /** Footprint `f` (null: `kindNotAllowed(kind)`) inside the board at `p`, overlapping no placement but `ignoring`. */
          checkFits(f                  , kind               , p              , ignoring                    )       {
    if (!f) throw editError('kindNotAllowed', kind);
    const board = this.schematic.board;
    if (!(p.x >= 0 && p.y >= 0 && p.x + f.width <= board.width && p.y + f.height <= board.height)) {
      throw editError('outOfBounds');
    }
    for (const pl of this.schematic.placements) {
      if (pl.component.id === ignoring) continue;
      const q = pl.position;
      const g = footprintOf(this.schematic.circuit, pl.component.id);
      if (!g) continue;
      if (p.x < q.x + g.width && q.x < p.x + f.width && p.y < q.y + g.height && q.y < p.y + f.height) {
        throw editError('overlap', pl.component.id);
      }
    }
  }

  /** Adds a `kind` component (with `chip`'s definition for a chip) under the next free ID at `position`. */
          added(kind               , position              , chip                 )              {
    const id = this.nextID(kind);
    const circuit = this.schematic.circuit.clone();
    try {
      circuit.addComponent(id, kind, chip);
    } catch (e) {
      if (e instanceof GameCoreError && e.code === 'chipConflict') throw e;
      throw editError('tooManyComponents');
    }
    const positions = this.schematic.positionsByID;
    positions.set(id, position);
    this.schematic = this.rebuilt(circuit, positions);
    return id;
  }

          nextID(kind               )              {
    const prefix = ID_PREFIX[kind];
    if (!prefix) throw new Error('robot is never placed (ADR-015)');
    const count = this.schematic.circuit.components.length;
    for (let n = 1; n <= count + 1; n++) {
      const id = `${prefix}${n}`;
      if (!this.schematic.circuit.component(id)) return id;
    }
    throw new Error('pigeonhole');
  }

          rebuilt(circuit         , positions                                )            {
    try {
      return this.schematic.replacing(circuit, positions);
    } catch (e) {
      if (!(e instanceof GameCoreError)) throw e;
      switch (e.code) {
        case 'overlap': throw editError('overlap', (e.detail                 )[0]);
        case 'unknownComponent': case 'unplaced': throw editError('unknownComponent', e.detail);
        case 'wallMounted': throw editError('locked', e.detail);
        default: throw editError('outOfBounds');
      }
    }
  }
}

// --- core/level-editor.ts
// Port of World/LevelEditor and Content/ContentID (ADR-019, ADR-020, EDITOR-05).




                                                            


                                           

const levelRulesError = (code        , detail          ) => new GameCoreError('EditorRulesError', code, detail);

const CONTENT_ID = /^[a-z0-9][a-z0-9-]{0,63}$/;

function contentID(raw        )         {
  if (!CONTENT_ID.test(raw)) throw new GameCoreError('ContentError', 'invalidID', raw);
  return raw;
}

/** The editor part of an editable level (ADR-019, ADR-020). */
class LevelEditor {
           rules             ;
           startingSchematic        ;

  constructor(rules             , startingSchematic        ) {
    this.rules = rules;
    this.startingSchematic = startingSchematic;
  }

  /** A session on `starting`, which must hold exactly the fitted parts of `equipment` (ADR-029). */
  session(starting           , equipment            = Equipment.none)                {
    return new EditorSession(this.rules, starting, undefined, equipment);
  }

  toJSON()            {
    return {
      board: { width: this.rules.board.width, height: this.rules.board.height },
      parts: this.rules.parts.map((p) => ({ kind: p.kind, max: p.max ?? undefined })),
      locked: this.rules.locked.length > 0 ? [...this.rules.locked] : undefined,
      startingSchematic: this.startingSchematic,
    };
  }

  static fromJSON(json     )              {
    const board = boardSize(json.board?.width, json.board?.height);
    if (json.parts.length > EditorRules.maxParts) throw levelRulesError('tooManyParts', { count: json.parts.length });
    const parts                  = json.parts.map((p     ) => {
      if (!isComponentKind(p.kind)) throw new GameCoreError('DecodingError', 'dataCorrupted', p.kind);
      return { kind: p.kind, max: p.max ?? null };
    });
    const lockedRaw            = json.locked ?? [];
    if (lockedRaw.length > Circuit.maxComponents) throw levelRulesError('tooManyLocked', { count: lockedRaw.length });
    const locked = lockedRaw.map((id) => componentID(String(id)));
    const start = contentID(json.startingSchematic);
    return new LevelEditor(new EditorRules(board, parts, locked), start);
  }
}

// --- core/fitting.ts
// Fitting found parts (ADR-066, ADR-073): the items that are robot parts, a circuit or schematic matched to a robot's
// equipment (`withParts`), and the checks and results of fitting a part from the riding figure's inventory to the
// ridden robot and of removing one. simulation.ts applies the results between ticks; world.ts keeps each robot's
// equipment (`levelEquipment`, `World.equipmentOf`).


                                                       

                                                      
                                                        

                                           

                                              
                                             

/** ADR-066, ADR-073: the items that are robot parts, in ADR-029's order. */
                                          

/** ADR-066, ADR-073: every found part, in ADR-029's order (the order the Menu lists them in). */
const FOUND_PARTS                       = ['antenna', 'arm'];

/** ADR-066, ADR-073: true when `raw` names a found part. */
function isFoundPart(raw         )                   {
  return raw === 'antenna' || raw === 'arm';
}

/** ADR-073: a `FitError` with its code and detail. */
function fitError(code        , detail          )                {
  return new GameCoreError('FitError', code, detail);
}

/**
 * ADR-067, ADR-073: a copy of `circuit` whose part components match `equipment`, in ADR-029's order: a fitted part
 * that is absent is added (ID and kind the part, no wires); a part not fitted is removed with every wire to its pins.
 */
function withParts(circuit         , equipment           )          {
  const next = circuit.clone();
  for (const part of ROBOT_PARTS) {
    const ids = next.components.filter((c) => c.kind === part).map((c) => c.id);
    if (equipment.has(part) && ids.length === 0) next.addComponent(part, part);
    if (!equipment.has(part)) for (const id of ids) next.removeComponent(id);
  }
  return next;
}

/** ADR-073: `withParts` on a schematic's circuit, keeping every placement and the board. */
function schematicWithParts(schematic           , equipment           )            {
  return schematic.replacing(withParts(schematic.circuit, equipment), schematic.positionsByID);
}

/** ADR-073: what a fit or remove changes: the ridden robot, its equipment and circuit, and the inventory. */
                          
                             
                                
                                 
                            
 

/** The ridden robot's model and equipment, else `FitError.notRiding` (no figure, or a figure on foot). */
function riddenEquipment(s            , equipment                                    )                          {
  const model = riddenModel(s);
  if (model === null) throw fitError('notRiding');
  return [model, equipment.get(model) ?? Equipment.none];
}

/**
 * ADR-066, ADR-073: the checks and result of a fit by the figure riding in `s` (`circuit` is the ridden robot's).
 * `FitError`, first fault wins: `notRiding`, `notInInventory(part)`, `alreadyFitted(part)`, `idInUse(part)`,
 * `boardTooSmall(wall)` when `board` is given and too short for the parts with the new one (ADR-029's `shortWall`).
 */
function planFit(
  s            , equipment                                    , circuit         , part           ,
  board                  ,
)          {
  const [model, eq] = riddenEquipment(s, equipment);
  const at = s.inventory.indexOf(part);
  if (at < 0) throw fitError('notInInventory', part);
  if (eq.has(part)) throw fitError('alreadyFitted', part);
  if (circuit.component(part) !== null) throw fitError('idInUse', part);
  const next = eq.with(part);
  const wall                   = board ? shortWall(board, next) : null;
  if (wall !== null) throw fitError('boardTooSmall', wall);
  const inventory = s.inventory.filter((_, k) => k !== at);
  return { model, equipment: next, inventory, circuit: withParts(circuit, next) };
}

/**
 * ADR-066, ADR-073: the checks and result of removing `part` from the robot the figure rides in `s` (`circuit` is
 * its). `FitError`, first fault wins: `notRiding`, `notFitted(part)`, `notRemovable(battery)`, and `armInUse` for the
 * arm while the robot's claw holds a crate or tows a robot (ADR-072). The part goes to the end of the inventory.
 */
function planRemove(
  s            , equipment                                    , circuit         , part           ,
)          {
  const [model, eq] = riddenEquipment(s, equipment);
  if (!eq.has(part)) throw fitError('notFitted', part);
  if (part === 'battery') throw fitError('notRemovable', part);
  if (part === 'arm' && robotStates(s).find((r) => r.model === model)?.holding) throw fitError('armInUse');
  const next = eq.without(part);
  return { model, equipment: next, inventory: [...s.inventory, part], circuit: withParts(circuit, next) };
}

// --- core/circuit-tick.ts
// One circuit's part of a tick (ADR-010 steps 1 to 4): sampling a robot's sensors from the committed world, the
// combinational gates, the flip-flops' next state and the robot's commands, and the check of a step's boundary
// inputs. simulation.ts runs these per awake robot in robot order (ADR-064, ADR-069); a robot's RX, LOW and HOLD
// read its own equipment through the world (ADR-073).


                                                         

                                                

                                                             
                                                     
                                              
                                                 
                                                    

/** Committed q per flip-flop key (its ID, or `c/<inner id>` inside chip `c`, ADR-080). */
                                                          

/** Inputs for unconnected pins, keyed by `pinKey`. */
                                             

// MARK: - Simulation state (moved from simulation.ts in CHUNK-2.6)

/** The committed sequential state of a simulation (ADR-010 step 6). */
                                  
                                                             
                        
                                                                                                  
                                
                                                                                                    
                                                              
 

/** One robot's circuit after the first (ADR-064): its model, compiled circuit and `robot` component. */
                               
                             
                                     
                              
 

function initialFlipFlops(compiled                 )            {
  return new Map(compiled.flipFlops.map((id) => [id, false]));
}

/** Tick 0 with every flip-flop of `compiled` and of `others` off (ADR-009, ADR-069). */
function initialState(compiled                 , others                         )                  {
  const robotFlipFlops = new Map(others.map((r) => [r.model, initialFlipFlops(r.compiled)]));
  return { tick: 0, flipFlops: initialFlipFlops(compiled), robotFlipFlops };
}

/** ADR-069: a robot after the first in one tick: its model, its signals (all off while asleep), its next state. */
                            
                             
                                 
                                
 

/** Immutable result of one tick (ADR-010 step 6); `robots` are the robots after the first (ADR-069). */
                               
                        
                                 
                                  
                                    
                                        
 

/** The next q of every flip-flop of `compiled` from this tick's signals (ADR-010 step 3). */
function nextFlipFlops(compiled                 , current           , values              )            {
  const next = new Map(current);
  for (const id of compiled.flipFlops) {
    // Non-null: kindOf covers every component of the compiled circuit.
    const kind = compiled.kindOf.get(id) ;
    const q = current.get(id) ?? false;
    next.set(id, nextState(kind, q, (pin) => values.getKey(id + '.' + pin)) ?? q);
  }
  return next;
}

/** ADR-010 step 4: the robot's thrusters and its arm's GRAB from this tick's signals. */
function commandOf(compiled                 , r             , values              )               {
  const arm = compiled.parts.arm[0];
  return {
    thrust: {
      north: values.getKey(r + '.thrusterN'), east: values.getKey(r + '.thrusterE'),
      south: values.getKey(r + '.thrusterS'), west: values.getKey(r + '.thrusterW'),
    },
    grab: arm === undefined ? false : values.getKey(arm + '.grab'),
  };
}

/**
 * ADR-010 step 2 after the boundary values are set: every step of the net in order (a gate, or a chip pin's
 * pass-through copy, ADR-086), then the sinks. Each read takes its driver's value, or an unwired pin's boundary input.
 */
function evaluate(compiled                 , values              , inputs           )       {
  const read = (r         )          => (r.driver !== null ? values.getKey(r.driver) : inputs.get(r.pin) ?? false);
  for (const step of compiled.steps) {
    if (step.kind === 'pass') {
      values.setKey(step.key, read(step.reads[0]));
      continue;
    }
    const ins = step.reads.map((r) => {
      const v = read(r);
      values.setKey(r.pin, v);
      return v;
    });
    const names = inputPins(step.kind);
    const outs = evaluateGate(step.kind, (pin) => ins[names.indexOf(pin)] ?? false);
    if (!outs) throw new Error(`combinational component ${step.key} has no output function`);
    const outNames = outputPins(step.kind);
    for (let i = 0; i < outNames.length; i++) values.setKey(step.outputs[i], outs[outNames[i]] ?? false);
  }
  for (const r of compiled.sinks) values.setKey(r.pin, read(r));
}

/** ADR-010 step 1 for robot `model`: its bumpers, RX, LOW and HOLD from the committed world (ADR-064). */
function sampleSensors(
  values              , compiled                 , r             , model            , w       ,
)       {
  for (const d of DIRECTIONS) values.setKey(r + '.' + bumperPin(d), w.bumperOf(model, d));
  const parts = compiled.parts;
  for (const id of parts.antenna) values.setKey(id + '.rx', w.isAntennaReceiving(model));
  for (const id of parts.battery) values.setKey(id + '.low', w.isBatteryLow(model));
  for (const id of parts.arm) values.setKey(id + '.hold', w.holdingOf(model));
}

/**
 * ADR-010 (moved from simulation.ts in CHUNK-2.6): every key of `inputs`, in pin order, must name an input pin of
 * `circuit` with no wire into it, else `CircuitError` `unknownComponent`, `unknownPin`, `expectedInputPin` or
 * `inputAlreadyDriven`.
 */
function validateInputs(circuit         , inputs           )       {
  const refs = [...inputs.keys()].map(parsePinKey).sort(comparePinRefs);
  for (const ref of refs) {
    if (!circuit.component(ref.component)) throw new GameCoreError('CircuitError', 'unknownComponent', ref.component);
    const d = circuit.pinDirectionOf(ref);
    if (d === null) throw new GameCoreError('CircuitError', 'unknownPin', ref);
    if (d !== 'input') throw new GameCoreError('CircuitError', 'expectedInputPin', ref);
    const driver = circuit.driver(ref);
    if (driver) throw new GameCoreError('CircuitError', 'inputAlreadyDriven', { input: ref, existingDriver: driver });
  }
}

// --- core/chip-bench-layout.ts
// The layout of a chip opened on the fab's bench (ADR-082, ADR-090): a chip's insides carry no board positions, so the
// parts are laid out in columns by wire distance from the pins, left to right, with `freeCell` for the overflow.


                                                


                                                        
                                              

                
                           
                                
 

/** Wire distance from `pins` to each component an output of `pins` reaches (1 for a direct wire), breadth first. */
function distances(circuit         )                           {
  const seen = new Map                     ([[CHIP_PINS_ID, 0]]);
  const queue                = [CHIP_PINS_ID];
  const wires = circuit.connections;
  for (let head = 0; head < queue.length; head++) {
    const from = queue[head];
    for (const w of wires) {
      if (w.from.component !== from || seen.has(w.to.component)) continue;
      seen.set(w.to.component, seen.get(from)  + 1);
      queue.push(w.to.component);
    }
  }
  return seen;
}

/** The parts of each column, 1 up, in ID order; parts `pins` does not reach take the column after the last. */
function columnsOf(circuit         )           {
  const dist = distances(circuit);
  const parts         = [];
  for (const c of circuit.components) {
    const footprint = footprintOf(circuit, c.id);
    if (footprint) parts.push({ id: c.id, footprint });
  }
  const reached = parts.map((p) => dist.get(p.id)).filter((d)              => d !== undefined);
  const last = Math.max(0, ...reached);
  const columns           = [];
  for (const p of parts) {
    const column = dist.get(p.id) ?? last + 1;
    while (columns.length < column) columns.push([]);
    columns[column - 1].push(p);
  }
  return columns.filter((c) => c.length > 0);
}

/** `circuit` restricted to the components of `placed`, for `freeCell`. */
function placedSchematic(circuit         , board           , placed                                )            {
  const part = new Circuit();
  for (const id of placed.keys()) part.addComponent(id, circuit.component(id) .kind, circuit.chip(id) ?? undefined);
  return new Schematic(part, board, placed);
}

/** One column at `x`: its parts down from y 1 into `placed`, or into `held` when they would leave the board. */
function placeColumn(
  column        , x        , board           , placed                                ,
  held                                      ,
)       {
  let y = 1;
  for (const part of column) {
    const f = part.footprint;
    if (x + f.width <= board.width && y + f.height <= board.height) placed.set(part.id, { x, y });
    else held.push({ part, near: { x: Math.min(x, board.width - 1), y: 1 } });
    y += f.height + 1;
  }
}

/**
 * ADR-090: positions for `circuit`'s board parts on `board`: columns by wire distance from `pins`, each starting at the
 * previous column's x plus its widest part plus one, ID order down each column from y 1 with one free row between; a
 * part that would leave the board goes to `freeCell` nearest to its column's top cell; null when a part fits nowhere.
 */
function benchLayout(circuit         , board           )                                        {
  const placed = new Map                           ();
  const held                                       = [];
  let x = 1;
  for (const column of columnsOf(circuit)) {
    placeColumn(column, x, board, placed, held);
    x += Math.max(...column.map((p) => p.footprint.width)) + 1;
  }
  for (const { part, near } of held) {
    const cell = freeCell(placedSchematic(circuit, board, placed), part.footprint, near);
    if (!cell) return null;
    placed.set(part.id, cell);
  }
  return placed;
}

// --- core/chip-bench.ts
// The fab's bench (ADR-082, ADR-090): a schematic with the locked chip pins, edited through an `EditorSession`, four
// switches on the pins' outputs, four lamps read from the pins' inputs, and its own tick. The bench burns through
// `ChipLibrary.burn` (ADR-086). No clock: the host calls `step()`. CHUNK-3.5 shows it; the save keeps it (ADR-083,
// save-chips.ts).


                                                         

                                                

                                                     

                                                          


                                                   





/** ADR-082, ADR-090: the kinds the bench offers, in `COMPONENT_KINDS` order. */
const BENCH_KINDS                           = ['and', 'or', 'not', 'srFlipFlop', 'chip'];

/** ADR-090: `CAMPAIGN_BOARD`, every bench kind without a maximum, `pins` locked. */
const BENCH_RULES = new EditorRules(
  CAMPAIGN_BOARD, BENCH_KINDS.map((kind) => ({ kind, max: null })), [CHIP_PINS_ID],
);

const EMPTY_CIRCUIT = (() => {
  const c = new Circuit();
  c.addComponent(CHIP_PINS_ID, 'chipPins');
  return c;
})();

/** ADR-090's construction checks, first fault wins: the board, then `pins`, then any other kind, by ID. */
function checkBench(schematic           )       {
  const board = schematic.board;
  if (board.width !== CAMPAIGN_BOARD.width || board.height !== CAMPAIGN_BOARD.height) {
    throw chipError('invalidBench', 'board');
  }
  const circuit = schematic.circuit;
  if (circuit.component(CHIP_PINS_ID)?.kind !== 'chipPins') throw chipError('invalidBench', 'pins');
  for (const c of circuit.components) {
    if (c.id !== CHIP_PINS_ID && !BENCH_KINDS.includes(c.kind)) throw chipError('invalidBench', c.id);
  }
}

                    
                                
                                            
                                  
 

/** `circuit` compiled, or the loops that keep it from compiling. */
function compileOf(schematic           )           {
  try {
    return { schematic, compiled: new CompiledCircuit(schematic.circuit), loops: [] };
  } catch (e) {
    if (e instanceof GameCoreError && e.code === 'combinationalLoops') {
      return { schematic, compiled: null, loops: e.detail                    };
    }
    throw e;
  }
}

/** ADR-082, ADR-090: the fab's bench: a schematic with one `pins`, four switches, its own tick and flip-flops. */
class ChipBench {
  /** ADR-090: `CAMPAIGN_BOARD` holding only the locked `chipPins` `pins`. */
  static          empty            = new Schematic(EMPTY_CIRCUIT, CAMPAIGN_BOARD, new Map());

  #session               ;
          ticks = 0;
          committed            = new Map();
          on = new Set         ();
          cache                  = null;

  /** ADR-090: a bench over `schematic`; `ChipError.invalidBench('board' | 'pins' | <component ID>)` otherwise. */
  constructor(schematic            = ChipBench.empty) {
    checkBench(schematic);
    this.#session = new EditorSession(BENCH_RULES, ChipBench.empty, schematic);
  }

  /** ADR-090: a copy of the bench's editing session, for reads (`remaining`, `isLocked`); edits go through `edit`. */
  get session()                {
    return this.#session.clone();
  }

  /** ADR-090: the bench's current schematic. */
  get schematic()            {
    return this.#session.schematic;
  }

  /**
   * ADR-021, ADR-090: runs `change` on the bench's session and drops every flip-flop whose part is gone after each
   * session operation, so a part placed later under a freed ID starts off, however many operations `change` makes.
   * A refused edit leaves the session unchanged (CQ.11) and its error propagates.
   */
  edit   (change                               )    {
    const session = this.#session;
    const pruning = new Proxy(session, {
      get: (target, key) => {
        const value = Reflect.get(target, key, target);
        if (typeof value !== 'function') return value;
        return (...args           ) => {
          try {
            return value.apply(target, args);
          } finally {
            this.#prune();
          }
        };
      },
    });
    try {
      return change(pruning);
    } finally {
      this.#prune();
    }
  }

  /** ADR-082, ADR-090: true when the schematic equals `ChipBench.empty` (the "Replace the bench?" question). */
  get isEmpty()          {
    return this.schematic.equals(ChipBench.empty);
  }

  /** ADR-090: completed bench ticks. */
  get tick()         {
    return this.ticks;
  }

  /** ADR-090: the current compile's flip-flop keys, each with its committed q, or off when new (ADR-021). */
  get flipFlops()            {
    const { compiled } = this.compiledNow();
    if (!compiled) return new Map(this.committed);
    return new Map(compiled.flipFlops.map((k) => [k, this.committed.get(k) ?? false]));
  }

  /** ADR-090: the combinational loops of the schematic; empty when it compiles. */
  get loops()                  {
    return this.compiledNow().loops;
  }

  /** ADR-024, ADR-090: the values of the next tick; all off while the bench does not compile. */
  get signals()               {
    const { compiled } = this.compiledNow();
    const values = new SignalValues();
    if (!compiled) return values;
    for (const [key, q] of this.flipFlops) {
      values.setKey(key + '.q', q);
      values.setKey(key + '.qBar', !q);
    }
    for (const pin of this.on) values.setKey(`${CHIP_PINS_ID}.${pin}`, true);
    evaluate(compiled, values, new Map());
    return values;
  }

  /** ADR-090: whether switch `pin` (`i1` to `i4`) is on; `ChipError.unknownTerminal(pin)` for another pin. */
  switchOn(pin         )          {
    if (!CHIP_INPUT_PINS.includes(pin)) throw chipError('unknownTerminal', pin);
    return this.on.has(pin);
  }

  /** ADR-090: flips switch `pin` (`i1` to `i4`), also while running; `unknownTerminal(pin)` for another pin. */
  toggleSwitch(pin         )       {
    if (!CHIP_INPUT_PINS.includes(pin)) throw chipError('unknownTerminal', pin);
    if (!this.on.delete(pin)) this.on.add(pin);
  }

  /** ADR-090: whether lamp `pin` (`o1` to `o4`) is on in `signals`; `unknownTerminal(pin)` for another pin. */
  lampOn(pin         )          {
    if (!CHIP_OUTPUT_PINS.includes(pin)) throw chipError('unknownTerminal', pin);
    return this.signals.getKey(`${CHIP_PINS_ID}.${pin}`);
  }

  /**
   * ADR-090: one bench tick: the flip-flops take their next state from `signals`, `tick` goes up by one. While the
   * bench does not compile it throws `CompileError.combinationalLoops` and changes nothing.
   */
  step()       {
    const { compiled, loops } = this.compiledNow();
    if (!compiled) throw new GameCoreError('CompileError', 'combinationalLoops', loops);
    this.committed = nextFlipFlops(compiled, this.flipFlops, this.signals);
    this.ticks += 1;
  }

  /** ADR-090: tick 0, every flip-flop and switch off; the schematic stays. */
  reset()       {
    this.ticks = 0;
    this.committed = new Map();
    this.on = new Set();
  }

  /** ADR-090: `library.burn` of the bench circuit; the bench is unchanged, and so is the library on a refusal. */
  burn(library             )                                                 {
    return library.burn(this.schematic.circuit);
  }

  /**
   * ADR-082, ADR-090: replaces the bench with a copy of `chip`'s circuit laid out by `benchLayout`, then resets tick,
   * flip-flops and switches; `ChipError.benchFull(chip.id)` and nothing changed when a part fits nowhere.
   */
  openOnBench(chip                )       {
    const circuit = chip.circuit;
    const positions = benchLayout(circuit, CAMPAIGN_BOARD);
    if (!positions) throw chipError('benchFull', chip.id);
    const schematic = new Schematic(circuit, CAMPAIGN_BOARD, positions);
    this.#session = new EditorSession(BENCH_RULES, ChipBench.empty, schematic);
    this.reset();
  }

  /**
   * ADR-092: replaces the bench's schematic, checked as the constructor does (`ChipError.invalidBench`, nothing
   * changed on a throw), and resets tick, flip-flops and switches.
   */
  replace(schematic           )       {
    checkBench(schematic);
    this.#session = new EditorSession(BENCH_RULES, ChipBench.empty, schematic);
    this.reset();
  }

  /** ADR-090: an independent copy of the session, tick, flip-flops and switches, for the app's Undo and Redo. */
  clone()            {
    const copy = new ChipBench(this.schematic);
    copy.#session = this.#session.clone();
    copy.ticks = this.ticks;
    copy.committed = new Map(this.committed);
    copy.on = new Set(this.on);
    return copy;
  }

  /** Keeps the stored flip-flops whose top-level part (`ff1`, or `chip1` for `chip1/ff1`) is still on the bench. */
  #prune()       {
    const circuit = this.schematic.circuit;
    const kept = [...this.committed].filter(([key]) => circuit.component(key.split('/')[0]) !== null);
    this.committed = new Map(kept);
  }

          compiledNow()           {
    if (this.cache?.schematic !== this.schematic) this.cache = compileOf(this.schematic);
    return this.cache;
  }
}

// --- core/between-ticks.ts
// A world action between ticks (ADR-061, ADR-065): act on a clone so a refusal leaves the world as it was.


                                        

/** The clone of `world` after `act`; throws when the level has no world (no figure). */
function betweenTicks(world              , act                       )        {
  if (!world) throw new GameCoreError('FigureError', 'noFigure');
  const next = world.clone();
  act(next);
  return next;
}

// --- core/sim-fitting.ts
// What a Simulation does around fitting (ADR-066, ADR-073): the robot's circuit check on attach, swapping one
// robot's circuit, finding the ridden robot's circuit, committing a fit or remove plan and matching the parts on
// Reset. Functions over the world and the circuit slots, so simulation.ts keeps to the tick.


                                                         
                                                                                  


                                                

                                            

                                              

                                        

/**
 * Robot count (ADR-015), no `chipPins` (`chipPinsInRobot(ids)`, ADR-086), then the robot parts against the robot's
 * own equipment (ADR-029, ADR-073); its ID.
 */
function attachedRobot(compiled                 , equipment           )              {
  const robot = compiled.robots[0];
  if (robot === undefined) throw new GameCoreError('AttachError', 'missingRobot');
  if (compiled.robots.length !== 1) throw new GameCoreError('AttachError', 'multipleRobots', compiled.robots);
  if (compiled.chipPins.length > 0) throw new GameCoreError('AttachError', 'chipPinsInRobot', compiled.chipPins);
  const fault = partFault(compiled.parts, equipment);
  if (fault) throw new GameCoreError('AttachError', fault.code, fault.detail);
  return robot;
}

/** The circuits of a run: the first robot's, the others (replaced as a whole), and the flip-flop state. */
                               
                         
                                 
                                  
                         
 

                                                            

/** `slots` with robot `model`'s circuit `compiled` and `robot`, keeping its flip-flops by key (ADR-021, ADR-080). */
function withCircuit(
  s              , firstModel                   , model                   , compiled                 ,
  robot                    ,
)               {
  const keep = (old           ) => new Map(compiled.flipFlops.map((id) => [id, old.get(id) ?? false]));
  if (model === firstModel || model === null) {
    return { ...s, first: compiled, firstRobot: robot, state: { ...s.state, flipFlops: keep(s.state.flipFlops) } };
  }
  const others = s.others.map((r) => (r.model === model ? { model, compiled, robot: robot ?? r.robot } : r));
  const robotFlipFlops = new Map(s.state.robotFlipFlops);
  robotFlipFlops.set(model, keep(s.state.robotFlipFlops.get(model) ?? new Map()));
  return { ...s, others, state: { ...s.state, robotFlipFlops } };
}

/** The world and the ridden robot's circuit (the first's on foot, which the plan refuses); detached `notRiding`. */
function fitTarget(world              , compiledOf            )                   {
  if (!world) throw fitError('notRiding');
  // Non-null: the ridden model is one of the level's robots, each of which has a circuit.
  return [world, compiledOf(riddenModel(world.state) ?? world.level.robots[0].model) .circuit];
}

/** ADR-073: commits a fit or remove on a world clone (inventory and equipment); the new circuit and its robot. */
function commitPlan(
  world              , plan         ,
)                                                                  {
  const compiled = new CompiledCircuit(plan.circuit);
  const robot = attachedRobot(compiled, plan.equipment);
  const next = betweenTicks(world, (w) => {
    w.state = { ...w.state, inventory: plan.inventory };
    w.setEquipment(plan.model, plan.equipment);
  });
  return { world: next, compiled, robot };
}

/** ADR-073 Reset: each robot's circuit whose part components differ from its (reset) equipment, matched to it. */
function resetMatches(
  world              , compiledOf            ,
)                                                                         {
  const out = [];
  for (const r of world?.level.robots ?? []) {
    // Non-null: an attached simulation has a circuit per robot of its level.
    const compiled = compiledOf(r.model) ;
    const eq = world .equipmentOf(r.model);
    if (partFault(compiled.parts, eq) === null) continue;
    const matched = new CompiledCircuit(withParts(compiled.circuit, eq));
    out.push({ model: r.model, compiled: matched, robot: attachedRobot(matched, eq) });
  }
  return out;
}

// --- core/robot-tick.ts
// One robot's tick steps 1 to 4 over a world (ADR-010, ADR-069), split from Simulation so the class keeps to the run:
// resolving a circuit's signals and running one robot, asleep or awake.

                                                

                                                              
                                                             
                                                     
                                              

                                        

/** Steps 1 and 2 for one circuit: flip-flop outputs, sensors (when attached), then the combinational logic. */
function resolveOn(
  world              , compiled                 , robot                    , model                   ,
  flipFlops           , inputs           ,
)               {
  const values = new SignalValues();
  for (const id of compiled.flipFlops) {
    const q = flipFlops.get(id) ?? false;
    values.setKey(id + '.q', q);
    values.setKey(id + '.qBar', !q);
  }
  if (world && robot !== null && model !== null) sampleSensors(values, compiled, robot, model, world);
  evaluate(compiled, values, inputs);
  return values;
}

/** Steps 1 to 4 for one robot; an asleep robot keeps its flip-flops, reads every pin off and commands nothing. */
function runRobotOn(
  world              , compiled                 , robot                    , model                   ,
  flipFlops           , inputs           ,
)                                                                                {
  if (model !== null && world?.robotState(model).asleep) {
    return { signals: new SignalValues(), flipFlops, command: null };
  }
  const signals = resolveOn(world, compiled, robot, model, flipFlops, inputs);
  const command = robot === null ? null : commandOf(compiled, robot, signals);
  return { signals, flipFlops: nextFlipFlops(compiled, flipFlops, signals), command };
}

// --- core/simulation.ts
// Port of GameCore/Simulation: the deterministic tick pipeline (ADR-007, ADR-009 to ADR-012, ADR-015, ADR-021, ADR-024,
// ADR-029 to ADR-032), the paused figure move (ADR-061), one circuit per robot, run in robot order (ADR-064, ADR-069),
// and fitting and removing found parts between ticks, which changes the ridden robot's equipment and circuit (ADR-066,
// ADR-073), and Reset to the run's arrival (ADR-074). One circuit's steps are in circuit-tick.ts, the fit and remove
// checks in fitting.ts, the public LevelRun facade in level-run.ts.


                                                                    
                                                      

                                                                                                           


                                            

                                                       
                                                     
                                              


                                           



                                        
                                             

/** ADR-069: `models` (any order) must be exactly the level's robot models, else `AttachError.circuitsMismatch`. */
function checkCircuitModels(level       , models                   )       {
  const expected = level.robots.map((r) => r.model);
  const actual = [...models].sort();
  if (actual.length !== expected.length || ![...expected].sort().every((m, i) => m === actual[i])) {
    throw new GameCoreError('AttachError', 'circuitsMismatch', { expected, actual });
  }
}

/** Deterministic tick runner of a compiled circuit, optionally attached to a level with one circuit per robot. */
class Simulation {
  state                 ;
  world              ;
  /** The first robot's circuit and `robot` component; a fit, a remove and Reset replace them (ADR-073). */
          first                 ;
          firstRobot                    ;
  /** The robots after the first; replaced as a whole, never changed in place, so clones may share it. */
          others                         ;

          constructor(
    compiled                 , robot                    , state                 , world              ,
    others                          = [],
  ) {
    this.first = compiled;
    this.firstRobot = robot;
    this.state = state;
    this.world = world;
    this.others = others;
  }

  /** ADR-089: the world's last tick or paused move walked the figure into the fab console; false when detached. */
  get enteredFab()          { return this.world?.enteredFab ?? false; }
  /** The first robot's circuit (ADR-069), or the detached circuit. */
  get compiled()                  { return this.first; }
  /** The first robot's `robot` component, or null when detached. */
  get robot()                     { return this.firstRobot; }

  /** Without a world. */
  static detached(compiled                 )             {
    return new Simulation(compiled, null, initialState(compiled, []), null);
  }

  /** Attached to a one-robot `level`: one robot (ADR-015), the fitted parts (ADR-029), else AttachError. */
  static attached(compiled                 , level       )             {
    if (level.robots.length !== 1) checkCircuitModels(level, [level.robots[0].model]);
    const robot = attachedRobot(compiled, level.equipment);
    return new Simulation(compiled, robot, initialState(compiled, []), new World(level));
  }

  /**
   * ADR-069: attached with one circuit per robot of `level` (exactly its models, else `circuitsMismatch`); every
   * robot starts at `arrival` (default tick 0 with the level's equipment) and its circuit attaches against its
   * arrival equipment (ADR-073, ADR-074).
   */
  static attachedAll(
    level       , compiled                                          , arrival          = levelArrival(level),
  )             {
    checkCircuitModels(level, [...compiled.keys()]);
    const eq = (m            ) => arrival.equipment.get(m) ?? level.equipment;
    // Non-null: checkCircuitModels proved the map has every model of the level.
    const [first, ...rest] = level.robots.map((r) => ({ model: r.model, compiled: compiled.get(r.model)  }));
    const robot = attachedRobot(first.compiled, eq(first.model));
    const others = rest.map((r) => ({ ...r, robot: attachedRobot(r.compiled, eq(r.model)) }));
    const world = new World(level, arrival.state, arrival.equipment, arrival);
    return new Simulation(first.compiled, robot, initialState(first.compiled, others), world, others);
  }

  /** A copy with its own world (state and equipment, ADR-073). */
  clone()             {
    return new Simulation(this.first, this.firstRobot, this.state, this.world ? this.world.clone() : null, this.others);
  }

  /** The first robot's model, or null when detached. */
          get firstModel()                    {
    return this.world ? this.world.level.robots[0].model : null;
  }

  /** ADR-069: robot `model`'s compiled circuit, or null when the level has no such robot. */
  compiledOf(model            )                         {
    if (model === this.firstModel) return this.compiled;
    return this.others.find((r) => r.model === model)?.compiled ?? null;
  }

  /** ADR-069: robot `model`'s committed flip-flops, or null when the level has no such robot. */
  flipFlopsOf(model            )                   {
    if (model === this.firstModel) return this.state.flipFlops;
    return this.state.robotFlipFlops.get(model) ?? null;
  }

  /**
   * Executes exactly one tick and returns its snapshot. Invalid inputs throw and change nothing; `inputs` apply to
   * the first robot's circuit only. Steps 1 to 4 run per awake robot in robot order (ADR-069); `sprint` lets a
   * steered standing figure take up to two checked one-cell sub-steps (ADR-055).
   */
  step(inputs            = new Map(), steering                   = null, sprint = false)               {
    validateInputs(this.compiled.circuit, inputs);
    const tick = this.state.tick;
    const first = runRobotOn(this.world, this.compiled, this.robot, this.firstModel, this.state.flipFlops, inputs);
    const others = this.others.map((r) => ({
      model: r.model,
      // Non-null: initialState and every step keep an entry per robot after the first.
      ...runRobotOn(this.world, r.compiled, r.robot, r.model, this.state.robotFlipFlops.get(r.model) , new Map()),
    }));
    let nextWorld = this.world;
    const firstModel = this.firstModel;
    if (this.world && firstModel !== null) {
      const commands = new Map                          ();
      if (first.command) commands.set(firstModel, first.command);
      for (const o of others) if (o.command) commands.set(o.model, o.command);
      nextWorld = this.world.clone();
      nextWorld.tick(commands, steering, sprint);
    }
    const robotFlipFlops = new Map(others.map((o) => [o.model, o.flipFlops]));
    const next                  = { tick: tick + 1, flipFlops: first.flipFlops, robotFlipFlops };
    this.state = next;
    this.world = nextWorld;
    const robots = others.map((o) => ({ model: o.model, signals: o.signals, flipFlops: o.flipFlops }));
    return { tick, signals: first.signals, state: next, world: nextWorld ? nextWorld.state : null, robots };
  }

  /** ADR-010 steps 1 and 2 of the first robot's next tick, with loop-boundary inputs; changes nothing (ADR-024). */
  resolve(inputs            = new Map())               {
    const model = this.firstModel;
    if (model !== null && this.world?.robotState(model).asleep) return new SignalValues();
    return resolveOn(this.world, this.compiled, this.robot, model, this.state.flipFlops, inputs);
  }

  /** ADR-024, ADR-069: what robot `model`'s next step resolves; every pin off while asleep or for an unknown model. */
  resolveOf(model            )               {
    if (model === this.firstModel) return this.resolve();
    const r = this.others.find((o) => o.model === model);
    if (!r || this.world?.robotState(model).asleep) return new SignalValues();
    // Non-null: initialState and every step keep an entry per robot after the first.
    return resolveOn(this.world, r.compiled, r.robot, model, this.state.robotFlipFlops.get(model) , new Map());
  }

  /**
