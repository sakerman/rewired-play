        opQ(thrusterPoint(16, 5), thrusterPoint(10, 9)), OP_Z,
      ],
      paint: 'fill', colour: 'gold', weight: 'line',
    });
  }
  const nozzle = [
    ...polyline([thrusterPoint(13, 30), thrusterPoint(19, 30), thrusterPoint(19, 25), thrusterPoint(13, 25)], true),
    ...polyline([thrusterPoint(13, 25), thrusterPoint(9, 12), thrusterPoint(23, 12), thrusterPoint(19, 25)], true),
  ];
  const tip = [ARROW_TIP.x, ARROW_TIP.y];
  const arrow = [...polyline([[ARROW_TAIL.x, ARROW_TAIL.y], tip]), ...polyline([[-0.11, 0.31], tip, [0.11, 0.31]])];
  out.push({ ops: nozzle, paint: 'stroke', colour: 'text', weight: 'line' });
  out.push({ ops: arrow, paint: 'stroke', colour: 'text', weight: 'line' });
  return out;
}

/** One bumper or thruster slot as drawn: pin, wall, kind, on in the shown signals, frame centre in board cells. */
                                                                                                                      

const WALL_OUT                           = {
  north: { x: 0, y: -1 }, south: { x: 0, y: 1 }, west: { x: -1, y: 0 }, east: { x: 1, y: 0 },
};

/**
 * The eight wall slots in `WALL_PINS` order, each frame centred half a hull margin outside its pin; none on a board
 * without a `robot` (the fab's bench, ADR-091).
 */
function wallSymbols(s           , signals              )               {
  if (!s.circuit.components.some((c) => c.kind === 'robot')) return [];
  return WALL_PINS.map((pin) => {
    const ref = { component: 'robot', pin };
    const a = anchorOf(ref, s);
    // Non-null: WALL_PINS are all wall pins, so wallOf returns a wall.
    const wall = wallOf(pin) ;
    const o = WALL_OUT[wall];
    return {
      pin, wall, kind: pin.startsWith('bumper') ? 'bumper' : 'thruster', on: signals.get(ref),
      centre: { x: a.x + (o.x * HULL_MARGIN) / 2, y: a.y + (o.y * HULL_MARGIN) / 2 },
    };
  });
}

/** Frame outline: dashed text colour when off, solid gold 1.5 times wider when on, at `depthPx` pixels deep. */
function frameStyle(on         , depthPx        )                                                             {
  const base = Math.max(1, depthPx * 1.5 * UNIT);
  if (on) return { colour: 'gold', width: base * 1.5, dash: [] };
  return { colour: 'text', width: base, dash: [Math.max(2, depthPx * 4 * UNIT), Math.max(1.5, depthPx * 3 * UNIT)] };
}

/** Stroke width in pixels of a symbol line (2 units) or plate (3 units) at `depthPx` pixels deep. */
function strokeWidth(weight                  , depthPx        )         {
  return weight === 'line' ? Math.max(1, depthPx * 2 * UNIT) : Math.max(1.5, depthPx * 3 * UNIT);
}

/** `Walls: Bumper north on, Thruster moves the robot south off, ...` for the canvas's accessible label (ADR-049). */
function describeWalls(signals              )         {
  const words = { N: 'north', E: 'east', S: 'south', W: 'west' }         ;
  const items = WALL_PINS.map((pin) => {
    const on = signals.get({ component: 'robot', pin }) ? 'on' : 'off';
    const d = words[pin.slice(-1)                         ];
    return pin.startsWith('bumper') ? `Bumper ${d} ${on}` : `Thruster moves the robot ${d} ${on}`;
  });
  return `Walls: ${items.join(', ')}.`;
}

// --- app/interior-parts.ts
// Canvas drawing of the robot parts on the interior walls: the bumper and thruster symbols (ADR-049) and the
// framed antenna, battery and arm in the hull margin with their symbols and pin labels (ADR-045).

                                                                           



                                                 



/** Hull margin in cells, room for the framed peripherals. */
const HULL_MARGIN = 1.7;
/** A peripheral frame is this deep in cells (ADR-025, ADR-045). */
const FRAME_DEPTH = 1.15;
/** A bumper or thruster frame is this long in cells along its wall. */
const FRAME_LENGTH = 1.5;

/** Board drawing frame: context, pixels per cell, the board-cell to pixel mappings and the board's colours. */
                             
                                
                
                           
                           
                                                   
                    
 

/** A wall symbol's colour: gold, or the theme's text colour. */
const symbolColour = (f            , colour                 ) => (colour === 'gold' ? C.gold : f.theme.text);

const OUTWARD                                              = {
  north: { x: 0, y: -1 }, south: { x: 0, y: 1 }, west: { x: -1, y: 0 }, east: { x: 1, y: 0 },
};

/** ADR-045: draws each fitted part's frame, symbol and pin labels from its state (the shown run, UX.19). */
function drawPartFrames(f            , s           , states                      )       {
  const { ctx, scale, X, Y } = f;
  for (const st of states) {
    const fr = partFrame(st.part, s);
    if (!fr) continue;
    const out = OUTWARD[fr.wall];
    const cx = fr.centre.x + (out.x * HULL_MARGIN) / 2, cy = fr.centre.y + (out.y * HULL_MARGIN) / 2;
    const horizontal = fr.wall === 'north' || fr.wall === 'south';
    const w = horizontal ? PART_FRAME_LENGTH : FRAME_DEPTH, h = horizontal ? FRAME_DEPTH : PART_FRAME_LENGTH;
    const lit = st.pins.some((p) => p.on);
    ctx.fillStyle = f.theme.chip;
    ctx.strokeStyle = lit ? C.gold : f.theme.chipEdge;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(X(cx - w / 2), Y(cy - h / 2), w * scale, h * scale, scale * 0.15);
    ctx.fill();
    ctx.stroke();
    ctx.save();
    ctx.translate(X(cx), Y(cy));
    if (fr.wall === 'east') ctx.rotate(Math.PI / 2);
    ctx.scale(scale, scale);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (st.part === 'antenna') drawAntenna(ctx, scale, f.theme, st.pins.some((p) => p.pin === 'tx' && p.on));
    else if (st.part === 'battery') drawBattery(ctx, scale, f.theme, st.bars ?? 0);
    else drawClaw(ctx, scale, f.theme, st.holding === true);
    ctx.restore();
    drawPinLabels(f, s, st, fr.wall);
  }
}

/** Mast with a ball on top; radio waves while TX is on (ADR-045). Local cells, up is outward. */
function drawAntenna(ctx                          , scale        , t            , tx         )       {
  ctx.strokeStyle = tx ? C.gold : t.silk;
  ctx.fillStyle = tx ? C.gold : t.silk;
  ctx.lineWidth = 2 / scale;
  ctx.beginPath();
  ctx.moveTo(0, 0.45);
  ctx.lineTo(0, -0.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -0.17, 0.12, 0, Math.PI * 2);
  ctx.fill();
  if (!tx) return;
  for (const r of [0.3, 0.5]) {
    ctx.beginPath();
    ctx.arc(0, -0.17, r, Math.PI * 1.15, Math.PI * 1.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -0.17, r, Math.PI * 1.6, Math.PI * 1.85);
    ctx.stroke();
  }
}

/** Battery outline with four charge bars, `bars` of them lit (ADR-045). */
function drawBattery(ctx                          , scale        , t            , bars        )       {
  const barW = 0.3, gap = 0.06, bodyW = 4 * barW + 5 * gap;
  ctx.strokeStyle = t.silk;
  ctx.lineWidth = 1.5 / scale;
  ctx.strokeRect(-bodyW / 2, -0.25, bodyW, 0.5);
  ctx.fillStyle = t.silk;
  ctx.fillRect(bodyW / 2, -0.1, 0.08, 0.2);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < bars ? C.gold : unlitBar(t);
    ctx.fillRect(-bodyW / 2 + gap + i * (barW + gap), -0.19, barW, 0.38);
  }
}

/** Claw: jaws open while empty, closed on a block while holding (ADR-045). Local cells, up is outward. */
function drawClaw(ctx                          , scale        , t            , holding         )       {
  ctx.strokeStyle = holding ? C.gold : t.silk;
  ctx.fillStyle = holding ? C.gold : t.silk;
  ctx.lineWidth = 2.5 / scale;
  ctx.fillRect(-0.3, 0.3, 0.6, 0.15);
  const tip = holding ? 0.22 : 0.5;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 0.25, 0.3);
    ctx.lineTo(side * tip, -0.3);
    ctx.stroke();
  }
  if (holding) {
    ctx.fillStyle = C.crate;
    ctx.fillRect(-0.17, -0.2, 0.34, 0.34);
  }
}

/** Silkscreen label of each part pin on the board side (ADR-045). */
function drawPinLabels(f            , s           , st           , wall           )       {
  const { ctx, scale, X, Y } = f;
  ctx.fillStyle = f.theme.silk;
  ctx.font = `700 ${Math.max(9, scale * 0.26)}px system-ui, sans-serif`;
  ctx.textBaseline = 'middle';
  for (const pin of PART_PINS[st.part]) {
    const a = anchorOf({ component: st.id, pin }, s);
    const label = PIN_LABELS[pin];
    if (wall === 'north' || wall === 'south') {
      ctx.textAlign = 'center';
      ctx.fillText(label, X(a.x), Y(a.y + (wall === 'north' ? 0.45 : -0.45)), 1.1 * scale);
    } else {
      ctx.textAlign = wall === 'east' ? 'right' : 'left';
      ctx.fillText(label, X(a.x + (wall === 'east' ? -0.4 : 0.4)), Y(a.y), 1.1 * scale);
    }
  }
}

                                                  
                                                      

function drawSymbolFrame(f            , sym     , d        )       {
  const { ctx, scale, X, Y } = f;
  const { centre: c, wall, on } = sym;
  const horizontal = wall === 'north' || wall === 'south';
  const w = horizontal ? FRAME_LENGTH : FRAME_DEPTH, h = horizontal ? FRAME_DEPTH : FRAME_LENGTH;
  const style = frameStyle(on, d);
  ctx.fillStyle = f.theme.hull;
  ctx.strokeStyle = symbolColour(f, style.colour);
  ctx.lineWidth = style.width;
  ctx.setLineDash(style.dash);
  ctx.beginPath();
  ctx.roundRect(X(c.x - w / 2), Y(c.y - h / 2), w * scale, h * scale, scale * 0.15);
  ctx.fill();
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawSymbolPath(f            , path         , d        )       {
  const { ctx } = f;
  ctx.beginPath();
  for (const { op, pts } of path.ops) {
    if (op === 'M') ctx.moveTo(pts[0], pts[1]);
    else if (op === 'L') ctx.lineTo(pts[0], pts[1]);
    else if (op === 'Q') ctx.quadraticCurveTo(pts[0], pts[1], pts[2], pts[3]);
    else ctx.closePath();
  }
  if (path.paint === 'fill') {
    ctx.fillStyle = symbolColour(f, path.colour);
    ctx.fill();
  } else {
    ctx.strokeStyle = symbolColour(f, path.colour);
    ctx.lineWidth = strokeWidth(path.weight, d) / d;
    ctx.stroke();
  }
}

/** ADR-049: each bumper and thruster as its symbol in its frame, facing out from its wall, from the shown signals. */
function drawWallSymbols(f            , s           , signals              )       {
  const { ctx, X, Y, scale } = f;
  const d = FRAME_DEPTH * scale;
  for (const sym of wallSymbols(s, signals)) {
    drawSymbolFrame(f, sym, d);
    ctx.save();
    ctx.translate(X(sym.centre.x), Y(sym.centre.y));
    ctx.rotate(WALL_ANGLE[sym.wall]);
    ctx.scale(d, d);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const paths = sym.kind === 'bumper' ? bumperPaths(sym.on) : thrusterPaths(sym.on);
    for (const path of paths) drawSymbolPath(f, path, d);
    ctx.restore();
  }
}

// --- app/board-camera.ts
// The board camera of the robot interior (ADR-046, ADR-077): which layout mode (the control column or band)
// leaves the hull the most room, the Fit transform, zoom and pan with their clamps, the hull's on-screen
// rectangle and where Delete floats. DOM-free; every rectangle and point is in canvas pixels. The board
// transform maps board cell (x, y) to (ox + x * scale, oy + y * scale).

                                           

                                                        

/** An axis-aligned rectangle in canvas pixels. */
                                                                                  
/** The board's size in cells. */
                                                            
/** ADR-077 (replacing ADR-046's sides and bands): one control column at the left, or one band at the top. */
                                            

/**
 * ADR-077 reserved space and ADR-046 limits, in CSS pixels: the column's strip and the band (each 4 px inset + two
 * 44 px buttons with a 4 px gap + 8 px to the board), Delete's gap, the smallest Fit scale, the largest zoom and
 * the zoom button step.
 */
const INTERIOR = { column: 104, row: 104, margin: 8, minScale: 8, maxCell: 96, zoomStep: 1.25 }         ;
/** ADR-046: the size of the floating Delete button. */
const DELETE_SIZE = { width: 96, height: 44 }         ;

const EPSILON = 1e-9;

/**
 * ADR-077: the fit area of a mode, the safe rectangle minus the control column at the left (`column`) or the band
 * at the top (`row`); the edges without controls have no margin.
 */
function fitAreaFor(mode              , safe      )       {
  if (mode === 'column') {
    return { left: safe.left + INTERIOR.column, top: safe.top, width: Math.max(0, safe.width - INTERIOR.column),
      height: safe.height };
  }
  return { left: safe.left, top: safe.top + INTERIOR.row, width: safe.width,
    height: Math.max(0, safe.height - INTERIOR.row) };
}

/** ADR-046: min(area.w / (B.w + 2·HULL_MARGIN), area.h / (B.h + 2·HULL_MARGIN)), at least INTERIOR.minScale. */
function fitScale(area      , board           )         {
  const s = Math.min(area.width / (board.width + 2 * HULL_MARGIN), area.height / (board.height + 2 * HULL_MARGIN));
  return Math.max(INTERIOR.minScale, s);
}

/** ADR-077: the mode with the larger Fit scale (a tie picks 'row') and its fit area. */
function chooseLayout(safe      , board           )                                     {
  const column = fitAreaFor('column', safe), row = fitAreaFor('row', safe);
  if (fitScale(column, board) > fitScale(row, board)) return { mode: 'column', area: column };
  return { mode: 'row', area: row };
}

/** ADR-046: the Fit transform, the hull centred in the area at the Fit scale. */
function fitTransform(area      , board           )                 {
  const scale = fitScale(area, board);
  return { scale, ox: area.left + (area.width - board.width * scale) / 2,
    oy: area.top + (area.height - board.height * scale) / 2 };
}

/** ADR-046: the zoom range, [Fit scale, max(96, Fit scale)] pixels per cell. */
function zoomLimits(area      , board           )                               {
  const min = fitScale(area, board);
  return { min, max: Math.max(INTERIOR.maxCell, min) };
}

/** One axis of the clamp: centred when the hull fits, else no gap between hull edge and area edge. */
function clampOffset(o        , scale        , start        , size        , cells        )         {
  const hull = (cells + 2 * HULL_MARGIN) * scale;
  if (hull <= size + EPSILON) return start + (size - cells * scale) / 2;
  const high = start + HULL_MARGIN * scale, low = start + size - hull + HULL_MARGIN * scale;
  return Math.min(Math.max(o, low), high);
}

/** ADR-046 (after ADR-041 (2)): the scale into the zoom range, then each axis centred or gap-free. */
function clampTransform(t                , area      , board           )                 {
  const { min, max } = zoomLimits(area, board);
  const scale = Math.min(Math.max(t.scale, min), max);
  return { scale, ox: clampOffset(t.ox, scale, area.left, area.width, board.width),
    oy: clampOffset(t.oy, scale, area.top, area.height, board.height) };
}

/** ADR-046: multiplies the scale by `factor` keeping the board point under `at` there, then clamps. */
function zoomAbout(
  t                , factor        , at       , area      , board           ,
)                 {
  const { min, max } = zoomLimits(area, board);
  const scale = Math.min(Math.max(t.scale * factor, min), max);
  const bx = (at.x - t.ox) / t.scale, by = (at.y - t.oy) / t.scale;
  return clampTransform({ scale, ox: at.x - bx * scale, oy: at.y - by * scale }, area, board);
}

/** ADR-046: moves the board by (dx, dy) pixels, then clamps (at Fit nothing moves). */
function panBy(t                , dx        , dy        , area      , board           )                 {
  return clampTransform({ scale: t.scale, ox: t.ox + dx, oy: t.oy + dy }, area, board);
}

/** The hull's rectangle: the board plus HULL_MARGIN cells on each side. */
function hullRect(t                , board           )       {
  const m = HULL_MARGIN * t.scale;
  return { left: t.ox - m, top: t.oy - m, width: board.width * t.scale + 2 * m,
    height: board.height * t.scale + 2 * m };
}

const inside = (pt       , r      ) =>
  pt.x >= r.left && pt.x <= r.left + r.width && pt.y >= r.top && pt.y <= r.top + r.height;

/** ADR-046 drop rule: true when `pt` is inside both the hull and the fit area. */
function onBoard(pt       , t                , area      , board           )          {
  return inside(pt, area) && inside(pt, hullRect(t, board));
}

/** The overlap of two rectangles (zero size when they do not meet). */
function intersectRect(a      , b      )       {
  const left = Math.max(a.left, b.left), top = Math.max(a.top, b.top);
  const right = Math.min(a.left + a.width, b.left + b.width), bottom = Math.min(a.top + a.height, b.top + b.height);
  return { left, top, width: Math.max(0, right - left), height: Math.max(0, bottom - top) };
}

/**
 * ADR-046: where Delete floats, centred above `target` with an 8 px gap, below it when it would leave the top
 * of the fit area, then clamped into the area.
 */
function deleteButtonRect(target      , size                                   , area      )       {
  const gap = INTERIOR.margin;
  let left = target.left + target.width / 2 - size.width / 2;
  let top = target.top - gap - size.height;
  if (top < area.top) top = target.top + target.height + gap;
  left = Math.min(Math.max(left, area.left), area.left + area.width - size.width);
  top = Math.min(Math.max(top, area.top), area.top + area.height - size.height);
  return { left, top, width: size.width, height: size.height };
}

/** True when both are null or both have the same four numbers. */
function sameRect(a             , b             )          {
  if (a === null || b === null) return a === b;
  return a.left === b.left && a.top === b.top && a.width === b.width && a.height === b.height;
}

// --- app/board-press.ts
// Long press, the context menu and Move in the robot interior (ADR-050): a pointer held on a part or a wire opens
// `#i-context` (Move for parts, Delete); Move picks the part up and the next tap places it. Also the tap on a
// board spot with no pin: place the picked-up part, select a wire or clear the selection.


                                                            

                                           


                                                     

/** A pointer held this long on a part or a wire without moving past the tap slop opens the menu (ADR-050). */
const LONG_PRESS_MS = 500;

/** What a long press can open the menu for: a placed part or a wire (by its input pin). */
                                                                   

/** Touch targets at least 44 pt: a pin within 22 pt or half a cell, whichever is larger (in cells). */
const pinRadius = (v             ) => Math.max(22 / v.boardTransform.scale, 0.5);

/** A part's hit rectangle is at least this many cells on each side: 44 px at the current scale (UX.4). */
const partMinSide = (v             ) => 44 / v.boardTransform.scale;

/** The point of the wire into `to` nearest to `pt`, in board cells; `pt` itself when the wire is gone. */
function pointOnWire(v             , to        , pt       )        {
  const s = v.game.editor.session.schematic;
  const c = wireInto(s.circuit, to);
  return c ? nearestOnRoute(wireRoute(c.from, c.to, s), pt) : pt;
}

/** Starts the long-press timer of pointer `pointerId` on `target`, pressed at `at` (board cells). */
function armLongPress(v             , pointerId        , target             , at       )       {
  cancelLongPress(v);
  const timer = window.setTimeout(() => openMenu(v, pointerId, target, at), LONG_PRESS_MS);
  v.press = { timer, id: pointerId };
}

/** Stops a pending long press (moved past the slop, lifted, cancelled or a pinch started). */
function cancelLongPress(v             )       {
  if (!v.press) return;
  window.clearTimeout(v.press.timer);
  v.press = null;
}

/** The long press fired: the pointer does nothing more until it lifts; the target is selected; the menu opens. */
function openMenu(v             , pointerId        , target             , at       )       {
  v.press = null;
  if (v.drag?.id !== pointerId) return;
  v.drag = null;
  v.gesture.ignored.add(pointerId);
  const editor = v.game.editor;
  if ('part' in target) {
    editor.selectComponent(target.part);
    v.menu = { part: target.part, wire: null, at };
  } else {
    editor.selectWire(target.wire);
    v.wireTapAt = pointOnWire(v, target.wire, at);
    v.menu = { part: null, wire: target.wire, at: v.wireTapAt };
  }
  v.invalidate();
}

/** Closes the context menu without an edit or a selection change. */
function closeMenu(v             )       {
  if (!v.menu) return;
  v.menu = null;
  v.invalidate();
}

/** A tap on a spot with no pin: places the picked-up part (or cancels on itself), else selects a wire or clears. */
function tapEmpty(v             , pt       )       {
  const editor = v.game.editor;
  const s = editor.session.schematic;
  const id = v.moving;
  if (id) {
    v.moving = null;
    const fp = footprintOf(s.circuit, id);
    if (fp && componentAt(pt, s) !== id) editor.move(id, dropCell(fp, pt));
    return;
  }
  const wire = wireAt(pt, s, pinRadius(v));
  if (!wire) {
    editor.clearSelection();
    return;
  }
  editor.selectWire(wire);
  v.wireTapAt = pointOnWire(v, wire, pt);
}

/** Installs the menu's Move and Delete buttons; each reads the board's editor when it runs (ADR-091). */
function wireContextMenu(v             )       {
  const on = (id        , fn            ) => $(id).addEventListener('click', (e) => {
    e.preventDefault();
    fn();
    v.invalidate();
  });
  on('i-context-move', () => {
    const editor = v.game.editor;
    const part = v.menu?.part;
    closeMenu(v);
    if (!part || !editor.startMove(part)) return;
    editor.clearSelection();
    v.moving = part;
  });
  on('i-context-delete', () => {
    const editor = v.game.editor;
    const menu = v.menu;
    closeMenu(v);
    if (menu?.part) editor.remove(menu.part);
    else if (menu?.wire) {
      editor.selectWire(menu.wire);
      editor.deleteSelectedWire();
    }
  });
}

// --- app/board-input.ts
// Board pointer input of the robot interior (ADR-046): tap-to-wire, drag-to-wire, move, place from the tray,
// remove by dropping off the board, pan by dragging empty board, pinch and wheel zoom. Moved out of input.ts.
// ADR-050 touch wiring: snapping to valid targets, the double-tap on an output, long press (board-press.ts).
// The toolbox's own listeners are in toolbox-input.ts; while the chip drawer is open a board press only closes it
// or, with a chip armed, places that chip where it lifts (ADR-088).


                                               

                                           




                                                     

/** A pointer that moves more than this many pixels from where it went down drags instead of tapping. */
const TAP_SLOP = 8;
/** Ctrl+wheel (a trackpad pinch) zooms by exp(−deltaY × this). */
const WHEEL_ZOOM = 0.0015;
/** A second tap on the same pin within this many ms of the first is a double-tap (ADR-050). */
const DOUBLE_TAP_MS = 350;

/** Client pixels to canvas pixels. */
function toCanvas(v             , clientX        , clientY        )        {
  const r = v.boardCanvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

/** Client pixels to board cells, using the board camera. */
function toBoard(v             , clientX        , clientY        )        {
  const c = toCanvas(v, clientX, clientY);
  const t = v.boardTransform;
  return { x: (c.x - t.ox) / t.scale, y: (c.y - t.oy) / t.scale };
}

/** ADR-046 drop rule for a client point: inside the hull and the fit area. */
function overBoard(v             , clientX        , clientY        )          {
  if (!v.boardArea) return false;
  return onBoard(toCanvas(v, clientX, clientY), v.boardTransform, v.boardArea, v.game.editor.session.schematic.board);
}

/**
 * One pointer down on the board: a pin starts a wire, a part a move, anything else a pan (or a tap). A part or
 * a wire arms the long press (ADR-050); with a part picked up for Move every drag is a pan. A pin pressed inside a
 * part keeps `part` while the drag stays in its footprint (a move, shown as a ghost) and drops it once it leaves.
 */
function startBoardDrag(v             , e              )       {
  const pt = toBoard(v, e.clientX, e.clientY);
  const session = v.game.editor.session;
  const s = session.schematic;
  const start = { x: e.clientX, y: e.clientY };
  const id = e.pointerId;
  const pan = () => { v.drag = { type: 'pan', id, start, moved: false, at: pt, last: start }; };
  if (v.moving) { pan(); return; }
  const pin = pinAt(pt, s, pinRadius(v));
  // A press inside a footprint near a pin is both: a tap or a drag out of the part wires, a drag inside moves it.
  const part = componentAt(pt, s, pin ? 0 : partMinSide(v));
  const grab = (p        ) => {
    // Non-null: componentAt only returns IDs of placed components.
    const pos = s.position(p) ;
    return { x: pt.x - pos.x, y: pt.y - pos.y };
  };
  if (pin) {
    // Two pins in reach (an AND's or OR's inputs half a cell apart, a flip-flop's S and R at Fit): aim with the
    // magnifier (UX.4).
    const aiming = pinsNear(pt, s, pinRadius(v)) >= 2;
    v.drag = {
      type: 'pin', id, pin, start, moved: false, at: pt, snap: aiming ? pin : null,
      targets: validTargets(session, pin), part, grab: part ? grab(part) : pt, aiming,
    };
    if (aiming) v.invalidate();
    // A press on the pin dot itself opens no menu; beside it, inside the part, it does.
    if (part && !pinAt(pt, s, 10 / v.boardTransform.scale)) armLongPress(v, id, { part }, pt);
    return;
  }
  if (part) {
    v.drag = { type: 'component', id, part, start, moved: false, at: pt, grab: grab(part) };
    armLongPress(v, id, { part }, pt);
    return;
  }
  pan();
  const wire = wireAt(pt, s, pinRadius(v));
  if (wire) armLongPress(v, id, { wire }, pt);
}

function moveBoardDrag(v             , e              )       {
  const drag = v.drag;
  if (!drag || drag.id !== e.pointerId) return;
  if (Math.hypot(e.clientX - drag.start.x, e.clientY - drag.start.y) > TAP_SLOP) {
    drag.moved = true;
    cancelLongPress(v);
  }
  if (drag.type === 'pin' && drag.aiming) {
    if (drag.moved) { drag.aiming = false; drag.snap = null; } else {
      // Still within the slop: the pin nearest the finger is the one the drag or tap will use.
      const s = v.game.editor.session.schematic;
      const pin = pinAt(toBoard(v, e.clientX, e.clientY), s, pinRadius(v));
      if (pin && !samePin(pin, drag.pin)) {
        drag.pin = pin;
        drag.targets = validTargets(v.game.editor.session, pin);
      }
      drag.snap = drag.pin;
    }
  }
  if (drag.type === 'pan') {
    if (drag.moved && v.boardArea) {
      v.boardTransform = panBy(v.boardTransform, e.clientX - drag.last.x, e.clientY - drag.last.y, v.boardArea,
        v.game.editor.session.schematic.board);
      drag.last = { x: e.clientX, y: e.clientY };
    }
  } else drag.at = toBoard(v, e.clientX, e.clientY);
  if (drag.type === 'pin' && drag.moved) {
    const s = v.game.editor.session.schematic;
    // A pin drag from inside a part moves the part while it stays in the footprint; once out, it wires (UX.22).
    if (drag.part && componentAt(drag.at, s) !== drag.part) drag.part = null;
    drag.snap = drag.part ? null : snapTarget(drag.targets, s, drag.at, snapRadius(v.boardTransform.scale));
  }
  v.invalidate();
}

/** A pin tap: tap-to-wire, a double-tap when the same pin was tapped within DOUBLE_TAP_MS (ADR-050). */
function tapPinAt(v             , e              , pin        )       {
  const last = v.lastTap;
  const double = last !== null && samePin(last.pin, pin) && e.timeStamp - last.at <= DOUBLE_TAP_MS;
  v.game.editor.tapPin(pin, double);
  v.lastTap = double ? null : { pin, at: e.timeStamp };
}

/** A finished pin drag: the snapped target, else a pin under the finger (its refusal shows), else nothing. */
function dropWire(v             , from        , snap               , pt       )       {
  const editor = v.game.editor;
  const target = snap ?? pinAt(pt, editor.session.schematic, pinRadius(v));
  if (target && !samePin(target, from)) editor.connect(from, target);
}

/** A part dragged: removed when dropped off the board, else moved under the finger and selected. */
function movePart(v             , e              , part        , grab       , pt       )       {
  const editor = v.game.editor;
  if (!overBoard(v, e.clientX, e.clientY)) editor.remove(part);
  else {
    editor.move(part, { x: Math.round(pt.x - grab.x), y: Math.round(pt.y - grab.y) });
    editor.selectComponent(part);
  }
}

/**
 * Applies a finished drag: a tap, a wire, a move, a removal (dropped off the board), a placement or arming from the
 * toolbox or the chip drawer (`dropNewPart`), or a pan.
 */
function endBoardDrag(v             , e              )       {
  const d = v.drag;
  if (!d || d.id !== e.pointerId) return;
  v.drag = null;
  const editor = v.game.editor;
  const pt = toBoard(v, e.clientX, e.clientY);
  if (d.type === 'pan') {
    if (!d.moved) tapEmpty(v, pt);
  } else if (d.type === 'pin') {
    if (!d.moved) tapPinAt(v, e, d.pin);
    else if (d.part && componentAt(pt, editor.session.schematic) === d.part) movePart(v, e, d.part, d.grab, pt);
    else dropWire(v, d.pin, d.snap, pt);
  } else if (d.type === 'component') {
    if (!d.moved) {
      editor.selectComponent(editor.selectedComponent === d.part ? null : d.part);
    } else movePart(v, e, d.part, d.grab, pt);
  } else dropNewPart(v, d, overBoard(v, e.clientX, e.clientY), pt);
  v.invalidate();
}

/** A second pointer on the board: cancels the first one's drag without an edit and starts a pinch. */
function startPinch(v             , ids                  )       {
  const g = v.gesture;
  v.drag = null;
  cancelLongPress(v);
  closeMenu(v);
  // Non-null: both ids were just read from the pointer map.
  const a = g.pointers.get(ids[0]) , b = g.pointers.get(ids[1]) ;
  const mid = toBoard(v, (a.x + b.x) / 2, (a.y + b.y) / 2);
  g.pinch = { ids, distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), scale: v.boardTransform.scale,
    anchor: mid };
}

/** Pinch: scale = start scale × distance / start distance, the start board point kept under the midpoint. */
function movePinch(v             )       {
  const g = v.gesture;
  if (!g.pinch || !v.boardArea) return;
  const board = v.game.editor.session.schematic.board;
  // Non-null: a pinch ends as soon as one of its pointers lifts.
  const a = g.pointers.get(g.pinch.ids[0]) , b = g.pointers.get(g.pinch.ids[1]) ;
  const { min, max } = zoomLimits(v.boardArea, board);
  const scale = Math.min(Math.max(g.pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / g.pinch.distance, min), max);
  const mid = toCanvas(v, (a.x + b.x) / 2, (a.y + b.y) / 2);
  const t = { scale, ox: mid.x - g.pinch.anchor.x * scale, oy: mid.y - g.pinch.anchor.y * scale };
  v.boardTransform = clampTransform(t, v.boardArea, board);
  v.invalidate();
}

function pointerDown(v             , e              )       {
  e.preventDefault();
  if (v.game.dialog !== null) return;
  v.boardCanvas.setPointerCapture?.(e.pointerId);
  const g = v.gesture;
  g.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (v.chipDrawer.open) {
    // ADR-088: never a pan, wire, selection or move; the release places the armed chip, else the press closes.
    e.stopPropagation();
    g.ignored.add(e.pointerId);
    if (v.chipDrawer.armed) v.chipDrawer.press = e.pointerId; else closeChipDrawer(v);
    v.invalidate();
    return;
  }
  if (v.menu) {
    // ADR-050: a pointer-down while the menu is open only closes it.
    closeMenu(v);
    g.ignored.add(e.pointerId);
    return;
  }
  if (g.pinch || g.ignored.size > 0) { g.ignored.add(e.pointerId); return; }
  const others = [...g.pointers.keys()].filter((id) => id !== e.pointerId);
  if (others.length > 0) {
    startPinch(v, [others[0], e.pointerId]);
    v.invalidate();
    return;
  }
  startBoardDrag(v, e);
}

function pointerMove(v             , e              )       {
  const g = v.gesture;
  // Tray drags are followed by the window listeners.
  if (!g.pointers.has(e.pointerId)) return;
  g.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (g.ignored.has(e.pointerId)) return;
  if (g.pinch) movePinch(v);
  else moveBoardDrag(v, e);
}

function pointerUp(v             , e              , cancelled         )       {
  const g = v.gesture;
  const tracked = g.pointers.delete(e.pointerId);
  if (v.press?.id === e.pointerId) cancelLongPress(v);
  if (releaseDrawerPress(v, e, cancelled)) v.invalidate();
  if (g.ignored.delete(e.pointerId)) return;
  if (g.pinch?.ids.includes(e.pointerId)) {
    for (const id of g.pinch.ids) if (id !== e.pointerId && g.pointers.has(id)) g.ignored.add(id);
    g.pinch = null;
    v.invalidate();
    return;
  }
  if (!tracked) return;
  if (cancelled) { v.drag = null; v.invalidate(); } else endBoardDrag(v, e);
}

/** ADR-046 wheel: Ctrl (a trackpad pinch) zooms about the pointer, a plain wheel pans. */
function wheel(v             , e            )       {
  e.preventDefault();
  if (!v.boardArea || v.game.dialog !== null) return;
  const board = v.game.editor.session.schematic.board;
  if (e.ctrlKey) {
    const at = toCanvas(v, e.clientX, e.clientY);
    v.boardTransform = zoomAbout(v.boardTransform, Math.exp(-e.deltaY * WHEEL_ZOOM), at, v.boardArea, board);
  } else v.boardTransform = panBy(v.boardTransform, -e.deltaX, -e.deltaY, v.boardArea, board);
  if (e.ctrlKey) closeMenu(v);
  v.invalidate();
}

/** ADR-046 Zoom buttons and keys: in or out by the zoom step about the fit area's centre. */
function zoomStep(v             , zoomIn         )       {
  const area = v.boardArea;
  if (!area) return;
  const centre = { x: area.left + area.width / 2, y: area.top + area.height / 2 };
  const factor = zoomIn ? INTERIOR.zoomStep : 1 / INTERIOR.zoomStep;
  v.boardTransform = zoomAbout(v.boardTransform, factor, centre, area, v.game.editor.session.schematic.board);
  closeMenu(v);
}

/** Installs the board's pointer and wheel listeners and the window listeners for tray and chip drawer drags. */
function wireBoard(v             )       {
  const cv = v.boardCanvas;
  cv.addEventListener('pointerdown', (e) => pointerDown(v, e));
  cv.addEventListener('pointermove', (e) => pointerMove(v, e));
  cv.addEventListener('pointerup', (e) => pointerUp(v, e, false));
  cv.addEventListener('pointercancel', (e) => pointerUp(v, e, true));
  cv.addEventListener('wheel', (e) => wheel(v, e), { passive: false });
  window.addEventListener('pointermove', (e) => { if (v.drag?.type === 'new') moveBoardDrag(v, e); });
  window.addEventListener('pointerup', (e) => { if (v.drag?.type === 'new') endBoardDrag(v, e); });
}

// --- app/toolbox-input.ts
// Toolbox input of the robot interior (moved out of board-input.ts): a gate tool's tap places its part and a drag
// places it where dropped (ADR-046); the Chips tool opens and closes the chip drawer, and a drawer chip is placed by
// a drag onto the board, by a tap that arms it and a board tap, or by Enter (ADR-081, ADR-088). Every chip
// placement attempt closes the drawer, as do Escape (input.ts) and a press on any other control; the fab's drawer
// actions (fab-input.ts) do not (ADR-091).


                                                              


                                           

                                                           

/** ADR-088: closes the chip drawer and disarms its chip; a pending board press it caught is dropped. */
function closeChipDrawer(v             )       {
  v.chipDrawer = { open: false, armed: null, robot: null, press: null };
}

/** ADR-088: a tap on a drawer chip arms it, a tap on the armed one disarms it; the drawer stays open. */
function toggleArmed(v             , id        )       {
  v.chipDrawer.armed = v.chipDrawer.armed === id ? null : id;
}

/**
 * A finished drag from the toolbox or the drawer (ADR-046, ADR-088): an unmoved gate drag places it at the nearest
 * free cell and an unmoved chip drag arms or disarms the chip; a moved drag released over the board (`onBoard`)
 * places the part or chip with its footprint centred under `pt`. Every chip outcome but arming closes the drawer.
 */
function dropNewPart(v             , d                                , onBoard         , pt       )       {
  const editor = v.game.editor;
  const chip = d.chip;
  if (!chip) {
    // Non-null: a toolbox kind is a gate kind, which has a footprint.
    if (!d.moved) editor.place(d.kind, null);
    else if (onBoard) editor.place(d.kind, dropCell(footprint(d.kind) , pt));
    return;
  }
  if (!d.moved) {
    toggleArmed(v, chip.id);
    return;
  }
  closeChipDrawer(v);
  if (onBoard) editor.placeChip(chip, dropCell(chipFootprint(chip), pt));
}

/**
 * ADR-088: the release (or cancel) of a board press made while the drawer was open with a chip armed: a release
 * places the armed chip centred under it; either closes the drawer. False for any other pointer.
 */
function releaseDrawerPress(v             , e              , cancelled         )          {
  const d = v.chipDrawer;
  if (d.press !== e.pointerId) return false;
  const chip = d.armed === null ? null : v.game.chipLibrary.chip(d.armed);
  closeChipDrawer(v);
  if (chip && !cancelled) {
    v.game.editor.placeChip(chip, dropCell(chipFootprint(chip), toBoard(v, e.clientX, e.clientY)));
  }
  return true;
}

/** A gate tool: a press at the limit shows the limit message, else it starts a drag of a new part (ADR-046). */
function wireGateTool(v             , kind               )       {
  $(`tool-${kind}`).addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (v.game.editor.session.remaining(kind) === 0) {
      v.game.editor.edit((s) => s.place(kind, { x: -99, y: -99 }));
      v.invalidate();
      return;
    }
    const start = { x: e.clientX, y: e.clientY };
    v.drag = { type: 'new', id: e.pointerId, kind, chip: null, start, moved: false,
      at: toBoard(v, e.clientX, e.clientY) };
  });
}

/** ADR-088: the Chips tool's press never reaches the window's closing listener; a tap opens or closes the drawer. */
function wireChipTool(v             )       {
  const tool = $('tool-chip');
  tool.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
  });
  tool.addEventListener('click', (e) => {
    e.preventDefault();
    if (v.chipDrawer.open) closeChipDrawer(v);
    else {
      const robot = v.game.screen === 'fab' ? 'bench' : v.game.player.run.current;
      v.chipDrawer = { open: true, armed: null, robot, press: null };
    }
    v.invalidate();
  });
}

/**
 * ADR-088: drawer button k: a press starts a drag of the k-th library chip (the board's window listeners follow
 * it); a click without a press (Enter or Space, `detail` 0) places the chip at the nearest free cell and closes.
 */
function wireChipPick(v             , k        )       {
  const b = $(`chip-pick-${k}`);
  b.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    const chip = v.game.chipLibrary.chips[k - 1];
    if (!chip) return;
    const start = { x: e.clientX, y: e.clientY };
    v.drag = { type: 'new', id: e.pointerId, kind: 'chip', chip, start, moved: false,
      at: toBoard(v, e.clientX, e.clientY) };
  });
  b.addEventListener('click', (e) => {
    e.preventDefault();
    const chip = v.game.chipLibrary.chips[k - 1];
    if (e.detail !== 0 || !chip) return;
    closeChipDrawer(v);
    v.game.editor.placeChip(chip, null);
    v.invalidate();
  });
}

/**
 * Installs the gate tools, the Chips tool and the drawer's buttons; a press that reaches the window (one on any
 * other control) closes the drawer (ADR-088), and a press on the drawer's own background does not.
 */
function wireToolbox(v             )       {
  for (const kind of TOOL_KINDS                   ) wireGateTool(v, kind);
  wireChipTool(v);
  for (let k = 1; k <= CHIP_DRAWER_BUTTONS; k++) wireChipPick(v, k);
  $('chip-drawer').addEventListener('pointerdown', (e) => e.stopPropagation());
  window.addEventListener('pointerdown', () => {
    if (!v.chipDrawer.open) return;
    closeChipDrawer(v);
    v.invalidate();
  });
}

// --- app/look-input.ts
// Look mode's input (ADR-094): the toggle, the keys, the check that turns it off when the view or the level changed,
// and the one-finger drag that pans the camera. While Look is on, walking is off: the room's floor tap and joystick
// (room-input.ts, ADR-051), the pad and the steering keys do nothing. Look never touches `LevelRun`.

                                                  


                                           

                                                     

const LOOK_WALK_KEYS = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft', 'w', 'd', 's', 'a'];
const LOOK_DIRECTIONS              = ['north', 'east', 'south', 'west'];

/** The room canvas's size, the cell size and the camera centre now drawn (px), as the room frame computes them. */
function drawnFrame(v             )                                                     {
  const r = v.roomCanvas.getBoundingClientRect();
  const vw = Math.max(1, Math.round(r.width)), vh = Math.max(1, Math.round(r.height));
  const c = cellSize(vw, vh);
  const room = v.game.player.run.level.room;
  return { c, vw, vh, from: lookCamera(v.look, v.game.player.run.world, room.width, room.height, c, vw, vh) };
}

function lookOff(v             )       {
  v.look = { ...LOOK_OFF };
  v.invalidate();
}

/** True while the room or outside view takes Look (no dialog open). */
function lookAllowed(v             )          {
  const { screen, dialog } = v.game;
  return (screen === 'room' || screen === 'outside') && dialog === null;
}

/** The `r-look` button: turns Look off, or on in the room or outside view, ending any walk or held steering. */
function toggleLook(v             )       {
  if (v.look.on) { lookOff(v); return; }
  if (!lookAllowed(v)) return;
  const player = v.game.player;
  player.cancelWalk();
  v.roomTouch = null;
  for (const d of LOOK_DIRECTIONS) player.release(d);
  player.setSprint(null);
  v.look = { ...LOOK_OFF, on: true, screen: v.game.screen, run: player.run };
  v.invalidate();
}

/**
 * A key while Look is on: a walk key turns it off and is consumed (true), but an auto-repeat of one only is consumed
 * and leaves Look on; Escape turns it off (false).
 */
function lookKey(v             , e               )          {
  if (!v.look.on) return false;
  if (LOOK_WALK_KEYS.includes(e.key)) {
    e.preventDefault();
    if (!e.repeat) lookOff(v);
    return true;
  }
  if (e.key === 'Escape') lookOff(v);
  return false;
}

/** Turns Look off when the screen or the run is not the one it was turned on in (checked on every render). */
function settleLook(v             )       {
  if (lookStale(v.look, v.game.screen, v.game.player.run)) lookOff(v);
}

/** A pointer down on the room while Look is on: starts the pan when allowed; true while Look is on. */
function startLookDrag(v             , e              )          {
  if (!v.look.on) return false;
  if (v.look.drag !== null || !lookAllowed(v)) return true;
  e.preventDefault();
  v.roomCanvas.setPointerCapture?.(e.pointerId);
  const at = { x: e.clientX, y: e.clientY };
  v.look.drag = { id: e.pointerId, start: at, last: at, moved: false };
  return true;
}

/** Pans the camera by the finger's movement once it passed the tap slop; true while Look is on. */
function moveLookDrag(v             , e              )          {
  if (!v.look.on) return false;
  const drag = v.look.drag;
  if (!drag || drag.id !== e.pointerId) return true;
  const at = { x: e.clientX, y: e.clientY };
  if (!drag.moved && Math.hypot(at.x - drag.start.x, at.y - drag.start.y) <= TAP_SLOP) return true;
  const from = drag.moved ? drag.last : drag.start;
  drag.moved = true;
  const { c, vw, vh, from: camera } = drawnFrame(v);
  const room = v.game.player.run.level.room;
  v.look.center = panLook(camera, at.x - from.x, at.y - from.y, room.width, room.height, c, vw, vh);
  drag.last = at;
  v.invalidate();
  return true;
}

/** The pointer lifted or was cancelled: the drag ends where it is; true while Look is on. */
function endLookDrag(v             , e              )          {
  if (!v.look.on) return false;
  if (v.look.drag?.id === e.pointerId) v.look.drag = null;
  v.invalidate();
  return true;
}

// --- app/room-input.ts
// Pointer input on the room floor (ADR-051): a tap walks the figure there (walk-path.ts, Player.walkTo), a drag
// becomes the joystick under the thumb and steers through Player.press/release like the pad. One pointer at a
// time; only in the room view, while the figure stands and no Menu dialog is open. Every handler redraws. A drag
// at least JOYSTICK.sprintRadius from its start sprints (ADR-055). While Look is on (ADR-094) the floor pans the
// camera instead, in the room and the outside view: each handler hands the pointer to look-input.ts first.

                                                  

                                           



                                                                


/** Whether the room takes floor taps and drags now (ADR-051 "Where"). */
function roomTakesTouch(v             )          {
  const { game } = v;
  return game.screen === 'room' && game.dialog === null && game.player.canSteer;
}

/** Client pixels to room cells (cell (x, y) spans x…x+1, y…y+1), the inverse of the drawn room frame. */
function roomCellsAt(v             , clientX        , clientY        )        {
  const r = v.roomCanvas.getBoundingClientRect();
  const vw = Math.max(1, Math.round(r.width)), vh = Math.max(1, Math.round(r.height));
  const { c, ox, oy } = roomFrameOf(v, v.game.player.run.world, vw, vh);
  return { x: (clientX - r.left - ox) / c - 1, y: (clientY - r.top - oy) / c - 1 };
}

/** Releases the joystick's pressed direction, if any, and forgets the room pointer. */
function endRoomTouch(v             )       {
  const t = v.roomTouch;
  if (!t) return;
  v.roomTouch = null;
  if (t.dir !== null) v.game.player.release(t.dir);
  v.game.player.setSprint(null);
}

/**
 * Changes the joystick's steering and sprint (ADR-055): a new direction releases the old one and presses the new
 * one, as the pad does; the sprint is set before that press, so a fast first drag sprints its first tick.
 */
function steerJoystick(v             , t           , d                  , sprint         )       {
  const player = v.game.player;
  t.sprint = sprint;
  if (d === t.dir) {
    player.setSprint(sprint);
    return;
  }
  if (t.dir !== null) player.release(t.dir);
  t.dir = d;
  player.setSprint(sprint);
  if (d !== null) player.press(d);
}

function roomDown(v             , e              )       {
  if (startLookDrag(v, e)) return;
  if (v.roomTouch !== null || !roomTakesTouch(v)) return;
  e.preventDefault();
  v.roomCanvas.setPointerCapture?.(e.pointerId);
  const at = { x: e.clientX, y: e.clientY };
  v.roomTouch = { id: e.pointerId, start: at, at, moved: false, dir: null, sprint: false };
  v.invalidate();
}

function roomMove(v             , e              )       {
  if (moveLookDrag(v, e)) return;
  const t = v.roomTouch;
  if (!t || t.id !== e.pointerId) return;
  t.at = { x: e.clientX, y: e.clientY };
  const dx = t.at.x - t.start.x, dy = t.at.y - t.start.y;
  if (!t.moved && Math.hypot(dx, dy) > TAP_SLOP) {
    t.moved = true;
    v.game.player.cancelWalk();
  }
  if (t.moved) steerJoystick(v, t, joystickDirection(dx, dy), joystickSprints(dx, dy));
  v.invalidate();
}

/** A tap at a client point: walks to its target, or does nothing when the tap has none (ADR-051, ADR-089). */
function tapRoom(v             , clientX        , clientY        )       {
  const player = v.game.player, level = player.run.level;
  const target = walkTargetAt(level.room, player.run.world, roomCellsAt(v, clientX, clientY), level.fab);
  if (target !== null) player.walkTo(target);
}

function roomUp(v             , e              , cancelled         )       {
  if (endLookDrag(v, e)) return;
  const t = v.roomTouch;
  if (!t || t.id !== e.pointerId) return;
  const tap = !t.moved && !cancelled && roomTakesTouch(v);
  endRoomTouch(v);
  if (tap) tapRoom(v, e.clientX, e.clientY);
  v.invalidate();
}

/** Installs the room canvas's pointer-down and the window listeners that follow that one pointer (ADR-051). */
function wireRoom(v             )       {
  v.roomCanvas.addEventListener('pointerdown', (e) => roomDown(v, e));
  window.addEventListener('pointermove', (e) => roomMove(v, e));
  window.addEventListener('pointerup', (e) => roomUp(v, e, false));
  window.addEventListener('pointercancel', (e) => roomUp(v, e, true));
}

// --- app/menu-input.ts
// The drop-down Menu's input (ADR-052): the moved Reset, Redo, Zoom and Fit entries, Put and Take (ADR-071),
// Fit and Remove a part (ADR-066, ADR-073) and the backdrop. Redo and Zoom keep the Menu open; Reset, Fit,
// Put, Take and Fit a part close it; Remove a part opens its confirmation; a tap on the backdrop only closes it. In
// "Chip fab" and "Reset bench" are fab-input.ts's.





                                                     

/** Installs the Menu's entries and its backdrop; a disabled entry does nothing. */
function wireMenu(v             )       {
  const { game, invalidate } = v;
  const on = (id        , fn            ) => $(id).addEventListener('click', (e) => {
    e.preventDefault();
    if (!($(id)                     ).disabled) fn();
    invalidate();
  });
  on('menu-reset', () => game.askReset());
  on('menu-redo', () => game.editor.redo());
  on('menu-zoom-in', () => zoomStep(v, true));
  on('menu-zoom-out', () => zoomStep(v, false));
  on('menu-fit', () => { v.needsFit = true; closeMenu(v); game.dialog = null; });
  for (const kind of ITEM_KINDS) {
    on(`menu-stow-${kind}`, () => game.passItem('stow', kind));
    on(`menu-take-${kind}`, () => game.passItem('take', kind));
  }
  for (const part of FOUND_PARTS) {
    on(`menu-fit-${part}`, () => game.fitPart(part));
    on(`menu-remove-${part}`, () => game.askRemove(part));
  }
  $('menu').addEventListener('pointerdown', (e) => {
    if (e.target !== $('menu')) return;
    e.preventDefault();
    e.stopPropagation();
    game.dialog = null;
    invalidate();
  });
}

// --- app/menu-chrome.ts
// The drop-down Menu's chrome (ADR-052): which entries show (Put and Take, ADR-071, and Fit and Remove, ADR-066,
// ADR-073, only in a campaign interior when they would do something; "Chip fab" in a campaign level's or tutorial
// room's room, interior and outside view, and the fab's own entries, ADR-091; "Main menu" in every view of a campaign
// level or tutorial room and "Leave level" only in a level file outside the fab, ADR-095), the disabled states of
// Redo and Zoom, and where the list goes next to its button. Called from chrome.ts while the Menu is open.



                                                            


                                                     

const clientRect = (el             )       => {
  const r = el.getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height };
};

/** Zoom out is disabled at the Fit scale, Zoom in at the maximum (ADR-046, as the Menu entries). */
function updateZoomEntries(v             )       {
  const scale = v.boardTransform.scale;
  const board = v.game.editor.session.schematic.board;
  const lim = v.boardArea ? zoomLimits(v.boardArea, board) : { min: scale, max: scale };
  ($('menu-zoom-out')                     ).disabled = scale <= lim.min + 1e-9;
  ($('menu-zoom-in')                     ).disabled = scale >= lim.max - 1e-9;
}

/** The list's place next to the Menu button of the current view: below a row cluster, right of a column one. */
function placeList(v             )       {
  const screen = v.game.screen;
  const interior = screen === 'interior' || screen === 'fab';
  const button = clientRect($(interior ? 'i-menu' : 'r-menu'));
  const layout = interior ? ($('interior').dataset.layout                            ) ?? null : null;
  const anchor = menuAnchor(screen === 'title' ? 'room' : screen, layout);
  const cluster = clientRect($(anchor.cluster));
  const column = anchor.column;
  const list = $('menu-list');
  const safe = clientRect($('safe-area'));
  list.style.maxHeight = '';
  list.style.width = `${menuListRect(button, cluster, column, safe, 0).width}px`;
  const r = menuListRect(button, cluster, column, safe, list.offsetHeight);
  list.style.left = `${r.left}px`;
  list.style.top = `${r.top}px`;
  list.style.maxHeight = `${r.height}px`;
}

/** ADR-071: each "Put <item> in hold" shows while `stowable` has its kind, each "Take <item> from hold" likewise. */
function updateHoldEntries(v             )       {
  const stowable = v.game.stowable, takeable = v.game.takeable;
  for (const kind of ITEM_KINDS) {
    $(`menu-stow-${kind}`).hidden = !stowable.includes(kind);
    $(`menu-take-${kind}`).hidden = !takeable.includes(kind);
  }
}

/** ADR-066, ADR-073: each "Fit <part>" shows while `fittable` has the part, each "Remove <part>" likewise. */
function updatePartEntries(v             )       {
  const fittable = v.game.fittable, removable = v.game.removable;
  for (const part of FOUND_PARTS) {
    $(`menu-fit-${part}`).hidden = !fittable.includes(part);
    $(`menu-remove-${part}`).hidden = !removable.includes(part);
  }
}

/**
 * ADR-091, ADR-095: "Chip fab" in a campaign level's or tutorial room's room, interior and outside view; in the fab
 * "Reset bench" in place of Reset, and no "Play again"; "Main menu" in every view of a campaign level or tutorial
 * room, the fab included, and "Leave level" only in a level file opened with `openPuzzle`, outside the fab.
 */
function updateFabEntries(v             )       {
  const game = v.game, screen = game.screen, fab = screen === 'fab';
  const session = game.inCampaign || game.inTutorial;
  $('menu-fab').hidden = !session || !['room', 'interior', 'outside'].includes(screen);
  $('menu-reset').hidden = fab;
  $('menu-reset-bench').hidden = !fab;
  $('menu-play-again').hidden = fab;
  $('menu-leave').hidden = fab || session;
  $('menu-main').hidden = !session;
}

/** Shows the entries of the current view, sets their disabled states and places the open list (ADR-052). */
function updateMenuList(v             )       {
  const game = v.game;
  const fab = game.screen === 'fab';
  $('menu-interior-row').hidden = game.screen !== 'interior' && !fab;
  updateHoldEntries(v);
  updatePartEntries(v);
  updateFabEntries(v);
  ($('menu-redo')                     ).disabled = !game.editor.canRedo;
  updateZoomEntries(v);
  placeList(v);
}

// --- app/chip-symbol.ts
// The chip symbol on the board (ADR-081, measures ADR-088): a black body inset in its 3 x h footprint, a half-circle
// notch on the middle of its north edge, a gold stub per pin from the footprint edge to the body at the pin's row,
// and the chip's number. DOM-free: every function takes the footprint as a pixel rectangle, like `gateStubLines`;
// interior-chips.ts draws it.


                                                       
                                                  

/** ADR-081: a chip's footprint is 3 cells wide, so a cell is a third of the footprint's pixel width. */
const chipCell = (fp          )         => fp.width / 3;

/** ADR-088: the body from x + 0.4 to x + 2.6 and from y + 0.1 to y + h − 0.1 cells of footprint `fp` (px). */
function chipBodyRect(fp          )           {
  const c = chipCell(fp);
  return { x: fp.x + 0.4 * c, y: fp.y + 0.1 * c, width: 2.2 * c, height: fp.height - 0.2 * c };
}

/** ADR-088: the notch, a half circle of radius 0.2 cell centred on the middle of the body's north edge (px). */
function chipNotch(body          , scale        )                                      {
  return { x: body.x + body.width / 2, y: body.y, r: 0.2 * scale };
}

/**
 * ADR-088: one stub per pin of `def`, from the footprint edge to the body at the pin's anchor y (row r at
 * y + r + 0.5 cells), inputs on the west, outputs on the east; `x0` is the west end. Inputs first, then outputs.
 */
function chipStubLines(def                , fp          )                                          {
  const c = chipCell(fp), body = chipBodyRect(fp);
  // Non-null: every pin of `def.inputs` and `def.outputs` has a row on its side.
  const y = (pin        ) => fp.y + (chipPinRow(def, pin)  + 0.5) * c;
  return [
    ...def.inputs.map((pin) => ({ x0: fp.x, x1: body.x, y: y(pin) })),
    ...def.outputs.map((pin) => ({ x0: body.x + body.width, x1: fp.x + fp.width, y: y(pin) })),
  ];
}

/** ADR-088: the number's font size, `max(9, 0.5 × s)` px at s px per cell. */
const chipDigitsPx = (scale        )         => Math.max(9, 0.5 * scale);

/** ADR-081: the number a chip shows, `chip-7` → `7`. */
const chipLabel = (def                )         => String(chipNumber(def.id));

// --- app/chip-drawer.ts
// The Chips tool and the chip drawer's chrome (ADR-081, ADR-088): the tool's visibility, count, dimming and names,
// and the drawer's buttons (one per library chip, `chip-pick-1` to `chip-pick-24`, ADR-091), its armed chip and its
// place where the Menu list opens. In the fab the armed chip shows "Open on bench" and, for a burned chip, "Scrap"
// (ADR-091). The drawer closes here when the interior or the fab leaves the screen, a dialog opens or the current
// robot changes. Called from chrome.ts and interior-chrome.ts; its input is in toolbox-input.ts and fab-input.ts.

                                                            





                                                     

/**
 * ADR-088: the drawer's height for `count` buttons, four a row: 44 px rows, 4 px gaps, 8 px padding, 1.5 px edge;
 * ADR-091: 48 px more per shown action (`actions`). `menuListRect` clamps it to the safe area less 16 px.
 */
const chipDrawerHeight = (count        , actions = 0)         => {
  const rows = Math.max(1, Math.ceil(count / 4));
  return 2 * 8 + 2 * 1.5 + rows * 44 + (rows - 1) * 4 + actions * 48;
};

/**
 * ADR-088: the Chips tool shows while the current robot allows `chip` and the library holds a chip; its count is
 * the library's, it is dimmed (`used`) while no chip is left to place, and it names the library and the drawer's
 * state. Returns whether it shows.
 */
function updateChipTool(v             )          {
  const session = v.game.editor.session;
  const count = v.game.chipLibrary.chips.length;
  const b = $('tool-chip');
  b.hidden = !session.isAllowed('chip') || count === 0;
  // Non-null: the Chips tool's markup contains a .count element.
  b.querySelector('.count') .textContent = String(count);
  b.classList.toggle('used', session.remaining('chip') === 0);
  b.setAttribute('aria-label', `Chips, ${count} in the library`);
  b.setAttribute('aria-expanded', String(v.chipDrawer.open));
  return !b.hidden;
}

/**
 * ADR-088's closing causes the chrome sees: neither the interior nor the fab shown, a dialog open, another robot
 * current (`bench` in the fab, ADR-091).
 */
function drawerMustClose(v             )          {
  const game = v.game;
  const board = game.screen === 'fab' ? 'bench' : game.player.run.current;
  return (game.screen !== 'interior' && game.screen !== 'fab') || game.dialog !== null || board !== v.chipDrawer.robot;
}

/** The client rectangle of the element `id` as a `Rect`. */
function viewportRect(id        )       {
  const r = $(id).getBoundingClientRect();
  return { left: r.left, top: r.top, width: r.width, height: r.height };
}

/** ADR-088: the drawer where the Menu list opens: right of the column, or below the band, 207 px wide. */
function placeChipDrawer(count        , actions        )       {
  const layout = ($('interior').dataset.layout                            ) ?? null;
  const anchor = menuAnchor('interior', layout);
  const r = chipDrawerRect(viewportRect('i-menu'), viewportRect(anchor.cluster), anchor.column,
    viewportRect('safe-area'), chipDrawerHeight(count, actions));
  const el = $('chip-drawer');
  el.style.left = `${r.left}px`;
  el.style.top = `${r.top}px`;
  el.style.width = `${r.width}px`;
  el.style.height = `${r.height}px`;
}

/**
 * ADR-088: closes the drawer on its closing causes, then shows it while open with button k for the k-th library
 * chip (its number, "Chip <n>", pressed while armed) and the rest hidden, at its place; ADR-091: in the fab, the
 * armed chip's actions above them.
 */
function updateChipDrawer(v             )       {
  const d = v.chipDrawer;
  if (d.open && drawerMustClose(v)) closeChipDrawer(v);
  const chips = v.game.chipLibrary.chips;
  $('chip-drawer').hidden = !v.chipDrawer.open;
  const actions = updateDrawerActions(v);
  for (let k = 1; k <= CHIP_DRAWER_BUTTONS; k++) {
    const b = $(`chip-pick-${k}`), chip = chips[k - 1];
    b.hidden = !v.chipDrawer.open || !chip;
    if (!chip) continue;
    // Non-null: every drawer button's markup contains a .num element.
    b.querySelector('.num') .textContent = chipLabel(chip);
    b.setAttribute('aria-label', `Chip ${chipLabel(chip)}`);
    b.setAttribute('aria-pressed', String(v.chipDrawer.armed === chip.id));
  }
  if (v.chipDrawer.open) placeChipDrawer(chips.length, actions);
}

/**
 * ADR-091: "Open on bench" while the fab's drawer has an armed chip, and "Scrap" too for a burned one; returns how
 * many show.
 */
function updateDrawerActions(v             )         {
  const armed = v.chipDrawer.open && v.game.screen === 'fab' ? v.chipDrawer.armed : null;
  const open = armed !== null && v.game.chipLibrary.chip(armed) !== null;
  const scrap = open && scrapOffered(v.game.chipLibrary, armed);
  $('chip-open').hidden = !open;
  $('chip-scrap').hidden = !scrap;
  return (open ? 1 : 0) + (scrap ? 1 : 0);
}

// --- app/bench-view.ts
// The fab bench's terminals on the interior's board canvas (ADR-091): eight frames half a hull margin outside their
// pins, the switches on the west wall (a track and a knob: hollow at the outer end when off, filled gold at the inner
// end when on) and the lamps on the east wall (a hollow silkscreen ring when off, a gold disc with four rays when
// on), and the board's accessible description in the fab. The rest of the board is interior-view.ts's.


                                                                                 


                                                      



/** ADR-091: a switch knob's centre sits this many cells either side of its frame's centre (inner end when on). */
const KNOB_TRAVEL = 0.27;

/** ADR-091: the stroke width in px of the terminal symbols at `scale` px per cell. */
const terminalStroke = (scale        )         => Math.max(1, scale * 0.06);
/** ADR-091: a switch knob's radius in px: at least its stroke plus 1.5 px, so a hollow knob stays open (L-29). */
const knobRadius = (scale        )         => Math.max(scale * 0.22, terminalStroke(scale) + 1.5);
/** ADR-091: a lamp's disc or ring radius in px, at least its stroke plus 1.5 px (L-29). */
const lampRadius = (scale        )         => Math.max(scale * 0.24, terminalStroke(scale) + 1.5);

/** UX.19, ADR-091: what the fab draws of the bench: a snapshot of its signals and switches, refreshed by the stride. */
                                                                                     

/** ADR-091: whether lamp `pin` is lit in `shown`. */
const lampLit = (shown            , pin         )          => shown.signals.getKey(`${CHIP_PINS_ID}.${pin}`);

/** ADR-091: one terminal as drawn: its pin, wall, number K, on (switch on or lamp lit) and frame centre in cells. */
                                                                                                             

/** ADR-091: the eight terminals, switches `i1` to `i4` then lamps `o1` to `o4`, each frame centre in board cells. */
function benchTerminals(s           , shown            )                  {
  const one = (pin         , wall                 , k        , on         )                => {
    // Non-null: every bench terminal pin sits on the west or east wall.
    const c = terminalFrameCentre({ component: CHIP_PINS_ID, pin }, s) ;
    return { pin, wall, k, on, x: c.x, y: c.y };
  };
  return [
    ...CHIP_INPUT_PINS.map((pin, i) => one(pin, 'west', i + 1, shown.switches.has(pin))),
    ...CHIP_OUTPUT_PINS.map((pin, i) => one(pin, 'east', i + 1, lampLit(shown, pin))),
  ];
}

/** ADR-091: the eight terminal frames with their switch and lamp symbols, at frame `f`. */
function drawBenchTerminals(f            , s           , shown            )       {
  for (const t of benchTerminals(s, shown)) {
    drawTerminalFrame(f, t);
    if (t.wall === 'west') drawSwitch(f, t); else drawLamp(f, t);
  }
}

/**
 * A frame FRAME_DEPTH × FRAME_LENGTH, filled `chip`, edged gold when on and `silk` when off (`chipEdge` reaches only
 * 1.3:1 on the slate hull, so the off edge is the silkscreen, L-22).
 */
function drawTerminalFrame(f            , t               )       {
  const { ctx, scale, X, Y } = f;
  ctx.fillStyle = f.theme.chip;
  ctx.strokeStyle = t.on ? C.gold : f.theme.silk;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(X(t.x - FRAME_DEPTH / 2), Y(t.y - FRAME_LENGTH / 2), FRAME_DEPTH * scale, FRAME_LENGTH * scale,
    scale * 0.15);
  ctx.fill();
  ctx.stroke();
}

/** A switch: a track across the frame, and the knob hollow at the outer (west) end or filled gold at the inner end. */
function drawSwitch(f            , t               )       {
  const { ctx, scale, X, Y } = f;
  const sw = terminalStroke(scale);
  ctx.strokeStyle = f.theme.silk;
  ctx.lineWidth = sw;
  ctx.beginPath();
  ctx.moveTo(X(t.x - KNOB_TRAVEL), Y(t.y));
  ctx.lineTo(X(t.x + KNOB_TRAVEL), Y(t.y));
  ctx.stroke();
  const kx = t.x + (t.on ? KNOB_TRAVEL : -KNOB_TRAVEL);
  ctx.fillStyle = t.on ? C.gold : f.theme.panel;
  ctx.strokeStyle = t.on ? C.gold : f.theme.silk;
  ctx.beginPath();
  ctx.arc(X(kx), Y(t.y), knobRadius(scale), 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

/** A lamp: a hollow silkscreen ring when off; a filled gold disc with four diagonal rays when lit. */
function drawLamp(f            , t               )       {
  const { ctx, scale, X, Y } = f;
  const r = lampRadius(scale), sw = terminalStroke(scale);
  const cx = X(t.x), cy = Y(t.y);
  ctx.lineWidth = sw;
  ctx.strokeStyle = t.on ? C.gold : f.theme.silk;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (t.on) {
    ctx.fillStyle = C.gold;
    ctx.fill();
  }
  ctx.stroke();
  if (!t.on) return;
  ctx.beginPath();
  for (const [dx, dy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const u = Math.SQRT1_2;
    ctx.moveTo(cx + dx * u * r * 1.35, cy + dy * u * r * 1.35);
    ctx.lineTo(cx + dx * u * r * 1.9, cy + dy * u * r * 1.9);
  }
  ctx.stroke();
}

/**
 * ADR-091: the fab board's accessible description: "Chip bench.", the parts and wires as the interior's, the
 * selection, then the switches and lamps ("switch 1 off, …, lamp 4 on").
 */
function describeBench(
  s           , signals              , shown            , sel                                             ,
)         {
  const terminals = benchTerminals(s, shown).map((t) => `${t.wall === 'west' ? 'switch' : 'lamp'} ${t.k} ` +
    `${t.on ? 'on' : 'off'}`);
  const pick = describeSelection(s, sel);
  return `Chip bench. ${describeBoardParts(s, signals)}${pick} Terminals: ${terminals.join(', ')}.`;
}

// --- app/interior-chrome.ts
// The interior chrome that follows the editor and the board camera (ADR-046): toolbox counts, Undo state, the floating
// Delete (text, visibility, position next to the selection) and the canvas's accessible description. Moved out of
// interior-view.ts. ADR-050: a selected wire, and the context menu `#i-context` placed like Delete. ADR-088: the
// Chips tool (chip-drawer.ts) and a chip's footprint. ADR-091: the fab's description (bench-view.ts).


                                                                        


                                              





                                           


                                                 

                                                     

/** The context menu with Move and Delete (ADR-050); without Move it is DELETE_SIZE. */
const MENU_SIZE = { width: 184, height: 44 }         ;

/**
 * Toolbox counts and the Chips tool (ADR-088), Undo/Delete state and the canvas's accessible description (names the
 * selected pin; the bench's in the fab, ADR-091).
 */
function updateChrome(v             , s           , signals              , states                      )       {
  const editor = v.game.editor;
  for (const kind of TOOL_KINDS) {
    const left = editor.session.remaining(kind);
    const b = $(`tool-${kind}`);
    // Non-null: Every tool button template contains a .count element.
    b.querySelector('.count') .textContent = left === null ? '∞' : `×${left}`;
    b.classList.toggle('used', left === 0);
    b.hidden = !editor.session.isAllowed(kind);
    const amount = left === null ? 'unlimited' : `${left} left`;
    b.setAttribute('aria-label', `${kindTitle(kind)}, ${amount}. Tap to place, or drag onto the board.`);
  }
  const chips = updateChipTool(v);
  // The tray panel itself hides when none of its five tools shows.
  $('toolbox').hidden = !chips && !TOOL_KINDS.some((kind) => editor.session.isAllowed(kind));
  ($('i-undo')                     ).disabled = !editor.canUndo;
  updateDelete(v, s);
  updateMenu(v, s);
  const sel = { pin: editor.selectedPin, wire: editor.selectedWire };
  // ADR-070: with several robots the description names the ridden one; ADR-091: the fab describes the bench.
  const run = v.game.player.run;
  const name = run.models.length > 1 ? BOARD_THEMES[run.current].name : null;
  v.boardCanvas.setAttribute('aria-label', v.game.screen === 'fab'
    ? describeBench(s, signals, v.game.fab.shown, sel) : describeCircuit(s, signals, states, sel, name));
}

/** A placed part's or chip's footprint in canvas pixels, or null when it is not placed. */
function partRect(v             , s           , id        )              {
  const t = v.boardTransform;
  const pos = s.position(id), fp = footprintOf(s.circuit, id);
  if (!pos || !fp) return null;
  return { left: t.ox + pos.x * t.scale, top: t.oy + pos.y * t.scale, width: fp.width * t.scale,
    height: fp.height * t.scale };
}

/** The pin-radius touch square around a board point, in canvas pixels. */
function touchSquare(v             , a       )       {
  const t = v.boardTransform, r = pinRadius(v) * t.scale;
  return { left: t.ox + a.x * t.scale - r, top: t.oy + a.y * t.scale - r, width: 2 * r, height: 2 * r };
}

/** Where a selected wire's controls float: its tapped point, else its route midpoint (ADR-050). */
function wireSpot(v             , s           , to        )               {
  if (v.wireTapAt) return v.wireTapAt;
  const c = wireInto(s.circuit, to);
  return c ? routeMidpoint(wireRoute(c.from, c.to, s)) : null;
}

/** The selected part's footprint, a pin's or a wire's touch square, in canvas pixels; null: nothing selected. */
function selectionRect(v             , s           )              {
  const editor = v.game.editor;
  if (editor.selectedComponent) return partRect(v, s, editor.selectedComponent);
  const wire = editor.selectedWire;
  const at = wire ? wireSpot(v, s, wire) : editor.selectedPin && anchorOf(editor.selectedPin, s);
  return at ? touchSquare(v, at) : null;
}

/** Places a floating on-board control next to `target` (ADR-046), at `size`. */
function float(el             , target      , size                                   , area      )       {
  const r = deleteButtonRect(target, size, area);
  el.style.left = `${r.left}px`;
  el.style.top = `${r.top}px`;
  el.style.width = `${r.width}px`;
  el.style.height = `${r.height}px`;
}

/**
 * Delete ("Delete" for a part or a wire, "Cut wire" for a wired input) floats next to the selection (ADR-046,
 * ADR-050); hidden while the context menu is open.
 */
function updateDelete(v             , s           )       {
  const editor = v.game.editor;
  const sel = editor.selectedPin;
  const whole = editor.selectedComponent !== null || editor.selectedWire !== null;
  const canDelete = !v.menu && (whole || (sel !== null && editor.isDrivenInput(sel)));
  const target = canDelete ? selectionRect(v, s) : null;
  const button = $('i-delete');
  button.hidden = !target || !v.boardArea;
  button.textContent = whole ? 'Delete' : 'Cut wire';
  if (target && v.boardArea) float(button, target, DELETE_SIZE, v.boardArea);
}

/** ADR-050: the context menu floats next to its part or wire like Delete; Move only for a part. */
function updateMenu(v             , s           )       {
  const menu = v.menu;
  const target = menu && (menu.part ? partRect(v, s, menu.part) : touchSquare(v, menu.at));
  const box = $('i-context');
  box.hidden = !target || !v.boardArea;
  if (!menu || !target || !v.boardArea) return;
  $('i-context-move').hidden = menu.part === null;
  float(box, target, menu.part ? MENU_SIZE : DELETE_SIZE, v.boardArea);
}

// --- app/interior-overlay.ts
// Touch wiring drawings over the robot interior board (ADR-050): rings on the valid targets of the selected or
// dragged pin, the selected wire's halo and the magnifier above the finger. The
// magnifier gets the board drawing as a callback, so this module does not import interior-view.ts.

                                                          

                                           
                                                      


                                                     

/** A circle in canvas pixels. */
                                                           
/** The magnifier circle and the px per cell it draws at. */
                                                             

/** The drawn radius of a pin in px at `scale` px per cell (interior-view.ts draws pins this size): ADR-057's
 *  max(5, 0.17 s), cut at 0.25 s - 1.5 so dots of pins half a cell apart (ADR-087) leave 1 px. */
const pinDrawRadius = (scale        ) => Math.min(Math.max(5, scale * 0.17), scale * 0.25 - 1.5);

/** The border width of a pin dot in px: 2, thinner on small dots so the hollow (off) and filled (on) dots differ. */
const pinBorderWidth = (scale        ) => Math.min(2, pinDrawRadius(scale) * 0.4);

/** The ring radius around a target pin in px (ADR-087): d + 5, shrunk toward d + 1 when cells are small so rings of
 *  pins half a cell apart leave a gap from 31.25 px per cell (at least 1 px up to that). */
function targetRingRadius(scale        )         {
  const d = pinDrawRadius(scale);
  return Math.max(d + 1, Math.min(d + 5, 0.25 * scale - 1.5));
}

/** The trace width of a lit wire in px (the widest trace; the halo is 4 px wider). */
const litTraceWidth = (scale        ) => Math.max(2.5, scale * 0.09);

/** The pins to ring (ADR-050): a pin drag's targets, else the selected pin's, else none. */
function currentTargets(v             )           {
  if (v.drag?.type === 'pin') return v.drag.targets;
  const sel = v.game.editor.selectedPin;
  return sel ? validTargets(v.game.editor.session, sel) : [];
}

/** A gold ring on every valid target; the snapped one also gets a translucent gold halo (ADR-050). */
function drawTargetRings(
  f            , s           , targets                   , snap               , scale        ,
)       {
  const { ctx, X, Y } = f;
  const ring = targetRingRadius(scale);
  if (snap) {
    const a = anchorOf(snap, s);
    ctx.fillStyle = 'rgba(255, 207, 63, 0.35)';
    ctx.beginPath();
    ctx.arc(X(a.x), Y(a.y), ring + 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 2;
  for (const t of targets) {
    const a = anchorOf(t, s);
    ctx.beginPath();
    ctx.arc(X(a.x), Y(a.y), ring, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/** The selected wire's white halo, 4 px wider than a lit trace, drawn under the wires (ADR-050). */
function drawWireHalo(f            , s           , to        )       {
  const c = wireInto(s.circuit, to);
  if (!c) return;
  const { ctx, scale, X, Y } = f;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = litTraceWidth(scale) + 4;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  wireRoute(c.from, c.to, s).forEach((pt, i) => (i ? ctx.lineTo(X(pt.x), Y(pt.y)) : ctx.moveTo(X(pt.x), Y(pt.y))));
  ctx.stroke();
}

/**
 * The magnifier (ADR-050): a circle placed by `loupePlacement` around the finger (canvas px) showing the board at
 * loupeScale (at least 96 px per cell) with the board point under the finger at its centre, drawn by `draw`; a
 * crosshair and a gold rim. Returns the circle and its scale, or null before the board has a fit area. Never changes
 * the board camera.
 */
function drawLoupe(
  v             , f            , finger       , draw                         ,
)                     {
  if (!v.boardArea) return null;
  const { ctx } = f;
  const c = loupePlacement(finger, v.boardArea);
  const t = v.boardTransform;
  const at = { x: (finger.x - t.ox) / t.scale, y: (finger.y - t.oy) / t.scale };
  const scale = loupeScale(t.scale);
  ctx.save();
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = f.theme.outside;
  ctx.fillRect(c.x - c.r, c.y - c.r, 2 * c.r, 2 * c.r);
  draw({ ctx, scale, X: (x) => c.x + (x - at.x) * scale, Y: (y) => c.y + (y - at.y) * scale, theme: f.theme });
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(c.x - 8, c.y);
  ctx.lineTo(c.x + 8, c.y);
  ctx.moveTo(c.x, c.y - 8);
  ctx.lineTo(c.x, c.y + 8);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
  ctx.stroke();
  return { ...c, scale };
}

// --- app/gate-symbols.ts
// The logic parts' symbols (ADR-054): geometry in design units ported 1:1 from
// iOS/App/CircuitEditor/GateSymbol.swift. AND, OR and NOT are drawn in a 32 x 20 box, the flip-flop in 32 x 40;
// on the board they fill 1.6 x 1 and 1.6 x 2 cells of 2 x 1 and 2 x 2 footprints (ADR-087); stubs join every pin.
// DOM-free; interior-chips.ts replays the ops on the canvas.

                                                      

                                                           
/** One path command in design units: M/L x,y; Q cx,cy,x,y; C c1x,c1y,c2x,c2y,x,y; O cx,cy,r (a full circle); Z. */
                                                                                         
/** A rectangle by its top-left corner and size, in any one unit. */
                                                                                 

/** Design units of the box each symbol is drawn in. */
const GATE_DESIGN_SIZE                                                                = {
  and: { width: 32, height: 20 }, or: { width: 32, height: 20 }, not: { width: 32, height: 20 },
  srFlipFlop: { width: 32, height: 40 },
};

const isGateKind = (k               )                =>
  k === 'and' || k === 'or' || k === 'not' || k === 'srFlipFlop';

/** The symbol's box inside footprint `fp`: the design box scaled uniformly to fit, centred. */
function gateSymbolRect(kind          , fp          )           {
  const d = GATE_DESIGN_SIZE[kind];
  const unit = Math.min(fp.width / d.width, fp.height / d.height);
  const width = d.width * unit, height = d.height * unit;
  return { x: fp.x + (fp.width - width) / 2, y: fp.y + (fp.height - height) / 2, width, height };
}

/** Maps design units of `kind` onto rectangle `r` (any units). */
function gateMap(kind          , r          )                                                     {
  const d = GATE_DESIGN_SIZE[kind];
